name: Benchmark cadence once

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - .github/workflows/benchmark-cadence-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/mel-clean-autonomy
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply benchmark cadence patch
        run: node scripts/patch-benchmark-cadence-once.mjs
      - name: Targeted learning tests
        run: node --test tests/benchmark-cadence.test.mjs tests/verified-repair-learning.test.mjs
      - name: Syntax
        run: npm ci && npm run check
      - name: Commit candidate changes
        run: |
          git config user.name "mel-autonomy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/learning/learning-engine.js src/teachers/github-completion-reconciler.js tests/benchmark-cadence.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: benchmark verified completion cadence"
          git push origin HEAD:candidate/mel-clean-autonomy
