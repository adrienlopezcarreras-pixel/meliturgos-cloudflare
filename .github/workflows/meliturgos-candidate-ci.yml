name: MELITURGOS candidate CI

on:
  push:
    branches:
      - 'candidate/**'
  pull_request:
    branches:
      - mel-current

permissions:
  contents: read

jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Teacher Bridge tests
        run: node --test tests/integration/github-teacher-bridge.test.mjs
      - name: Cloud code capability tests
        run: node --test tests/integration/github-code-capabilities.test.mjs
      - name: Route tests
        run: npm run test:routes
      - name: MEL integration tests
        run: npm run test:mel
      - name: MVP product tests
        run: npm run test:mvp
