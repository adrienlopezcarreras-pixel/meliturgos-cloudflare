name: windows-release-build

on:
  pull_request:
    paths:
      - 'assets/MEL-Computer-*.ps1'
      - 'windows-companion/**'
      - 'tests/computer-companion-api.test.mjs'
      - 'scripts/*windows-release*.ps1'
      - 'scripts/companion-local-ai-benchmark.ps1'
      - 'tests/gen2/windows-release-contract.test.mjs'
      - 'tests/gen2/windows-adb-wifi-contract.test.mjs'
      - 'tests/gen2/companion-ble-channel.test.mjs'
      - '.github/workflows/windows-release-build.yml'
      - 'src/roadmap/master-roadmap.js'
  push:
    branches:
      - main
      - 'roadmap/gen2-59-windows-release-*'
    paths:
      - 'assets/MEL-Computer-*.ps1'
      - 'windows-companion/**'
      - 'tests/computer-companion-api.test.mjs'
      - 'scripts/*windows-release*.ps1'
      - 'scripts/companion-local-ai-benchmark.ps1'
      - 'tests/gen2/windows-release-contract.test.mjs'
      - '.github/workflows/windows-release-build.yml'
      - 'src/roadmap/master-roadmap.js'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA to package
        required: true
        type: string
      version:
        description: Windows companion release version
        required: true
        default: '2.3.14'
        type: string
      signed_release:
        description: Build a signed Authenticode release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: GEN2-59 contract tests
        run: node --test tests/gen2/windows-release-contract.test.mjs tests/gen2/windows-adb-wifi-contract.test.mjs tests/gen2/companion-ble-channel.test.mjs
      - name: Repository syntax
        run: npm run check

  package:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: contract
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '2.3.14' }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      SIGNED_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_release || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Prove exact checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $expected = "$env:EXPECTED_SHA".Trim().ToLowerInvariant()
          if ($expected -notmatch '^[0-9a-f]{40}$') { throw "WINDOWS_RELEASE_EXPECTED_SHA_INVALID" }
          if ($actual -ne $expected) { throw "WINDOWS_RELEASE_EXACT_SHA_MISMATCH:$actual" }

      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $files = @(
            'assets/MEL-Computer-Setup.ps1',
            'assets/MEL-Computer-Companion.ps1',
            'windows-companion/MEL-ADB-WiFi.ps1',
            'windows-companion/Start-MEL-Companion-MCP.ps1',
            'windows-companion/MEL-MINI-USB-Preflight.ps1',
            'tools/android-companion/MEL-Android-WiFi-Pairing.ps1',
            'scripts/build-windows-release.ps1',
            'scripts/companion-local-ai-benchmark.ps1',
            'scripts/sign-windows-release.ps1',
            'scripts/verify-windows-release.ps1'
          )
          foreach ($file in $files) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) { throw "POWERSHELL_PARSE_FAILED:${file}:$($errors[0].Message)" }
          }

      - name: Prove PNG screenshot upload is a raw byte array
        shell: pwsh
        run: ./tests/windows-companion-png-payload.ps1

      - name: Prove unattended opt-in and immediate local revocation on Windows
        shell: pwsh
        run: ./tests/windows-companion-unattended-access.ps1

      - name: Require signing secrets for signed release
        if: env.SIGNED_RELEASE == 'true'
        shell: pwsh
        env:
          MEL_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.MEL_WINDOWS_SIGNING_PFX_BASE64 }}
          MEL_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.MEL_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MEL_WINDOWS_SIGNING_PFX_BASE64)) { throw "WINDOWS_SIGN_PFX_SECRET_MISSING" }
          if ([string]::IsNullOrWhiteSpace($env:MEL_WINDOWS_SIGNING_PFX_PASSWORD)) { throw "WINDOWS_SIGN_PASSWORD_SECRET_MISSING" }

      - name: Build unsigned package
        if: env.SIGNED_RELEASE != 'true'
        shell: pwsh
        run: |
          ./scripts/build-windows-release.ps1 -Version "$env:RELEASE_VERSION" -SourceSha "$env:EXPECTED_SHA"

      - name: Build signed package
        if: env.SIGNED_RELEASE == 'true'
        shell: pwsh
        env:
          MEL_WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.MEL_WINDOWS_SIGNING_PFX_BASE64 }}
          MEL_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.MEL_WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          ./scripts/build-windows-release.ps1 -Version "$env:RELEASE_VERSION" -SourceSha "$env:EXPECTED_SHA" -Sign

      - name: Prove Windows release includes read-only MCP bridge
        shell: pwsh
        run: |
          $stage = ".windows-release/MEL-Windows-$env:RELEASE_VERSION"
          foreach ($name in @('Start-MEL-Companion-MCP.ps1','mel-companion-mcp.mjs')) {
            if (!(Test-Path -LiteralPath (Join-Path $stage $name) -PathType Leaf)) { throw "WINDOWS_MCP_NOT_PACKAGED:$name" }
          }

      - name: Smoke test packaged MCP stdio handshake
        shell: pwsh
        run: |
          $stage = ".windows-release/MEL-Windows-$env:RELEASE_VERSION"
          $adapter = Join-Path $stage 'mel-companion-mcp.mjs'
          if (!(Test-Path -LiteralPath $adapter -PathType Leaf)) { throw 'WINDOWS_MCP_ADAPTER_MISSING' }
          & node --check $adapter
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_MCP_SYNTAX_FAILED' }
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          ) -join "`n"
          $responses = $requests | & node $adapter
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_MCP_HANDSHAKE_FAILED' }
          $messages = @($responses | ForEach-Object { $_ | ConvertFrom-Json })
          if ($messages.Count -ne 2) { throw 'WINDOWS_MCP_RESPONSE_COUNT_INVALID' }
          if ($messages[0].result.serverInfo.name -ne 'mel-companion-readonly') { throw 'WINDOWS_MCP_SERVER_IDENTITY_INVALID' }
          if (@($messages[1].result.tools).Count -ne 1 -or $messages[1].result.tools[0].name -ne 'mel_companion_status') {
            throw 'WINDOWS_MCP_TOOL_SCOPE_INVALID'
          }

      - name: Smoke test packaged MCP PowerShell launcher
        shell: pwsh
        run: |
          $stage = ".windows-release/MEL-Windows-$env:RELEASE_VERSION"
          $launcher = Join-Path $stage 'Start-MEL-Companion-MCP.ps1'
          if (!(Test-Path -LiteralPath $launcher -PathType Leaf)) { throw 'WINDOWS_MCP_LAUNCHER_MISSING' }
          $env:MEL_MCP_SERVER_URL = 'https://mel.example.test/'
          $env:MEL_MCP_OWNER_TOKEN = 'ci-placeholder-not-a-real-token'
          try {
            $requests = @(
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}',
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            ) -join "`n"
            $responses = $requests | & pwsh -NoProfile -NonInteractive -File $launcher
            if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_MCP_LAUNCHER_FAILED' }
            $messages = @($responses | ForEach-Object { $_ | ConvertFrom-Json })
            if ($messages.Count -ne 2) { throw 'WINDOWS_MCP_LAUNCHER_RESPONSES_INVALID' }
            if ($messages[0].result.serverInfo.name -ne 'mel-companion-readonly') { throw 'WINDOWS_MCP_LAUNCHER_IDENTITY_INVALID' }
            if (@($messages[1].result.tools).Count -ne 1 -or $messages[1].result.tools[0].name -ne 'mel_companion_status') { throw 'WINDOWS_MCP_LAUNCHER_TOOL_INVALID' }
          } finally {
            Remove-Item Env:MEL_MCP_OWNER_TOKEN -ErrorAction SilentlyContinue
            Remove-Item Env:MEL_MCP_SERVER_URL -ErrorAction SilentlyContinue
          }

      - name: Verify MCP launcher fails closed without owner configuration
        shell: pwsh
        run: |
          $stage = ".windows-release/MEL-Windows-$env:RELEASE_VERSION"
          $launcher = Join-Path $stage 'Start-MEL-Companion-MCP.ps1'
          Remove-Item Env:MEL_MCP_OWNER_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:MEL_MCP_SERVER_URL -ErrorAction SilentlyContinue
          $ErrorActionPreference = 'Continue'
          try {
            $output = & pwsh -NoProfile -NonInteractive -File $launcher 2>&1 | Out-String
            $code = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = 'Stop'
          }
          if ($code -eq 0 -or $output -notmatch 'MEL_MCP_CONFIGURATION_MISSING') {
            throw 'WINDOWS_MCP_MISSING_OWNER_CONFIG_NOT_REJECTED'
          }
          $global:LASTEXITCODE = 0

      - name: Verify packaged MCP rejects malformed owner tokens
        shell: pwsh
        run: |
          $launcher = ".windows-release/MEL-Windows-$env:RELEASE_VERSION/Start-MEL-Companion-MCP.ps1"
          $env:MEL_MCP_SERVER_URL = 'https://mel.example.test/'
          $env:MEL_MCP_OWNER_TOKEN = "invalid`nheader"
          $ErrorActionPreference = 'Continue'
          try {
            $output = & pwsh -NoProfile -NonInteractive -File $launcher 2>&1 | Out-String
            $code = $LASTEXITCODE
          } finally {
            Remove-Item Env:MEL_MCP_OWNER_TOKEN -ErrorAction SilentlyContinue
            Remove-Item Env:MEL_MCP_SERVER_URL -ErrorAction SilentlyContinue
            $ErrorActionPreference = 'Stop'
          }
          if ($code -eq 0 -or $output -notmatch 'MEL_MCP_OWNER_TOKEN_INVALID') {
            throw 'WINDOWS_MCP_MALFORMED_TOKEN_NOT_REJECTED'
          }
          $global:LASTEXITCODE = 0

      - name: Verify release package
        shell: pwsh
        run: |
          ./scripts/verify-windows-release.ps1 -PackageDir "artifacts/windows" -Version "$env:RELEASE_VERSION" -SourceSha "$env:EXPECTED_SHA"

      - name: Prove MINI USB helper requires owner confirmation before bootloader access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = '.windows-release/MEL-Windows-' + $env:RELEASE_VERSION + '/MEL-MINI-USB-Preflight.ps1'
          if (!(Test-Path -LiteralPath $helper -PathType Leaf)) { throw 'MINI_USB_HELPER_NOT_PACKAGED' }
          # The stdin is deliberately empty. Neither the runner nor a cloud
          # relay can pass the attended owner's literal consent accidentally.
          # Expected denial emits stderr. Capture it without treating it as a
          # terminating *parent* PowerShell error; then assert the actual code.
          $ErrorActionPreference = 'Continue'
          try {
            $output = 'n' | & pwsh -NoProfile -NonInteractive -File $helper -Port COM3 2>&1 | Out-String
            $childExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = 'Stop'
          }
          if ($childExitCode -eq 0 -or $output -notmatch 'MINI_USB_LOCAL_CONFIRMATION_REQUIRED') {
            throw "MINI_USB_HELPER_DID_NOT_FAIL_CLOSED:$output"
          }
          # GitHub's PowerShell runner exits using LASTEXITCODE even after a
          # deliberately rejected child process was successfully asserted.
          $global:LASTEXITCODE = 0

      - name: Verify Authenticode for signed release
        if: env.SIGNED_RELEASE == 'true'
        shell: pwsh
        run: |
          $stage = ".windows-release/MEL-Windows-$env:RELEASE_VERSION"
          foreach ($file in Get-ChildItem -LiteralPath $stage -Filter *.ps1 -File) {
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($sig.Status -ne 'Valid') { throw "WINDOWS_RELEASE_SIGNATURE_INVALID:$($file.Name):$($sig.Status)" }
          }

      - name: Prove archive metadata matches the packaged SHA
        shell: pwsh
        run: |
          $path = "artifacts/windows/MEL-Windows-$env:RELEASE_VERSION.release.json"
          if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw 'WINDOWS_RELEASE_METADATA_NOT_FOUND' }
          $meta = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json
          if ($meta.source_sha -ne $env:EXPECTED_SHA.ToLowerInvariant()) { throw 'WINDOWS_RELEASE_ARCHIVE_PROVENANCE_MISMATCH' }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'WINDOWS_MAIN_PUBLISH_REF_MISMATCH' }
            if ($meta.source_sha -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'WINDOWS_MAIN_PUBLISH_SHA_MISMATCH' }
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: MEL-Windows-${{ github.event_name }}-${{ env.RELEASE_VERSION }}-${{ env.EXPECTED_SHA }}
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 30

  publish-signed-release:
    name: Publish owner-approved signed Windows release
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact validated Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MEL-Windows-workflow_dispatch-${{ inputs.version }}-${{ inputs.expected_sha }}
          path: signed-windows
      - name: Verify approved release target and publish signed package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "WINDOWS_RELEASE_SHA_INVALID"; exit 1; }
          [[ "${EXPECTED_SHA,,}" == "${GITHUB_SHA,,}" ]] || { echo "WINDOWS_RELEASE_NOT_CURRENT_MAIN_SHA"; exit 1; }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "WINDOWS_RELEASE_VERSION_INVALID"; exit 1; }
          test -f "signed-windows/MEL-Windows-$RELEASE_VERSION.release.json"
          test -f "signed-windows/MEL-Windows-$RELEASE_VERSION.zip"
          manifest_sha="$(jq -er '.source_sha' "signed-windows/MEL-Windows-$RELEASE_VERSION.release.json")"
          [[ "${manifest_sha,,}" == "${EXPECTED_SHA,,}" ]] || { echo "WINDOWS_RELEASE_MANIFEST_SHA_MISMATCH"; exit 1; }
          signed="$(jq -er '.signed' "signed-windows/MEL-Windows-$RELEASE_VERSION.release.json")"
          [[ "$signed" == "true" ]] || { echo "WINDOWS_RELEASE_NOT_SIGNED"; exit 1; }
          declared_hash="$(jq -er '.package_sha256' "signed-windows/MEL-Windows-$RELEASE_VERSION.release.json")"
          [[ "$declared_hash" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "WINDOWS_RELEASE_CHECKSUM_INVALID"; exit 1; }
          actual_hash="$(sha256sum "signed-windows/MEL-Windows-$RELEASE_VERSION.zip" | cut -d' ' -f1)"
          [[ "${declared_hash,,}" == "${actual_hash,,}" ]] || { echo "WINDOWS_RELEASE_CHECKSUM_MISMATCH"; exit 1; }
          expected_manifest_hash="$(jq -er '.manifest_sha256' "signed-windows/MEL-Windows-$RELEASE_VERSION.release.json")"
          [[ "$expected_manifest_hash" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "WINDOWS_RELEASE_INTERNAL_MANIFEST_HASH_INVALID"; exit 1; }
          unzip -p "signed-windows/MEL-Windows-$RELEASE_VERSION.zip" release-manifest.json > "$RUNNER_TEMP/mel-release-manifest.json"
          internal_manifest_hash="$(sha256sum "$RUNNER_TEMP/mel-release-manifest.json" | cut -d' ' -f1)"
          [[ "${expected_manifest_hash,,}" == "${internal_manifest_hash,,}" ]] || { echo "WINDOWS_RELEASE_INTERNAL_MANIFEST_HASH_MISMATCH"; exit 1; }
          tag="mel-companion-windows-v${RELEASE_VERSION}-${EXPECTED_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "WINDOWS_RELEASE_TAG_ALREADY_PUBLISHED"
            exit 1
          fi
          gh release create "$tag" signed-windows/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$EXPECTED_SHA" \
            --title "MEL Companion Windows $RELEASE_VERSION (${EXPECTED_SHA:0:12})" \
            --notes "Signed Windows Companion package built and verified from exact commit $EXPECTED_SHA. Owner-approved workflow_dispatch only." \
            --latest=false
