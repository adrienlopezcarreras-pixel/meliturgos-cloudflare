name: MEL Companion MCP isolated CI
on:
  push:
    branches:
      - feature/mel-chatgpt-companion-mcp-20261013
    paths:
      - 'tools/mel-companion-mcp.mjs'
      - 'tools/Check-MEL-Companion-OAuth.mjs'
      - 'tests/mel-companion-mcp.test.mjs'
      - 'tools/Test-MEL-Companion-MCP.ps1'
      - 'src/devices/companion-mcp-http.js'
      - 'src/devices/companion-mcp-transport-gate.js'
      - 'tests/companion-mcp-transport-gate.test.mjs'
      - 'src/devices/companion-mcp-oauth-jwt.js'
      - 'src/devices/companion-mcp-authenticator.js'
      - 'src/devices/companion-mcp-endpoint.js'
      - 'src/devices/companion-mcp-device-authorization.js'
      - 'src/devices/companion-mcp-d1-lookup.js'
      - 'src/devices/companion-mcp-d1-status.js'
      - 'src/devices/companion-mcp-preview-runtime.js'
      - 'src/preview/companion-mcp-worker.js'
      - 'src/preview/companion-mcp-deployment-guard.js'
      - 'src/preview/companion-mcp-resource-preflight.js'
      - 'src/preview/companion-mcp-resource-metadata.js'
      - 'src/preview/companion-mcp-oauth-provider-preflight.js'
      - 'src/preview/companion-mcp-oauth-discovery.js'
      - 'tests/companion-mcp-oauth-discovery.test.mjs'
      - 'tests/companion-mcp-oauth-provider-preflight.test.mjs'
      - 'tests/companion-mcp-wrangler-preview.test.mjs'
      - 'tests/companion-mcp-jwks-config.test.mjs'
      - 'wrangler.companion-mcp-preview.example.toml'
      - 'tests/companion-mcp-resource-metadata.test.mjs'
      - 'tests/companion-mcp-resource-preflight.test.mjs'
      - 'tests/companion-mcp-deployment-guard.test.mjs'
      - 'tests/companion-mcp-preview-worker.test.mjs'
      - 'tests/companion-mcp-preview-worker-integration.test.mjs'
      - 'tests/companion-mcp-preview-runtime.test.mjs'
      - 'migrations/20261013_companion_mcp_token_revocations.sql'
      - 'tests/companion-mcp-d1-status.test.mjs'
      - 'migrations/20261013_companion_mcp_device_grants.sql'
      - 'tests/companion-mcp-migration.test.mjs'
      - 'tests/companion-mcp-signed-d1-integration.test.mjs'
      - 'tests/companion-mcp-d1-lookup.test.mjs'
      - 'tests/companion-mcp-device-authorization.test.mjs'
      - 'tests/companion-mcp-endpoint.test.mjs'
      - 'tests/companion-mcp-authenticator.test.mjs'
      - 'tests/companion-mcp-oauth-jwt.test.mjs'
      - 'tests/companion-mcp-http.test.mjs'
      - 'tests/companion-mcp-client-handshake.test.mjs'
      - '.github/workflows/mel-companion-mcp-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check tools/mel-companion-mcp.mjs
          node --check tools/Check-MEL-Companion-OAuth.mjs
      - name: Check Windows preflight avoids policy changes and writes
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('tools/Test-MEL-Companion-MCP.ps1','utf8'); if(/Set-ExecutionPolicy|Invoke-Expression|Start-Process|winget install|Invoke-RestMethod|ConvertFrom-SecureString|Get-Content/i.test(s))process.exit(1)"
      - name: Offline MCP security contract
        run: node --test tests/mel-companion-mcp.test.mjs tests/companion-mcp-http.test.mjs tests/companion-mcp-client-handshake.test.mjs tests/companion-mcp-oauth-jwt.test.mjs tests/companion-mcp-authenticator.test.mjs tests/companion-mcp-endpoint.test.mjs tests/companion-mcp-device-authorization.test.mjs tests/companion-mcp-d1-lookup.test.mjs tests/companion-mcp-migration.test.mjs tests/companion-mcp-d1-status.test.mjs tests/companion-mcp-signed-d1-integration.test.mjs tests/companion-mcp-transport-gate.test.mjs tests/companion-mcp-preview-runtime.test.mjs tests/companion-mcp-preview-worker.test.mjs tests/companion-mcp-preview-worker-integration.test.mjs tests/companion-mcp-deployment-guard.test.mjs tests/companion-mcp-resource-preflight.test.mjs tests/companion-mcp-resource-metadata.test.mjs tests/companion-mcp-oauth-provider-preflight.test.mjs tests/companion-mcp-oauth-discovery.test.mjs tests/companion-mcp-wrangler-preview.test.mjs tests/companion-mcp-jwks-config.test.mjs
