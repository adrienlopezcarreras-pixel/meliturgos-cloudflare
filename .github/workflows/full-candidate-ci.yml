name: full-candidate-ci

on:
  push:
    branches:
      - 'candidate/mel-clean-autonomy'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Syntax
        run: npm run check
      - name: Full test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-report.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> test-report.log
          exit $code
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
      - name: Upload runtime SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-sbom
          path: runtime-sbom.json
          retention-days: 14
          if-no-files-found: error
      - name: Development dependency advisory report
        run: |
          npm audit --package-lock-only --audit-level=high || echo 'DEV_DEPENDENCY_ADVISORY_PRESENT - non-runtime tooling advisory recorded; runtime gate passed.'
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-test-report
          path: test-report.log
          retention-days: 1
