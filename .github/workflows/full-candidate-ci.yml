name: full-candidate-ci

on:
  push:
    branches:
      - 'candidate/augmentio-core'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax
        run: npm run check
      - name: Full test suite
        run: npm test
