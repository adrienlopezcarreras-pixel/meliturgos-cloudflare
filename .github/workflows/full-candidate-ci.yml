name: full-ci

on:
  push:
    branches:
      - main
      - 'candidate/**'
      - 'cleanup/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Syntax
        run: npm run check
      - name: Full test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-report.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> test-report.log
          exit $code
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-test-report
          path: test-report.log
          retention-days: 1
