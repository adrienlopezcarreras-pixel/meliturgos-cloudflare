name: diag-backup-actions-secrets

on:
  push:
    branches:
      - diag/backup-actions-secrets-20260929

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe backup secret availability without disclosure
        shell: bash
        env:
          BACKUP_KEY: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_B64 }}
          BACKUP_KEY_ID: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -n "${BACKUP_KEY:-}" ]; then echo "BACKUP_KEY_PRESENT=true"; else echo "BACKUP_KEY_PRESENT=false"; fi
          if [ -n "${BACKUP_KEY_ID:-}" ]; then echo "BACKUP_KEY_ID_PRESENT=true"; else echo "BACKUP_KEY_ID_PRESENT=false"; fi
