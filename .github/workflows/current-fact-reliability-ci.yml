name: current-fact-reliability-ci

on:
  pull_request:
    paths:
      - 'src/api/native-chat.js'
      - 'src/api/current-fact-reliability.js'
      - 'src/services/internet-service.js'
      - 'tests/native-chat-current-fact-reliability.test.mjs'
      - 'tests/native-chat-web-research.test.mjs'
      - '.github/workflows/current-fact-reliability-ci.yml'

permissions:
  contents: read

jobs:
  current-fact-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/runtime-security-gate.mjs
      - name: Syntax
        run: >
          node --check src/api/current-fact-reliability.js &&
          node --check src/api/native-chat.js
      - name: Reliability targeted tests
        run: >
          node --test
          tests/native-chat-current-fact-reliability.test.mjs
          tests/native-chat-web-research.test.mjs
          tests/native-chat-quality-guard.test.mjs

  current-fact-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: current-fact-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git switch -c candidate/current-fact-reliability-ci
      - run: npm test
