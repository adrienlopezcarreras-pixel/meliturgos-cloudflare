name: Companion MCP read-only CI
on:
  pull_request:
    paths:
      - 'tools/mel-companion-mcp.mjs'
      - 'tests/mel-companion-mcp.test.mjs'
      - '.github/workflows/companion-mcp-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node --check tools/mel-companion-mcp.mjs
      - run: node --test tests/mel-companion-mcp.test.mjs
