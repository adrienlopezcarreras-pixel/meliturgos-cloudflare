name: cancel-run-34

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - ".github/workflows/cancel-run-34.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel GitHub LoRA run 34
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/35364509267/cancel
          echo "RUN_34_CANCEL_REQUESTED"
