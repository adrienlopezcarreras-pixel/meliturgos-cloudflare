name: shardvault-udrop-cloudflare-probe

on:
  push:
    branches:
      - 'probe/cnet-cloudflare-roundtrip'
    paths:
      - '.github/workflows/shardvault-udrop-cloudflare-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deploy uDrop probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/udrop-probe
          WORKER_NAME="mel-udrop-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "WORKER_NAME=${WORKER_NAME}" >> "$GITHUB_ENV"
          cat > .tmp/udrop-probe/worker.mjs <<'EOF'
          function b64u(v){let s='';for(let i=0;i<v.length;i+=0x8000)s+=String.fromCharCode(...v.subarray(i,i+0x8000));return btoa(s).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');}
          function unb64u(v){const n=String(v||'').trim().replaceAll('-','+').replaceAll('_','/');const raw=atob(n+'='.repeat((4-n.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0));}
          function hex(buffer){return [...new Uint8Array(buffer)].map(b=>b.toString(16).padStart(2,'0')).join('');}
          async function sha(bytes){return hex(await crypto.subtle.digest('SHA-256',bytes));}
          async function once(encoded,expected,name,ua){
            const headers={'content-type':'text/plain; charset=utf-8','accept':'application/json'};
            if(ua)headers['user-agent']=ua;
            try{
              const r=await fetch('https://udrop.dev',{method:'POST',headers,body:encoded});
              const raw=await r.text();
              let d=null;try{d=JSON.parse(raw)}catch{}
              const base=String(d?.url||'').trim();
              let read=null;
              if(base){
                const rr=await fetch(base.replace(/\/$/,'')+'/raw',{headers:{accept:'text/plain'}});
                const text=String(await rr.text()).trim();
                let got=null;try{got=unb64u(text)}catch{}
                read={status:rr.status,ok:rr.ok,chars:text.length,bytes:got?.length||0,sha_match:Boolean(got)&&await sha(got)===expected};
              }
              return {name,status:r.status,ok:r.ok,url_present:Boolean(base),body_preview:r.ok?null:raw.slice(0,180),read};
            }catch(error){return {name,status:0,ok:false,error:String(error?.message||error).slice(0,180)};}
          }
          export default {
            async fetch(){
              const p=new Uint8Array(253011);
              for(let i=0;i<p.length;i++)p[i]=i%251;
              const expected=await sha(p),encoded=b64u(p);
              return Response.json({
                payload_bytes:p.length,encoded_chars:encoded.length,
                no_ua:await once(encoded,expected,'no-ua',null),
                mel_ua:await once(encoded,expected,'mel-ua','MEL-ShardVault/1.0'),
                browser_ua:await once(encoded,expected,'browser-ua','Mozilla/5.0'),
              },{headers:{'cache-control':'no-store'}});
            }
          };
          EOF
          cat > .tmp/udrop-probe/wrangler.jsonc <<EOF
          {"name":"${WORKER_NAME}","main":"worker.mjs","compatibility_date":"2026-10-03","workers_dev":true}
          EOF
          npx wrangler deploy --config .tmp/udrop-probe/wrangler.jsonc
      - name: Execute uDrop round-trip
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${WORKER_NAME}.adrien-lopezcarreras.workers.dev/"
          READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE="$(curl --silent --show-error --max-time 150 --output udrop-probe.json --write-out '%{http_code}' "${URL}" || true)"
            echo "attempt=${ATTEMPT} http=${CODE}"
            if [ "${CODE}" = "200" ]; then READY=1; break; fi
            sleep 2
          done
          cat udrop-probe.json
          test "${READY}" = "1"
      - name: Delete probe worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          curl -sS --max-time 30 -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}" >/dev/null
