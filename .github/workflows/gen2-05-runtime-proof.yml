name: gen2-05-runtime-proof

on:
  push:
    branches:
      - 'feat/gen2-05-runtime-capability'
    paths:
      - 'src/models/model-council.js'
      - 'src/capabilities/default-bus.js'
      - 'src/index.js'
      - 'tests/gen2/model-council-capability.test.mjs'
      - '.github/workflows/gen2-05-runtime-proof.yml'

permissions:
  contents: read

concurrency:
  group: gen2-05-runtime-proof
  cancel-in-progress: true

jobs:
  isolated-cloudflare-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Re-run GEN2-05 runtime integration test
        env:
          MEL_TEST_VERIFIED_ZERO_COST_PROVIDERS: '1'
        run: node --test tests/gen2/model-council-capability.test.mjs
      - name: Build isolated proof config
        shell: bash
        run: |
          cat > wrangler.gen2-05-proof.jsonc <<'JSON'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "meliturgos-gen2-05-proof",
            "main": "src/visual-final-entry.js",
            "compatibility_date": "2026-09-04",
            "workers_dev": true,
            "ai": { "binding": "AI" },
            "vars": {
              "MELITURGOS_USER": "adrien",
              "MEL_RUNTIME_ENV": "gen2-05-proof",
              "MEL_GITHUB_REPOSITORY": "adrienlopezcarreras-pixel/meliturgos-cloudflare"
            }
          }
          JSON
      - name: Deploy isolated GEN2-05 proof Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.gen2-05-proof.jsonc \
            --define "MEL_DEPLOYED_GIT_SHA:'${GITHUB_SHA}'" \
            --define "MEL_DEPLOYED_GIT_BRANCH:'${GITHUB_REF_NAME}'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure isolated proof authentication
        shell: bash
        run: |
          set -euo pipefail
          PROOF_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::${PROOF_PASSWORD}"
          echo "GEN2_05_PROOF_PASSWORD=${PROOF_PASSWORD}" >> "${GITHUB_ENV}"
          printf '%s' "${PROOF_PASSWORD}" | npx wrangler secret put MELITURGOS_PASSWORD \
            --config wrangler.gen2-05-proof.jsonc \
            --name meliturgos-gen2-05-proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Prove real Cloudflare runtime is zero-euro fail-closed
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-gen2-05-proof.adrien-lopezcarreras.workers.dev"

          ready=0
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --max-time 30 \
              --header "Authorization: Bearer ${GEN2_05_PROOF_PASSWORD}" \
              --output gen2-05-readiness.json \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/gen2/readiness?refresh=1" || true)"
            if [ "${code}" = "200" ]; then ready=1; break; fi
            sleep 3
          done
          test "${ready}" -eq 1

          council_code="$(curl --silent --show-error --max-time 45 \
            --header "Authorization: Bearer ${GEN2_05_PROOF_PASSWORD}" \
            --header "content-type: application/json" \
            --data '{"request":{"prompt":"GEN2-05 isolated runtime proof; remain fail-closed without verified zero-cost provenance."},"maxCandidates":2,"timeoutMs":5000}' \
            --output gen2-05-council.json \
            --write-out '%{http_code}' \
            "${BASE_URL}/api/gen2/model-council" || true)"
          test "${council_code}" = "503"

          GITHUB_SHA="${GITHUB_SHA}" node - <<'NODE'
          const fs = require('fs');
          const readiness = JSON.parse(fs.readFileSync('gen2-05-readiness.json', 'utf8'));
          const council = JSON.parse(fs.readFileSync('gen2-05-council.json', 'utf8'));
          const runtime = readiness?.models?.runtime_zero_cost || {};
          if (readiness?.bindings?.ai !== true) throw new Error('GEN2_05_AI_BINDING_NOT_LIVE');
          if (runtime.status !== 'SAFE_IDLE') throw new Error('GEN2_05_RUNTIME_NOT_SAFE_IDLE:' + String(runtime.status));
          if (Number(runtime.healthy_provider_count || 0) < 1) throw new Error('GEN2_05_NO_HEALTHY_RUNTIME_PROVIDER');
          if (Number(runtime.authorized_zero_cost_count || 0) !== 0) throw new Error('GEN2_05_UNEXPECTED_ZERO_COST_AUTHORIZATION');
          if (council?.code !== 'COUNCIL_NO_ELIGIBLE_PROVIDER') throw new Error('GEN2_05_WRONG_FAIL_CLOSED_CODE:' + String(council?.code));
          const proof = {
            schema: 'mel.gen2-05.runtime-proof/v1',
            sha: process.env.GITHUB_SHA,
            cloudflare_runtime: true,
            ai_binding_live: true,
            healthy_provider_count: Number(runtime.healthy_provider_count || 0),
            authorized_zero_cost_count: Number(runtime.authorized_zero_cost_count || 0),
            zero_cost_status: runtime.status,
            council_http_status: 503,
            council_code: council.code,
            provider_inference_authorized: false,
            provider_inference_executed: false,
            verdict: 'RUNTIME_WIRING_PROVED_ZERO_EURO_BLOCKED',
          };
          fs.writeFileSync('gen2-05-runtime-proof.json', JSON.stringify(proof, null, 2));
          console.log(JSON.stringify(proof, null, 2));
          NODE
      - name: Upload sanitized GEN2-05 runtime proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gen2-05-runtime-proof-${{ github.sha }}
          path: gen2-05-runtime-proof.json
          if-no-files-found: warn
          retention-days: 7
      - name: Delete isolated proof Worker
        if: always()
        shell: bash
        run: |
          set +e
          printf 'y\n' | npx wrangler delete \
            --config wrangler.gen2-05-proof.jsonc \
            --name meliturgos-gen2-05-proof
          exit 0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
