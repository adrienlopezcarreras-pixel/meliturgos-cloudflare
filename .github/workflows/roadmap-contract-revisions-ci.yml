name: roadmap-contract-revisions-ci
on:
  pull_request:
    paths:
      - 'src/roadmap/roadmap-code-contracts.js'
      - 'scripts/check-roadmap-contract-revisions.mjs'
      - 'scripts/check-syntax.mjs'
      - 'tests/roadmap-contract-revision-policy.test.mjs'
      - '.github/workflows/roadmap-contract-revisions-ci.yml'
permissions:
  contents: read
jobs:
  contract-revisions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test revision policy against real Git history
        run: node --test tests/roadmap-contract-revision-policy.test.mjs
      - name: Require a new revision for changed roadmap scopes
        run: node scripts/check-roadmap-contract-revisions.mjs
