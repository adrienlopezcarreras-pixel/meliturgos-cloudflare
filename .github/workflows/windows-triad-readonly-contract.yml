name: Windows Triad Readonly Contract
on:
  pull_request:
    paths:
      - 'src/devices/computer-companion-api.js'
      - 'src/devices/triad-activity-readonly.js'
      - 'tests/companion-triad-activity-readonly.test.mjs'
      - '.github/workflows/windows-triad-readonly-contract.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/companion-triad-activity-readonly.test.mjs
