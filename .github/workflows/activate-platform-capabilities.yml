name: activate-platform-capabilities

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact deployed SHA to prove; defaults to current ref"
        required: false
        type: string
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: mel-launch-bootstrap-token
  cancel-in-progress: false

jobs:
  activate-and-prove:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEL_GITHUB_TOKEN: ${{ secrets.MEL_GITHUB_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.GH_TOKEN }}
      EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Provision real runtime platform credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          printf '%s' "${CLOUDFLARE_API_TOKEN}" | npx wrangler secret put CLOUDFLARE_API_TOKEN --env=""
          printf '%s' "${CLOUDFLARE_ACCOUNT_ID}" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID --env=""

          if [ -n "${MEL_GITHUB_TOKEN:-}" ]; then
            printf '%s' "${MEL_GITHUB_TOKEN}" | npx wrangler secret put MEL_GITHUB_TOKEN --env=""
            echo "GITHUB_RUNTIME_CREDENTIAL=CONFIGURED" >> "${GITHUB_ENV}"
          else
            echo "GITHUB_RUNTIME_CREDENTIAL=RELAY" >> "${GITHUB_ENV}"
          fi

      - name: Prove real production platform capabilities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"

          cleanup() {
            set +e
            printf 'y\n' | npx wrangler secret delete MEL_LAUNCH_BOOTSTRAP_TOKEN --env="" >/tmp/platform-proof-secret-delete.log 2>&1 || true
          }
          trap cleanup EXIT

          printf '%s' "${TOKEN}" | npx wrangler secret put MEL_LAUNCH_BOOTSTRAP_TOKEN --env=""

          api_get() {
            local path="$1"
            local out="$2"
            curl --silent --show-error --fail-with-body --max-time 60               --header "x-mel-release-smoke: 1"               --header "x-mel-launch-bootstrap: ${TOKEN}"               "${BASE_URL}${path}" > "${out}"
          }

          capability() {
            local id="$1"
            local input="$2"
            local out="$3"
            local approval="${4:-}"
            local -a headers=(
              --header "x-mel-release-smoke: 1"
              --header "x-mel-launch-bootstrap: ${TOKEN}"
              --header "content-type: application/json"
            )
            if [ -n "${approval}" ]; then
              headers+=(--header "x-mel-approve-capability: ${approval}")
            fi
            curl --silent --show-error --fail-with-body --max-time 75               "${headers[@]}"               --data "$(node -e 'const id=process.argv[1],input=JSON.parse(process.argv[2]);process.stdout.write(JSON.stringify({id,input}))' "${id}" "${input}")"               "${BASE_URL}/api/gen2/capabilities/execute" > "${out}"
            node -e 'const d=require("./"+process.argv[1]);if(d?.ok!==true)throw new Error("CAPABILITY_PROOF_NOT_OK:"+process.argv[2]);' "${out}" "${id}"
          }

          if [ "${GITHUB_RUNTIME_CREDENTIAL:-RELAY}" = "RELAY" ]; then
            printf '%s' '{"ref":"main"}' > github-relay-dispatch.json
            RELAY_CODE="$(curl --silent --show-error --max-time 30 \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @github-relay-dispatch.json \
              --output github-relay-dispatch-response.txt \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/github-action-relay.yml/dispatches")"
            test "${RELAY_CODE}" = "204"
          fi

          # Capability health is diagnostic here, not the proof gate. The live
          # operations below are stronger evidence and fail closed individually.
          api_get "/api/gen2/capabilities?refresh=1" capabilities-before.json || true
          if [ -f capabilities-before.json ]; then
            node - <<'NODE'
          const d=require('./capabilities-before.json');
          const wanted=[
            'cloudflare.workers.read',
            'cloudflare.deployments.read',
            'cloudflare.deployments.create',
            'github.actions.workflow.dispatch',
          ];
          const rows=new Map((d.capabilities||[]).map(x=>[x.id,x]));
          console.log(JSON.stringify({
            preflight_health:Object.fromEntries(wanted.map(id=>[id,{
              health:rows.get(id)?.health||null,
              detail:rows.get(id)?.health_detail||null,
            }])),
          },null,2));
          NODE
          fi

          capability cloudflare.workers.read '{"limit":10}' cloudflare-workers.json
          capability cloudflare.deployments.read '{"script":"meliturgos","limit":20}' cloudflare-deployments.json

          ACTIVE_VERSION="$(node - <<'NODE'
          const d=require('./cloudflare-deployments.json');
          const deployments=d?.result?.deployments||[];
          let id='';
          for(const deployment of deployments){
            const versions=Array.isArray(deployment?.versions)?deployment.versions:[];
            if(versions.length===1 && Number(versions[0]?.percentage)===100 && versions[0]?.version_id){
              id=String(versions[0].version_id);
              break;
            }
          }
          if(!id) throw new Error('ACTIVE_CLOUDFLARE_VERSION_NOT_FOUND');
          process.stdout.write(id);
          NODE
          )"

          capability             cloudflare.deployments.create             "{\"versions\":[{\"version_id\":\"${ACTIVE_VERSION}\",\"percentage\":100}],\"message\":\"MEL real capability proof — same active version\"}"             cloudflare-create.json             cloudflare.deployments.create

          GITHUB_PROOF=false
          GITHUB_BLOCKER=""
          capability             github.actions.workflow.dispatch             '{"workflow":"gen2-36-provider-write-smoke.yml","ref":"main"}'             github-dispatch.json             github.actions.workflow.dispatch

          GITHUB_TRANSPORT="$(node -e 'const d=require("./github-dispatch.json");process.stdout.write(String(d?.result?.transport||""))')"
          if [ "${GITHUB_TRANSPORT}" = "d1-github-actions-relay" ] || [ "${GITHUB_TRANSPORT}" = "r2-github-actions-relay" ]; then
            GITHUB_RELAY_JOB_ID="$(node -e 'const d=require("./github-dispatch.json");const id=String(d?.result?.relay_job_id||"");if(!/^gh-relay-/.test(id))process.exit(2);process.stdout.write(id)')"
            printf '%s' '{"ref":"main"}' > github-relay-dispatch.json
            RELAY_CODE="$(curl --silent --show-error --max-time 30 \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @github-relay-dispatch.json \
              --output github-relay-dispatch-response.txt \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/github-action-relay.yml/dispatches")"
            test "${RELAY_CODE}" = "204"

            RELAY_DONE=0
            for ATTEMPT in $(seq 1 40); do
              STATUS_INPUT="$(GITHUB_RELAY_JOB_ID="${GITHUB_RELAY_JOB_ID}" node -e 'process.stdout.write(JSON.stringify({job_id:process.env.GITHUB_RELAY_JOB_ID}))')"
              capability github.actions.workflow.dispatch.status "${STATUS_INPUT}" github-dispatch-status.json
              RELAY_STATUS="$(node -e 'const d=require("./github-dispatch-status.json");process.stdout.write(String(d?.result?.status||""))')"
              if [ "${RELAY_STATUS}" = "DISPATCHED" ]; then
                RELAY_DONE=1
                break
              fi
              if [ "${RELAY_STATUS}" = "FAILED" ]; then
                cat github-dispatch-status.json
                exit 18
              fi
              sleep 2
            done
            test "${RELAY_DONE}" = "1"
            GITHUB_PROOF=true
          elif [ "${GITHUB_TRANSPORT}" = "direct-github-api" ]; then
            GITHUB_PROOF=true
          else
            GITHUB_BLOCKER="GITHUB_CONTROL_TRANSPORT_UNPROVEN"
          fi

          api_get "/api/gen2/capabilities?refresh=1" capabilities-after.json

          node - <<'NODE'
          const fs=require('fs');
          const caps=require('./capabilities-after.json').capabilities||[];
          const rows=new Map(caps.map(x=>[x.id,x]));
          const cloudflareIds=[
            'cloudflare.workers.read',
            'cloudflare.deployments.read',
            'cloudflare.deployments.create',
          ];
          // Health remains recorded for diagnostics. Success of the three live
          // Cloudflare capability calls above is the actual fail-closed proof.
          const healthy=new Set(['HEALTHY','PROTECTED']);
          const remainingMel=caps
            .filter(x=>x.provider==='mel' && !healthy.has(String(x.health||'').toUpperCase()))
            .map(x=>({id:x.id,health:x.health,detail:x.health_detail||null}));
          const ghMode=String(process.env.GITHUB_RUNTIME_CREDENTIAL||'RELAY');
          const gh=rows.get('github.actions.workflow.dispatch')||null;
          let dispatch=null;
          let dispatchStatus=null;
          try{dispatch=require('./github-dispatch.json')?.result||null;}catch{}
          try{dispatchStatus=require('./github-dispatch-status.json')?.result||null;}catch{}
          const proof={
            schema:'mel.real-platform-capabilities-proof/v1',
            source_sha:process.env.EXPECTED_SHA||null,
            generated_at:new Date().toISOString(),
            cloudflare:{
              real_runtime_credentials:true,
              workers_read:true,
              deployments_read:true,
              same_version_deployment_write:true,
              capabilities:cloudflareIds.map(id=>({id,health:rows.get(id)?.health||null})),
            },
            github:{
              control_mode:ghMode==='CONFIGURED'?'direct-token':(dispatch?.transport==='r2-github-actions-relay'?'r2-actions-relay':'d1-actions-relay'),
              runtime_credential_configured:ghMode==='CONFIGURED',
              workflow_dispatch_executed:dispatch?.accepted===true && (dispatch?.transport==='direct-github-api' || dispatchStatus?.status==='DISPATCHED'),
              transport:dispatch?.transport||null,
              relay_job_id:dispatch?.relay_job_id||null,
              relay_status:dispatchStatus?.status||null,
              health:gh?.health||null,
              blocker:null,
            },
            remaining_mel:remainingMel,
            secret_values_exposed:false,
          };
          fs.writeFileSync('platform-capabilities-proof.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof,null,2));
          NODE

          cleanup
          trap - EXIT

          if [ "${GITHUB_PROOF}" != "true" ]; then
            echo "GitHub runtime control proof failed."
            exit 17
          fi

      - name: Upload sanitized real capability proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-platform-capabilities-${{ inputs.expected_sha || github.sha }}
          path: platform-capabilities-proof.json
          if-no-files-found: warn
          retention-days: 14
