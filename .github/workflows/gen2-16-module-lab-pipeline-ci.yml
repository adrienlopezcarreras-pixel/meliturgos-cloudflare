name: GEN2-16 module lab pipeline CI

on:
  push:
    branches:
      - 'roadmap/gen2-16-module-lab-pipeline-20260921'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen2-16:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: GEN2-16 targeted tests
        run: node --test tests/module-development-pipeline.test.mjs tests/module-lab-council-gate.test.mjs tests/development-preflight.test.mjs tests/development-coordinator.test.mjs
