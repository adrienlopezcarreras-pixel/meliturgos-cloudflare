name: final-production-shardvault-catbox-97d3e1b5

on:
  push:
    branches:
      - release/shardvault-catbox-live-proof-97d3e1b5
    paths:
      - .github/workflows/final-production-shardvault-catbox-97d3e1b5.yml

permissions:
  contents: read

concurrency:
  group: meliturgos-cloudflare-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact approved SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 97d3e1b5fef6bc34c0cb1a618345cc231d8f1d4c
          fetch-depth: 1

      - name: Prove immutable promotion identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "97d3e1b5fef6bc34c0cb1a618345cc231d8f1d4c"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax gate
        run: npm run check

      - name: Full regression gate
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B candidate/release-ci-head 97d3e1b5fef6bc34c0cb1a618345cc231d8f1d4c
          npm test

      - name: Probe Catbox live write-read
        shell: bash
        run: |
          set +e
          head -c 1024 /dev/urandom > shard-probe.bin
          remote="$(curl -fsS --max-time 25 -F "reqtype=fileupload" -F "fileToUpload=@shard-probe.bin" https://catbox.moe/user/api.php 2>/tmp/catbox.err)"
          if printf '%s' "$remote" | grep -q '^https://'; then
            curl -fsSL --max-time 25 "$remote" -o catbox-roundtrip.bin
            if cmp -s shard-probe.bin catbox-roundtrip.bin; then
              echo "Catbox live round-trip: PASS"
            else
              echo "Catbox live round-trip: content mismatch"
            fi
          else
            echo "Catbox live probe unavailable: $(cat /tmp/catbox.err)"
          fi
          exit 0

      - name: Build immutable source survival archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=mel-source-97d3e1b5fef6bc34c0cb1a618345cc231d8f1d4c.tar.gz 97d3e1b5fef6bc34c0cb1a618345cc231d8f1d4c
          test -s mel-source-97d3e1b5fef6bc34c0cb1a618345cc231d8f1d4c.tar.gz

      - name: Seed exact code archive into R2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put "meliturgos-private-media/shardvault/code/adrienlopezcarreras-pixel__meliturgos-cloudflare/97d3e1b5fef6bc34c0cb1a618345cc231d8f1d4c.tar.gz"             --file="mel-source-97d3e1b5fef6bc34c0cb1a618345cc231d8f1d4c.tar.gz"             --content-type="application/gzip"             --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy exact approved SHA
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy             --define "MEL_DEPLOYED_GIT_SHA:'97d3e1b5fef6bc34c0cb1a618345cc231d8f1d4c'"             --define "MEL_DEPLOYED_GIT_BRANCH:'release/shardvault-catbox-live-proof-97d3e1b5'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production responds
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 --output production-root.html --write-out '%{http_code}' https://meliturgos.adrien-lopezcarreras.workers.dev)"
          case "$code" in
            2??|3??|401) ;;
            *) echo "Unexpected production HTTP status: $code"; exit 22 ;;
          esac
