name: dependency-fix

on:
  push:
    branches:
      - 'candidate/mel-security-env-fix-20260916'
    paths:
      - '.github/workflows/dependency-fix.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: candidate/mel-security-env-fix-20260916
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Refresh Wrangler and lockfile
        run: npm install --save-dev --save-exact wrangler@4.131.2
      - name: Require patched Wrangler and Sharp
        shell: bash
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const wrangler = lock.packages?.['node_modules/wrangler']?.version;
          const sharp = lock.packages?.['node_modules/sharp']?.version;
          console.log(`wrangler=${wrangler}`);
          console.log(`sharp=${sharp}`);
          if (wrangler !== '4.131.2') throw new Error(`Expected wrangler 4.131.2, got ${wrangler}`);
          const parts = String(sharp || '').split('.').map(Number);
          const patched = parts.length === 3 && (parts[0] > 0 || parts[1] > 35 || (parts[1] === 35 && parts[2] >= 4));
          if (!patched) throw new Error(`Expected sharp >= 0.35.4, got ${sharp}`);
          NODE
      - name: Require clean high-severity audit
        run: npm audit --audit-level=high
      - name: Commit audited lockfile
        run: |
          git config user.name "MEL dependency bot"
          git config user.email "mel-dependency-bot@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "security(deps): update Wrangler 4.131.2 and patched Sharp"
            git push origin HEAD:candidate/mel-security-env-fix-20260916
          fi
