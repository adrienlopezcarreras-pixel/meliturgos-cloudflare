name: mel-avatar-01-browser-motion-ci

on:
  push:
    branches:
      - 'roadmap/mel-avatar-01-*'
      - 'candidate/mel-avatar-01-*'
  pull_request:
    branches:
      - main
    paths:
      - 'src/pages/avatar-motion-runtime.js'
      - 'src/pages/mvp-runtime.js'
      - 'src/pages/mvp-interface-v3.js'
      - 'tests/mel-avatar-motion.test.mjs'
      - 'tests/theme-avatar-assets.test.mjs'
      - 'tests/theme-avatar-pipeline.test.mjs'
      - '.github/workflows/mel-avatar-01-browser-motion-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Targeted MEL-AVATAR-01 tests
        run: node --test tests/mel-avatar-motion.test.mjs tests/theme-avatar-assets.test.mjs tests/theme-avatar-pipeline.test.mjs
      - name: Syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/mel-avatar-01-ci
      - name: Full test suite
        run: npm test
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
