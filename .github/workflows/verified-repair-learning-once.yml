name: Verified repair learning once

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - .github/workflows/verified-repair-learning-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/mel-clean-autonomy
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified repair learning patch
        run: node scripts/patch-verified-repair-learning.mjs
      - name: Targeted tests
        run: node --test tests/verified-repair-learning.test.mjs
      - name: Syntax
        run: npm ci && npm run check
      - name: Commit candidate changes
        run: |
          git config user.name "mel-autonomy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/dev/runtime-api.js src/teachers/github-completion-reconciler.js tests/verified-repair-learning.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: learn from verified repair cycles"
          git push origin HEAD:candidate/mel-clean-autonomy
