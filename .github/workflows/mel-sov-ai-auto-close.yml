name: MEL SOV AI auto-close

on:
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mel-sov-ai-auto-close.yml'
      - 'src/portability/**'
      - 'tests/gen2/sov-ai-auto-close.test.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: mel-sov-ai-auto-close
  cancel-in-progress: false

jobs:
  close-ai-gap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PROOF_KEY_B64: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_B64 }}
      BASE_URL: https://meliturgos.adrien-lopezcarreras.workers.dev
    steps:
      - name: Resolve latest successful production SHA
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-cloudflare-release.yml/runs?status=success&per_page=20" > release-runs.json
          TARGET_SHA="$(node - <<'NODE'
          const d=require('./release-runs.json');
          const run=(d.workflow_runs||[]).find(r=>r?.status==='completed'&&r?.conclusion==='success'&&/^[0-9a-f]{40}$/i.test(String(r?.head_sha||'')));
          if(!run) process.exit(2);
          process.stdout.write(String(run.head_sha).toLowerCase());
          NODE
          )"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Derive exact-SHA proof token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(PROOF_KEY_B64="$PROOF_KEY_B64" TARGET_SHA="$TARGET_SHA" node - <<'NODE'
          const crypto=require('crypto');
          const source=Buffer.from(String(process.env.PROOF_KEY_B64||''),'base64');
          const sha=String(process.env.TARGET_SHA||'').toLowerCase();
          if(source.length!==32||!/^[0-9a-f]{40}$/.test(sha)) throw new Error('PARALLEL_PROOF_DERIVATION_INVALID');
          process.stdout.write(Buffer.from(crypto.hkdfSync('sha256',source,Buffer.from('meliturgos-parallel-proof-salt-v1'),Buffer.from('MEL_PARALLEL_PROOF_V1:'+sha),32)).toString('base64url'));
          NODE
          )"
          echo "::add-mask::$TOKEN"
          echo "PROOF_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Close only the remaining AI sovereignty gap
        shell: bash
        run: |
          set -euo pipefail

          release_transition_supersedes_run() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-cloudflare-release.yml/runs?per_page=10" > release-transition.json
            TARGET_SHA="$TARGET_SHA" node - <<'NODE'
          const d=require('./release-transition.json');
          const target=String(process.env.TARGET_SHA||'').toLowerCase();
          const runs=d.workflow_runs||[];
          const newerActive=runs.some(r=>['queued','in_progress','waiting','pending'].includes(String(r?.status||'')));
          const latestSuccess=runs.find(r=>r?.status==='completed'&&r?.conclusion==='success'&&/^[0-9a-f]{40}$/i.test(String(r?.head_sha||'')));
          const stableChanged=latestSuccess&&String(latestSuccess.head_sha||'').toLowerCase()!==target;
          process.exit(newerActive||stableChanged?0:1);
          NODE
          }

          abort_if_release_transition() {
            local code="${1:-}"
            local reason="${2:-}"
            if [ "$code" = "401" ] && [ "$reason" = "BOOTSTRAP_AUTH_REQUIRED" ] && release_transition_supersedes_run; then
              echo "MEL_SOV_AI_SUPERSEDED_BY_NEW_RELEASE target=$TARGET_SHA"
              exit 0
            fi
          }

          read_state() {
            local file="$1"
            TARGET_SHA="$TARGET_SHA" FILE="$file" node - <<'NODE'
          const fs=require('fs');
          let d={};
          try{d=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'))}catch{}
          const expected=String(process.env.TARGET_SHA||'').toLowerCase();
          const exact=String(d?.deployed_sha||'').toLowerCase()===expected;
          console.log('SOV_DONE='+(d?.done_verified_eligible===true&&exact?'1':'0'));
          console.log('AI_LOW_REFUSAL_READY='+(d?.ai_low_refusal_ready===true?'1':'0'));
          console.log('SOV_STATUS='+String(d?.status||d?.code||'UNKNOWN').replace(/[^A-Za-z0-9_.:-]/g,'_').slice(0,180));
          NODE
          }

          BEFORE_CODE="$(curl --silent --show-error --max-time 30 \
            --header "x-mel-parallel-proof: $PROOF_TOKEN" \
            --header "content-type: application/json" \
            --data '{"phase":"sovereignty-proof"}' \
            --output sov-before.json --write-out '%{http_code}' \
            "$BASE_URL/api/internal/release-launch-bootstrap" || true)"

          read_state sov-before.json > sov-before.env
          . ./sov-before.env

          if [ "$SOV_DONE" = "1" ]; then
            echo "MEL_SOV_AI_ALREADY_CLOSED"
            exit 0
          fi

          AI_REFRESH_OK=0
          CONFIGURED_AI_REASON="NOT_ATTEMPTED"

          # Survival invariant: never require or auto-start an owner PC to close
          # the global AI sovereignty gate. The Windows/Ollama path is optional
          # local acceleration and is validated only by explicit/manual ai_local
          # refreshes outside this auto-close workflow.
          if [ "$AI_LOW_REFUSAL_READY" = "1" ]; then
            echo "MEL_SOV_AI_ALWAYS_ON_LOW_REFUSAL_ALREADY_READY"
            AI_REFRESH_OK=1
          else
            CONFIGURED_AI_CODE="$(curl --silent --show-error --max-time 150 \
              --header "x-mel-parallel-proof: $PROOF_TOKEN" \
              --header "content-type: application/json" \
              --data '{"phase":"sovereignty-proof"}' \
              --output sov-ai-configured.json --write-out '%{http_code}' \
              "$BASE_URL/api/internal/release-launch-bootstrap?refresh=ai" || true)"
            CONFIGURED_AI_REASON="$(node - <<'NODE'
          const fs=require('fs');let d={};try{d=JSON.parse(fs.readFileSync('sov-ai-configured.json','utf8'))}catch{}
          process.stdout.write(String(d?.refresh?.reason||d?.refresh?.status||d?.code||d?.status||'UNKNOWN').slice(0,180));
          NODE
            )"
            abort_if_release_transition "$CONFIGURED_AI_CODE" "$CONFIGURED_AI_REASON"

            if [ "$CONFIGURED_AI_CODE" = "200" ]; then
              node - <<'NODE'
          const d=require('./sov-ai-configured.json');
          if(d?.ok!==true||d?.status!=='MEL_SOV_01_REFRESH_STEP_VERIFIED') throw new Error('AI_CONFIGURED_REFRESH_NOT_VERIFIED');
          if(d?.secret_values_exposed!==false||d?.autonomy_started!==false) throw new Error('AI_CONFIGURED_REFRESH_SAFETY_FAILED');
          NODE
              AI_REFRESH_OK=1
              echo "MEL_SOV_AI_ALWAYS_ON_PREVALIDATED"
            else
              echo "MEL_SOV_AI_ALWAYS_ON_NOT_READY http=$CONFIGURED_AI_CODE reason=$CONFIGURED_AI_REASON"
            fi
          fi

          if [ "$AI_REFRESH_OK" != "1" ]; then
            echo "MEL_SOV_AI_ALWAYS_ON_ALTERNATIVE_REQUIRED configured_reason=$CONFIGURED_AI_REASON"
            echo "MEL_SOV_AI_LOCAL_OPTIONAL_NOT_AUTO_STARTED"
            exit 47
          fi

          FINAL_CODE="$(curl --silent --show-error --max-time 45 \
            --header "x-mel-parallel-proof: $PROOF_TOKEN" \
            --header "content-type: application/json" \
            --data '{"phase":"sovereignty-proof"}' \
            --output sov-final.json --write-out '%{http_code}' \
            "$BASE_URL/api/internal/release-launch-bootstrap" || true)"

          FINAL_REASON="$(node - <<'NODE'
          const fs=require('fs');let d={};try{d=JSON.parse(fs.readFileSync('sov-final.json','utf8'))}catch{}
          process.stdout.write(String(d?.code||d?.status||'UNKNOWN').slice(0,180));
          NODE
          )"
          abort_if_release_transition "$FINAL_CODE" "$FINAL_REASON"

          TARGET_SHA="$TARGET_SHA" FINAL_CODE="$FINAL_CODE" node - <<'NODE'
          const d=require('./sov-final.json');
          const expected=String(process.env.TARGET_SHA||'').toLowerCase();
          const ok=Number(process.env.FINAL_CODE)===200
            && d?.ok===true
            && d?.status==='MEL_SOV_01_DONE_VERIFIED_ELIGIBLE'
            && d?.done_verified_eligible===true
            && d?.ai_low_refusal_ready===true
            && Number(d?.ready_layer_count||0)===10
            && Number(d?.layer_count||0)===10
            && String(d?.deployed_sha||'').toLowerCase()===expected
            && d?.secret_values_exposed===false
            && d?.autonomy_started===false;
          if(!ok){
            console.error('MEL_SOV_AI_FINAL_GATE_NOT_CLOSED',JSON.stringify({
              http:Number(process.env.FINAL_CODE),
              status:d?.status||d?.code||null,
              done_verified_eligible:d?.done_verified_eligible===true,
              ai_low_refusal_ready:d?.ai_low_refusal_ready===true,
              ready_layer_count:Number(d?.ready_layer_count||0),
              layer_count:Number(d?.layer_count||0),
              deployed_sha:String(d?.deployed_sha||'').toLowerCase(),
              expected_sha:expected,
            }));
            process.exit(45);
          }
          console.log('MEL_SOV_AI_CLOSED_10_OF_10');
          NODE

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### MEL SOV AI auto-close' >> "$GITHUB_STEP_SUMMARY"
          echo '- Scope: AI layer only' >> "$GITHUB_STEP_SUMMARY"
          echo '- Non-AI layers are not revalidated here' >> "$GITHUB_STEP_SUMMARY"
          echo '- Owner-PC / Ollama is optional and is never auto-started by this gate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Global AI coverage requires an always-on prevalidated alternative' >> "$GITHUB_STEP_SUMMARY"
          echo '- The workflow fails if SOV 10/10 is not actually closed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Green means MEL_SOV_AI_CLOSED_10_OF_10 or already closed without owner-device dependency' >> "$GITHUB_STEP_SUMMARY"
