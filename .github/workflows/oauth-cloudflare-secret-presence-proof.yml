name: oauth-cloudflare-secret-presence-proof

on:
  push:
    branches:
      - proof/oauth-cloudflare-secrets-20260926
    paths:
      - .github/workflows/oauth-cloudflare-secret-presence-proof.yml

permissions:
  contents: read

jobs:
  verify-secret-names:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Verify required Worker secret names
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler secret list --json > worker-secrets.json
          node <<'NODE'
          const fs=require('fs');
          const wanted=[
            'GOOGLE_OAUTH_CLIENT_ID',
            'GOOGLE_OAUTH_CLIENT_SECRET',
            'MEL_OAUTH_ENCRYPTION_KEY_ID',
            'MEL_OAUTH_ENCRYPTION_KEY_B64',
          ];
          const raw=JSON.parse(fs.readFileSync('worker-secrets.json','utf8'));
          const rows=Array.isArray(raw) ? raw : [];
          const names=new Set(rows.map(x=>String(x?.name||'')));
          const proof=wanted.map(name=>({name,present:names.has(name)}));
          console.log(JSON.stringify(proof,null,2));
          if(proof.some(x=>!x.present)) process.exit(1);
          NODE
