name: oauth-cloudflare-secret-presence-proof

on:
  push:
    branches:
      - proof/oauth-cloudflare-secrets-20260926
    paths:
      - .github/workflows/oauth-cloudflare-secret-presence-proof.yml

permissions:
  contents: read

jobs:
  verify-secret-names:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Verify required Worker secret names
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RAW="$(npx wrangler secret list 2>&1)"
          missing=0
          for name in \
            GOOGLE_OAUTH_CLIENT_ID \
            GOOGLE_OAUTH_CLIENT_SECRET \
            MEL_OAUTH_ENCRYPTION_KEY_ID \
            MEL_OAUTH_ENCRYPTION_KEY_B64
          do
            if grep -Fq "$name" <<<"$RAW"; then
              printf '{"name":"%s","present":true}\n' "$name"
            else
              printf '{"name":"%s","present":false}\n' "$name"
              missing=1
            fi
          done
          exit "$missing"
