name: MEL-SEC-02 capability permissions CI

on:
  push:
    branches:
      - 'roadmap/mel-sec-02-capability-permissions-20260921'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Capability authorization proof
        run: node --test tests/capability-permissions-enforcement.test.mjs tests/connectors-security.test.mjs
