name: gen2-44-observability-ci

on:
  pull_request:
    paths:
      - 'src/capabilities/capability-bus.js'
      - 'src/core/orchestrator/gen2-runtime.js'
      - 'src/diagnostics/health-dashboard.js'
      - 'src/diagnostics/runtime-observability.js'
      - 'src/diagnostics/system-readiness.js'
      - 'src/roadmap/master-roadmap.js'
      - 'tests/gen2/runtime-observability.test.mjs'
      - 'tests/system-readiness.test.mjs'
      - '.github/workflows/gen2-44-observability-ci.yml'
  push:
    branches:
      - 'work/gen2-44-observability-runtime'
    paths:
      - 'src/capabilities/capability-bus.js'
      - 'src/core/orchestrator/gen2-runtime.js'
      - 'src/diagnostics/health-dashboard.js'
      - 'src/diagnostics/runtime-observability.js'
      - 'src/diagnostics/system-readiness.js'
      - 'src/roadmap/master-roadmap.js'
      - 'tests/gen2/runtime-observability.test.mjs'
      - 'tests/system-readiness.test.mjs'
      - '.github/workflows/gen2-44-observability-ci.yml'

permissions:
  contents: read

jobs:
  observability-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Observability syntax
        run: >
          node --check src/capabilities/capability-bus.js &&
          node --check src/core/orchestrator/gen2-runtime.js &&
          node --check src/diagnostics/health-dashboard.js &&
          node --check src/diagnostics/runtime-observability.js &&
          node --check src/diagnostics/system-readiness.js
      - name: Observability targeted tests
        run: >
          node --test
          tests/gen2/runtime-observability.test.mjs
          tests/gen2/health-dashboard.test.mjs
          tests/system-readiness.test.mjs
          tests/capability-permissions-enforcement.test.mjs
          tests/runtime-diagnostics-capabilities.test.mjs

  observability-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: observability-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Repository syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/gen2-44-ci
      - name: Full test suite
        run: npm test
