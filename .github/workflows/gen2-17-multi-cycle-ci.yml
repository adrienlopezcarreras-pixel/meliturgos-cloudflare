name: gen2-17-multi-cycle-ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/autonomy-runtime.test.mjs'
      - 'src/evolution/**'
      - 'src/maintenance/**'
      - 'release-tools/predeploy-backup-refresh/system-restore-proof.mjs'
      - 'release-tools/predeploy-backup-refresh/isolated-restore-runner.mjs'
      - 'tests/maintenance/**'
      - 'tests/mel-work-schedule.test.mjs'
      - 'tests/gen2/companion-grand-cleanup.test.mjs'
      - 'windows-companion/MEL-Grand-Nettoyage.ps1'
      - 'windows-companion/MEL-Nettoyage-GitHub.ps1'
      - 'windows-companion/MEL-Restaurer-Branches.ps1'
      - 'src/security/github-actions-oidc.js'
      - 'src/evaluation/capability-watch-runtime.js'
      - 'tests/gen2/github-actions-oidc.test.mjs'
      - 'tests/gen2/capability-watch-production-proof.test.mjs'
      - 'tests/release-launch-bootstrap.test.mjs'
      - 'src/roadmap/master-roadmap.js'
      - '.github/workflows/gen2-17-multi-cycle-ci.yml'
  push:
    branches:
      - 'work/gen2-17-multi-cycle-proof'

permissions:
  contents: read

jobs:
  gen2-17-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
      - name: Evolution syntax
        run: >
          node --check src/evolution/chat-intent.js &&
          node --check src/evolution/semantic-intent.js &&
          node --check src/evolution/autonomy-runtime.js &&
          node --check src/evolution/autonomy-supervisor.js &&
          node --check src/evolution/evolution-proof-runner.js &&
          node --check src/evolution/release-launch-bootstrap.js &&
          node --check src/security/github-actions-oidc.js &&
          node --check src/evaluation/capability-watch-runtime.js
      - name: Global maintenance reset regressions
        run: node --test tests/maintenance/*.test.mjs tests/gen2/companion-grand-cleanup.test.mjs tests/mel-work-schedule.test.mjs
      - name: Chat direct-path and explicit-action regressions
        run: >
          node --test
          tests/evolution-chat-intent.test.mjs
          tests/chat-intent-development.test.mjs
          tests/autonomy-chat-intent.test.mjs
          tests/capability-chat-routing.test.mjs
          tests/self-state-introspection.test.mjs
          tests/chat-gap-development-routing.test.mjs
          tests/evolution-chat-gap-e2e.test.mjs
      - name: Validate every registered capability and roadmap prerequisites (read-only)
        run: >
          node --test
          tests/capability-inventory-gate.test.mjs
          tests/gen2/skill-registry.test.mjs
          tests/gen2/skill-registry-runtime.test.mjs
          tests/max-roadmap-dependency-priority.test.mjs
      - name: Targeted supervised autonomy proof
        # GPT6 2026-10-21: the planner tests use mocked zero-cost providers;
        # this flag is strictly Node-only and cannot authorize production providers.
        env:
          MEL_TEST_VERIFIED_ZERO_COST_PROVIDERS: '1'
        run: >
          node --test
          tests/autonomy-runtime.test.mjs
          tests/autonomy-completion-gates.test.mjs
          tests/autonomy-supervisor.test.mjs
          tests/autonomy-implementation-planner.test.mjs
          tests/owner-chat-roadmap-id.test.mjs
          tests/gen2/self-audit-supervisor.test.mjs
          tests/evolution-proof-runner.test.mjs
          tests/release-launch-bootstrap.test.mjs
          tests/gen2/github-actions-oidc.test.mjs
          tests/gen2/capability-watch-production-proof.test.mjs

  gen2-17-full-suite:
    # Final closure gate: every PR changing MAX dependencies/capabilities
    # must also pass the complete repository suite after targeted tests.
    # workflow_dispatch remains available for manual re-verification.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: gen2-17-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Repository syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/gen2-17-proof-ci
      - name: Full test suite
        run: npm test
