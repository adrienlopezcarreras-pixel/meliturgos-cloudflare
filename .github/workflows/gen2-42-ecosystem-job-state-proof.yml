name: gen2-42-ecosystem-job-state-proof

on:
  push:
    branches:
      - proof/gen2-42-completion-live-20260926
    paths:
      - .github/workflows/gen2-42-ecosystem-job-state-proof.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect ecosystem-watch jobs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json             --command "SELECT id,status,optional_context,result_json,candidate_branch,updated_at FROM dev_jobs WHERE requested_by='mel-autonomy' ORDER BY updated_at DESC LIMIT 100"             > jobs.raw.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('jobs.raw.json','utf8'));
          const rows=[];
          for(const part of Array.isArray(raw)?raw:[raw]) if(part && Array.isArray(part.results)) rows.push(...part.results);
          const parse=v=>{try{const x=JSON.parse(v||'{}');return x&&typeof x==='object'?x:{}}catch{return {}}};
          const out=[];
          for(const row of rows){
            const ctx=parse(row.optional_context), res=parse(row.result_json);
            if(String(ctx.source||'')!=='ecosystem-watch') continue;
            const t=res.teacher_bridge||{}, rev=t.review||{}, req=t.request||{}, proposal=res.implementation_proposal||{}, prep=res.bridge_preparation||{}, bridge=res.dev_bridge||{};
            out.push({
              id:String(row.id||''),
              status:String(row.status||''),
              roadmap_id:String(ctx.roadmap_id||''),
              candidate_branch:String(row.candidate_branch||prep.candidate_branch||bridge.candidate_branch||''),
              teacher_status:String(t.status||''),
              teacher_verdict:String(rev.verdict||''),
              development_allowed:rev.development_allowed===true,
              request_id:String(req.request_id||rev.request_id||''),
              proposal_status:String(proposal.status||''),
              proposal_teacher_request_id:String(proposal.teacher_request_id||''),
              bridge_preparation_status:String(prep.status||''),
              updated_at:Number(row.updated_at||0)
            });
          }
          console.log(JSON.stringify({count:out.length,jobs:out.slice(0,30)},null,2));
          NODE
