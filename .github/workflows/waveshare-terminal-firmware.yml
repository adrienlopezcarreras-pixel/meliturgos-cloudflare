              "sha256": "${OTA_SHA256}",
              "size": ${OTA_SIZE},
              "source_sha": "${GITHUB_SHA}",
              "waveshare_upstream_sha": "283ec84c566c096f8c30493b93dcd4b0bb608de7"
            },
            "installer": {
              "available": true,
              "key": "devices/waveshare-esp32-s3-touch-lcd-3.5-c/mini-first-install.bin",
              "sha256": "${INSTALL_SHA256}",
              "size": ${INSTALL_SIZE}
            },
            "assets": { "version": "1", "items": [] }
          }
          JSON
          sha256sum mel-terminal.bin mini-first-install.bin lvgl_system.elf lvgl_system.map ../firmware-manifest.json > ../SHA256SUMS.txt

      - name: Upload flash-ready artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL-Waveshare-3.5-C-${{ github.sha }}
