name: gen2-22-audio-runtime-ci

on:
  pull_request:
    paths:
      - 'src/media/audio.js'
      - 'src/media/audio-runtime.js'
      - 'tests/gen2/audio-runtime.test.mjs'
      - '.github/workflows/gen2-22-audio-runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check src/media/audio-runtime.js
      - run: node --test tests/gen2/audio-runtime.test.mjs
      - run: npm run check
