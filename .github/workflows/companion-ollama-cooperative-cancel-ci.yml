name: Companion Ollama Cooperative Cancel CI
on:
  pull_request:
    paths:
      - 'assets/MEL-Computer-Companion.ps1'
      - 'dist/MEL-Computer-Companion.ps1'
      - 'src/portability/companion-sovereignty-executor.js'
      - 'tests/gen2/companion-ollama-cooperative-cancel.test.mjs'
      - 'tests/windows/companion-ollama-http-cancel-smoke.ps1'
      - '.github/workflows/companion-ollama-cooperative-cancel-ci.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/gen2/companion-ollama-cooperative-cancel.test.mjs tests/gen2/companion-ollama-consent-gate.test.mjs

  windows-loopback:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check real cooperative HTTP transport against local fake server
        shell: powershell
        run: .\tests\windows\companion-ollama-http-cancel-smoke.ps1
