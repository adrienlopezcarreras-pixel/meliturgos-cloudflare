name: mel-sov-01-live-proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact deployed SHA to prove; defaults to current ref"
        required: false
        type: string
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mel-launch-bootstrap-token
  cancel-in-progress: false

jobs:
  production-proof:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Contract tests
        run: node --test tests/release-launch-bootstrap.test.mjs tests/gen2/technical-sovereignty-live.test.mjs tests/gen2/prevalidated-alternative-registry.test.mjs

      - name: Prove MEL-SOV-01 from production Worker binding
        shell: bash
        env:
          PROOF_KEY_B64: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_B64 }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          TOKEN="$(PROOF_KEY_B64="${PROOF_KEY_B64}" TARGET_SHA="${EXPECTED_SHA}" node - <<'NODE'
          const crypto=require('crypto');
          const source=Buffer.from(String(process.env.PROOF_KEY_B64||''),'base64');
          const sha=String(process.env.TARGET_SHA||'').toLowerCase();
          if(source.length!==32||!/^[0-9a-f]{40}$/.test(sha)) throw new Error('PARALLEL_PROOF_DERIVATION_INVALID');
          process.stdout.write(Buffer.from(crypto.hkdfSync(
            'sha256',
            source,
            Buffer.from('meliturgos-parallel-proof-salt-v1'),
            Buffer.from('MEL_PARALLEL_PROOF_V1:'+sha),
            32,
          )).toString('base64url'));
          NODE
          )"
          echo "::add-mask::${TOKEN}"

          # Refresh each expensive sovereignty prevalidation domain in its own
          # Worker request so no single request can consume the full CPU budget.
          # Runtime pressure can make one isolated refresh transiently fail, so
          # retry only bounded transient statuses and preserve a sanitized
          # diagnostic artifact instead of losing the whole proof.
          refresh_sov_target() {
            local TARGET="$1"
            local STEP="${2:-}"
            local KEY="${TARGET}"
            local QUERY="refresh=${TARGET}"
            if [ -n "${STEP}" ]; then
              KEY="${TARGET}-${STEP}"
              QUERY="${QUERY}&step=${STEP}"
            fi
            local CODE="000"
            local REFRESH_READY=0
            for ATTEMPT in $(seq 1 6); do
              CODE="$(curl --silent --show-error --max-time 75 \
                --header "x-mel-parallel-proof: ${TOKEN}" \
                --header "content-type: application/json" \
                --data '{"phase":"sovereignty-proof"}' \
                --output "mel-sov-refresh-${KEY}.json" \
                --write-out '%{http_code}' \
                "${BASE_URL}/api/internal/release-launch-bootstrap?${QUERY}" || true)"
              if [ "${CODE}" = "200" ]; then
                REFRESH_READY=1
                break
              fi
              REFRESH_ERROR_CODE="$(KEY="${KEY}" node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("mel-sov-refresh-"+process.env.KEY+".json","utf8"))}catch{};process.stdout.write(String(d?.refresh?.reason||d?.code||d?.error||d?.status||"UNKNOWN"))')"
              if [ "${REFRESH_ERROR_CODE}" = "SOV_BACKUP_GOOGLE_DRIVE_RECONSENT_REQUIRED" ]; then
                echo "Google Drive OAuth re-consent is required for ${KEY}; this is not transient."
                break
              fi
              case "${CODE}" in
                409|429|500|502|503|504)
                  echo "Transient MEL-SOV-01 refresh ${KEY} status ${CODE} (${REFRESH_ERROR_CODE}); retry ${ATTEMPT}/6."
                  sleep $((ATTEMPT * 2))
                  ;;
                *)
                  echo "Non-retryable MEL-SOV-01 refresh ${KEY} status ${CODE} (${REFRESH_ERROR_CODE})."
                  break
                  ;;
              esac
            done
            if [ "${REFRESH_READY}" != "1" ]; then
              TARGET="${TARGET}" STEP="${STEP}" KEY="${KEY}" CODE="${CODE}" EXPECTED_SHA="${EXPECTED_SHA}" node - <<'NODE'
          const fs=require('fs');
          let row={};
          try{row=JSON.parse(fs.readFileSync('./mel-sov-refresh-'+process.env.KEY+'.json','utf8'))}catch{}
          const proof={
            ok:false,
            status:'MEL_SOV_01_REFRESH_FAILED',
            source_sha:process.env.EXPECTED_SHA||null,
            refresh_target:process.env.TARGET,
            refresh_step:process.env.STEP||null,
            http_status:Number(process.env.CODE||0),
            refresh_error:String(row?.code||row?.error||row?.status||'UNKNOWN').slice(0,160),
            secret_values_exposed:false,
            autonomy_started:false,
          };
          fs.writeFileSync('mel-sov-01-live-proof.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof));
          NODE
              return 31
            fi
            TARGET="${TARGET}" STEP="${STEP}" KEY="${KEY}" node - <<'NODE'
          const d=require('./mel-sov-refresh-'+process.env.KEY+'.json');
          if(d?.ok!==true || d?.status!=='MEL_SOV_01_REFRESH_STEP_VERIFIED') throw new Error('MEL_SOV_01_REFRESH_FAILED:'+process.env.KEY);
          if(d?.refresh_target!==process.env.TARGET) throw new Error('MEL_SOV_01_REFRESH_TARGET_MISMATCH');
          if(process.env.STEP && d?.refresh_step!==process.env.STEP) throw new Error('MEL_SOV_01_REFRESH_STEP_MISMATCH');
          if(d?.secret_values_exposed!==false || d?.autonomy_started!==false) throw new Error('MEL_SOV_01_REFRESH_SAFETY_FAILED');
          NODE
          }

          for TARGET in ai ai_local source_control infrastructure; do
            refresh_sov_target "${TARGET}" || exit $?
          done
          for STEP in resolve prepare readback rollback finalize; do
            refresh_sov_target "backup_restore" "${STEP}" || exit $?
          done

          CODE="$(curl --silent --show-error --max-time 60 \
            --header "x-mel-parallel-proof: ${TOKEN}" \
            --header "content-type: application/json" \
            --data '{"phase":"sovereignty-proof"}' \
            --output mel-sov-01-live-proof.json \
            --write-out '%{http_code}' \
            "${BASE_URL}/api/internal/release-launch-bootstrap" || true)"
          if [ "${CODE}" != "200" ] && [ "${CODE}" != "409" ]; then
            echo "Final MEL-SOV-01 status returned HTTP ${CODE}."
            exit 31
          fi

          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('mel-sov-01-live-proof.json','utf8'));
          const refresh={};
          for(const id of ['ai','ai_local','source_control','infrastructure','backup_restore']){
            const row=JSON.parse(fs.readFileSync('mel-sov-refresh-'+id+'.json','utf8'));
            refresh[id]=row?.refresh||null;
          }
          d.prevalidation_refresh=refresh;
          fs.writeFileSync('mel-sov-01-live-proof.json',JSON.stringify(d,null,2));
          NODE

          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('mel-sov-01-live-proof.json','utf8'));
          const expected=String(process.env.EXPECTED_SHA||'').toLowerCase();
          if(d?.ok!==true) throw new Error('MEL_SOV_01_PROOF_NOT_OK');
          if(d?.secret_values_exposed!==false) throw new Error('MEL_SOV_01_SECRET_HYGIENE_FAILED');
          if(d?.autonomy_started!==false) throw new Error('MEL_SOV_01_PROOF_STARTED_AUTONOMY');
          if(expected && String(d?.deployed_sha||'').toLowerCase()!==expected) {
            throw new Error('MEL_SOV_01_DEPLOYED_SHA_MISMATCH');
          }
          console.log(JSON.stringify({
            status:d.status,
            done_verified_eligible:d.done_verified_eligible===true,
            fully_covered:d.fully_covered===true,
            architecture_fully_sovereign:d.architecture_fully_sovereign===true,
            ai_low_refusal_ready:d.ai_low_refusal_ready===true,
            ready_layer_count:Number(d.ready_layer_count||0),
            layer_count:Number(d.layer_count||0),
            covered_layers:d.covered_layers||[],
            uncovered_layers:d.uncovered_layers||[],
            blocked_layers:d.blocked_layers||[],
            registry_count:Number(d.registry_count||0),
            prevalidation_refresh:d.prevalidation_refresh||{},
            deployed_sha:d.deployed_sha||null,
          },null,2));
          if(d?.done_verified_eligible!==true) process.exit(1);
          NODE


      - name: Upload sanitized MEL-SOV-01 proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mel-sov-01-live-proof-${{ inputs.expected_sha || github.sha }}
          path: mel-sov-01-live-proof.json
          if-no-files-found: warn
          retention-days: 30
