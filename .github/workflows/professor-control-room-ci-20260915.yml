name: professor-control-room-ci-20260915

on:
  push:
    branches:
      - ui/professor-control-room-20260915

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Syntax
        run: npm run check
      - name: Professor UI contract
        run: node --test tests/professor-control-room.test.mjs
      - name: Full test suite
        run: npm test
