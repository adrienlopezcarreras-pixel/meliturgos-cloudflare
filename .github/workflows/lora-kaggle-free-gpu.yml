name: lora-kaggle-free-gpu

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - ".github/workflows/lora-kaggle-free-gpu.yml"
      - "kaggle/mel-lora-uncensored/**"
      - "scripts/train-mel-lora.py"
      - "scripts/create-lora-plan.py"
      - "scripts/prepare-kaggle-lora-shard.py"
      - "scripts/run-local-lora-impact.py"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact candidate SHA used for every cycle in this training chain"
        required: false
        default: ""
        type: string
      cycle:
        description: "UNCENSORED training cycle index"
        required: true
        default: "0"
        type: string
      parent_release_tag:
        description: "Previous immutable checkpoint release tag; empty for cycle 0"
        required: false
        default: ""
        type: string
      shard_size:
        description: "Examples trained in this free GPU cycle, including 50 canonical MEL lessons"
        required: true
        default: "750"
        type: string
      max_cycles:
        description: "Maximum chained free-GPU cycles"
        required: true
        default: "100"
        type: string
      benchmark_preview:
        description: "Use isolated Cloudflare preview benchmark after training"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: mel-lora-kaggle-free-gpu
  cancel-in-progress: true

jobs:
  cancel-only:
    if: ${{ contains(github.event.head_commit.message, '[cancel-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel active LoRA waiter by concurrency
        run: echo "cancel-only; no Kaggle training is submitted"

  train-chain:
    if: ${{ !contains(github.event.head_commit.message, '[cancel-only]') }}
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve chain parameters
        shell: bash
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_CYCLE: ${{ inputs.cycle }}
          INPUT_PARENT_RELEASE_TAG: ${{ inputs.parent_release_tag }}
          INPUT_SHARD_SIZE: ${{ inputs.shard_size }}
          INPUT_MAX_CYCLES: ${{ inputs.max_cycles }}
          INPUT_BENCHMARK_PREVIEW: ${{ inputs.benchmark_preview }}
        run: |
          set -euo pipefail
          SOURCE_SHA="${INPUT_SOURCE_SHA:-$GITHUB_SHA}"
          CYCLE="${INPUT_CYCLE:-0}"
          PARENT_RELEASE_TAG="${INPUT_PARENT_RELEASE_TAG:-}"
          SHARD_SIZE="${INPUT_SHARD_SIZE:-750}"
          MAX_CYCLES="${INPUT_MAX_CYCLES:-100}"
          BENCHMARK_PREVIEW="${INPUT_BENCHMARK_PREVIEW:-false}"

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID_SOURCE_SHA"; exit 1; }
          [[ "$CYCLE" =~ ^[0-9]+$ ]] || { echo "INVALID_CYCLE"; exit 1; }
          [[ "$SHARD_SIZE" =~ ^[0-9]+$ ]] || { echo "INVALID_SHARD_SIZE"; exit 1; }
          [[ "$MAX_CYCLES" =~ ^[0-9]+$ ]] || { echo "INVALID_MAX_CYCLES"; exit 1; }
          (( SHARD_SIZE >= 50 && SHARD_SIZE <= 3000 )) || { echo "SHARD_SIZE_OUT_OF_RANGE"; exit 1; }
          (( MAX_CYCLES >= 1 && MAX_CYCLES <= 100 )) || { echo "MAX_CYCLES_OUT_OF_RANGE"; exit 1; }

          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "CYCLE=$CYCLE" >> "$GITHUB_ENV"
          echo "PARENT_RELEASE_TAG=$PARENT_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "SHARD_SIZE=$SHARD_SIZE" >> "$GITHUB_ENV"
          echo "MAX_CYCLES=$MAX_CYCLES" >> "$GITHUB_ENV"
          echo "BENCHMARK_PREVIEW=$BENCHMARK_PREVIEW" >> "$GITHUB_ENV"

      - name: Checkout exact training SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Authenticate Kaggle
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_API_TOKEN_REQUIRED"; exit 1; }
          python -m pip install -q -U kaggle
          KAGGLE_OWNER="$(python - <<'PY'
          import os
          from kagglesdk.kaggle_client import KaggleClient
          from kagglesdk.kaggle_creds import KaggleCredentials
          client = KaggleClient(user_agent="meliturgos-kaggle-lora/2.0")
          creds = KaggleCredentials(client=client, access_token=os.environ["KAGGLE_API_TOKEN"])
          print(creds.introspect())
          PY
          )"
          test -n "$KAGGLE_OWNER"
          echo "KAGGLE_OWNER=$KAGGLE_OWNER" >> "$GITHUB_ENV"
          echo "KERNEL_REF=$KAGGLE_OWNER/mel-lora-uncensored-notebook-t4" >> "$GITHUB_ENV"

      - name: Record free accelerator quota
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if kaggle quota --format json > artifacts/kaggle-quota.json 2> artifacts/kaggle-quota.err; then
            cat artifacts/kaggle-quota.json
          else
            echo "KAGGLE_QUOTA_JSON_UNAVAILABLE"
            cat artifacts/kaggle-quota.err || true
            kaggle quota 2>&1 | tee artifacts/kaggle-quota.txt || true
          fi

      - name: Prepare deterministic training shard outside Kaggle
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "datasets>=2.20" "huggingface_hub>=0.25"
          node scripts/export-canonical-lora-dataset.mjs --output /tmp/mel-canonical-50.jsonl
          python scripts/prepare-kaggle-lora-shard.py             --cycle "$CYCLE"             --shard-size "$SHARD_SIZE"             --mel-lessons /tmp/mel-canonical-50.jsonl             --output /tmp/mel-training-shard.jsonl
          gzip -9 -c /tmp/mel-training-shard.jsonl > /tmp/mel-training-shard.jsonl.gz
          test -s /tmp/mel-training-shard.jsonl.gz
          test -s /tmp/mel-training-shard.jsonl.meta.json

      - name: Fetch immutable parent checkpoint when continuing
        if: env.PARENT_RELEASE_TAG != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mel-parent
          gh release download "$PARENT_RELEASE_TAG"             --repo "$GITHUB_REPOSITORY"             --pattern "mel-lora-bundle.tar.gz"             --dir /tmp/mel-parent
          test -s /tmp/mel-parent/mel-lora-bundle.tar.gz

      - name: Publish private offline cycle payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD_REF="$KAGGLE_OWNER/mel-lora-cycle-payload"
          echo "PAYLOAD_REF=$PAYLOAD_REF" >> "$GITHUB_ENV"

          rm -rf artifacts/kaggle-payload
          mkdir -p artifacts/kaggle-payload
          cp scripts/train-mel-lora.py artifacts/kaggle-payload/train-mel-lora.py
          cp scripts/create-lora-plan.py artifacts/kaggle-payload/create-lora-plan.py
          cp scripts/run-local-lora-impact.py artifacts/kaggle-payload/run-local-lora-impact.py
          cp /tmp/mel-training-shard.jsonl.gz artifacts/kaggle-payload/mel-training-shard.jsonl.gz
          cp /tmp/mel-training-shard.jsonl.meta.json artifacts/kaggle-payload/mel-training-shard.jsonl.meta.json
          if [[ -s /tmp/mel-parent/mel-lora-bundle.tar.gz ]]; then
            cp /tmp/mel-parent/mel-lora-bundle.tar.gz artifacts/kaggle-payload/parent-bundle.tar.gz
          fi

          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("artifacts/kaggle-payload")
          payload={
              "schema":"mel.kaggle-cycle-payload.v1",
              "source_sha":os.environ["SOURCE_SHA"],
              "cycle":int(os.environ["CYCLE"]),
              "shard_size":int(os.environ["SHARD_SIZE"]),
              "parent_release_tag":os.environ.get("PARENT_RELEASE_TAG") or None,
              "private":True,
          }
          (root/"payload.json").write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          metadata={
              "title":"MEL LoRA Cycle Payload",
              "id":f'{os.environ["KAGGLE_OWNER"]}/mel-lora-cycle-payload',
              "licenses":[{"name":"other"}],
              "description":"Private transient MEL LoRA training payload. Exact source provenance is retained inside payload.json and shard metadata.",
          }
          (root/"dataset-metadata.json").write_text(json.dumps(metadata,indent=2)+"\n",encoding="utf-8")
          PY

          if kaggle datasets files "$PAYLOAD_REF" >/dev/null 2>&1; then
            kaggle datasets version               -p artifacts/kaggle-payload               -m "MEL LoRA cycle $CYCLE source $SOURCE_SHA"
          else
            kaggle datasets create -p artifacts/kaggle-payload
          fi

          STATUS_READY=0
          for attempt in $(seq 1 60); do
            DATASET_STATUS="$(kaggle datasets status "$PAYLOAD_REF" --format json 2>&1 || true)"
            echo "dataset-status[$attempt] $DATASET_STATUS"
            LOWER_STATUS="$(printf '%s' "$DATASET_STATUS" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$LOWER_STATUS" | grep -Eq 'ready|complete|completed|success|active'; then
              STATUS_READY=1
              printf '%s\n' "$DATASET_STATUS" > artifacts/kaggle-payload-status.json
              break
            fi
            if printf '%s' "$LOWER_STATUS" | grep -Eq 'error|failed|failure'; then
              echo "KAGGLE_PAYLOAD_DATASET_FAILED"
              exit 1
            fi
            sleep 10
          done
          if [[ "$STATUS_READY" != "1" ]]; then
            echo "KAGGLE_PAYLOAD_DATASET_STATUS_TIMEOUT"
            exit 1
          fi

          READY=0
          for attempt in $(seq 1 30); do
            FILES="$(kaggle datasets files "$PAYLOAD_REF" 2>&1 || true)"
            echo "payload-files[$attempt] $FILES"
            if printf '%s' "$FILES" | grep -q "payload.json"; then
              printf '%s\n' "$FILES" > artifacts/kaggle-payload-files.txt
              READY=1
              break
            fi
            sleep 10
          done
          if [[ "$READY" != "1" ]]; then
            echo "KAGGLE_PAYLOAD_DATASET_FILES_NOT_READY"
            exit 1
          fi
          cat artifacts/kaggle-payload-status.json
          cat artifacts/kaggle-payload-files.txt
          grep -q "payload.json" artifacts/kaggle-payload-files.txt

      - name: Build fully offline Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kaggle-kernel
          cp kaggle/mel-lora-uncensored/kernel-metadata.json artifacts/kaggle-kernel/kernel-metadata.json

          python - <<'PY'
          import json, os
          from pathlib import Path
          source=Path("kaggle/mel-lora-uncensored/run.py").read_text(encoding="utf-8")
          replacements={
              "__MEL_GIT_SHA__":os.environ["SOURCE_SHA"],
              "__MEL_CYCLE__":os.environ["CYCLE"],
              "__MEL_SHARD_SIZE__":os.environ["SHARD_SIZE"],
          }
          for key,value in replacements.items():
              source=source.replace(key,value)
          if "__MEL_" in source:
              raise SystemExit("UNRESOLVED_KAGGLE_TEMPLATE_PLACEHOLDER")
          Path("artifacts/kaggle-kernel/run.py").write_text(source,encoding="utf-8")
          notebook={
              "cells":[{
                  "cell_type":"code",
                  "execution_count":None,
                  "metadata":{"trusted":True},
                  "outputs":[],
                  "source":source.splitlines(keepends=True),
              }],
              "metadata":{
                  "kernelspec":{"display_name":"Python 3","language":"python","name":"python3"},
                  "language_info":{"name":"python","version":"3.12"},
                  "kaggle":{
                      "accelerator":"nvidiaTeslaT4",
                      "dataSources":[],
                      "isInternetEnabled":False,
                      "language":"python",
                      "sourceType":"notebook",
                      "isGpuEnabled":True,
                  },
              },
              "nbformat":4,
              "nbformat_minor":5,
          }
          Path("artifacts/kaggle-kernel/mel-lora-uncensored-notebook-t4.ipynb").write_text(
              json.dumps(notebook,ensure_ascii=False,indent=1)+"\n",encoding="utf-8"
          )

          meta=json.loads(Path("artifacts/kaggle-kernel/kernel-metadata.json").read_text())
          meta["id"]=f'{os.environ["KAGGLE_OWNER"]}/mel-lora-uncensored-notebook-t4'
          meta["title"]="MEL LoRA Uncensored Notebook T4"
          meta["code_file"]="mel-lora-uncensored-notebook-t4.ipynb"
          meta["kernel_type"]="notebook"
          meta["enable_gpu"]=True
          meta["enable_internet"]=False
          meta["machine_shape"]="NvidiaTeslaT4"
          meta["dataset_sources"]=[
              "cdeotte/mistral-7b-instruct-v02-fp16",
              "nbroad/hf-libraries",
              os.environ["PAYLOAD_REF"],
          ]
          Path("artifacts/kaggle-kernel/kernel-metadata.json").write_text(
              json.dumps(meta,indent=2)+"\n",encoding="utf-8"
          )
          PY

          python -m py_compile artifacts/kaggle-kernel/run.py
          test -s artifacts/kaggle-kernel/run.py
          test -s artifacts/kaggle-kernel/mel-lora-uncensored-notebook-t4.ipynb
          test "$(wc -c < artifacts/kaggle-kernel/run.py)" -lt 100000
          python -m json.tool artifacts/kaggle-kernel/mel-lora-uncensored-notebook-t4.ipynb >/dev/null
          cat artifacts/kaggle-kernel/kernel-metadata.json

      - name: Submit free offline Kaggle T4 training
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push             -p artifacts/kaggle-kernel             --accelerator NvidiaTeslaT4             -t 120
          echo "Submitted $KERNEL_REF cycle $CYCLE with internet disabled."

      - name: Verify server-side GPU metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/kaggle-server-metadata
          VERIFIED=0
          for attempt in $(seq 1 6); do
            rm -rf artifacts/kaggle-server-metadata
            mkdir -p artifacts/kaggle-server-metadata
            if kaggle kernels pull "$KERNEL_REF" -p artifacts/kaggle-server-metadata -m >/tmp/kaggle-pull.log 2>&1; then
              META="$(find artifacts/kaggle-server-metadata -name kernel-metadata.json -print -quit)"
              if [[ -n "$META" && -s "$META" ]]; then
                cat "$META"
                python -c 'import json,sys; meta=json.load(open(sys.argv[1],encoding="utf-8")); gpu=meta.get("enable_gpu") is True; shape=str(meta.get("machine_shape") or ""); print(json.dumps({"enable_gpu":gpu,"machine_shape":shape})); sys.exit(0 if gpu and shape=="NvidiaTeslaT4" else 2)' "$META"
                VERIFIED=1
                break
              fi
            fi
            cat /tmp/kaggle-pull.log || true
            sleep 10
          done
          [[ "$VERIFIED" == "1" ]] || { echo "KAGGLE_SERVER_METADATA_UNVERIFIED"; exit 1; }

      - name: Wait for Kaggle cycle
        shell: bash
        run: |
          set -euo pipefail
          COMPLETE=0
          for attempt in $(seq 1 210); do
            STATUS="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
            echo "[$attempt] $STATUS"
            LOWER="$(printf '%s' "$STATUS" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$LOWER" | grep -Eq 'complete|completed|success'; then
              COMPLETE=1
              break
            fi
            if printf '%s' "$LOWER" | grep -Eq 'error|failed|failure|cancelled|canceled|cancel_acknowledged|cancel acknowledged'; then
              mkdir -p artifacts/kaggle-error
              kaggle kernels output "$KERNEL_REF" -p artifacts/kaggle-error --force || true
              find artifacts/kaggle-error -type f -maxdepth 4 -print || true
              echo "::error title=Kaggle GPU run failed::$STATUS"
              exit 1
            fi
            sleep 60
          done
          [[ "$COMPLETE" == "1" ]] || { echo "KAGGLE_GPU_RUN_TIMEOUT"; exit 1; }

      - name: Download trained bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kaggle-output artifacts/lora-incoming
          kaggle kernels output "$KERNEL_REF" -p artifacts/kaggle-output --force
          BUNDLE="$(find artifacts/kaggle-output -type f -name 'mel-lora-bundle.tar.gz' -print -quit)"
          [[ -n "$BUNDLE" && -s "$BUNDLE" ]] || {
            echo "KAGGLE_BUNDLE_MISSING"
            find artifacts/kaggle-output -maxdepth 4 -type f -print
            exit 1
          }
          tar -xzf "$BUNDLE" -C artifacts/lora-incoming
          cp "$BUNDLE" artifacts/mel-lora-bundle.tar.gz
          cp artifacts/lora-incoming/kaggle-run.json artifacts/kaggle-run.json

      - name: Validate exact provenance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { assertAdapterArtifact } from './src/learning/lora-plan.js';
          const dir='artifacts/lora-incoming';
          const plan=JSON.parse(fs.readFileSync(dir+'/lora-plan.json','utf8'));
          const artifact=JSON.parse(fs.readFileSync(dir+'/artifact-evidence.json','utf8'));
          const training=JSON.parse(fs.readFileSync(dir+'/training-evidence.json','utf8'));
          const run=JSON.parse(fs.readFileSync(dir+'/kaggle-run.json','utf8'));
          const checked=assertAdapterArtifact(artifact);
          if(String(run.source_sha)!==String(process.env.SOURCE_SHA)) throw new Error('KAGGLE_SOURCE_SHA_MISMATCH');
          if(Number(run.cycle)!==Number(process.env.CYCLE)) throw new Error('KAGGLE_CYCLE_MISMATCH');
          if(checked.finetune_id) throw new Error('PREEXISTING_FINETUNE_ID_FORBIDDEN');
          if(String(training.plan_id||'')!==String(plan.id||'')) throw new Error('TRAINING_PLAN_ID_MISMATCH');
          if(String(artifact.dataset_digest||'')!==String(plan.dataset_digest||'')) throw new Error('LORA_DATASET_MISMATCH');
          if(String(artifact.training_manifest_digest||'').toLowerCase()!==String(plan.training_manifest_digest||'').toLowerCase()) throw new Error('LORA_TRAINING_MANIFEST_MISMATCH');
          console.log(JSON.stringify({
            status:'KAGGLE_BUNDLE_VERIFIED',
            cycle:Number(process.env.CYCLE),
            artifact_digest:checked.digest,
            train_loss:run.train_loss,
            global_step:run.global_step,
            offline_kernel:run.offline_kernel===true,
          },null,2));
          NODE

      - name: Save immutable checkpoint release
        shell: bash
        run: |
          set -euo pipefail
          SHORT="${SOURCE_SHA:0:12}"
          TAG="mel-lora-kaggle-${SHORT}-c$(printf '%03d' "$CYCLE")"
          echo "CHECKPOINT_TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/mel-lora-bundle.tar.gz artifacts/kaggle-run.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artifacts/mel-lora-bundle.tar.gz artifacts/kaggle-run.json               --repo "$GITHUB_REPOSITORY"               --target "$SOURCE_SHA"               --title "MEL LoRA Kaggle UNCENSORED cycle $CYCLE"               --notes "Free offline Kaggle GPU checkpoint. No production deployment. No paid fallback."
          fi

      - name: Create zero-cost training result
        if: env.BENCHMARK_PREVIEW != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path("artifacts/kaggle-run.json").read_text())
          result={
            "status":"TRAINED_UNBENCHMARKED",
            "cycle":run.get("cycle"),
            "artifact_digest":run.get("artifact_digest"),
            "train_loss":run.get("train_loss"),
            "global_step":run.get("global_step"),
            "next_stage":run.get("local_next_stage") or "UNCENSORED_CONTINUE",
            "local_uncensored_gate":run.get("local_uncensored_gate") is True,
            "local_impact":run.get("local_impact") or {},
            "local_impact_delta":run.get("local_impact_delta") or {},
            "activation_blocker":"CANONICAL_PREVIEW_BENCHMARK_NOT_RUN" if run.get("local_uncensored_gate") else "LOCAL_IMPACT_GATE_NOT_PASSED",
            "zero_cost_only":True,
          }
          Path("artifacts/finalize-result.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY

      - name: Upload adapter to Cloudflare open-beta LoRA
        if: env.BENCHMARK_PREVIEW == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/upload-cloudflare-lora.mjs             --dir artifacts/lora-incoming             --name "mel-kaggle-c${CYCLE}-${GITHUB_RUN_ID}"
          node scripts/approve-lora-artifact.mjs             --dir artifacts/lora-incoming             --approval-id "kaggle-${GITHUB_RUN_ID}-c${CYCLE}"

      - name: Benchmark isolated preview
        if: env.BENCHMARK_PREVIEW == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_PASSWORD="$(python - <<'PY'
          import hashlib,hmac,os
          token=os.environ["CLOUDFLARE_API_TOKEN"].encode()
          print(hmac.new(token,b"meliturgos-preview-auth-v1",hashlib.sha256).hexdigest())
          PY
          )"
          export MELITURGOS_PASSWORD="$PREVIEW_PASSWORD"
          export MEL_BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          node scripts/finalize-lora.mjs             --dir artifacts/lora-incoming             --url "$MEL_BASE_URL"             --activate true             --allow-not-activated true | tee artifacts/finalize-result.json

      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kaggle-lora-cycle-${{ github.run_id }}
          path: |
            artifacts/kaggle-run.json
            artifacts/finalize-result.json
            artifacts/lora-incoming/lora-plan.json
            artifacts/lora-incoming/training-evidence.json
            artifacts/lora-incoming/training-started.json
            artifacts/lora-incoming/training-progress.jsonl
            artifacts/lora-incoming/artifact-evidence.json
            artifacts/lora-incoming/approval-evidence.json
            artifacts/lora-incoming/dataset-metadata.json
            artifacts/lora-incoming/shard-metadata.json
            artifacts/kaggle-error/**
            artifacts/kaggle-quota.json
            artifacts/kaggle-quota.txt
            artifacts/kaggle-quota.err
            artifacts/kaggle-payload-status.json
            artifacts/kaggle-payload-files.txt
            artifacts/kaggle-server-metadata/**/kernel-metadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Continue free UNCENSORED chain
        shell: bash
        run: |
          set -euo pipefail
          NEXT_STAGE="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("artifacts/finalize-result.json").read_text())
          print(data.get("next_stage") or "UNCENSORED_CONTINUE")
          PY
          )"
          NEXT_CYCLE=$((CYCLE + 1))

          {
            echo "### MEL free Kaggle LoRA"
            echo "- Cycle: $CYCLE"
            echo "- Checkpoint: $CHECKPOINT_TAG"
            echo "- Next stage: $NEXT_STAGE"
            echo "- Zero-cost only: true"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$NEXT_STAGE" == "AGENTIC_READY" ]]; then
            echo "Canonical UNCENSORED gate reached; preserve parent and stop before AGENTIC."
            exit 0
          fi
          if [[ "$NEXT_STAGE" == "LOCAL_GATE_READY_FOR_CANONICAL_BENCHMARK" ]]; then
            echo "Local zero-cost impact gate reached; preserve checkpoint and dispatch exact canonical benchmark collector."
            gh workflow run lora-kaggle-free-collect.yml \
              --repo "$GITHUB_REPOSITORY" \
