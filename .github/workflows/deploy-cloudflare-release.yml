name: deploy-cloudflare-release

on:
  push:
    branches:
      - 'release/mel-hardware-v0.1.0'
  workflow_dispatch:
    inputs:
      release_branch:
        description: Exact release/* branch that points to the approved canonical candidate
        required: true
        type: string
      expected_sha:
        description: Exact 40-character candidate SHA approved for production
        required: true
        type: string
      approval:
        description: Type DEPLOY_APPROVED to authorize the production mutation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: meliturgos-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.release_branch || github.ref_name }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approval || 'DEPLOY_APPROVED' }}
    steps:
      - name: Require explicit production approval
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "DEPLOY_APPROVED"
          case "$RELEASE_BRANCH" in
            release/*) ;;
            *) echo "release_branch must start with release/"; exit 2 ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$RELEASE_BRANCH" = "release/mel-hardware-v0.1.0"
          fi

      - name: Checkout exact release pointer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_branch || github.sha }}
          fetch-depth: 0

      - name: Prove release pointer equals the current production source
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$EXPECTED_SHA"
          git fetch origin main --depth=1
          SOURCE_SHA="$(git rev-parse FETCH_HEAD)"
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
          echo "Exact release identity verified against main: $EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs

      - name: Syntax gate
        run: npm run check

      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B candidate/release-ci-head "$EXPECTED_SHA"
          npm test

      - name: Build critical MEL code bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -czf mel-critical-code.tar.gz \
            --exclude='src/assets' \
            src shardvault worker.js wrangler.jsonc package.json package-lock.json
          test -s mel-critical-code.tar.gz
          BUNDLE_BYTES="$(wc -c < mel-critical-code.tar.gz)"
          SHARD_BYTES=$(( (BUNDLE_BYTES + 32 + 3) / 4 ))
          if [ "$SHARD_BYTES" -lt 65536 ]; then SHARD_BYTES=65536; fi
          echo "MEL_CRITICAL_CODE_BUNDLE_BYTES=$BUNDLE_BYTES" >> "$GITHUB_ENV"
          echo "MEL_CRITICAL_CODE_SHARD_BYTES=$SHARD_BYTES" >> "$GITHUB_ENV"
          echo "Critical code bundle bytes: $BUNDLE_BYTES"
          echo "Representative code shard bytes: $SHARD_BYTES"

      - name: Upload critical MEL code bundle to R2
        shell: bash
        run: |
          set -euo pipefail
          REPO_KEY="${GITHUB_REPOSITORY//\//__}"
          OBJECT_PATH="meliturgos-private-media/shardvault/code-critical/${REPO_KEY}/${EXPECTED_SHA}.tar.gz"
          npx wrangler r2 object put "$OBJECT_PATH" \
            --file mel-critical-code.tar.gz \
            --content-type application/gzip \
            --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy exact approved SHA to production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --define "MEL_DEPLOYED_GIT_SHA:'${EXPECTED_SHA}'" \
            --define "MEL_DEPLOYED_GIT_BRANCH:'${RELEASE_BRANCH}'" \
            --define "MEL_CRITICAL_CODE_BUNDLE_BYTES:${MEL_CRITICAL_CODE_BUNDLE_BYTES}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prepare and prove production autonomy launch evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          BOOTSTRAP_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${BOOTSTRAP_TOKEN}"

          cleanup_secret() {
            set +e
            set +o pipefail
            printf 'y\n' | npx wrangler secret delete MEL_LAUNCH_BOOTSTRAP_TOKEN --env="" >/tmp/mel-launch-secret-delete.log 2>&1
            rc=${PIPESTATUS[1]}
            set -o pipefail
            set -e
            return "$rc"
          }
          trap 'cleanup_secret || true' EXIT

          printf '%s' "$BOOTSTRAP_TOKEN" | npx wrangler secret put MEL_LAUNCH_BOOTSTRAP_TOKEN --env=""

          ready=0
          for attempt in $(seq 1 20); do
            HTTP_CODE="$(curl --silent --show-error --max-time 180 \
              --header "x-mel-launch-bootstrap: ${BOOTSTRAP_TOKEN}" \
              --header "content-type: application/json" \
              --data '{}' \
              --output production-launch-bootstrap.json \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/internal/release-launch-bootstrap" || true)"
            if [ "$HTTP_CODE" = "200" ]; then
              ready=1
              break
            fi
            echo "Launch bootstrap attempt ${attempt} returned HTTP ${HTTP_CODE}."
            if [ -s production-launch-bootstrap.json ]; then
              node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("production-launch-bootstrap.json","utf8")); console.log(JSON.stringify({status:d?.status||null,blockers:d?.readiness?.blockers||[],restore_status:d?.readiness?.restore?.status||null,shardvault_status:d?.readiness?.shardvault?.status||null,active_external_count:Number(d?.readiness?.shardvault?.active_external_count||0),external_code_status:d?.readiness?.shardvault?.external_code_status||null,external_code_endpoints:Number(d?.readiness?.shardvault?.external_code_endpoints||0),code_sync:d?.code_sync||null},null,2));'
            fi
            sleep 5
          done
          test "$ready" -eq 1

          EXPECTED_SHA="$EXPECTED_SHA" node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('production-launch-bootstrap.json','utf8'));
          const r=d?.readiness||{};
          const shard=r.shardvault||{};
          const restore=r.restore||{};
          if(d?.ok!==true) throw new Error('PRODUCTION_LAUNCH_BOOTSTRAP_NOT_OK');
          if(d?.autonomy_started!==false || d?.owner_launch_required!==true) throw new Error('BOOTSTRAP_MUST_NOT_START_AUTONOMY');
          if(r?.launch_ready!==true || r?.status!=='GO_FOR_SUPERVISED_AUTONOMY') throw new Error('PRODUCTION_LAUNCH_NO_GO');
          if(String(r?.candidate_sha||'')!==String(process.env.EXPECTED_SHA||'')) throw new Error('PRODUCTION_LAUNCH_SHA_MISMATCH');
          for(const [key,value] of Object.entries(r?.gates||{})){
            if(value!==true) throw new Error('PRODUCTION_LAUNCH_GATE_FALSE:'+key);
          }
          if(restore?.ok!==true || restore?.sha_matches!==true) throw new Error('PRODUCTION_RESTORE_SHA_NOT_VERIFIED');
          if(String(restore?.deployed_sha||'')!==String(process.env.EXPECTED_SHA||'')) throw new Error('PRODUCTION_RESTORE_DEPLOYED_SHA_MISMATCH');
          if(String(restore?.backup_deployed_sha||'')!==String(process.env.EXPECTED_SHA||'')) throw new Error('PRODUCTION_BACKUP_SHA_MISMATCH');
          if(shard?.ok!==true || shard?.recoverable!==true) throw new Error('PRODUCTION_SHARDVAULT_NOT_RECOVERABLE');
          if(Number(shard?.active_external_count||0)<7) throw new Error('PRODUCTION_SHARDVAULT_EXTERNAL_LT_7');
          if(shard?.external_code_status!=='COPIED') throw new Error('PRODUCTION_EXTERNAL_CODE_NOT_COPIED');
          if(Number(shard?.external_code_endpoints||0)<7) throw new Error('PRODUCTION_EXTERNAL_CODE_ENDPOINTS_LT_7');
          console.log(JSON.stringify({
            status:r.status,
            candidate_sha:r.candidate_sha,
            gates:r.gates,
            retry_cap:r?.failure_hygiene?.retry_cap,
            historical_failed_count:r?.failure_hygiene?.historical_failed_count,
            restore,
            shardvault:shard,
            autonomy_started:d.autonomy_started,
            owner_launch_required:d.owner_launch_required,
          },null,2));
          NODE

          PUBLIC_CODE="$(curl --silent --show-error --max-time 60 \
            --output production-launch-readiness.json \
            --write-out '%{http_code}' \
            "${BASE_URL}/api/teacher/launch-readiness")"
          test "$PUBLIC_CODE" = "200"

          EXPECTED_SHA="$EXPECTED_SHA" node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('production-launch-readiness.json','utf8'));
          if(d?.launch_ready!==true || d?.status!=='GO_FOR_SUPERVISED_AUTONOMY') throw new Error('PUBLIC_PRODUCTION_LAUNCH_NO_GO');
          if(String(d?.candidate_sha||'')!==String(process.env.EXPECTED_SHA||'')) throw new Error('PUBLIC_PRODUCTION_SHA_MISMATCH');
          if(d?.restore?.ok!==true) throw new Error('PUBLIC_PRODUCTION_RESTORE_NOT_OK');
          if(d?.shardvault?.ok!==true) throw new Error('PUBLIC_PRODUCTION_SHARDVAULT_NOT_OK');
          if(Number(d?.shardvault?.active_external_count||0)<7) throw new Error('PUBLIC_PRODUCTION_EXTERNAL_LT_7');
          if(d?.shardvault?.external_code_status!=='COPIED') throw new Error('PUBLIC_PRODUCTION_CODE_NOT_COPIED');
          if(Number(d?.shardvault?.external_code_endpoints||0)<7) throw new Error('PUBLIC_PRODUCTION_CODE_ENDPOINTS_LT_7');
          console.log('Public production launch-readiness proof is GO.');
          NODE

          cleanup_secret
          trap - EXIT
          echo "Temporary launch bootstrap secret deleted."

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo '### MEL production launch readiness'
              echo
              echo '- Verdict: **GO_FOR_SUPERVISED_AUTONOMY**'
              echo "- Exact SHA: \`${EXPECTED_SHA}\`"
              echo '- Fresh SHA-bound system backup: verified'
              echo '- ShardVault recovery: verified'
              echo '- External critical-code copies: >= 7'
              echo '- Historical failure retries: bounded'
              echo '- Autonomy started by deployment: **no**'
              echo '- Owner Resume/MAX remains required to start the SHA'
              echo '- Temporary bootstrap secret: deleted'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production HTTP
        shell: bash
        run: |
          set -euo pipefail
          PROD_STATUS="$(curl --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            --output production-root.html \
            --write-out '%{http_code}' \
            https://meliturgos.adrien-lopezcarreras.workers.dev)"
          case "$PROD_STATUS" in
            2??|3??|401) ;;
            *) echo "Unexpected production HTTP status: $PROD_STATUS"; exit 22 ;;
          esac
          echo "Production HTTP verification passed with status ${PROD_STATUS}."
