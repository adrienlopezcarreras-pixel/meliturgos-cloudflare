name: deploy-cloudflare-release

on:
  workflow_dispatch:
  push:
    branches:
      - release/mel-2026-09-11-r5
    paths:
      - '.github/workflows/deploy-cloudflare-release.yml'

permissions:
  contents: read

concurrency:
  group: meliturgos-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Verify release branch
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            release/*) ;;
            *) echo "Refusing production deploy outside release/*: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
          echo "Deploying ${GITHUB_SHA} from ${GITHUB_REF_NAME}"

      - name: Install exact lockfile
        run: npm ci

      - name: Dependency security gate
        run: npm audit --audit-level=high

      - name: Syntax
        run: npm run check

      - name: Full test suite
        run: npm test

      - name: Deploy Cloudflare Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
