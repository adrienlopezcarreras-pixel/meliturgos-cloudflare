          fi

          # Use Wrangler's supported rollback command rather than hand-crafting
          # the deployment API request. It resolves the Worker identity from the
          # canonical config and creates a 100% deployment of the captured version.
          if ! npx wrangler rollback "${PREVIOUS_CLOUDFLARE_VERSION_ID}" \
            --name meliturgos \
            --message "MEL automatic rollback after failed release verification" \
            >/tmp/mel-rollback.log 2>&1; then
            echo "Automatic Wrangler rollback failed."
            cat /tmp/mel-rollback.log
            exit 49
          fi
