          };
          if(!/^[0-9a-f]{40}$/i.test(String(proof.source_sha||''))) throw new Error('PRODUCTION_SOVEREIGNTY_SOURCE_SHA_INVALID');
          if(proof.secret_values_exposed!==false) throw new Error('PRODUCTION_SOVEREIGNTY_SECRET_SANITIZATION_FAILED');
          fs.writeFileSync('production-sovereignty-proof.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof,null,2));
          NODE

          rm -f production-sovereignty-status.json

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
