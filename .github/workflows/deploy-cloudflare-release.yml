          echo "Automatic rollback accepted to previous stable Cloudflare version."

          CONTROL_READY=0
          for CONTROL_ATTEMPT in $(seq 1 18); do
            CONTROL_CODE="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 1 --max-time 30 \
              --output rollback-autonomy-control.json \
              --write-out '%{http_code}' \
              "https://meliturgos.adrien-lopezcarreras.workers.dev/api/gen2/autonomy/control" || true)"
            if [ "${CONTROL_CODE}" = "200" ] && \
              PREVIOUS_AUTONOMY_PAUSED="${PREVIOUS_AUTONOMY_PAUSED}" \
              PREVIOUS_MAX_AUTONOMY="${PREVIOUS_MAX_AUTONOMY}" \
              node - <<'NODE'
          const d=require('./rollback-autonomy-control.json');
          const paused=String(process.env.PREVIOUS_AUTONOMY_PAUSED)==='true';
          const max=String(process.env.PREVIOUS_MAX_AUTONOMY)==='true';
          if(d?.ok!==true || d?.paused!==paused || d?.max_autonomy!==max) process.exit(1);
          NODE
            then
              CONTROL_READY=1
              break
            fi
            echo "Rollback autonomy control verification attempt ${CONTROL_ATTEMPT}/18 returned HTTP ${CONTROL_CODE}; waiting for stable propagation."
            sleep 3
          done

          if [ "${PRE_RESTORE_REQUIRED}" = "1" ] && [ "${PRE_RESTORE_READY}" != "1" ]; then
            echo "Worker rollback succeeded, but the prior launch SHA could not be staged before rollback."
            exit 56
          fi
          if [ "${CONTROL_READY}" != "1" ]; then
            echo "Worker rollback succeeded, but prior paused/MAX control was not observable after propagation."
            test ! -s rollback-autonomy-control.json || cat rollback-autonomy-control.json
            exit 57
          fi
          echo "Previous stable Worker and autonomy control restored after failed exact-SHA release."


  post-release-health:
    name: post-release-health-gate
    needs: deploy
    uses: ./.github/workflows/post-release-proof-suite.yml
    with:
      expected_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
    secrets: inherit
