name: deploy-cloudflare-release

on:
  push:
    branches:
      - 'release/mel-hardware-v0.1.0'
  workflow_dispatch:
    inputs:
      release_branch:
        description: Exact release/* branch that points to the approved canonical candidate
        required: true
        type: string
      expected_sha:
        description: Exact 40-character candidate SHA approved for production
        required: true
        type: string
      approval:
        description: Type DEPLOY_APPROVED to authorize the production mutation
        required: true
        type: string
      owner_max_autorelease:
        description: Re-enable MAX 100% automatically after a fully verified autonomous release
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: mel-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    concurrency:
      group: mel-launch-bootstrap-token
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.release_branch || github.ref_name }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approval || 'DEPLOY_APPROVED' }}
      OWNER_MAX_AUTORELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_max_autorelease && 'true' || 'false' }}
      # TEMPORARY DEV-LIGHT MODE: ShardVault 7/7/code-sync proof paused to finish downstream release validation.
      # MUST be restored to 'false' before final validation/closure.
      MEL_ROADMAP_SHARDVAULT_PAUSED: 'false'
      # TEMPORARY DEV-LIGHT MODE: keep external/deep AI proofs out of the blocking release path.
      # MUST be restored to 'false' before final roadmap closure.
      MEL_RELEASE_DEEP_AI_PROOFS_PAUSED: 'false'
    steps:
      - name: Require explicit production approval
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "DEPLOY_APPROVED"
          case "$RELEASE_BRANCH" in
            release/*) ;;
            *) echo "release_branch must start with release/"; exit 2 ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$RELEASE_BRANCH" = "release/mel-hardware-v0.1.0"
          fi

      - name: Checkout exact release pointer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_branch || github.sha }}
          fetch-depth: 0

      - name: Prove release pointer belongs to the current main history
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$EXPECTED_SHA"
          git fetch origin main
          SOURCE_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$SOURCE_SHA" != "$EXPECTED_SHA" ]; then
            CANONICAL_MAIN_SHA=""
            if git merge-base --is-ancestor "$EXPECTED_SHA" "$SOURCE_SHA"; then
              CANONICAL_MAIN_SHA="$EXPECTED_SHA"
            else
              read -r COMMIT_SHA PARENT_ONE PARENT_TWO EXTRA_PARENT <<<"$(git rev-list --parents -n 1 "$EXPECTED_SHA")"
              test "$COMMIT_SHA" = "$EXPECTED_SHA"
              test -n "${PARENT_ONE:-}"
              test -n "${PARENT_TWO:-}"
              test -z "${EXTRA_PARENT:-}"
              RELEASE_TREE="$(git rev-parse "$EXPECTED_SHA^{tree}")"
              for PARENT_SHA in "$PARENT_ONE" "$PARENT_TWO"; do
                if git merge-base --is-ancestor "$PARENT_SHA" "$SOURCE_SHA"; then
                  PARENT_TREE="$(git rev-parse "$PARENT_SHA^{tree}")"
                  if [ "$RELEASE_TREE" = "$PARENT_TREE" ]; then
                    test -z "$CANONICAL_MAIN_SHA"
                    CANONICAL_MAIN_SHA="$PARENT_SHA"
                  fi
                fi
              done
              test -n "$CANONICAL_MAIN_SHA"
              echo "Release merge SHA matches canonical main parent tree exactly: ${CANONICAL_MAIN_SHA}"
            fi
            MAIN_ADVANCE_COUNT="$(git rev-list --count "$CANONICAL_MAIN_SHA..$SOURCE_SHA")"
            test "$MAIN_ADVANCE_COUNT" -le 25
            echo "main advanced by ${MAIN_ADVANCE_COUNT} commit(s) after canonical release content; exact release content remains in main history."
          fi
          echo "Exact release identity verified against canonical main history: $EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs --require-release-eligible

      - name: Syntax gate
        run: npm run check

      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B candidate/release-ci-head "$EXPECTED_SHA"
          npm test

      - name: Build critical MEL code bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -czf mel-critical-code.tar.gz \
            --exclude='src/assets' \
            src shardvault worker.js wrangler.jsonc package.json package-lock.json
          test -s mel-critical-code.tar.gz
          BUNDLE_BYTES="$(wc -c < mel-critical-code.tar.gz)"
          SHARD_BYTES=$(( (BUNDLE_BYTES + 32 + 3) / 4 ))
          if [ "$SHARD_BYTES" -lt 65536 ]; then SHARD_BYTES=65536; fi
          echo "MEL_CRITICAL_CODE_BUNDLE_BYTES=$BUNDLE_BYTES" >> "$GITHUB_ENV"
          echo "MEL_CRITICAL_CODE_SHARD_BYTES=$SHARD_BYTES" >> "$GITHUB_ENV"
          echo "Critical code bundle bytes: $BUNDLE_BYTES"
          echo "Representative code shard bytes: $SHARD_BYTES"

      - name: Upload critical MEL code bundle to R2
        shell: bash
        run: |
          set -euo pipefail
          REPO_KEY="${GITHUB_REPOSITORY//\//__}"
          OBJECT_PATH="meliturgos-private-media/shardvault/code-critical/${REPO_KEY}/${EXPECTED_SHA}.tar.gz"
          npx wrangler r2 object put "$OBJECT_PATH" \
            --file mel-critical-code.tar.gz \
            --content-type application/gzip \
            --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Refresh current production backup through ephemeral worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          MEL_BACKUP_ENCRYPTION_KEY_B64: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_B64 }}
          MEL_BACKUP_ENCRYPTION_KEY_ID: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "${MEL_BACKUP_ENCRYPTION_KEY_B64:-}"
          test -n "${MEL_BACKUP_ENCRYPTION_KEY_ID:-}"

          curl --silent --show-error --fail-with-body --max-time 60 \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=release%2Fmel-hardware-v0.1.0&status=success&per_page=100" \
            > successful-release-runs.json
          CURRENT_PRODUCTION_SHA="$(node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('successful-release-runs.json','utf8'));
          const rows=(d.workflow_runs||[]).filter(row =>
            row?.name==='deploy-cloudflare-release' &&
            row?.conclusion==='success' &&
            /^[0-9a-f]{40}$/i.test(String(row?.head_sha||''))
          );
          if(!rows.length) throw new Error('CURRENT_PRODUCTION_RELEASE_SHA_NOT_FOUND');
          process.stdout.write(String(rows[0].head_sha).toLowerCase());
          NODE
          )"
          [[ "${CURRENT_PRODUCTION_SHA}" =~ ^[0-9a-f]{40}$ ]]
          echo "Current canonical production release SHA: ${CURRENT_PRODUCTION_SHA}"
          echo "PREVIOUS_DEPLOYED_SHA=${CURRENT_PRODUCTION_SHA}" >> "$GITHUB_ENV"

          REFRESH_NAME="mel-pd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REFRESH_CONFIG="release-tools/predeploy-backup-refresh/wrangler.run.jsonc"
          REFRESH_URL="https://${REFRESH_NAME}.adrien-lopezcarreras.workers.dev"
          export REFRESH_NAME
          node - <<'NODE'
          const fs=require('fs');
          const source='release-tools/predeploy-backup-refresh/wrangler.jsonc';
          const target='release-tools/predeploy-backup-refresh/wrangler.run.jsonc';
          const config=JSON.parse(fs.readFileSync(source,'utf8'));
          config.name=process.env.REFRESH_NAME;
          fs.writeFileSync(target,JSON.stringify(config,null,2));
          NODE
          REFRESH_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${REFRESH_TOKEN}"
          REFRESH_CREATED=0

          cleanup_refresher() {
            set +e
            if [ "${REFRESH_CREATED:-0}" = "1" ]; then
              DELETE_OK=0
              for CLEANUP_ATTEMPT in $(seq 1 5); do
                DELETE_CODE="$(curl --silent --show-error --max-time 30 \
                  --request DELETE \
                  --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  --output /tmp/predeploy-refresh-delete.json \
                  --write-out '%{http_code}' \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${REFRESH_NAME}" || true)"
                if [ "${DELETE_CODE}" = "200" ] || [ "${DELETE_CODE}" = "404" ]; then
                  DELETE_OK=1
                  REFRESH_CREATED=0
                  break
                fi
                sleep 2
              done
              if [ "${DELETE_OK}" != "1" ]; then
                test ! -s /tmp/predeploy-refresh-delete.json || cat /tmp/predeploy-refresh-delete.json
                set -e
                return 1
              fi
            fi
            set -e
            return 0
          }
          trap 'cleanup_refresher || true' EXIT

          # Deploy the ephemeral sidecar exactly once with its short-lived auth token.
          # A separate `wrangler secret put` creates a second Worker revision and can make
          # workers.dev alternate between unauthenticated/absent revisions during propagation.
          npx wrangler deploy --config "${REFRESH_CONFIG}" \
            --var "MEL_PREDEPLOY_BACKUP_REFRESH_TOKEN:${REFRESH_TOKEN}" \
            >/tmp/predeploy-refresh-deploy.log
          REFRESH_CREATED=1

          SIDECAR_READY=0
          SIDECAR_STABLE_PROBES=0
          for READY_ATTEMPT in $(seq 1 18); do
            READY_CODE="$(curl --silent --show-error --max-time 30 \
              --header "x-mel-predeploy-backup-refresh: ${REFRESH_TOKEN}" \
              --output /tmp/predeploy-refresh-ready.json \
              --write-out '%{http_code}' \
              "${REFRESH_URL}/d1/tables" || true)"
            if [ "${READY_CODE}" = "200" ] && node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/predeploy-refresh-ready.json','utf8'));
          if(d?.ok!==true||d?.status!=='D1_TABLES'||!Array.isArray(d?.tables)) process.exit(1);
          NODE
            then
              SIDECAR_STABLE_PROBES=$((SIDECAR_STABLE_PROBES + 1))
              echo "Ephemeral backup sidecar stable probe ${SIDECAR_STABLE_PROBES}/3 passed."
              if [ "${SIDECAR_STABLE_PROBES}" -ge 3 ]; then
                SIDECAR_READY=1
                break
              fi
              sleep 1
              continue
            fi
            SIDECAR_STABLE_PROBES=0
            echo "Ephemeral backup sidecar readiness attempt ${READY_ATTEMPT}/18 returned HTTP ${READY_CODE}."
            sleep 2
          done
          test "${SIDECAR_READY}" = "1"

          export MEL_R2_BUCKET_NAME="meliturgos-private-media"
          export MEL_PREDEPLOY_BACKUP_REFRESH_URL="${REFRESH_URL}"
          export MEL_PREDEPLOY_BACKUP_REFRESH_TOKEN="${REFRESH_TOKEN}"
          export MEL_SOURCE_SHA="${CURRENT_PRODUCTION_SHA}"
          export MEL_SOURCE_BRANCH="${RELEASE_BRANCH}"

          if ! node release-tools/predeploy-backup-refresh/runner.mjs > predeploy-backup-refresh.json; then
            test ! -s predeploy-backup-refresh.json || cat predeploy-backup-refresh.json
            exit 52
          fi

          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('predeploy-backup-refresh.json','utf8'));
          const b=d?.backup||{};
          if(d?.ok!==true||d?.status!=='PREDEPLOY_BACKUP_REFRESH_CREATED') process.exit(1);
          if(!b?.id||b?.encrypted!==true||b?.restore_candidate_verified!==true) process.exit(1);
          if(b?.backup_object_present!==true||Number(b?.backup_object_bytes||0)<=0) process.exit(1);
          if(!/^[0-9a-f]{40}$/.test(String(b?.source_sha||'').toLowerCase())) process.exit(1);
          if(!/^[0-9a-f]{64}$/.test(String(b?.integrity_sha256||'').toLowerCase())) process.exit(1);
          NODE

          if ! cleanup_refresher; then
            echo "Ephemeral backup refresher cleanup failed; release remains blocked."
            exit 51
          fi
          REFRESH_CREATED=0
          trap - EXIT
          echo "Fresh encrypted restore-verified production backup created on GitHub runner; ephemeral R2 inventory sidecar removed."

      - name: Capture current production rollback target
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/meliturgos/deployments" \
            > predeploy-deployments.json
          PREVIOUS_VERSION_ID="$(node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('predeploy-deployments.json','utf8'));
          if(raw?.success===false) throw new Error('PREDEPLOY_DEPLOYMENTS_READ_FAILED');
          const root=raw?.result ?? raw;
          const deployments=Array.isArray(root)?root:(Array.isArray(root?.deployments)?root.deployments:[root]);
          let found='';
          for(const deployment of deployments){
            const versions=Array.isArray(deployment?.versions)?deployment.versions:[];
            if(versions.length===1 && Number(versions[0]?.percentage)===100 && versions[0]?.version_id){
              found=String(versions[0].version_id);
              break;
            }
          }
          if(!found) throw new Error('PREVIOUS_STABLE_VERSION_NOT_FOUND');
          process.stdout.write(found);
          NODE
          )"
          test -n "$PREVIOUS_VERSION_ID"
          echo "PREVIOUS_CLOUDFLARE_VERSION_ID=$PREVIOUS_VERSION_ID" >> "$GITHUB_ENV"

      - name: Capture pre-deploy autonomy control
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          CODE="$(curl --silent --show-error --max-time 30             --output predeploy-autonomy-control.json             --write-out '%{http_code}'             "${BASE_URL}/api/gen2/autonomy/control" || true)"
          test "${CODE}" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('predeploy-autonomy-control.json','utf8'));
          if(d?.ok!==true) throw new Error('PREDEPLOY_AUTONOMY_CONTROL_NOT_OK');
          if(typeof d?.paused!=='boolean' || typeof d?.max_autonomy!=='boolean') throw new Error('PREDEPLOY_AUTONOMY_CONTROL_INVALID');
          const paused=d.paused===true;
          const reportedMax=d.max_autonomy===true;
          const maxAutonomy=paused?false:reportedMax;
          if(paused&&reportedMax){
            console.log('Legacy contradictory autonomy control normalized fail-safe: PAUSED=true, MAX=false.');
          }
          fs.appendFileSync(process.env.GITHUB_ENV,
            'PREVIOUS_AUTONOMY_PAUSED='+String(paused)+'\n'
            +'PREVIOUS_MAX_AUTONOMY='+String(maxAutonomy)+'\n');
          console.log(JSON.stringify({paused,max_autonomy:maxAutonomy,status:paused?'PAUSED':(maxAutonomy?'MAX_AUTONOMY':(d.status||'RUNNING')),normalized_contradiction:paused&&reportedMax}));
          NODE

      - name: Create verified pre-deploy production backup
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BINDER_NAME="mel-pdb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BINDER_CONFIG="release-tools/predeploy-backup-binder/wrangler.run.jsonc"
          BINDER_URL="https://${BINDER_NAME}.adrien-lopezcarreras.workers.dev"
          export BINDER_NAME
          node - <<'NODE'
          const fs=require('fs');
          const source='release-tools/predeploy-backup-binder/wrangler.jsonc';
          const target='release-tools/predeploy-backup-binder/wrangler.run.jsonc';
          const config=JSON.parse(fs.readFileSync(source,'utf8'));
          config.name=process.env.BINDER_NAME;
          fs.writeFileSync(target,JSON.stringify(config,null,2));
          NODE

          BINDER_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${BINDER_TOKEN}"
          BINDER_CREATED=0

          cleanup_binder() {
            set +e
            if [ "${BINDER_CREATED:-0}" = "1" ]; then
              DELETE_OK=0
              for CLEANUP_ATTEMPT in $(seq 1 5); do
                DELETE_CODE="$(curl --silent --show-error --max-time 30 \
                  --request DELETE \
                  --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  --output /tmp/predeploy-binder-delete.json \
                  --write-out '%{http_code}' \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${BINDER_NAME}" || true)"
                if [ "${DELETE_CODE}" = "200" ] || [ "${DELETE_CODE}" = "404" ]; then
                  DELETE_OK=1
                  BINDER_CREATED=0
                  break
                fi
                sleep 2
              done
              if [ "${DELETE_OK}" != "1" ]; then
                test ! -s /tmp/predeploy-binder-delete.json || cat /tmp/predeploy-binder-delete.json
                set -e
                return 1
              fi
            fi
            set -e
            return 0
          }
          trap 'cleanup_binder || true' EXIT

          npx wrangler deploy --config "${BINDER_CONFIG}" >/tmp/predeploy-binder-deploy.log
          BINDER_CREATED=1
          printf '%s' "${BINDER_TOKEN}" | npx wrangler secret put MEL_PREDEPLOY_BINDER_TOKEN --config "${BINDER_CONFIG}" >/tmp/predeploy-binder-secret.log

          BINDER_READY=0
          BINDER_STABLE_PROBES=0
          for READY_ATTEMPT in $(seq 1 24); do
            READY_CODE="$(curl --silent --show-error --max-time 30 \
              --header "x-mel-predeploy-binder: ${BINDER_TOKEN}" \
              --output /tmp/predeploy-binder-ready.json \
              --write-out '%{http_code}' \
              "${BINDER_URL}/health" || true)"
            if [ "${READY_CODE}" = "200" ] && node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/predeploy-binder-ready.json','utf8'));
          if(d?.ok!==true||d?.status!=='BINDER_READY') process.exit(1);
          NODE
            then
              BINDER_STABLE_PROBES=$((BINDER_STABLE_PROBES + 1))
              echo "Ephemeral backup binder stable probe ${BINDER_STABLE_PROBES}/3 passed."
              if [ "${BINDER_STABLE_PROBES}" -ge 3 ]; then
                BINDER_READY=1
                break
              fi
              sleep 1
              continue
            fi
            BINDER_STABLE_PROBES=0
            echo "Ephemeral backup binder readiness attempt ${READY_ATTEMPT}/24 returned HTTP ${READY_CODE}."
            sleep 2
          done
          if [ "${BINDER_READY}" != "1" ]; then
            test ! -s /tmp/predeploy-binder-ready.json || cat /tmp/predeploy-binder-ready.json
            exit 53
          fi

          PREPARED=0
          for ATTEMPT in $(seq 1 4); do
            CODE="$(curl --silent --show-error --max-time 45 \
              --request POST \
              --header "x-mel-predeploy-binder: ${BINDER_TOKEN}" \
              --header "content-type: application/json" \
              --data '{}' \
              --output predeploy-backup.json \
              --write-out '%{http_code}' \
              "${BINDER_URL}/prepare" || true)"
            if [ "${CODE}" = "200" ] && node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('predeploy-backup.json','utf8'));
          const b=d?.backup||{};
          if(d?.ok!==true||d?.status!=='PREDEPLOY_RELEASE_PREPARED') process.exit(1);
          if(d?.autonomy?.paused!==true||d?.autonomy?.status!=='PAUSED') process.exit(1);
          if(b?.ok!==true||b?.restore_candidate_verified!==true) process.exit(1);
          if(b?.backup_object_present!==true||Number(b?.backup_object_bytes||0)<=0) process.exit(1);
          if(!b?.id) process.exit(1);
          if(!/^[0-9a-f]{40}$/.test(String(b?.snapshot_deployed_sha||'').toLowerCase())) process.exit(1);
          if(!/^[0-9a-f]{64}$/.test(String(b?.integrity_sha256||'').toLowerCase())) process.exit(1);
          NODE
            then
              PREPARED=1
              break
            fi
            echo "Pre-deploy binder prepare attempt ${ATTEMPT}/4 returned HTTP ${CODE}."
            test ! -s predeploy-backup.json || cat predeploy-backup.json
            if [ "${CODE}" = "409" ]; then break; fi
            sleep 2
          done
          if [ "${PREPARED}" != "1" ]; then
            exit 54
          fi
          echo "Verified pre-deploy backup and D1 autonomy pause are ready."

          if ! cleanup_binder; then
            echo "Ephemeral backup binder cleanup failed; release remains blocked."
            exit 55
          fi
          BINDER_CREATED=0
          touch predeploy-backup-verified.marker
          trap - EXIT

      - name: Prepare encrypted Media Vault secrets for exact deployment
        shell: bash
        env:
          MEL_BACKUP_ENCRYPTION_KEY_B64: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_B64 }}
          MEL_BACKUP_ENCRYPTION_KEY_ID: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${MEL_BACKUP_ENCRYPTION_KEY_B64:-}"
          test -n "${MEL_BACKUP_ENCRYPTION_KEY_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          BOOTSTRAP_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${BOOTSTRAP_TOKEN}"
          printf '%s' "${BOOTSTRAP_TOKEN}" > release-bootstrap-token.txt
          chmod 600 release-bootstrap-token.txt
          export BOOTSTRAP_TOKEN

          account_code="$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output workers-ai-account.json \
            --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" || true)"
          ent_code="$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output workers-ai-entitlements.json \
            --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/entitlements" || true)"
          test "${account_code}" = "200"
          test "${ent_code}" = "200"
          curl --fail --silent --show-error --location --max-time 30 "https://developers.cloudflare.com/workers-ai/platform/pricing/" -o workers-ai-pricing.html
          curl --fail --silent --show-error --location --max-time 30 "https://developers.cloudflare.com/workers-ai/platform/errors/" -o workers-ai-errors.html
          grep -Fq "10,000 Neurons per day" workers-ai-pricing.html
          grep -Fq "N/A - Upgrade to Workers Paid" workers-ai-pricing.html
          grep -Fq "daily free allocation of 10,000 neurons" workers-ai-errors.html
          grep -Fq "429" workers-ai-errors.html
          curl --fail --silent --show-error --location --max-time 30 "https://developers.cloudflare.com/browser-run/pricing/" -o browser-run-pricing.html
          curl --fail --silent --show-error --location --max-time 30 "https://developers.cloudflare.com/browser-run/limits/" -o browser-run-limits.html
          grep -Fq "Workers Free" browser-run-pricing.html
          grep -Fq "10 minutes per day" browser-run-pricing.html
          grep -Fq "429" browser-run-limits.html
          grep -Fq "10 minutes per day" browser-run-limits.html

          node - <<'NODE'
          const fs=require('fs');
          const account=JSON.parse(fs.readFileSync('workers-ai-account.json','utf8'));
          const ent=JSON.parse(fs.readFileSync('workers-ai-entitlements.json','utf8'));
          if(account?.success!==true || ent?.success!==true || !Array.isArray(ent?.result)) {
            throw new Error('CLOUDFLARE_PLAN_EVIDENCE_INVALID');
          }
          const accountType=String(account?.result?.type||'').toLowerCase();
          if(accountType!=='standard') throw new Error('WORKERS_FREE_ACCOUNT_TYPE_NOT_PROVED');
          const marker=ent.result.find(row =>
            String(row?.feature?.key||row?.id||'')==='workers.static_assets.manifest_limit_file_count'
          );
          const markerValue=Number(marker?.allocation?.value);
          if(markerValue!==20000) throw new Error('WORKERS_FREE_ENTITLEMENT_NOT_PROVED:'+String(markerValue));
          const now=Date.now();
          const proof={
            schema:'mel.workers-ai.zero-cost-proof/v1',
            provider:'workers-ai',
            account_plan:'WORKERS_FREE',
            billing_path:'direct-workers-ai-binding',
            pricing_policy:'cloudflare-workers-ai-pricing-2026-10-01',
            free_allocation_neurons_per_day:10000,
            free_overage_behavior:'FAIL_NOT_BILL',
            plan_evidence:{
              source:'cloudflare-account-entitlements-api',
              account_type:'standard',
              entitlement_key:'workers.static_assets.manifest_limit_file_count',
              entitlement_value:markerValue,
              workers_free_reference_value:20000,
            },
            models:[
              '@cf/meta/llama-3.3-70b-instruct-fp8-fast',
              '@cf/google/gemma-4-26b-a4b-it',
              '@cf/nvidia/nemotron-3-120b-a12b',
              '@cf/zai-org/glm-4.7-flash',
              '@cf/black-forest-labs/flux-1-schnell',
              '@cf/black-forest-labs/flux-2-klein-4b',
              '@cf/deepgram/aura-1',
              '@cf/openai/whisper-large-v3-turbo',
            ],
            verified_at:new Date(now).toISOString(),
            expires_at:new Date(now+60*60*1000).toISOString(),
          };
          fs.writeFileSync('workers-ai-zero-cost-proof.json',JSON.stringify(proof));
          fs.writeFileSync('workers-ai-zero-cost-evidence.json',JSON.stringify({
            schema:proof.schema,
            provider:proof.provider,
            account_plan:proof.account_plan,
            entitlement_key:proof.plan_evidence.entitlement_key,
            entitlement_value:proof.plan_evidence.entitlement_value,
            verified_at:proof.verified_at,
            expires_at:proof.expires_at,
            model_count:proof.models.length,
          },null,2));
          const browserPricing=fs.readFileSync('browser-run-pricing.html','utf8');
          const browserLimits=fs.readFileSync('browser-run-limits.html','utf8');
          if(!browserPricing.includes('Workers Free')||!browserPricing.includes('10 minutes per day')) throw new Error('BROWSER_RUN_FREE_PRICING_NOT_PROVED');
          if(!browserLimits.includes('429')||!browserLimits.includes('10 minutes per day')) throw new Error('BROWSER_RUN_FREE_HARD_LIMIT_NOT_PROVED');
          const browserProof={
            schema:'mel.browser-run.zero-cost-proof/v1',
            provider:'cloudflare-browser-run',
            account_plan:'WORKERS_FREE',
            included_minutes_per_day:10,
            overage_behavior:'HARD_LIMIT_NO_BILLING',
            documentation_url:'https://developers.cloudflare.com/browser-run/pricing/',
            verified_at:new Date(now).toISOString(),
            expires_at:new Date(now+60*60*1000).toISOString(),
          };
          fs.writeFileSync('browser-run-zero-cost-proof.json',JSON.stringify(browserProof));
          fs.writeFileSync('browser-run-zero-cost-evidence.json',JSON.stringify({
            schema:browserProof.schema,
            account_plan:browserProof.account_plan,
            included_minutes_per_day:browserProof.included_minutes_per_day,
            overage_behavior:browserProof.overage_behavior,
            verified_at:browserProof.verified_at,
            expires_at:browserProof.expires_at,
          },null,2));
          NODE
          MEDIA_KEY_B64="$(node - <<'NODE'
          const crypto=require('crypto');
          const source=Buffer.from(String(process.env.MEL_BACKUP_ENCRYPTION_KEY_B64||''),'base64');
          if(source.length!==32) throw new Error('MEDIA_VAULT_SOURCE_KEY_MUST_BE_32_BYTES');
          const derived=crypto.hkdfSync(
            'sha256',
            source,
            Buffer.from('meliturgos-media-vault-salt-v1','utf8'),
            Buffer.from('MEL_MEDIA_VAULT_V1','utf8'),
            32,
          );
          process.stdout.write(Buffer.from(derived).toString('base64'));
          NODE
          )"
          MEDIA_KEY_ID="media-hkdf-v1:${MEL_BACKUP_ENCRYPTION_KEY_ID}"
          test -n "${MEDIA_KEY_B64}"
          test -n "${MEDIA_KEY_ID}"
          echo "::add-mask::${MEDIA_KEY_B64}"
          export MEDIA_KEY_B64 MEDIA_KEY_ID
          node - <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const source=Buffer.from(String(process.env.MEL_BACKUP_ENCRYPTION_KEY_B64||''),'base64');
          const expectedSha=String(process.env.EXPECTED_SHA||'').toLowerCase();
          if(source.length!==32) throw new Error('PARALLEL_PROOF_SOURCE_KEY_MUST_BE_32_BYTES');
          if(!/^[0-9a-f]{40}$/.test(expectedSha)) throw new Error('PARALLEL_PROOF_EXPECTED_SHA_INVALID');
          const parallelProofToken=Buffer.from(crypto.hkdfSync(
            'sha256',
            source,
            Buffer.from('meliturgos-parallel-proof-salt-v1','utf8'),
            Buffer.from('MEL_PARALLEL_PROOF_V1:'+expectedSha,'utf8'),
            32,
          )).toString('base64url');
          const workersAiProof=JSON.parse(fs.readFileSync('workers-ai-zero-cost-proof.json','utf8'));
          const browserRunProof=JSON.parse(fs.readFileSync('browser-run-zero-cost-proof.json','utf8'));
          const payload={
            MEL_LAUNCH_BOOTSTRAP_TOKEN:String(process.env.BOOTSTRAP_TOKEN||''),
            MEL_WORKERS_AI_ZERO_COST_PROOF_JSON:JSON.stringify(workersAiProof),
            MEL_BROWSER_RUN_ZERO_COST_PROOF_JSON:JSON.stringify(browserRunProof),
            MEL_MEDIA_ENCRYPTION_KEY_B64:String(process.env.MEDIA_KEY_B64||''),
            MEL_MEDIA_ENCRYPTION_KEY_ID:String(process.env.MEDIA_KEY_ID||''),
            MEL_PARALLEL_PROOF_TOKEN:parallelProofToken,
            // Keep the production runtime codec on the exact same key identity
            // used by the pre-deploy encrypted backup runner.
            MEL_BACKUP_ENCRYPTION_KEY_B64:String(process.env.MEL_BACKUP_ENCRYPTION_KEY_B64||''),
            MEL_BACKUP_ENCRYPTION_KEY_ID:String(process.env.MEL_BACKUP_ENCRYPTION_KEY_ID||''),
          };
          if(!payload.MEL_LAUNCH_BOOTSTRAP_TOKEN || !payload.MEL_WORKERS_AI_ZERO_COST_PROOF_JSON || !payload.MEL_BROWSER_RUN_ZERO_COST_PROOF_JSON
            || !payload.MEL_MEDIA_ENCRYPTION_KEY_B64 || !payload.MEL_MEDIA_ENCRYPTION_KEY_ID || !payload.MEL_PARALLEL_PROOF_TOKEN
            || !payload.MEL_BACKUP_ENCRYPTION_KEY_B64 || !payload.MEL_BACKUP_ENCRYPTION_KEY_ID) {
            throw new Error('RELEASE_CRYPTO_SECRETS_MISSING');
          }
          fs.writeFileSync('media-vault-release-secrets.json',JSON.stringify(payload),{mode:0o600});
          NODE
          test -s media-vault-release-secrets.json
          echo "Encrypted Media Vault secrets prepared for the exact Worker deployment."

      - name: Install pinned Browser Rendering adapter
        run: npm install --no-save --ignore-scripts @cloudflare/playwright@1.3.6

      - name: Deploy production Browser Companion
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config browser-companion/runtime/wrangler.browser-production.jsonc
          echo "Production Browser Companion deployed."

      - name: Require persistent production secrets before exact deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler secret list --name meliturgos --format json > production-secret-names.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('production-secret-names.json','utf8'));
          const names=new Set((Array.isArray(rows)?rows:[]).map(row=>String(row?.name||'')).filter(Boolean));
          const staged=JSON.parse(fs.readFileSync('media-vault-release-secrets.json','utf8'));
          for(const name of Object.keys(staged||{})) names.add(String(name));
          const source=fs.readFileSync('wrangler.jsonc','utf8');
          const match=source.match(/"secrets"\s*:\s*\{[\s\S]*?"required"\s*:\s*(\[[\s\S]*?\])/);
          if(!match) throw new Error('PRODUCTION_REQUIRED_SECRET_CONTRACT_MISSING');
          const required=JSON.parse(match[1]);
          if(!Array.isArray(required)||required.length<1||required.some(name=>typeof name!=='string'||!name.trim())) {
            throw new Error('PRODUCTION_REQUIRED_SECRET_CONTRACT_INVALID');
          }
          const missing=required.filter(name=>!names.has(name));
          if(missing.length) throw new Error('PRODUCTION_REQUIRED_SECRETS_MISSING:'+missing.join(','));
          console.log('Persistent production secret contract verified: '+required.length+' required bindings available remotely or staged for the exact deployment; omitted remote secrets are preserved.');
          NODE
          rm -f production-secret-names.json

      - name: Deploy exact approved SHA to production
        shell: bash
        run: |
          set -euo pipefail
          test -f predeploy-backup-verified.marker
          touch production-deploy-started.marker
          test -s media-vault-release-secrets.json
          npx wrangler deploy \
            --keep-vars \
            --secrets-file media-vault-release-secrets.json \
            --define "MEL_DEPLOYED_GIT_SHA:'${EXPECTED_SHA}'" \
            --define "MEL_DEPLOYED_GIT_BRANCH:'${RELEASE_BRANCH}'" \
            --define "MEL_CRITICAL_CODE_BUNDLE_BYTES:${MEL_CRITICAL_CODE_BUNDLE_BYTES}" \
            --define "MEL_SHARDVAULT_ROADMAP_PAUSED:'${MEL_ROADMAP_SHARDVAULT_PAUSED}'"
          rm -f media-vault-release-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify owner auth binding and exact deployment immediately
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          test -s release-bootstrap-token.txt
          BOOTSTRAP_TOKEN="$(cat release-bootstrap-token.txt)"
          echo "::add-mask::${BOOTSTRAP_TOKEN}"

          AUTH_READY=0
          for ATTEMPT in $(seq 1 12); do
            ROOT_BODY="$(mktemp)"
            ROOT_CODE="$(curl --silent --show-error --max-time 30               --output "${ROOT_BODY}" --write-out '%{http_code}'               "${BASE_URL}/" || true)"
            if [ "${ROOT_CODE}" = "503" ] && grep -q 'AUTH_NOT_CONFIGURED' "${ROOT_BODY}" 2>/dev/null; then
              echo "Production owner auth binding is missing after deploy."
              cat "${ROOT_BODY}"
              exit 47
            fi

            IDENTITY_CODE="$(curl --silent --show-error --max-time 30               --header "x-mel-release-smoke: 1"               --header "x-mel-launch-bootstrap: ${BOOTSTRAP_TOKEN}"               --header "content-type: application/json"               --data '{"phase":"identity"}'               --output production-immediate-identity.json               --write-out '%{http_code}'               "${BASE_URL}/api/internal/release-launch-bootstrap" || true)"
            if [ "${ROOT_CODE}" = "401" ] && [ "${IDENTITY_CODE}" = "200" ] &&               EXPECTED_SHA="${EXPECTED_SHA}" node - <<'NODE'
          const d=require('./production-immediate-identity.json');
          const expected=String(process.env.EXPECTED_SHA||'').toLowerCase();
          if(d?.ok!==true || d?.status!=='RELEASE_IDENTITY_VERIFIED') process.exit(1);
          if(String(d?.deployed_sha||'').toLowerCase()!==expected) process.exit(1);
          NODE
            then
              AUTH_READY=1
              break
            fi
            echo "Immediate auth/identity probe attempt ${ATTEMPT}/12: root=${ROOT_CODE}, identity=${IDENTITY_CODE}."
            sleep 2
          done
          test "${AUTH_READY}" = "1"
          echo "Production owner auth binding and exact SHA verified immediately after deploy."

      - name: Verify bundled Workers AI zero-cost proof
        shell: bash
        run: |
          set -euo pipefail
          test -s workers-ai-zero-cost-proof.json
          test -s workers-ai-zero-cost-evidence.json
          test -s browser-run-zero-cost-proof.json
          test -s browser-run-zero-cost-evidence.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('workers-ai-zero-cost-proof.json','utf8'));
          if(p?.schema!=='mel.workers-ai.zero-cost-proof/v1') throw new Error('WORKERS_AI_ZERO_COST_SCHEMA_INVALID');
          if(p?.provider!=='workers-ai'||p?.account_plan!=='WORKERS_FREE'||p?.billing_path!=='direct-workers-ai-binding') throw new Error('WORKERS_AI_ZERO_COST_PROOF_INVALID');
          const verified=Date.parse(String(p?.verified_at||''));
          const expires=Date.parse(String(p?.expires_at||''));
          const now=Date.now();
          if(!Number.isFinite(verified)||!Number.isFinite(expires)||verified>now+60000||expires<=now) throw new Error('WORKERS_AI_ZERO_COST_PROOF_STALE');
          if(!Array.isArray(p?.models)||p.models.length<1) throw new Error('WORKERS_AI_ZERO_COST_MODELS_MISSING');
          const b=JSON.parse(fs.readFileSync('browser-run-zero-cost-proof.json','utf8'));
          if(b?.schema!=='mel.browser-run.zero-cost-proof/v1'||b?.provider!=='cloudflare-browser-run'||b?.account_plan!=='WORKERS_FREE') throw new Error('BROWSER_RUN_ZERO_COST_PROOF_INVALID');
          if(b?.overage_behavior!=='HARD_LIMIT_NO_BILLING'||Number(b?.included_minutes_per_day)!==10) throw new Error('BROWSER_RUN_ZERO_COST_GUARD_INVALID');
          const bVerified=Date.parse(String(b?.verified_at||'')),bExpires=Date.parse(String(b?.expires_at||''));
          if(!Number.isFinite(bVerified)||!Number.isFinite(bExpires)||bVerified>Date.now()+60000||bExpires<=Date.now()) throw new Error('BROWSER_RUN_ZERO_COST_PROOF_STALE');
          console.log('Workers AI + Browser Run zero-cost proofs bundled in the exact Worker deployment and still fresh.');
          NODE

      - name: Prove MEL-MEDIA-02 12/12 live on exact deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          test -s release-bootstrap-token.txt
          BOOTSTRAP_TOKEN="$(cat release-bootstrap-token.txt)"
          echo "::add-mask::${BOOTSTRAP_TOKEN}"

          MEDIA_READY=0
          for ATTEMPT in 1 2 3; do
            MEDIA_CODE="$(curl --silent --show-error --max-time 300 \
              --header "x-mel-launch-bootstrap: ${BOOTSTRAP_TOKEN}" \
              --header "content-type: application/json" \
              --data '{"phase":"media-proof"}' \
              --output mel-media-02-production-proof.json \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/internal/release-launch-bootstrap" || true)"
            if [ "${MEDIA_CODE}" = "200" ] && EXPECTED_SHA="${EXPECTED_SHA}" node - <<'NODE'
          const d=require('./mel-media-02-production-proof.json');
          const expected=String(process.env.EXPECTED_SHA||'').toLowerCase();
          if(d?.ok!==true) process.exit(1);
          if(d?.status!=='MEL_MEDIA_02_DONE_VERIFIED_ELIGIBLE'||d?.done_verified_eligible!==true) process.exit(1);
          if(String(d?.source_sha||'').toLowerCase()!==expected||String(d?.deployed_sha||'').toLowerCase()!==expected) process.exit(1);
          if(Number(d?.capability_count)!==12) process.exit(1);
          if(!Array.isArray(d?.required_capabilities)||d.required_capabilities.length!==12) process.exit(1);
          if(!Array.isArray(d?.executions)||d.executions.length!==12||d.executions.some(row=>row?.ok!==true)) process.exit(1);
          if(d?.secret_values_exposed!==false||d?.autonomy_started!==false) process.exit(1);
          NODE
            then
              MEDIA_READY=1
              break
            fi
            echo "MEL-MEDIA-02 live proof attempt ${ATTEMPT}/3 returned HTTP ${MEDIA_CODE}."
            test ! -s mel-media-02-production-proof.json || cat mel-media-02-production-proof.json
            sleep $((ATTEMPT * 3))
          done
          if [ "${MEDIA_READY}" != "1" ]; then
            echo "MEL-MEDIA-02 exact-SHA 12/12 production proof failed."
            exit 58
          fi
          echo "MEL-MEDIA-02 exact-SHA 12/12 live proof passed."

      - name: Upload MEL-MEDIA-02 exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mel-media-02-production-proof-${{ env.EXPECTED_SHA }}
          path: mel-media-02-production-proof.json
          if-no-files-found: warn
          retention-days: 14

      - name: Dispatch decoupled downstream production proofs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DISPATCH_CODE="$(curl --silent --show-error --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({ref:"main",inputs:{expected_sha:process.env.EXPECTED_SHA}}))')" \
            --output /tmp/downstream-proof-dispatch.json \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release-downstream-proof-decoupled.yml/dispatches" || true)"
          if [ "${DISPATCH_CODE}" != "204" ]; then
            echo "Decoupled downstream proof dispatch returned HTTP ${DISPATCH_CODE}."
            test ! -s /tmp/downstream-proof-dispatch.json || cat /tmp/downstream-proof-dispatch.json
            exit 53
          fi
          echo "Decoupled downstream proofs dispatched for exact SHA ${EXPECTED_SHA}; release continues independently."

      - name: Prepare and prove production autonomy launch evidence
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          test -s release-bootstrap-token.txt
          BOOTSTRAP_TOKEN="$(cat release-bootstrap-token.txt)"
          [[ "${BOOTSTRAP_TOKEN}" =~ ^[0-9a-f]{64}$ ]]
          echo "::add-mask::${BOOTSTRAP_TOKEN}"

          if [ "$MEL_ROADMAP_SHARDVAULT_PAUSED" = "true" ]; then
            echo "ShardVault external replication is PAUSED_FOR_ROADMAP; skipping 7/7 Internet endpoint proof."
          else
          # A Worker secret update may take a few seconds to become visible on
          # every production isolate.  Retry the first authenticated request
          # instead of treating that propagation window as a release failure.
          SHARD_STATUS_READY=0
          SHARD_STATUS_ATTEMPT=0
          SHARD_STATUS_DEADLINE_EPOCH=$(( $(date +%s) + 360 ))
          while [ "$SHARD_STATUS_READY" != "1" ] && [ "$(date +%s)" -lt "$SHARD_STATUS_DEADLINE_EPOCH" ]; do
            SHARD_STATUS_ATTEMPT=$((SHARD_STATUS_ATTEMPT + 1))
            SHARD_STATUS_CODE="$(curl --silent --show-error --max-time 60 \
              --header "x-mel-release-smoke: 1" \
              --header "x-mel-launch-bootstrap: ${BOOTSTRAP_TOKEN}" \
              --output production-shardvault-before.json \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/gen2/shardvault/status" || true)"
            if [ "$SHARD_STATUS_CODE" = "200" ]; then
              SHARD_STATUS_READY=1
              break
            fi
            echo "ShardVault status propagation attempt ${SHARD_STATUS_ATTEMPT} returned HTTP ${SHARD_STATUS_CODE}; waiting within the 360s propagation budget."
            if [ -s production-shardvault-before.json ]; then
              cat production-shardvault-before.json
            fi
            sleep 5
          done
          if [ "$SHARD_STATUS_READY" != "1" ]; then
            echo "ShardVault release-smoke authentication did not become ready within the bounded 360s propagation window."
            exit 46
          fi
          SHARD_RELEASE_QUORUM=5
          SHARD_ACTIVE="$(node -e 'const d=require("./production-shardvault-before.json"); const n=Array.isArray(d?.active_external_registry)?d.active_external_registry.length:0; process.stdout.write(String(n));')"
          echo "ShardVault external registry before release proof: ${SHARD_ACTIVE}/7 (release quorum ${SHARD_RELEASE_QUORUM}/7)"

          if [ "$SHARD_ACTIVE" -lt "$SHARD_RELEASE_QUORUM" ]; then
            SHARD_READY=0
            for SHARD_ATTEMPT in $(seq 1 17); do
              # Release proof scans one documented provider per request.
              # Broad Internet discovery stays outside the production gate so
              # a slow catalogue/search cannot exhaust Worker CPU.
              SHARD_PROBE_LIMIT=1
              SHARD_KNOWN_ONLY=true
              SHARD_OFFSET=$(( (SHARD_ATTEMPT - 1) % 13 ))
              SHARD_SEARCH_CODE="$(curl --silent --show-error --max-time 90 \
                --header "x-mel-release-smoke: 1" \
                --header "x-mel-launch-bootstrap: ${BOOTSTRAP_TOKEN}" \
                --header "content-type: application/json" \
                --data "{\"max_new_endpoints\":1,\"probe_limit\":${SHARD_PROBE_LIMIT},\"probe_offset\":${SHARD_OFFSET},\"known_candidates_only\":${SHARD_KNOWN_ONLY}}" \
                --output production-shardvault-search.json \
                --write-out '%{http_code}' \
                "${BASE_URL}/api/gen2/shardvault/search" || true)"
              if [ "$SHARD_SEARCH_CODE" != "200" ]; then
                echo "ShardVault bounded activation attempt ${SHARD_ATTEMPT} returned HTTP ${SHARD_SEARCH_CODE}."
                test ! -s production-shardvault-search.json || cat production-shardvault-search.json
              else
                SHARD_STATE="$(node -e 'const d=require("./production-shardvault-search.json"); if(d?.ok!==true) throw new Error("SHARDVAULT_SEARCH_NOT_OK"); const active=Number(d?.active_external_count||0); const target=Number(d?.target_count||7); const quorum=5; process.stdout.write(String(active)+" "+String(target)+" "+(active>=quorum?"1":"0"));')"
                SHARD_ACTIVE="${SHARD_STATE%% *}"
                SHARD_REST="${SHARD_STATE#* }"
                SHARD_TARGET="${SHARD_REST%% *}"
                SHARD_READY="${SHARD_REST##* }"
                echo "ShardVault bounded activation ${SHARD_ATTEMPT}: ${SHARD_ACTIVE}/${SHARD_TARGET}"
                if [ "$SHARD_READY" = "1" ]; then
                  break
                fi
              fi
              sleep 2
            done
            test "$SHARD_READY" = "1"
          fi

