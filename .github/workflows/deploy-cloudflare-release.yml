name: deploy-cloudflare-release

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Exact release/* branch that points to the approved canonical candidate
        required: true
        type: string
      expected_sha:
        description: Exact 40-character candidate SHA approved for production
        required: true
        type: string
      approval:
        description: Type DEPLOY_APPROVED to authorize the production mutation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: meliturgos-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_BRANCH: ${{ inputs.release_branch }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      APPROVAL: ${{ inputs.approval }}
    steps:
      - name: Require explicit production approval
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "DEPLOY_APPROVED"
          case "$RELEASE_BRANCH" in
            release/*) ;;
            *) echo "release_branch must start with release/"; exit 2 ;;
          esac
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout exact release pointer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0

      - name: Prove release pointer equals the current canonical candidate
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$EXPECTED_SHA"
          git fetch origin candidate/mel-clean-autonomy --depth=1
          CANONICAL_SHA="$(git rev-parse FETCH_HEAD)"
          test "$CANONICAL_SHA" = "$EXPECTED_SHA"
          echo "Exact release identity verified: $EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs

      - name: Syntax gate
        run: npm run check

      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B candidate/release-ci-head "$EXPECTED_SHA"
          npm test

      - name: Deploy exact approved SHA to production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --define "MEL_DEPLOYED_GIT_SHA:'${EXPECTED_SHA}'" \
            --define "MEL_DEPLOYED_GIT_BRANCH:'${RELEASE_BRANCH}'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production HTTP
        shell: bash
        run: |
          set -euo pipefail
          PROD_STATUS="$(curl --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            --output production-root.html \
            --write-out '%{http_code}' \
            https://meliturgos.adrien-lopezcarreras.workers.dev)"
          case "$PROD_STATUS" in
            2??|3??|401) ;;
            *) echo "Unexpected production HTTP status: $PROD_STATUS"; exit 22 ;;
          esac
          echo "Production HTTP verification passed with status ${PROD_STATUS}."
