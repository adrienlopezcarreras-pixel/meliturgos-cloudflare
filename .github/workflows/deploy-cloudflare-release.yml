      - name: Automatic rollback on failed production verification
        if: failure()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ ! -f production-deploy-started.marker ]; then
            echo "Production deployment never started; no rollback required."
            exit 0
          fi

          test -n "${PREVIOUS_CLOUDFLARE_VERSION_ID:-}"
          test -n "${PREVIOUS_DEPLOYED_SHA:-}"
          test -n "${PREVIOUS_AUTONOMY_PAUSED:-}"
          test -n "${PREVIOUS_MAX_AUTONOMY:-}"

          # A failed proof may coincide with Cloudflare's transient 1042
          # visibility window. Wait for the canonical Worker to be observable
          # again before staging D1 state or invoking rollback.
          WORKER_VISIBLE=0
          for WORKER_ATTEMPT in $(seq 1 30); do
            WORKER_CODE="$(curl --silent --show-error --max-time 30 \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --output rollback-worker-visibility.json \
              --write-out '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/meliturgos/deployments" || true)"
            if [ "${WORKER_CODE}" = "200" ]; then
              WORKER_VISIBLE=1
              break
            fi
            if [ "${WORKER_CODE}" = "404" ] && grep -q '"code"[[:space:]]*:[[:space:]]*10007' rollback-worker-visibility.json 2>/dev/null; then
              echo "Cloudflare Worker visibility gap persists (10007/1042); retry ${WORKER_ATTEMPT}/30."
            else
              echo "Worker visibility probe returned HTTP ${WORKER_CODE}; retry ${WORKER_ATTEMPT}/30."
            fi
            sleep 5
          done
          if [ "${WORKER_VISIBLE}" != "1" ]; then
            echo "Canonical Worker did not become observable before rollback safety deadline."
            test ! -s rollback-worker-visibility.json || cat rollback-worker-visibility.json
            exit 58
          fi

          PRE_RESTORE_REQUIRED=1
          PRE_RESTORE_READY=0
          if [ "${PREVIOUS_AUTONOMY_PAUSED}" = "true" ] && [ "${PREVIOUS_MAX_AUTONOMY}" = "false" ]; then
            PRE_RESTORE_REQUIRED=0
            PRE_RESTORE_READY=1
            echo "Previous production was already paused; pre-rollback MAX restoration is unnecessary."
          else
            OIDC_RESPONSE="$(curl --silent --show-error --fail --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=meliturgos-worker")"
            OIDC_TOKEN="$(printf '%s' "${OIDC_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})')"
            echo "::add-mask::${OIDC_TOKEN}"

            for RESTORE_ATTEMPT in $(seq 1 6); do
              RESTORE_CODE="$(curl --silent --show-error --max-time 120 \
                --request POST \
                --header "x-mel-github-oidc: ${OIDC_TOKEN}" \
                --header "content-type: application/json" \
                --data '{"phase":"release-rollback-restore"}' \
                --output rollback-autonomy-restore.json \
                --write-out '%{http_code}' \
                "https://meliturgos.adrien-lopezcarreras.workers.dev/api/internal/release-launch-bootstrap?expected_sha=${EXPECTED_SHA}&restore_sha=${PREVIOUS_DEPLOYED_SHA}&paused=${PREVIOUS_AUTONOMY_PAUSED}&max=${PREVIOUS_MAX_AUTONOMY}" || true)"
              if [ "${RESTORE_CODE}" = "200" ] && \
                EXPECTED_SHA="${EXPECTED_SHA}" \
                PREVIOUS_DEPLOYED_SHA="${PREVIOUS_DEPLOYED_SHA}" \
                PREVIOUS_AUTONOMY_PAUSED="${PREVIOUS_AUTONOMY_PAUSED}" \
                PREVIOUS_MAX_AUTONOMY="${PREVIOUS_MAX_AUTONOMY}" \
                node - <<'NODE'
          const d=require('./rollback-autonomy-restore.json');
          const deployed=String(process.env.EXPECTED_SHA||'').toLowerCase();
          const restore=String(process.env.PREVIOUS_DEPLOYED_SHA||'').toLowerCase();
          const paused=String(process.env.PREVIOUS_AUTONOMY_PAUSED)==='true';
          const max=String(process.env.PREVIOUS_MAX_AUTONOMY)==='true';
          if(d?.ok!==true || d?.status!=='RELEASE_ROLLBACK_AUTONOMY_RESTORED') process.exit(1);
          if(String(d?.deployed_sha||'').toLowerCase()!==deployed) process.exit(1);
          if(String(d?.restore_sha||'').toLowerCase()!==restore) process.exit(1);
          if(String(d?.launch_approved_sha||'').toLowerCase()!==restore) process.exit(1);
          if(d?.paused!==paused || d?.max_autonomy!==max) process.exit(1);
          NODE
              then
                PRE_RESTORE_READY=1
                echo "Previous autonomy control staged in shared D1 before Worker rollback."
                break
              fi
              echo "Pre-rollback autonomy restore attempt ${RESTORE_ATTEMPT}/6 returned HTTP ${RESTORE_CODE}; bounded retry."
              test ! -s rollback-autonomy-restore.json || cat rollback-autonomy-restore.json
              sleep 3
