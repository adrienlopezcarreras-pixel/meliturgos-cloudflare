            covered_layers:Array.isArray(coverage?.covered_layers)?coverage.covered_layers:[],
            uncovered_layers:Array.isArray(coverage?.uncovered_layers)?coverage.uncovered_layers:[],
            ready_layer_count:Number(architecture?.ready_layer_count||0),
            layer_count:Number(architecture?.layer_count||0),
