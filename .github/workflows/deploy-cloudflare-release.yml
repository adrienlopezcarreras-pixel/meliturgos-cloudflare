      - name: Read durable MAX choice after verified production proofs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            'https://meliturgos.adrien-lopezcarreras.workers.dev/api/gen2/autonomy/control' \
            --output verified-release-autonomy-control.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { rememberedReleaseMax, isReleaseAutonomyPause } from './src/evolution/autonomy-control.js';
          const control=JSON.parse(fs.readFileSync('verified-release-autonomy-control.json','utf8'));
          if(control.ok!==true || typeof control.paused!=='boolean' || typeof control.max_autonomy!=='boolean')
            throw new Error('VERIFIED_RELEASE_CONTROL_UNAVAILABLE');
          // Preserve the owner's pre-deploy choice through a technical release pause.
          // A later owner/safety pause must always revoke automatic restoration.
          const predeployChoice=process.env.PREVIOUS_MAX_AUTONOMY==='true';
          const restoreChoice=rememberedReleaseMax(control) || (predeployChoice && isReleaseAutonomyPause(control));
          fs.appendFileSync(process.env.GITHUB_ENV,'PREVIOUS_MAX_AUTONOMY='+String(restoreChoice)+'\n'+'VERIFIED_CONTROL_VERSION='+String(control.updated_at ?? '')+'\n');
          NODE

      # A routine release must not silently switch off an autonomy the owner had
      # running: MAX on before a push deploy is restored after the same verified
      # checks. An owner pause stays a pause.
      - name: Keep MAX disabled after hardening release
        if: success() && !(env.OWNER_MAX_AUTORELEASE == 'true' || env.PREVIOUS_MAX_AUTONOMY == 'true')
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          test -s release-bootstrap-token.txt
          SAFE_TOKEN="$(cat release-bootstrap-token.txt)"
          echo "::add-mask::${SAFE_TOKEN}"
          CODE="$(curl --silent --show-error --max-time 120 \
            --header "x-mel-launch-bootstrap: ${SAFE_TOKEN}" \
            --header "content-type: application/json" \
            --data '{"phase":"pause"}' \
            --output final-autonomy-safe-stop.json \
            --write-out '%{http_code}' \
            "${BASE_URL}/api/internal/release-launch-bootstrap" || true)"
          test "${CODE}" = "200"
          node - <<'NODE'
          const d=require('./final-autonomy-safe-stop.json');
          if(d?.ok!==true||d?.paused!==true||d?.max_autonomy!==false){
            throw new Error('FINAL_AUTONOMY_SAFE_STOP_NOT_PROVED');
          }
          if(d?.autonomy_started===true) throw new Error('FINAL_AUTONOMY_SAFE_STOP_STARTED_AUTONOMY');
          console.log('Final hardening state: paused=true, max_autonomy=false.');
          NODE

      - name: Re-enable MAX 100% after verified autonomous release
        id: restore_max
        if: success() && (env.OWNER_MAX_AUTORELEASE == 'true' || env.PREVIOUS_MAX_AUTONOMY == 'true')
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          test -s release-bootstrap-token.txt
          MAX_TOKEN="$(cat release-bootstrap-token.txt)"
          echo "::add-mask::${MAX_TOKEN}"
          READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE="$(curl --silent --show-error --max-time 120 \
              --header "x-mel-launch-bootstrap: ${MAX_TOKEN}" \
              --header "content-type: application/json" \
              --data '{"phase":"gen2-42-owner-max"}' \
              --output owner-max-autorelease.json \
              --write-out '%{http_code}' \
              "$BASE_URL/api/internal/release-launch-bootstrap?release_restore=true&verified_control_version=${VERIFIED_CONTROL_VERSION}&release_owner_control_version=${PREDEPLOY_OWNER_CONTROL_VERSION}" || true)"
            if [ "$CODE" = "200" ]; then READY=1; break; fi
            sleep 3
          done
          test "$READY" = "1"
          node - <<'NODE'
          const fs=require('fs');
          const d=require('./owner-max-autorelease.json');
          if(d?.ok!==true) throw new Error('OWNER_MAX_AUTORELEASE_RESTART_FAILED');
          if(d.restore_skipped===true){
            if(d.autonomy_started!==false) throw new Error('OWNER_CONTROL_NOT_PRESERVED');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'restored=false\n');
            console.log('Later owner/safety control preserved; no autonomy kick.');
          } else {
            if(d.max_autonomy!==true||d.paused===true) throw new Error('OWNER_MAX_AUTORELEASE_RESTART_FAILED');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'restored=true\n');
            console.log('MAX restored after verified release.');
          }
          NODE

      - name: Kick event-driven autonomy chain after MAX restore
        if: success() && steps.restore_max.outputs.restored == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' '{"ref":"main","inputs":{"chain_depth":"0"}}' > autonomy-chain-dispatch.json
          CODE="$(curl --silent --show-error --max-time 30             --request POST             --header "Authorization: Bearer $GH_TOKEN"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --header "Content-Type: application/json"             --data-binary @autonomy-chain-dispatch.json             --output autonomy-chain-dispatch-response.txt             --write-out '%{http_code}'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/gen2-42-runtime-tick.yml/dispatches")"
          test "$CODE" = "204"
          echo "AUTONOMY_CHAIN_STARTED depth=0"

      - name: Automatic rollback on failed production verification
        if: failure()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ ! -f production-deploy-started.marker ]; then
            echo "Production deployment never started; no rollback required."
            exit 0
          fi

          test -n "${PREVIOUS_CLOUDFLARE_VERSION_ID:-}"
          test -n "${PREVIOUS_DEPLOYED_SHA:-}"
          test -n "${PREVIOUS_AUTONOMY_PAUSED:-}"
          test -n "${PREVIOUS_MAX_AUTONOMY:-}"

          # A failed proof may coincide with Cloudflare's transient 1042
          # visibility window. Wait for the canonical Worker to be observable
          # again before staging D1 state or invoking rollback.
          WORKER_VISIBLE=0
          for WORKER_ATTEMPT in $(seq 1 30); do
            WORKER_CODE="$(curl --silent --show-error --max-time 30 \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --output rollback-worker-visibility.json \
              --write-out '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/meliturgos/deployments" || true)"
            if [ "${WORKER_CODE}" = "200" ]; then
              WORKER_VISIBLE=1
              break
            fi
            if [ "${WORKER_CODE}" = "404" ] && grep -q '"code"[[:space:]]*:[[:space:]]*10007' rollback-worker-visibility.json 2>/dev/null; then
              echo "Cloudflare Worker visibility gap persists (10007/1042); retry ${WORKER_ATTEMPT}/30."
            else
              echo "Worker visibility probe returned HTTP ${WORKER_CODE}; retry ${WORKER_ATTEMPT}/30."
            fi
            sleep 5
          done
          if [ "${WORKER_VISIBLE}" != "1" ]; then
            echo "Canonical Worker did not become observable before rollback safety deadline."
            test ! -s rollback-worker-visibility.json || cat rollback-worker-visibility.json
            exit 58
          fi

          # Hardening invariant: rollback restores the previous Worker version but
          # NEVER restarts autonomy. Shared D1 is staged PAUSED/MAX=false before
          # the code rollback so the previous Worker inherits the safe state.
          SAFE_PAUSED=true
          SAFE_MAX=false
          PRE_RESTORE_READY=0

          OIDC_RESPONSE="$(curl --silent --show-error --fail --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=meliturgos-worker")"
          OIDC_TOKEN="$(printf '%s' "${OIDC_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})')"
          echo "::add-mask::${OIDC_TOKEN}"

          for RESTORE_ATTEMPT in $(seq 1 6); do
            RESTORE_CODE="$(curl --silent --show-error --max-time 120 \
              --request POST \
              --header "x-mel-github-oidc: ${OIDC_TOKEN}" \
              --header "content-type: application/json" \
              --data '{"phase":"release-rollback-restore"}' \
              --output rollback-autonomy-restore.json \
              --write-out '%{http_code}' \
              "https://meliturgos.adrien-lopezcarreras.workers.dev/api/internal/release-launch-bootstrap?expected_sha=${EXPECTED_SHA}&restore_sha=${PREVIOUS_DEPLOYED_SHA}&paused=true&max=false" || true)"
            if [ "${RESTORE_CODE}" = "200" ] && \
              EXPECTED_SHA="${EXPECTED_SHA}" \
              PREVIOUS_DEPLOYED_SHA="${PREVIOUS_DEPLOYED_SHA}" \
              node - <<'NODE'
          const d=require('./rollback-autonomy-restore.json');
          const deployed=String(process.env.EXPECTED_SHA||'').toLowerCase();
          const restore=String(process.env.PREVIOUS_DEPLOYED_SHA||'').toLowerCase();
          if(d?.ok!==true || d?.status!=='RELEASE_ROLLBACK_AUTONOMY_RESTORED') process.exit(1);
          if(String(d?.deployed_sha||'').toLowerCase()!==deployed) process.exit(1);
          if(String(d?.restore_sha||'')!=='') process.exit(1);
          if(d?.launch_approved_sha!=null) process.exit(1);
          if(d?.paused!==true || d?.max_autonomy!==false) process.exit(1);
          NODE
            then
              PRE_RESTORE_READY=1
              echo "Safe paused autonomy staged in shared D1 before Worker rollback."
              break
            fi
            echo "Pre-rollback safe-stop attempt ${RESTORE_ATTEMPT}/6 returned HTTP ${RESTORE_CODE}; bounded retry."
            test ! -s rollback-autonomy-restore.json || cat rollback-autonomy-restore.json
            sleep 3
          done
          if [ "${PRE_RESTORE_READY}" != "1" ]; then
            echo "Refusing rollback without a proven PAUSED/MAX=false shared-D1 state."
            exit 56
          fi

          # Use Wrangler's supported rollback command rather than hand-crafting
          # the deployment API request. It restores code only; autonomy remains
          # fail-safe in the shared D1 state staged above.
          if ! npx wrangler rollback "${PREVIOUS_CLOUDFLARE_VERSION_ID}" \
            --name meliturgos \
            --message "MEL automatic rollback after failed release verification (MAX kept disabled)" \
            >/tmp/mel-rollback.log 2>&1; then
            echo "Automatic Wrangler rollback failed."
            cat /tmp/mel-rollback.log
            exit 49
          fi
          cat /tmp/mel-rollback.log
          echo "Automatic rollback accepted to previous stable Cloudflare version."

          CONTROL_READY=0
          for CONTROL_ATTEMPT in $(seq 1 18); do
            CONTROL_CODE="$(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 1 --max-time 30 \
              --output rollback-autonomy-control.json \
              --write-out '%{http_code}' \
              "https://meliturgos.adrien-lopezcarreras.workers.dev/api/gen2/autonomy/control" || true)"
            if [ "${CONTROL_CODE}" = "200" ] && node - <<'NODE'
          const d=require('./rollback-autonomy-control.json');
          if(d?.ok!==true || d?.paused!==true || d?.max_autonomy!==false) process.exit(1);
          NODE
            then
              CONTROL_READY=1
              break
            fi
            echo "Rollback safe autonomy verification attempt ${CONTROL_ATTEMPT}/18 returned HTTP ${CONTROL_CODE}; waiting for stable propagation."
            sleep 3
          done
          if [ "${CONTROL_READY}" != "1" ]; then
            echo "Worker rollback succeeded, but PAUSED/MAX=false was not observable after propagation."
            test ! -s rollback-autonomy-control.json || cat rollback-autonomy-control.json
            exit 57
          fi
          echo "Previous stable Worker restored with autonomy PAUSED and MAX disabled."


