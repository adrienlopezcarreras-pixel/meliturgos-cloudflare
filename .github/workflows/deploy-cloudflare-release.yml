          }
          const coverage=d?.alternative_coverage||{};
          const architecture=d?.architecture_contract||{};
          const gap=d?.gap_plan||{};
          const candidates=d?.replacement_candidates||{};
          const blocked=(Array.isArray(gap?.blocked_layers)?gap.blocked_layers:[]).map(row=>({
            layer:String(row?.layer||''),
            status:String(row?.status||''),
            blocking_reason:row?.blocking_reason||null,
            live_alternative_count:Array.isArray(row?.live_alternatives)?row.live_alternatives.length:0,
