name: Companion Owner Compute Status CI
on:
  pull_request:
    paths:
      - 'src/devices/companion-compute-admission.js'
      - 'src/devices/computer-companion-api.js'
      - 'tests/gen2/companion-owner-compute-status.test.mjs'
      - '.github/workflows/companion-owner-compute-status-ci.yml'
permissions:
  contents: read
jobs:
  status-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/gen2/companion-owner-compute-status.test.mjs tests/gen2/companion-late-ollama-result.test.mjs
