name: post-release-proof-suite

on:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact release SHA to prove; defaults to current main"
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/post-release-proof-suite.yml'
      - 'tests/gen2/post-release-proof-suite.test.mjs'

permissions:
  contents: read
  actions: write

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/gen2/post-release-proof-suite.test.mjs

  resolve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      expected_sha: ${{ steps.sha.outputs.expected_sha }}
    steps:
      - id: sha
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.expected_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="${INPUT_SHA:-${FALLBACK_SHA}}"
          [[ "${SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "expected_sha=${SHA,,}" >> "$GITHUB_OUTPUT"

  platform:
    needs: resolve
    uses: ./.github/workflows/activate-platform-capabilities.yml
    with:
      expected_sha: ${{ needs.resolve.outputs.expected_sha }}
    secrets: inherit

  persistent-stress:
    needs: [resolve, platform]
    if: always() && needs.resolve.result == 'success'
    uses: ./.github/workflows/persistent-capability-stress-live-proof.yml
    with:
      expected_sha: ${{ needs.resolve.outputs.expected_sha }}
    secrets: inherit

  council-rich-ui:
    needs: [resolve, persistent-stress]
    if: always() && needs.resolve.result == 'success'
    uses: ./.github/workflows/council-rich-ui-production-proof.yml
    with:
      expected_sha: ${{ needs.resolve.outputs.expected_sha }}
    secrets: inherit

  connections:
    needs: [resolve, council-rich-ui]
    if: always() && needs.resolve.result == 'success'
    uses: ./.github/workflows/live-connections-production-proof.yml
    with:
      expected_sha: ${{ needs.resolve.outputs.expected_sha }}
    secrets: inherit

  sovereignty:
    needs: [resolve, connections]
    if: always() && needs.resolve.result == 'success'
    uses: ./.github/workflows/mel-sov-01-live-proof.yml
    with:
      expected_sha: ${{ needs.resolve.outputs.expected_sha }}
    secrets: inherit

  summary:
    needs: [resolve, platform, persistent-stress, council-rich-ui, connections, sovereignty]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Report exact post-release proof outcomes
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
          PLATFORM: ${{ needs.platform.result }}
          STRESS: ${{ needs.persistent-stress.result }}
          COUNCIL_RICH_UI: ${{ needs.council-rich-ui.result }}
          CONNECTIONS: ${{ needs.connections.result }}
          SOVEREIGNTY: ${{ needs.sovereignty.result }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const proof={
            schema:'mel.post-release-proof-suite/v1',
            expected_sha:process.env.EXPECTED_SHA||null,
            platform:process.env.PLATFORM||'unknown',
            persistent_stress:process.env.STRESS||'unknown',
            council_rich_ui:process.env.COUNCIL_RICH_UI||'unknown',
            connections:process.env.CONNECTIONS||'unknown',
            sovereignty:process.env.SOVEREIGNTY||'unknown',
          };
          console.log(JSON.stringify(proof,null,2));
          const values=[proof.platform,proof.persistent_stress,proof.council_rich_ui,proof.connections,proof.sovereignty];
          if(values.some(value=>value!=='success')) process.exit(1);
          NODE
