name: live-connections-production-proof

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-connections-production-proof.yml'
      - 'tests/live-connections-production-proof.test.mjs'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact deployed SHA to prove; defaults to current ref"
        required: false
        type: string
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mel-live-connections-proof
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/live-connections-production-proof.test.mjs

  production-proof:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci

      - name: Prove live production connections
        shell: bash
        env:
          PROOF_KEY_B64: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_B64 }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          EXPECTED_SHA="${{ inputs.expected_sha || github.sha }}"
          TOKEN="$(PROOF_KEY_B64="${PROOF_KEY_B64}" TARGET_SHA="${EXPECTED_SHA}" node - <<'NODE'
          const crypto=require('crypto');
          const source=Buffer.from(String(process.env.PROOF_KEY_B64||''),'base64');
          const sha=String(process.env.TARGET_SHA||'').toLowerCase();
          if(source.length!==32||!/^[0-9a-f]{40}$/.test(sha)) throw new Error('PARALLEL_PROOF_DERIVATION_INVALID');
          process.stdout.write(Buffer.from(crypto.hkdfSync(
            'sha256',
            source,
            Buffer.from('meliturgos-parallel-proof-salt-v1'),
            Buffer.from('MEL_PARALLEL_PROOF_V1:'+sha),
            32,
          )).toString('base64url'));
          NODE
          )"
          echo "::add-mask::${TOKEN}"

          probe() {
            local name="$1"
            local path="$2"
            local body="$3"
            local out="/tmp/${name}.json"
            local code
            code="$(curl --silent --show-error --max-time 45               --header "x-mel-release-smoke: 1"               --header "x-mel-parallel-proof: ${TOKEN}"               --header "content-type: application/json"               --data "${body}"               --output "${out}"               --write-out '%{http_code}'               "${BASE_URL}${path}" || true)"
            if [ "${code}" != "200" ]; then
              node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{};console.log(process.argv[2]+": "+JSON.stringify({ok:false,http:Number(process.argv[3]),code:d?.code||d?.error||"UNKNOWN",upstream_status:Number(d?.upstream_status||0)||null,upstream_code:d?.upstream_code||null,upstream_message:d?.upstream_message||null,action_required:d?.action_required||null}))' "${out}" "${name}" "${code}"
              return 1
            fi
            node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(d?.ok!==true)process.exit(2);console.log(process.argv[2]+": "+JSON.stringify({ok:true,provider:d?.provider||null,connector_id:d?.connector_id||null,live_probe:d?.live_probe===true,persistent:d?.persistent===true,authenticated:d?.authenticated===true,project_found:d?.project_found===true,project_count:Number(d?.project_count||0),deployment_count:Number(d?.deployment_count||0)}))' "${out}" "${name}"
          }

          # Prove exact-SHA immutable parallel-proof authentication here.
          # Connector health is evaluated independently below so one broken
          # account never hides the status of every other connection.
          READY=0
          for attempt in $(seq 1 12); do
            READY_CODE="$(curl --silent --show-error --max-time 45               --header "x-mel-release-smoke: 1"               --header "x-mel-parallel-proof: ${TOKEN}"               --output /tmp/connections-self-check.json               --write-out '%{http_code}'               "${BASE_URL}/api/gen2/code/self-check" || true)"
            if [ "${READY_CODE}" = "200" ]; then
              READY=1
              break
            fi
            sleep 2
          done
          test "${READY}" = "1"

          # Print only sanitized OAuth state (authorization/scopes/refreshability)
          # so a missing consent scope can be distinguished from a code defect.
          GOOGLE_STATUS_CODE="$(curl --silent --show-error --max-time 30             --header "x-mel-release-smoke: 1"             --header "x-mel-parallel-proof: ${TOKEN}"             --output /tmp/google_status.json             --write-out '%{http_code}'             "${BASE_URL}/api/gen2/connections/google/status" || true)"
          if [ "${GOOGLE_STATUS_CODE}" = "200" ]; then
            node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/google_status.json','utf8'));
          const connectors={};
          for(const [id,row] of Object.entries(d?.connectors||{})){
            connectors[id]={
              authorized:row?.authorized===true,
              scopes:Array.isArray(row?.scopes)?row.scopes:[],
              refreshable:row?.refreshable===true,
              expires_at:row?.expires_at||null,
            };
          }
          console.log('google_oauth_status: '+JSON.stringify({
            ok:d?.ok===true,
            app_configured:d?.app_configured===true,
            connectors,
          }));
          NODE
          fi

          FAILURES=0
          GOOGLE_GMAIL_OK=0
          GOOGLE_CALENDAR_OK=0
          GOOGLE_TASKS_OK=0
          GOOGLE_DRIVE_OK=0
          MICROSOFT_MAIL_OK=0
          MICROSOFT_ONEDRIVE_OK=0
          MICROSOFT_SHAREPOINT_OK=0

          if probe google_gmail /api/gen2/connections/google/test '{"connector_id":"gmail"}'; then
            GOOGLE_GMAIL_OK=1
          else
            FAILURES=$((FAILURES+1))
          fi

          # Pipedream is the canonical UI path for Microsoft and can also hold
          # the Yahoo/Ymail IMAP account. Prove the project and enumerate only
          # sanitized account/app health before accepting it as a fallback.
          PIPEDREAM_OK=0
          PIPEDREAM_APPS=""
          PD_STATUS_CODE="$(curl --silent --show-error --max-time 30               --header "x-mel-release-smoke: 1"               --header "x-mel-parallel-proof: ${TOKEN}"               --output /tmp/pipedream_status.json               --write-out '%{http_code}'               "${BASE_URL}/api/gen2/connections/pipedream/status" || true)"
          if [ "${PD_STATUS_CODE}" = "200" ]; then
            node -e 'const d=require("/tmp/pipedream_status.json");console.log("pipedream_status: "+JSON.stringify({ok:d?.ok===true,configured:d?.configured===true,environment:d?.environment||null,client_id_present:d?.client_id_present===true,client_secret_present:d?.client_secret_present===true}))'
          fi
          # The linked-account inventory is the stronger proof for MEL's actual
          # integrations: it authenticates the project and proves which user
          # accounts are healthy. Component catalogue reachability is diagnostic
          # only and must not mask healthy linked accounts.
          PD_ACCOUNTS_CODE="000"
          for attempt in $(seq 1 12); do
            PD_ACCOUNTS_CODE="$(curl --silent --show-error --max-time 45               --header "x-mel-release-smoke: 1"               --header "x-mel-parallel-proof: ${TOKEN}"               --output /tmp/pipedream_accounts.json               --write-out '%{http_code}'               "${BASE_URL}/api/gen2/connections/pipedream/accounts" || true)"
            if [ "${PD_ACCOUNTS_CODE}" = "200" ]; then
              break
            fi
            PD_ERROR_CODE="$(node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("/tmp/pipedream_accounts.json","utf8"))}catch{};process.stdout.write(String(d?.code||d?.error||"UNKNOWN"))')"
            if [ "${PD_ACCOUNTS_CODE}" = "401" ] && [ "${PD_ERROR_CODE}" = "AUTH_REQUIRED" ]; then
              sleep 2
              continue
            fi
            break
          done
          if [ "${PD_ACCOUNTS_CODE}" = "200" ]; then
            PIPEDREAM_OK=1
            PIPEDREAM_APPS="$(node -e 'const d=require("/tmp/pipedream_accounts.json");process.stdout.write((d.connected_apps||[]).join(","))')"
            node -e 'const d=require("/tmp/pipedream_accounts.json");console.log("pipedream_accounts: "+JSON.stringify({ok:d?.ok===true,connected_apps:d?.connected_apps||[],healthy_account_count:(d?.accounts||[]).filter(x=>x?.healthy===true).length,account_status_degraded:d?.account_status_degraded===true,reconnect_required:d?.reconnect_required===true,environment:d?.environment||null,action_required:d?.action_required||null,upstream_status:Number(d?.upstream_status||0)||null,upstream_code:d?.upstream_code||null,upstream_message:d?.upstream_message||null}))'
          else
            PD_ACCOUNTS_CODE="${PD_ACCOUNTS_CODE}" node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("/tmp/pipedream_accounts.json","utf8"))}catch{};console.log("pipedream_accounts: "+JSON.stringify({ok:false,http:Number(process.env.PD_ACCOUNTS_CODE||0),code:d?.code||d?.error||"UNKNOWN",upstream_status:Number(d?.upstream_status||0)||null,upstream_code:d?.upstream_code||null,upstream_message:d?.upstream_message||null,action_required:d?.action_required||null}))'
          fi
          if ! probe pipedream_catalog /api/gen2/connections/pipedream/test '{}'; then
            echo "Pipedream component-catalogue diagnostic is unavailable; linked-account proof remains authoritative."
          fi

          has_pd_app() {
            case ",${PIPEDREAM_APPS}," in
              *,"$1",*) return 0 ;;
              *) return 1 ;;
            esac
          }

          if probe google_calendar /api/gen2/connections/google/test '{"connector_id":"google-calendar"}'; then
            GOOGLE_CALENDAR_OK=1
          elif [ "${PIPEDREAM_OK}" = "1" ] && has_pd_app google_calendar; then
            GOOGLE_CALENDAR_OK=1
            echo 'google_calendar: {"ok":true,"provider":"pipedream","app":"google_calendar","linked_account":true}'
          fi
          if [ "${GOOGLE_CALENDAR_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          if probe google_tasks /api/gen2/connections/google/test '{"connector_id":"google-tasks"}'; then
            GOOGLE_TASKS_OK=1
          elif [ "${PIPEDREAM_OK}" = "1" ] && has_pd_app google_tasks; then
            if probe google_tasks_pipedream_read /api/gen2/connections/pipedream/test '{"probe":"google_tasks_read"}'; then
              GOOGLE_TASKS_OK=1
              echo 'google_tasks: {"ok":true,"provider":"pipedream","app":"google_tasks","linked_account":true,"live_read_action":true,"private_content_returned":false}'
            fi
          fi
          if [ "${GOOGLE_TASKS_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          # Native Drive is a hard dependency of MEL-SOV-01 backup/restore.
          # Prove the actual Google Drive API target instead of inferring health
          # from OAuth scopes alone.
          if probe google_drive /api/gen2/connections/google/test '{"connector_id":"google-drive"}'; then
            GOOGLE_DRIVE_OK=1
          fi
          if [ "${GOOGLE_DRIVE_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          if probe microsoft_mail /api/gen2/connections/microsoft/test '{"connector_id":"microsoft-mail"}'; then
            MICROSOFT_MAIL_OK=1
          elif [ "${PIPEDREAM_OK}" = "1" ] && has_pd_app microsoft_outlook; then
            MICROSOFT_MAIL_OK=1
            echo 'microsoft_mail: {"ok":true,"provider":"pipedream","app":"microsoft_outlook","linked_account":true}'
          fi
          if [ "${MICROSOFT_MAIL_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          if probe microsoft_onedrive /api/gen2/connections/microsoft/test '{"connector_id":"microsoft-onedrive"}'; then
            MICROSOFT_ONEDRIVE_OK=1
          elif [ "${PIPEDREAM_OK}" = "1" ] && has_pd_app microsoft_onedrive; then
            MICROSOFT_ONEDRIVE_OK=1
            echo 'microsoft_onedrive: {"ok":true,"provider":"pipedream","app":"microsoft_onedrive","linked_account":true}'
          fi
          if [ "${MICROSOFT_ONEDRIVE_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          if probe microsoft_sharepoint /api/gen2/connections/microsoft/test '{"connector_id":"microsoft-sharepoint"}'; then
            MICROSOFT_SHAREPOINT_OK=1
          elif [ "${PIPEDREAM_OK}" = "1" ] && has_pd_app sharepoint; then
            MICROSOFT_SHAREPOINT_OK=1
            echo 'microsoft_sharepoint: {"ok":true,"provider":"pipedream","app":"sharepoint","linked_account":true}'
          fi
          if [ "${MICROSOFT_SHAREPOINT_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          YAHOO_OK=0
          if probe yahoo_oauth /api/gen2/connections/yahoo/test '{"connector_id":"yahoo-mail"}'; then
            YAHOO_OK=1
          elif [ "${PIPEDREAM_OK}" = "1" ] && has_pd_app imap; then
            YAHOO_OK=1
            echo 'yahoo_ymail: {"ok":true,"provider":"pipedream","app":"imap","linked_account":true,"direct_imap_probe":false}'
          fi
          if [ "${YAHOO_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          # Vercel is an optional integration. MEL production and sovereignty do
          # not depend on a paid Vercel plan, so an absent token is reported but
          # must not fail the global connection proof.
          VERCEL_OK=0
          VERCEL_STATUS="OPTIONAL_NOT_CONFIGURED"
          if probe vercel /api/gen2/connections/vercel/test '{}'; then
            VERCEL_OK=1
            VERCEL_STATUS="CONNECTED"
          else
            echo 'vercel: {"ok":false,"required":false,"status":"OPTIONAL_NOT_CONFIGURED"}'
          fi

          GOOGLE_GMAIL_OK="${GOOGLE_GMAIL_OK}" GOOGLE_CALENDAR_OK="${GOOGLE_CALENDAR_OK}" GOOGLE_TASKS_OK="${GOOGLE_TASKS_OK}" GOOGLE_DRIVE_OK="${GOOGLE_DRIVE_OK}" MICROSOFT_MAIL_OK="${MICROSOFT_MAIL_OK}" MICROSOFT_ONEDRIVE_OK="${MICROSOFT_ONEDRIVE_OK}" MICROSOFT_SHAREPOINT_OK="${MICROSOFT_SHAREPOINT_OK}" YAHOO_OK="${YAHOO_OK}" VERCEL_OK="${VERCEL_OK}" VERCEL_STATUS="${VERCEL_STATUS}" FAILURES="${FAILURES}" node - <<'NODE'
          const fs=require('fs');
          const proof={
            schema:'mel.live-connections-production-proof/v1',
            source_sha:process.env.EXPECTED_SHA || null,
            complete:Number(process.env.FAILURES||0)===0,
            failure_count:Number(process.env.FAILURES||0),
            google:{
              gmail:process.env.GOOGLE_GMAIL_OK==='1',
              calendar:process.env.GOOGLE_CALENDAR_OK==='1',
              tasks:process.env.GOOGLE_TASKS_OK==='1',
              drive:process.env.GOOGLE_DRIVE_OK==='1'
            },
            microsoft:{
              outlook:process.env.MICROSOFT_MAIL_OK==='1',
              onedrive:process.env.MICROSOFT_ONEDRIVE_OK==='1',
              sharepoint:process.env.MICROSOFT_SHAREPOINT_OK==='1'
            },
            mail:{
              yahoo_or_ymail:process.env.YAHOO_OK==='1'
            },
            vercel:{
              required:false,
              authenticated_target_probe:process.env.VERCEL_OK==='1',
              status:process.env.VERCEL_STATUS||'OPTIONAL_NOT_CONFIGURED'
            },
            secret_values_exposed:false,
            mutation_scope:'read_only_parallel_proof_auth'
          };
          fs.writeFileSync('live-connections-proof.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof,null,2));
          NODE

          if [ "${FAILURES}" != "0" ]; then
            echo "Live connection proof failures: ${FAILURES}"
            exit 1
          fi
      - name: Upload sanitized live proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-connections-production-proof-${{ inputs.expected_sha || github.sha }}
          path: live-connections-proof.json
          if-no-files-found: error
          retention-days: 14
