name: live-connections-production-proof

on:
  workflow_run:
    workflows: ["deploy-cloudflare-release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact deployed SHA to prove; defaults to current ref"
        required: false
        type: string
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

env:
  LIVE_PROOF_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha || github.sha }}

concurrency:
  group: mel-launch-bootstrap-token
  cancel-in-progress: false

jobs:
  production-proof:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'release/mel-hardware-v0.1.0')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.LIVE_PROOF_SHA }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci

      - name: Prove live production connections
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ env.LIVE_PROOF_SHA }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          EXPECTED_SHA="${{ env.LIVE_PROOF_SHA }}"
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"

          cleanup() {
            set +e
            printf 'y\n' | npx wrangler secret delete MEL_LAUNCH_BOOTSTRAP_TOKEN --env="" >/tmp/live-connections-secret-delete.log 2>&1 || true
          }
          trap cleanup EXIT

          printf '%s' "${TOKEN}" | npx wrangler secret put MEL_LAUNCH_BOOTSTRAP_TOKEN --env=""

          probe() {
            local name="$1"
            local path="$2"
            local body="$3"
            local out="/tmp/${name}.json"
            local code
            code="$(curl --silent --show-error --max-time 45               --header "x-mel-release-smoke: 1"               --header "x-mel-launch-bootstrap: ${TOKEN}"               --header "content-type: application/json"               --data "${body}"               --output "${out}"               --write-out '%{http_code}'               "${BASE_URL}${path}" || true)"
            if [ "${code}" != "200" ]; then
              node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{};console.log(process.argv[2]+": "+JSON.stringify({ok:false,http:Number(process.argv[3]),code:d?.code||d?.error||"UNKNOWN"}))' "${out}" "${name}" "${code}"
              return 1
            fi
            node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(d?.ok!==true)process.exit(2);console.log(process.argv[2]+": "+JSON.stringify({ok:true,provider:d?.provider||null,connector_id:d?.connector_id||null,live_probe:d?.live_probe===true,persistent:d?.persistent===true,authenticated:d?.authenticated===true,project_found:d?.project_found===true,project_count:Number(d?.project_count||0),deployment_count:Number(d?.deployment_count||0)}))' "${out}" "${name}"
          }

          # Bound retry only for temporary bootstrap-secret propagation.
          READY=0
          for attempt in $(seq 1 12); do
            if probe google_gmail /api/gen2/connections/google/test '{"connector_id":"gmail"}'; then
              READY=1
              break
            fi
            sleep 2
          done
          test "${READY}" = "1"

          # Print only sanitized OAuth state (authorization/scopes/refreshability)
          # so a missing consent scope can be distinguished from a code defect.
          GOOGLE_STATUS_CODE="$(curl --silent --show-error --max-time 30             --header "x-mel-release-smoke: 1"             --header "x-mel-launch-bootstrap: ${TOKEN}"             --output /tmp/google_status.json             --write-out '%{http_code}'             "${BASE_URL}/api/gen2/connections/google/status" || true)"
          if [ "${GOOGLE_STATUS_CODE}" = "200" ]; then
            node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/google_status.json','utf8'));
          const connectors={};
          for(const [id,row] of Object.entries(d?.connectors||{})){
            connectors[id]={
              authorized:row?.authorized===true,
              scopes:Array.isArray(row?.scopes)?row.scopes:[],
              refreshable:row?.refreshable===true,
              expires_at:row?.expires_at||null,
            };
          }
          console.log('google_oauth_status: '+JSON.stringify({
            ok:d?.ok===true,
            app_configured:d?.app_configured===true,
            connectors,
          }));
          NODE
          fi

          FAILURES=0
          if ! probe google_calendar /api/gen2/connections/google/test '{"connector_id":"google-calendar"}'; then FAILURES=$((FAILURES+1)); fi
          if ! probe google_tasks /api/gen2/connections/google/test '{"connector_id":"google-tasks"}'; then FAILURES=$((FAILURES+1)); fi

          # Pipedream is the canonical UI path for Microsoft and can also hold
          # the Yahoo/Ymail IMAP account. Prove the project and enumerate only
          # sanitized account/app health before accepting it as a fallback.
          PIPEDREAM_OK=0
          PIPEDREAM_APPS=""
          # The linked-account inventory is the stronger proof for MEL's actual
          # integrations: it authenticates the project and proves which user
          # accounts are healthy. Component catalogue reachability is diagnostic
          # only and must not mask healthy linked accounts.
          PD_ACCOUNTS_CODE="$(curl --silent --show-error --max-time 45             --header "x-mel-release-smoke: 1"             --header "x-mel-launch-bootstrap: ${TOKEN}"             --output /tmp/pipedream_accounts.json             --write-out '%{http_code}'             "${BASE_URL}/api/gen2/connections/pipedream/accounts" || true)"
          if [ "${PD_ACCOUNTS_CODE}" = "200" ]; then
            PIPEDREAM_OK=1
            PIPEDREAM_APPS="$(node -e 'const d=require("/tmp/pipedream_accounts.json");process.stdout.write((d.connected_apps||[]).join(","))')"
            node -e 'const d=require("/tmp/pipedream_accounts.json");console.log("pipedream_accounts: "+JSON.stringify({ok:d?.ok===true,connected_apps:d?.connected_apps||[],healthy_account_count:(d?.accounts||[]).filter(x=>x?.healthy===true).length}))'
          else
            PD_ACCOUNTS_CODE="${PD_ACCOUNTS_CODE}" node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("/tmp/pipedream_accounts.json","utf8"))}catch{};console.log("pipedream_accounts: "+JSON.stringify({ok:false,http:Number(process.env.PD_ACCOUNTS_CODE||0),code:d?.code||d?.error||"UNKNOWN"}))'
          fi
          if ! probe pipedream_catalog /api/gen2/connections/pipedream/test '{}'; then
            echo "Pipedream component-catalogue diagnostic is unavailable; linked-account proof remains authoritative."
          fi

          has_pd_app() {
            case ",${PIPEDREAM_APPS}," in
              *,"$1",*) return 0 ;;
              *) return 1 ;;
            esac
          }

          MICROSOFT_MAIL_OK=0
          if probe microsoft_mail /api/gen2/connections/microsoft/test '{"connector_id":"microsoft-mail"}'; then
            MICROSOFT_MAIL_OK=1
          elif [ "${PIPEDREAM_OK}" = "1" ] && has_pd_app microsoft_outlook; then
            MICROSOFT_MAIL_OK=1
            echo 'microsoft_mail: {"ok":true,"provider":"pipedream","app":"microsoft_outlook","linked_account":true}'
          fi
          if [ "${MICROSOFT_MAIL_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          MICROSOFT_ONEDRIVE_OK=0
          if probe microsoft_onedrive /api/gen2/connections/microsoft/test '{"connector_id":"microsoft-onedrive"}'; then
            MICROSOFT_ONEDRIVE_OK=1
          elif [ "${PIPEDREAM_OK}" = "1" ] && has_pd_app microsoft_onedrive; then
            MICROSOFT_ONEDRIVE_OK=1
            echo 'microsoft_onedrive: {"ok":true,"provider":"pipedream","app":"microsoft_onedrive","linked_account":true}'
          fi
          if [ "${MICROSOFT_ONEDRIVE_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          MICROSOFT_SHAREPOINT_OK=0
          if probe microsoft_sharepoint /api/gen2/connections/microsoft/test '{"connector_id":"microsoft-sharepoint"}'; then
            MICROSOFT_SHAREPOINT_OK=1
          elif [ "${PIPEDREAM_OK}" = "1" ] && has_pd_app sharepoint; then
            MICROSOFT_SHAREPOINT_OK=1
            echo 'microsoft_sharepoint: {"ok":true,"provider":"pipedream","app":"sharepoint","linked_account":true}'
          fi
          if [ "${MICROSOFT_SHAREPOINT_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          YAHOO_OK=0
          if probe yahoo_oauth /api/gen2/connections/yahoo/test '{"connector_id":"yahoo-mail"}'; then
            YAHOO_OK=1
          elif probe yahoo_imap /api/gen2/connections/yahoo-imap/test '{}'; then
            YAHOO_OK=1
          elif [ "${PIPEDREAM_OK}" = "1" ] && has_pd_app imap; then
            YAHOO_OK=1
            echo 'yahoo_imap: {"ok":true,"provider":"pipedream","app":"imap","linked_account":true}'
          fi
          if [ "${YAHOO_OK}" != "1" ]; then FAILURES=$((FAILURES+1)); fi

          if ! probe roundcube /api/gen2/connections/roundcube/test '{}'; then FAILURES=$((FAILURES+1)); fi
          if ! probe vercel /api/gen2/connections/vercel/test '{}'; then FAILURES=$((FAILURES+1)); fi

          if [ "${FAILURES}" != "0" ]; then
            echo "Live connection proof failures: ${FAILURES}"
            exit 1
          fi

          node - <<'NODE'
          const fs=require('fs');
          const proof={
            schema:'mel.live-connections-production-proof/v1',
            source_sha:process.env.EXPECTED_SHA || null,
            google:{gmail:true,calendar:true,tasks:true},
            microsoft:{outlook:true,onedrive:true,sharepoint:true},
            mail:{yahoo_or_ymail:true,roundcube_imap_smtp:true},
            vercel:{authenticated_target_probe:true},
            secret_values_exposed:false,
            mutation_scope:'temporary_release_smoke_secret_only'
          };
          fs.writeFileSync('live-connections-proof.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof,null,2));
          NODE
      - name: Upload sanitized live proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-connections-production-proof-${{ env.LIVE_PROOF_SHA }}
          path: live-connections-proof.json
          if-no-files-found: error
          retention-days: 14
