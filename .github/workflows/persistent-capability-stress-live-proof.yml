name: persistent-capability-stress-live-proof

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact deployed SHA to prove; defaults to current ref"
        required: false
        type: string
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/persistent-capability-stress-live-proof.yml'
      - 'scripts/persistent-capability-stress-live-proof.mjs'
      - 'src/diagnostics/capability-truth-audit.js'
      - 'src/diagnostics/persistent-capability-stress.js'
      - 'tests/capability-truth-audit.test.mjs'
      - 'tests/capability-registry-exhaustive-audit.test.mjs'
      - 'tests/autonomy-capabilities.test.mjs'
      - 'tests/gen2/persistent-capability-stress.test.mjs'
      - 'tests/persistent-capability-stress-workflow-safety.test.mjs'
      - 'tests/persistent-stress-scoped-auth.test.mjs'
      - 'src/core/security.js'
      - 'src/router.js'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('persistent-stress-contract-{0}', github.event.pull_request.number) || 'mel-launch-bootstrap-token' }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check scripts/persistent-capability-stress-live-proof.mjs
      - run: node --test tests/capability-truth-audit.test.mjs tests/capability-registry-exhaustive-audit.test.mjs tests/autonomy-capabilities.test.mjs tests/gen2/persistent-capability-stress.test.mjs tests/release-production-smoke-routes.test.mjs tests/persistent-capability-stress-workflow-safety.test.mjs tests/persistent-stress-scoped-auth.test.mjs

  # The previous job wrote and deleted a temporary Cloudflare production secret
  # to launch stress. That is not a read-only proof, and it could remove a
  # legitimate credential if interrupted. Disable it rather than claiming
  # that contract CI or a capability inventory is full runtime stress.
  production-proof:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed until the live stress runner uses independent safe authorization
        run: |
          echo 'PERSISTENT_STRESS_LIVE_PROOF_DISABLED_UNSAFE_PRODUCTION_SECRET_MUTATION'
          echo 'Use GET-only capability inventory and bounded LOW-risk execution proofs.'
          echo 'Full 165-capability runtime stress is NOT VERIFIED by those lighter checks.'
          exit 1
