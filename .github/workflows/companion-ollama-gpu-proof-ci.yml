name: Companion Ollama GPU Proof CI
on:
  pull_request:
    paths:
      - 'assets/MEL-Computer-Companion.ps1'
      - 'dist/MEL-Computer-Companion.ps1'
      - 'src/portability/companion-local-ai-adapter.js'
      - 'tests/gen2/companion-ollama-gpu-proof.test.mjs'
      - '.github/workflows/companion-ollama-gpu-proof-ci.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/gen2/companion-ollama-gpu-proof.test.mjs tests/gen2/companion-ai-prevalidation-runtime.test.mjs
