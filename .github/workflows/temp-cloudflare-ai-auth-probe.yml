name: temp-cloudflare-ai-auth-probe

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - '.github/workflows/temp-cloudflare-ai-auth-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe token and Workers AI access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "TOKEN_SECRET_MISSING"; exit 41; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "ACCOUNT_SECRET_MISSING"; exit 42; }

          python - <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]

          def call(url):
              req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=json.loads(r.read().decode() or "{}")
                      return r.status, body
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors="replace")
                  try: body=json.loads(raw or "{}")
                  except: body={}
                  return e.code, body

          v_status,v=call("https://api.cloudflare.com/client/v4/user/tokens/verify")
          print(json.dumps({
              "probe":"token_verify",
              "http_status":v_status,
              "success":v.get("success"),
              "status":(v.get("result") or {}).get("status"),
              "error_codes":[x.get("code") for x in (v.get("errors") or [])],
              "error_messages":[x.get("message") for x in (v.get("errors") or [])],
          }))

          ai_status,ai=call(f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/finetunes")
          print(json.dumps({
              "probe":"workers_ai_finetunes_list",
              "http_status":ai_status,
              "success":ai.get("success"),
              "error_codes":[x.get("code") for x in (ai.get("errors") or [])],
              "error_messages":[x.get("message") for x in (ai.get("errors") or [])],
          }))
          PY
