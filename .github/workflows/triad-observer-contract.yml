name: triad observer contracts
on:
  pull_request:
    paths:
      - 'src/devices/triad-*.js'
      - 'tests/triad-*.test.mjs'
      - '.github/workflows/triad-observer-contract.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/triad-observer.test.mjs tests/triad-native-signal-adapters.test.mjs
