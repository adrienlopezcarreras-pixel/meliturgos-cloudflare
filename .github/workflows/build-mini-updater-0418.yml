name: build-mini-updater-0418

on:
  push:
    branches:
      - build/mini-updater-0.4.18
    paths:
      - tools/mini_updater_0418.py
      - .github/workflows/build-mini-updater-0418.yml

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned updater toolchain
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install pyinstaller==6.16.0 esptool==4.12.0

      - name: Download CI-validated MINI 0.4.18 firmware
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-WebRequest -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10993953647/zip" -OutFile "mini-firmware.zip"
          Expand-Archive -Path "mini-firmware.zip" -DestinationPath "mini-firmware" -Force
          if (-not (Test-Path "mini-firmware/build/mini-first-install.bin")) {
            throw "mini-first-install.bin missing from validated artifact"
          }

      - name: Verify exact firmware before embedding
        shell: pwsh
        run: |
          $expected = "fa46543cc39152f932cd7423242837f151db57e83895a88193d44f407c0fe6b4"
          $actual = (Get-FileHash "mini-firmware/build/mini-first-install.bin" -Algorithm SHA256).Hash.ToLower()
          Write-Host "Firmware SHA-256: $actual"
          if ($actual -ne $expected) {
            throw "Firmware SHA-256 mismatch"
          }

      - name: Build standalone Windows updater
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name "MEL_MINI_Updater_0.4.18" --collect-all esptool --collect-all serial --add-data "mini-firmware/build/mini-first-install.bin;." tools/mini_updater_0418.py

      - name: Validate updater executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/MEL_MINI_Updater_0.4.18.exe")) {
            throw "Updater executable missing"
          }
          $hash = (Get-FileHash "dist/MEL_MINI_Updater_0.4.18.exe" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "dist/MEL_MINI_Updater_0.4.18.exe").Length
          if ($size -lt 5000000) {
            throw "Updater executable unexpectedly small: $size"
          }
          "SHA256  MEL_MINI_Updater_0.4.18.exe" | Out-File -Encoding ascii "dist/BUILD_INFO.txt"
          "$hash" | Out-File -Encoding ascii -Append "dist/BUILD_INFO.txt"
          "firmware_sha256=fa46543cc39152f932cd7423242837f151db57e83895a88193d44f407c0fe6b4" | Out-File -Encoding ascii -Append "dist/BUILD_INFO.txt"
          "firmware_version=0.4.18-truthful-mobile-status" | Out-File -Encoding ascii -Append "dist/BUILD_INFO.txt"
          Write-Host "Updater SHA-256: $hash"
          Write-Host "Updater size: $size"

      - name: Upload updater artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL-MINI-Updater-0.4.18
          path: |
            dist/MEL_MINI_Updater_0.4.18.exe
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
