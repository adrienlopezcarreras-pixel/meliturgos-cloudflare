name: MEL-RES-05 encrypted backup CI

on:
  # Autonomous, read-only recovery drill on the default branch. The job
  # decrypts and restores into isolated temporary storage, never production.
  schedule:
    - cron: '23 3 * * *'
  pull_request:
    paths:
      - "src/backup/**"
      - "src/dev/d1-dev-job-repository.js"
      - "tests/maintenance/**"
      - "release-tools/predeploy-backup-refresh/**"
      - "tests/maintenance/system-restore-proof.test.mjs"
      - "tests/maintenance/r2-snapshot-discovery.test.mjs"
      - "src/resilience/**"
      - "tests/encrypted-backup-storage.test.mjs"
      - "tests/backup-system-runtime.test.mjs"
      - "tests/backup-verified-snapshot.test.mjs"
      - "tests/restore-service.test.mjs"
      - ".github/workflows/mel-res-05-encrypted-backup-ci.yml"
  workflow_dispatch:
    inputs:
      snapshot_key:
        description: 'Optional encrypted snapshot key. Empty = discover newest R2 snapshot; read-only restore on main only'
        required: false
        type: string

# Drop obsolete PR test runs when newer commits supersede them.
# Scheduled read-only drills, manual drills and main-branch runs are never
# cancelled, even when a pull request is updated at the same time.
concurrency:
  group: mel-res-05-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  encrypted-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Repository syntax
        run: npm run check
      - name: Encrypted backup and restore tests
        run: node --test tests/encrypted-backup-storage.test.mjs tests/backup-system-runtime.test.mjs tests/backup-verified-snapshot.test.mjs tests/restore-service.test.mjs tests/gen2/recovery-drill.test.mjs tests/maintenance/system-restore-proof.test.mjs tests/maintenance/r2-snapshot-discovery.test.mjs
      - name: Normalize branch for candidate-only integration tests
        run: git checkout -B candidate/mel-res-05-encrypted-backup-ci "$(git rev-parse HEAD)"
      - name: Full regression suite
        # Both scheduled and manually initiated isolated drills run bounded
        # targeted tests and the security gate. PR validation stays exhaustive.
        if: github.event_name == 'pull_request'
        run: npm test
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs

  isolated-snapshot-restore:
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
    needs: encrypted-backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: mel-isolated-snapshot-restore
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore latest or explicitly selected encrypted snapshot in isolated storage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MEL_BACKUP_ENCRYPTION_KEY_ID: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_ID }}
          MEL_BACKUP_ENCRYPTION_KEY_B64: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_B64 }}
          MEL_RESTORE_SNAPSHOT_KEY: ${{ inputs.snapshot_key }}
        run: node release-tools/predeploy-backup-refresh/isolated-restore-runner.mjs
      - name: Store content-free independent restore receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-restore-proof
          path: isolated-restore-proof.json
          if-no-files-found: error
          # Keep two weeks of daily immutable drill receipts for external audit.
          retention-days: 14
