name: gen2-53-canary-rollback-contract

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Validate historical canary/rollback guard
        run: node --test tests/gen2-53-release-guard.test.mjs

      - name: Production mutation policy
        run: |
          echo "This workflow is validation-only."
          echo "All production mutations go through deploy-cloudflare-release.yml."
