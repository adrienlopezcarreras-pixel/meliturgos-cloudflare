name: GEN2-42 authenticated runtime tick

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      chain_depth:
        description: "Bounded event-driven autonomy chain depth"
        required: false
        default: "0"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - src/dev/runtime-api.js
      - tests/integration/dev-runtime-api.test.mjs
      - .github/workflows/gen2-42-runtime-tick.yml
  push:
    branches:
      - ops/gen2-42-runtime-tick
    paths:
      - .ops/gen2-42-runtime-tick-trigger.txt

permissions:
  contents: read
  actions: write

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Dev Bridge and bootstrap runtime contracts
        run: node --test tests/integration/dev-runtime-api.test.mjs tests/release-launch-bootstrap.test.mjs

  tick:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Run bounded GEN2-42 action through durable Dev Bridge
        shell: bash
        env:
          MEL_DEV_BRIDGE_TOKEN: ${{ secrets.MEL_DEV_BRIDGE_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          test -n "${MEL_DEV_BRIDGE_TOKEN:-}"
          MODE="tick"
          if [ -f .ops/gen2-42-runtime-tick-trigger.txt ]; then
            REQUESTED_MODE="$(awk -F= '$1=="mode"{print $2}' .ops/gen2-42-runtime-tick-trigger.txt | tail -n1 | tr -d '\r' || true)"
            if [ -n "$REQUESTED_MODE" ]; then MODE="$REQUESTED_MODE"; fi
          fi
          case "$MODE" in
            tick) ;;
            owner-max) echo "owner-max remains on the owner-authorized release path"; exit 64 ;;
            *) echo "Unsupported GEN2-42 ops mode: $MODE"; exit 64 ;;
          esac
          echo "GEN2-42 bounded mode: $MODE"
          CODE="$(curl -sS --max-time 180 \
            -o tick-response.raw.json \
            -w '%{http_code}' \
            -X POST "$BASE_URL/api/dev-bridge/autonomy/tick" \
            -H "Authorization: Bearer $MEL_DEV_BRIDGE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' || true)"
          if [ "$CODE" != "200" ]; then
            if [ -s tick-response.raw.json ]; then cat tick-response.raw.json; fi
            exit 65
          fi
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('tick-response.raw.json','utf8'));if(x?.ok!==true||!x?.tick)process.exit(2)"
      - name: Build sanitized tick proof
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('tick-response.raw.json','utf8'));
          const tick=body?.tick||{};
          const completions=tick?.completions||tick?.passive_completions||{};
          const completed=Array.isArray(completions?.completed)?completions.completed:[];
          const rejected=Array.isArray(completions?.rejected)?completions.rejected:[];
          const prep=tick?.bridge_preparation||null;
          const job=tick?.job||null;
          const normalizedJob=job?{...job,job_id:job?.job_id||job?.id||null}:null;
          const bridgeReady=prep?.status==='READY' && Boolean(normalizedJob?.job_id);
          const safe={
            schema:'mel.gen2-42-authenticated-runtime-tick/v4',
            ok:body?.ok===true && tick?.ok!==false,
            status:'GEN2_42_RUNTIME_TICK_EXECUTED',
            phase:'dev-bridge-autonomy-tick',
            tick_status:tick?.status||null,
            advanced:tick?.advanced===true,
            paused:tick?.control?.paused===true,
            max_autonomy:tick?.control?.max_autonomy===true,
            launch_approved_sha:tick?.control?.launch_approved_sha||null,
            control_unchanged_by_bootstrap:true,
            owner_authorized_bootstrap:false,
            bridge_preparation_ready:bridgeReady,
            bridge_job:normalizedJob,
            bridge_executor:tick?.bridge_executor||null,
            completed,
            rejected,
          };
          fs.writeFileSync('gen2-42-runtime-tick-proof.json',JSON.stringify(safe,null,2));
          console.log(JSON.stringify(safe,null,2));
          NODE

      - name: Dispatch cloud bridge fallback when local executor is offline
        id: bridge_fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
        run: |
          set -euo pipefail
          READY="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).bridge_preparation_ready===true?'true':'false'")"
          ONLINE="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).bridge_executor?.online===true?'true':'false'")"
          JOB_ID="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).bridge_job?.job_id||''")"
          if [ "$READY" != "true" ] || [ "$ONLINE" = "true" ] || [ -z "$JOB_ID" ]; then
            echo "CLOUD_BRIDGE_FALLBACK_SKIPPED ready=$READY local_online=$ONLINE job_id=$JOB_ID"
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$JOB_ID" =~ ^[A-Za-z0-9_.:-]+$ ]]
          [[ "$CHAIN_DEPTH" =~ ^[0-9]+$ ]]
          if [ "$CHAIN_DEPTH" -ge 20 ]; then
            echo "CLOUD_BRIDGE_CHAIN_LIMIT_REACHED depth=$CHAIN_DEPTH"
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          JOB_ID="$JOB_ID" CHAIN_DEPTH="$CHAIN_DEPTH" node -e "process.stdout.write(JSON.stringify({ref:'main',inputs:{job_id:process.env.JOB_ID,chain_depth:process.env.CHAIN_DEPTH}}))" > cloud-bridge-dispatch.json
          CODE="$(curl --silent --show-error --max-time 30             --request POST             --header "Authorization: Bearer $GH_TOKEN"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --header "Content-Type: application/json"             --data-binary @cloud-bridge-dispatch.json             --output cloud-bridge-dispatch-response.txt             --write-out '%{http_code}'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/gen2-42-apply-ready-bridge.yml/dispatches")"
          test "$CODE" = "204"
          echo "CLOUD_BRIDGE_FALLBACK_DISPATCHED job_id=$JOB_ID depth=$CHAIN_DEPTH"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      - name: Continue event-driven autonomy while work is advancing
        if: steps.bridge_fallback.outputs.dispatched != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
        run: |
          set -euo pipefail
          ADVANCED="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).advanced===true?'true':'false'")"
          PAUSED="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).paused===true?'true':'false'")"
          READY="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).bridge_preparation_ready===true?'true':'false'")"
          [[ "$CHAIN_DEPTH" =~ ^[0-9]+$ ]]
          if [ "$ADVANCED" != "true" ] || [ "$PAUSED" = "true" ] || [ "$READY" = "true" ]; then
            echo "AUTONOMY_CHAIN_IDLE advanced=$ADVANCED paused=$PAUSED bridge_ready=$READY depth=$CHAIN_DEPTH"
            exit 0
          fi
          if [ "$CHAIN_DEPTH" -ge 20 ]; then
            echo "AUTONOMY_CHAIN_LIMIT_REACHED depth=$CHAIN_DEPTH"
            exit 0
          fi
          NEXT_DEPTH="$((CHAIN_DEPTH + 1))"
          NEXT_DEPTH="$NEXT_DEPTH" node -e "process.stdout.write(JSON.stringify({ref:'main',inputs:{chain_depth:process.env.NEXT_DEPTH}}))" > autonomy-next-dispatch.json
          CODE="$(curl --silent --show-error --max-time 30             --request POST             --header "Authorization: Bearer $GH_TOKEN"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --header "Content-Type: application/json"             --data-binary @autonomy-next-dispatch.json             --output autonomy-next-dispatch-response.txt             --write-out '%{http_code}'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/gen2-42-runtime-tick.yml/dispatches")"
          test "$CODE" = "204"
          echo "AUTONOMY_CHAIN_CONTINUED depth=$NEXT_DEPTH"

      - name: Upload sanitized tick proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen2-42-runtime-tick-proof-${{ github.run_id }}
          path: gen2-42-runtime-tick-proof.json
          if-no-files-found: error
          retention-days: 7
