name: GEN2-42 authenticated runtime tick

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      chain_depth:
        description: "Bounded event-driven autonomy chain depth"
        required: false
        default: "0"
        type: string
  pull_request:
    branches:
      - main
    paths:
      - src/dev/runtime-api.js
      - tests/integration/dev-runtime-api.test.mjs
      - .github/workflows/gen2-42-runtime-tick.yml
  push:
    branches:
      - ops/gen2-42-runtime-tick
    paths:
      - .ops/gen2-42-runtime-tick-trigger.txt
      - src/security/github-actions-oidc.js
      - tests/gen2/github-actions-oidc.test.mjs
      - tests/gen2/runtime-tick-lease-retry-contract.test.mjs

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Dev Bridge and bootstrap runtime contracts
        run: node --test tests/gen2/github-actions-oidc.test.mjs tests/integration/dev-runtime-api.test.mjs tests/release-launch-bootstrap.test.mjs tests/gen2/runtime-tick-lease-retry-contract.test.mjs

  tick:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Run bounded GEN2-42 action with GitHub Actions OIDC
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          MODE="tick"
          if [ -f .ops/gen2-42-runtime-tick-trigger.txt ]; then
            REQUESTED_MODE="$(awk -F= '$1=="mode"{print $2}' .ops/gen2-42-runtime-tick-trigger.txt | tail -n1 | tr -d '\r' || true)"
            if [ -n "$REQUESTED_MODE" ]; then MODE="$REQUESTED_MODE"; fi
          fi
          case "$MODE" in
            tick) PHASE="gen2-42-runtime-tick" ;;
            owner-max) echo "owner-max remains on the owner-authorized release path"; exit 64 ;;
            *) echo "Unsupported GEN2-42 ops mode: $MODE"; exit 64 ;;
          esac
          echo "GEN2-42 bounded mode: $MODE"

          RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=meliturgos-worker")"
          OIDC_TOKEN="$(printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})')"
          echo "::add-mask::${OIDC_TOKEN}"

          printf '{"phase":"%s"}' "$PHASE" > tick-request.json
          ATTEMPT=1
          while true; do
            CODE="$(curl -sS --max-time 180 \
              -o tick-response.raw.json \
              -w '%{http_code}' \
              -X POST "$BASE_URL/api/internal/release-launch-bootstrap" \
              -H "x-mel-github-oidc: $OIDC_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @tick-request.json || true)"
            if [ "$CODE" != "200" ]; then break; fi
            TICK_STATUS="$(node -p "JSON.parse(require('fs').readFileSync('tick-response.raw.json','utf8')).tick_status||''")"
            if [ "$TICK_STATUS" != "SKIPPED_LEASE_BUSY" ]; then break; fi
            if [ "$ATTEMPT" -ge 3 ]; then
              echo "AUTONOMY_LEASE_BUSY_AFTER_RETRIES attempts=$ATTEMPT"
              cat tick-response.raw.json
              exit 66
            fi
            echo "AUTONOMY_LEASE_BUSY_RETRY attempt=$ATTEMPT"
            ATTEMPT="$((ATTEMPT + 1))"
            sleep 20
          done
          if [ "$CODE" != "200" ]; then
            if [ -s tick-response.raw.json ]; then cat tick-response.raw.json; fi
            exit 65
          fi
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('tick-response.raw.json','utf8'));if(x?.ok!==true)process.exit(2)"
      - name: Build sanitized tick proof
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('tick-response.raw.json','utf8'));
          const safe={
            schema:'mel.gen2-42-authenticated-runtime-tick/v6',
            ok:body?.ok===true,
            status:body?.status||null,
            phase:body?.phase||null,
            tick_status:body?.tick_status||null,
            advanced:body?.advanced===true,
            progress:body?.progress||null,
            watchdog:body?.watchdog||null,
            paused:body?.paused===true,
            max_autonomy:body?.max_autonomy===true,
            launch_approved_sha:body?.launch_approved_sha||null,
            control_unchanged_by_bootstrap:body?.control_unchanged_by_bootstrap===true,
            owner_authorized_bootstrap:body?.owner_authorized_bootstrap===true,
            bridge_preparation_ready:body?.bridge_preparation_ready===true,
            bridge_job:body?.bridge_job||null,
            bridge_executor:body?.bridge_executor||null,
            completed:Array.isArray(body?.completed)?body.completed:[],
            rejected:Array.isArray(body?.rejected)?body.rejected:[],
          };
          fs.writeFileSync('gen2-42-runtime-tick-proof.json',JSON.stringify(safe,null,2));
          console.log(JSON.stringify(safe,null,2));
          NODE

      - name: Dispatch cloud bridge fallback when local executor is offline
        id: bridge_fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
        run: |
          set -euo pipefail
          READY="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).bridge_preparation_ready===true?'true':'false'")"
          ONLINE="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).bridge_executor?.online===true?'true':'false'")"
          JOB_ID="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).bridge_job?.job_id||''")"
          if [ "$READY" != "true" ] || [ "$ONLINE" = "true" ] || [ -z "$JOB_ID" ]; then
            echo "CLOUD_BRIDGE_FALLBACK_SKIPPED ready=$READY local_online=$ONLINE job_id=$JOB_ID"
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$JOB_ID" =~ ^[A-Za-z0-9_.:-]+$ ]]
          [[ "$CHAIN_DEPTH" =~ ^[0-9]+$ ]]
          if [ "$CHAIN_DEPTH" -ge 20 ]; then
            echo "CLOUD_BRIDGE_CHAIN_LIMIT_REACHED depth=$CHAIN_DEPTH"
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          JOB_ID="$JOB_ID" CHAIN_DEPTH="$CHAIN_DEPTH" node -e "process.stdout.write(JSON.stringify({ref:'main',inputs:{job_id:process.env.JOB_ID,chain_depth:process.env.CHAIN_DEPTH}}))" > cloud-bridge-dispatch.json
          CODE="$(curl --silent --show-error --max-time 30             --request POST             --header "Authorization: Bearer $GH_TOKEN"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --header "Content-Type: application/json"             --data-binary @cloud-bridge-dispatch.json             --output cloud-bridge-dispatch-response.txt             --write-out '%{http_code}'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/gen2-42-apply-ready-bridge.yml/dispatches")"
          test "$CODE" = "204"
          echo "CLOUD_BRIDGE_FALLBACK_DISPATCHED job_id=$JOB_ID depth=$CHAIN_DEPTH"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      - name: Continue event-driven autonomy while work is advancing
        if: steps.bridge_fallback.outputs.dispatched != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
        run: |
          set -euo pipefail
          ADVANCED="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).advanced===true?'true':'false'")"
          PAUSED="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).paused===true?'true':'false'")"
          MAX="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).max_autonomy===true?'true':'false'")"
          READY="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).bridge_preparation_ready===true?'true':'false'")"
          WORK_REMAINING="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).progress?.work_remaining===true?'true':'false'")"
          WAITING_EXTERNAL="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).progress?.waiting_external===true?'true':'false'")"
          ONLINE="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).bridge_executor?.online===true?'true':'false'")"
          TRIPPED="$(node -p "JSON.parse(require('fs').readFileSync('gen2-42-runtime-tick-proof.json','utf8')).watchdog?.tripped===true?'true':'false'")"
          [[ "$CHAIN_DEPTH" =~ ^[0-9]+$ ]]
          if [ "$TRIPPED" = "true" ]; then
            echo "MAX_PROGRESS_WATCHDOG_TRIPPED"
            exit 67
          fi
          if [ "$PAUSED" = "true" ] || [ "$READY" = "true" ] || [ "$WORK_REMAINING" != "true" ]; then
            echo "AUTONOMY_CHAIN_IDLE advanced=$ADVANCED paused=$PAUSED bridge_ready=$READY work_remaining=$WORK_REMAINING depth=$CHAIN_DEPTH"
            exit 0
          fi
          if [ "$MAX" = "true" ] && [ "$WAITING_EXTERNAL" = "true" ]; then
            if [ "$ONLINE" = "true" ]; then
              echo "AUTONOMY_CHAIN_EXTERNAL_PROGRESS local_executor_online=true"
              exit 0
            fi
            echo "MAX_BLOCKED_WAITING_EXTERNAL_WITHOUT_EXECUTOR"
            exit 68
          fi
          if [ "$CHAIN_DEPTH" -ge 20 ]; then
            echo "AUTONOMY_CHAIN_LIMIT_REACHED_WITH_WORK_REMAINING depth=$CHAIN_DEPTH"
            exit 69
          fi
          NEXT_DEPTH="$((CHAIN_DEPTH + 1))"
          NEXT_DEPTH="$NEXT_DEPTH" node -e "process.stdout.write(JSON.stringify({ref:'main',inputs:{chain_depth:process.env.NEXT_DEPTH}}))" > autonomy-next-dispatch.json
          CODE="$(curl --silent --show-error --max-time 30             --request POST             --header "Authorization: Bearer $GH_TOKEN"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --header "Content-Type: application/json"             --data-binary @autonomy-next-dispatch.json             --output autonomy-next-dispatch-response.txt             --write-out '%{http_code}'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/gen2-42-runtime-tick.yml/dispatches")"
          test "$CODE" = "204"
          echo "AUTONOMY_CHAIN_CONTINUED depth=$NEXT_DEPTH"

      - name: Upload sanitized tick proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen2-42-runtime-tick-proof-${{ github.run_id }}
          path: gen2-42-runtime-tick-proof.json
          if-no-files-found: error
          retention-days: 7
