name: GEN2-42 authenticated runtime tick

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - src/dev/runtime-api.js
      - tests/integration/dev-runtime-api.test.mjs
      - .github/workflows/gen2-42-runtime-tick.yml
  push:
    branches:
      - ops/gen2-42-runtime-tick
    paths:
      - .ops/gen2-42-runtime-tick-trigger.txt

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Dev Bridge runtime contract
        run: node --test tests/integration/dev-runtime-api.test.mjs

  tick:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Create ephemeral bootstrap token and run canonical tick
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          BOOTSTRAP_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${BOOTSTRAP_TOKEN}"
          cleanup_secret() {
            set +e
            printf 'y\n' | npx wrangler secret delete MEL_LAUNCH_BOOTSTRAP_TOKEN --env="" >/tmp/gen2-42-bootstrap-delete.log 2>&1
            set -e
          }
          trap cleanup_secret EXIT
          printf '%s' "$BOOTSTRAP_TOKEN" | npx wrangler secret put MEL_LAUNCH_BOOTSTRAP_TOKEN --env=""

          READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE="$(curl -sS --max-time 90 \
              -o tick-response.raw.json \
              -w '%{http_code}' \
              -X POST "$BASE_URL/api/internal/release-launch-bootstrap" \
              -H "x-mel-launch-bootstrap: $BOOTSTRAP_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"phase":"gen2-42-runtime-tick"}' || true)"
            if [ "$CODE" = "200" ]; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" = "1"

      - name: Build sanitized tick proof
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('tick-response.raw.json','utf8'));
          const safe={
            schema:'mel.gen2-42-authenticated-runtime-tick/v2',
            ok:body?.ok===true,
            status:body?.status||null,
            tick_status:body?.tick_status||null,
            advanced:body?.advanced===true,
            paused:body?.paused===true,
            max_autonomy:body?.max_autonomy===true,
            control_unchanged_by_bootstrap:body?.control_unchanged_by_bootstrap===true,
            completed:Array.isArray(body?.completed)?body.completed:[],
            rejected:Array.isArray(body?.rejected)?body.rejected:[],
          };
          fs.writeFileSync('gen2-42-runtime-tick-proof.json',JSON.stringify(safe,null,2));
          console.log(JSON.stringify(safe,null,2));
          NODE

      - name: Upload sanitized tick proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen2-42-runtime-tick-proof-${{ github.run_id }}
          path: gen2-42-runtime-tick-proof.json
          if-no-files-found: error
          retention-days: 7
