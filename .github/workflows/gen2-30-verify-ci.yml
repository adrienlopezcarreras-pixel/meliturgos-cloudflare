name: gen2-30 verify CI

on:
  push:
    branches:
      - 'roadmap/gen2-30-verify-20260922'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/gen2/computer-use.test.mjs tests/roadmap-runtime-truth.test.mjs
      - run: |
          git checkout -B candidate/release-ci-head "$GITHUB_SHA"
          npm test
