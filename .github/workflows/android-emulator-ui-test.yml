name: android-emulator-ui-test

on:
  pull_request:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - "android-companion/**"
      - ".github/workflows/android-emulator-ui-test.yml"
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - "android-companion/**"
      - ".github/workflows/android-emulator-ui-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools"

      - name: Install emulator image
        shell: bash
        run: |
          set -euo pipefail
          AVD_HOME="$RUNNER_TEMP/mel-avd"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          export ANDROID_AVD_HOME="$AVD_HOME"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

          echo "no" | avdmanager create avd \
            --force \
            --name mel-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_6"

          echo "AVD home: $ANDROID_AVD_HOME"
          ls -la "$ANDROID_AVD_HOME"
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | tee "$RUNNER_TEMP/mel-avd-list.txt"
          grep -Fxq "mel-ci" "$RUNNER_TEMP/mel-avd-list.txt"

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Start Android emulator
        shell: bash
        run: |
          set -euo pipefail
          adb kill-server || true
          adb start-server

          nohup "$ANDROID_SDK_ROOT/emulator/emulator" @mel-ci             -no-window             -noaudio             -no-boot-anim             -no-snapshot             -no-snapshot-save             -wipe-data             -gpu swiftshader_indirect             -accel auto             -no-metrics             > "$RUNNER_TEMP/mel-emulator.log" 2>&1 &
          EMULATOR_PID=$!

          registered=0
          for i in {1..60}; do
            if adb devices | awk 'NR>1 && $1 ~ /^emulator-/ && $2 == "device" { found=1 } END { exit found ? 0 : 1 }'; then
              registered=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before registering with adb" >&2
              cat "$RUNNER_TEMP/mel-emulator.log" >&2 || true
              exit 1
            fi
            sleep 2
          done

          if [[ "$registered" != "1" ]]; then
            echo "Android emulator did not register with adb within the bounded startup window" >&2
            cat "$RUNNER_TEMP/mel-emulator.log" >&2 || true
            exit 1
          fi

          booted=0
          for i in {1..90}; do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=1
              break
            fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Android emulator exited before boot completed" >&2
              cat "$RUNNER_TEMP/mel-emulator.log" >&2 || true
              exit 1
            fi
            sleep 2
          done

          if [[ "$booted" != "1" ]]; then
            echo "Android emulator did not complete boot within the bounded startup window" >&2
            cat "$RUNNER_TEMP/mel-emulator.log" >&2 || true
            exit 1
          fi

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82 || true

      - name: Run instrumented Compose UI tests
        working-directory: android-companion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Capture real MEL UI screenshots
        shell: bash
        working-directory: android-companion
        run: |
          set -euo pipefail
          mkdir -p dist/emulator

          gradle --no-daemon :app:installDebug

          adb shell am force-stop fr.veriteinterdite.mel
          adb shell am start -W -n fr.veriteinterdite.mel/.MainActivity
          sleep 1
          adb shell dumpsys activity activities | grep -q "fr.veriteinterdite.mel/.MainActivity"
          adb exec-out screencap -p > dist/emulator/login-screen.png
          test -s dist/emulator/login-screen.png

          adb shell am start -W             -n fr.veriteinterdite.mel/.MelUiHarnessActivity             --es mode complete             --ez diagnostics true
          sleep 1
          adb shell dumpsys activity activities | grep -q "fr.veriteinterdite.mel/.MelUiHarnessActivity"
          adb exec-out screencap -p > dist/emulator/complete-screen.png
          test -s dist/emulator/complete-screen.png

          cp "$RUNNER_TEMP/mel-emulator.log" dist/emulator/emulator.log || true

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL-Android-emulator-${{ github.sha }}
          path: |
            android-companion/app/build/reports/androidTests/connected/**
            android-companion/app/build/outputs/androidTest-results/connected/**
            android-companion/dist/emulator/**
          if-no-files-found: warn
          retention-days: 14
