name: deploy-candidate-preview

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meliturgos-cloudflare-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Verify canonical candidate branch
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "candidate/mel-clean-autonomy"
          echo "Preparing isolated preview for ${GITHUB_SHA} from ${GITHUB_REF_NAME}"

      - name: Syntax gate
        run: npm run check

      - name: Test gate
        run: npm test

      - name: Deploy isolated preview Worker
        run: >
          npx wrangler deploy --env preview
          --define "MEL_DEPLOYED_GIT_SHA:'${GITHUB_SHA}'"
          --define "MEL_DEPLOYED_GIT_BRANCH:'${GITHUB_REF_NAME}'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Initialize isolated preview D1
        run: npx wrangler d1 migrations apply DB --env preview --remote --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
