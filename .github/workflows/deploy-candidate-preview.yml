          node - <<'NODE'
          const fs=require('fs');
          const state=JSON.parse(fs.readFileSync('preview-autonomy-initial.json','utf8'));
          const control=state?.control||state;
          if(control?.paused!==true) throw new Error('PREVIEW_AUTONOMY_NOT_PAUSED_BEFORE_PROOF');
