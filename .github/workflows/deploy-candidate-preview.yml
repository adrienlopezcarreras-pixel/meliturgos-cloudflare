            failure_code:d?.failure_hygiene?.code||null,
            historical_failed_count:Number(d?.failure_hygiene?.historical_failed_count||0),
            unbounded_failed_count:Number(d?.failure_hygiene?.unbounded_failed_count||0),
            restore_status:d?.restore?.status||null,
