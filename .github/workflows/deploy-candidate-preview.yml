            shardvault_status:d?.shardvault?.status||null,
            candidate_branch:d?.candidate_branch||null,
            candidate_sha:d?.candidate_sha||null
          },null,2));
          NODE

          HTTP_CODE=$(curl --show-error --silent --max-time 45 \
            --header "$AUTH" \
            --header "content-type: application/json" \
            --data '{}' \
            --output preview-autonomy-resume.json \
            --write-out '%{http_code}' \
            "$BASE_URL/api/gen2/autonomy/resume")

          export HTTP_CODE
          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('preview-autonomy-resume.json','utf8'));
          const status=Number(process.env.HTTP_CODE||0);
          if(status!==200){
            console.error(JSON.stringify({
              code:payload?.code||payload?.status||'PREVIEW_AUTONOMY_RESUME_HTTP_'+status,
              blockers:payload?.readiness?.blockers||[],
              gates:payload?.readiness?.gates||{},
              failure_code:payload?.readiness?.failure_hygiene?.code||null,
              restore_status:payload?.readiness?.restore?.status||null,
              restore_code:payload?.readiness?.restore?.code||payload?.readiness?.restore?.restore?.code||null,
              shardvault_status:payload?.readiness?.shardvault?.status||null
            },null,2));
            process.exit(22);
          }
          const control=payload?.control||payload?.state?.control||payload?.state||payload;
          if(control?.paused===true) throw new Error('PREVIEW_AUTONOMY_RESUME_FAILED');
          NODE

      - name: Run isolated GEN2-42 sourced watch proof
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          curl --fail-with-body --show-error --silent \
            --max-time 240 \
            --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
            --header "content-type: application/json" \
            --data '{"force":true}' \
            "${BASE_URL}/api/mel/capability-watch/run" \
            --output capability-watch-run.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('capability-watch-run.json').read_text(encoding='utf-8'))
          if payload.get('ok') is not True:
              raise SystemExit('WATCH_RUN_FAILED: ' + str(payload.get('error') or payload.get('detail')))
          result = payload.get('result') or {}
          discoveries = result.get('discoveries') or {}
          ledger = discoveries.get('ledger') or {}
          items = ledger.get('items') if isinstance(ledger.get('items'), list) else []
          sourced = [
              item for item in items
              if item.get('evidence_status') == 'SOURCED_OBSERVATION'
              and isinstance(item.get('sources'), list)
              and len(item.get('sources')) > 0
          ]
          handoff = discoveries.get('handoff') or {}
          teacher_states = {'WAITING_TEACHER', 'TEACHER_APPROVED', 'READY_FOR_REVIEW', 'COMPLETED'}
          active_teacher_handoffs = []
          for item in items:
              candidate_handoff = item.get('handoff') if isinstance(item.get('handoff'), dict) else {}
              if (
                  candidate_handoff.get('job_id')
                  and candidate_handoff.get('teacher_request_id')
                  and candidate_handoff.get('closed') is not True
                  and str(candidate_handoff.get('status') or '').upper() in teacher_states
              ):
                  active_teacher_handoffs.append({
                      'fingerprint': item.get('fingerprint'),
                      **candidate_handoff,
                  })

          proof_handoff = handoff if (
              handoff.get('job_id')
              and handoff.get('teacher_request_id')
              and str(handoff.get('status') or '').upper() in teacher_states
          ) else (active_teacher_handoffs[0] if active_teacher_handoffs else {})

          if result.get('status') != 'RAN':
              raise SystemExit('WATCH_NOT_RAN: ' + str(result.get('status')))
          if not sourced:
              raise SystemExit('WATCH_NO_SOURCED_DISCOVERY')
          # A forced watch may legitimately encounter only an existing QUEUED
          # discovery whose previous Teacher request must be rebased to the
          # current candidate SHA. The next workflow step runs the canonical
          # autonomy tick and is the authoritative Teacher-handoff proof.
          # Do not fail here before that rebase step has had a chance to run.

          print(json.dumps({
              'watch_status': result.get('status'),
              'watch_reason': result.get('reason'),
              'sourced_discoveries': len(sourced),
              'current_handoff_status': handoff.get('status'),
              'active_teacher_handoffs': len(active_teacher_handoffs),
              'proof_fingerprint': proof_handoff.get('fingerprint'),
              'handoff_status': proof_handoff.get('status'),
              'handoff_job_id': proof_handoff.get('job_id'),
              'teacher_request_id': proof_handoff.get('teacher_request_id'),
          }, indent=2))

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as h:
                  h.write('### GEN2-42 isolated sourced watch proof\n\n')
                  h.write(f'- Watch: {result.get("status")} / {result.get("reason")}\n')
                  h.write(f'- Sourced discoveries: {len(sourced)}\n')
                  h.write(f'- Current run handoff: {handoff.get("status")}\n')
                  h.write(f'- Active Teacher handoffs: {len(active_teacher_handoffs)}\n')
                  h.write(f'- Proof discovery: {proof_handoff.get("fingerprint")}\n')
                  h.write(f'- Handoff: {proof_handoff.get("status")}\n')
                  h.write(f'- Job: {proof_handoff.get("job_id")}\n')
                  h.write(f'- Teacher request: {proof_handoff.get("teacher_request_id")}\n')
          PY

      - name: Upload GEN2-42 preview proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gen2-42-preview-proof-${{ github.sha }}
          path: capability-watch-run.json
          if-no-files-found: warn
          retention-days: 7

      - name: Initialize isolated ShardVault snapshot before external promotions
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          HTTP_CODE="$(curl --show-error --silent --max-time 180 \
            --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
            --header "content-type: application/json" \
            --data '{"preview_bootstrap":true}' \
            --output shardvault-bootstrap.json \
            --write-out '%{http_code}' \
            "${BASE_URL}/api/gen2/shardvault/snapshot")"
          python - "$HTTP_CODE" <<'PY'
          import json, sys
          from pathlib import Path
          try:
              d=json.loads(Path('shardvault-bootstrap.json').read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit('SHARDVAULT_BOOTSTRAP_RESPONSE_INVALID')
          summary={'ok':d.get('ok') is True,'status':str(d.get('status') or 'UNSPECIFIED')[:80],
                   'shards':d.get('shards'),'seed_only':d.get('seed_only') is True,
                   'verified_roundtrip':d.get('verified_roundtrip') is True,
                   'storage_mode':d.get('storage_mode')}
          print('SHARDVAULT_BOOTSTRAP:',json.dumps(summary))
          if (sys.argv[1]!='200' or d.get('ok') is not True or not d.get('snapshot_id')
              or d.get('status') not in ('PREVIEW_SEED_VERIFIED','SIGNED_SNAPSHOT_EXISTS')
              or int(d.get('shards') or 0)!=7):
              raise SystemExit('SHARDVAULT_BOOTSTRAP_REQUIRED')
          PY
          rm -f shardvault-bootstrap.json

      - name: Live ShardVault external target probe
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          ready=0
          # One real, verified shard promotion per request; seven active targets
          # need at least seven requests. Allow bounded retries for transient hosts.
          for attempt in {1..10}; do
            rm -f shardvault-active-health-proof.json
            HTTP_CODE="$(curl --show-error --silent --max-time 180 \
              --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
              --header "content-type: application/json" \
              --data '{}' \
              --output shardvault-live-probe.json \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/gen2/shardvault/search" || true)"
            echo "ShardVault discovery attempt ${attempt}: HTTP ${HTTP_CODE}"
            # Preserve the first seven genuinely qualified endpoints as one
            # bounded proof. Subsequent calls promote them one shard at a time,
            # so the latest response alone need not qualify seven NEW targets.
            if [ "${HTTP_CODE}" = "200" ]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              d=json.loads(Path('shardvault-live-probe.json').read_text(encoding='utf-8'))
              expected=int(os.environ.get('MEL_CRITICAL_CODE_SHARD_BYTES') or 0)
              valid=(d.get('ok') is True
                  and int(d.get('required_bytes') or 0)>=expected
                  and int(d.get('probed') or 0)>=6
                  and int(d.get('representative_validated_count') or 0)>=7
                  and len(d.get('representative_validated_endpoint_ids') or [])>=7
                  and d.get('representative_archive_source')=='CRITICAL_BUNDLE'
                  and d.get('representative_critical_status')=='COPIED')
              if valid:
                  keys=('discovered','probed','representative_probed','representative_qualified',
                        'representative_validated_count','representative_validated_endpoint_ids',
                        'required_bytes','representative_archive_bytes')
                  Path('shardvault-qualification-proof.json').write_text(
                      json.dumps({k:d.get(k) for k in keys}),encoding='utf-8')
                  print('SHARDVAULT_SEVEN_QUALIFIED_PROOF_SAVED')
          except Exception:
              print('SHARDVAULT_QUALIFICATION_NOT_PROVEN')
          PY
            fi
            # Seven active registry entries are not a proof by themselves.
            # Re-read every actual shard and verify its MAC through the
            # existing authenticated ShardVault status endpoint. The endpoint may
            # reconcile its isolated registry but does not rewrite the shard data.
            if [ "${HTTP_CODE}" = "200" ] && python - <<'PY'
          import json
          from pathlib import Path
          try:
              d=json.loads(Path('shardvault-live-probe.json').read_text(encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if d.get('ok') is True
              and d.get('target_reached') is True
              and int(d.get('active_external_count') or 0)>=7 else 1)
          PY
            then
              HEALTH_HTTP="$(curl --show-error --silent --max-time 180 \
                --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
                --output shardvault-status-readback.json \
                --write-out '%{http_code}' \
                "${BASE_URL}/api/gen2/shardvault/status" || true)"
              echo "ShardVault authenticated readback attempt ${attempt}: HTTP ${HEALTH_HTTP}"
              if [ "${HEALTH_HTTP}" = "200" ]; then
                python - <<'PY'
          import json
          from pathlib import Path
          try:
              d=json.loads(Path('shardvault-status-readback.json').read_text(encoding='utf-8'))
              h=d.get('health') or {}
              latest=d.get('latest') or {}
              used=latest.get('used_endpoints') or {}
              registry=d.get('active_external_registry') or []
              ids=[e.get('id') for e in registry if isinstance(e,dict)]
              valid=(d.get('ok') is True and d.get('status')=='ONLINE'
                  and d.get('scheme',{}).get('data_shards')==4
                  and d.get('scheme',{}).get('total_shards')==7
                  and h.get('healthy_shards')==7
                  and h.get('total_shards')==7
                  and h.get('data_shards')==4
                  and h.get('recoverable') is True
                  and not h.get('missing') and not h.get('errors')
                  and len(ids)==7 and len(set(ids))==7
                  and len(used)==7 and set(used)==set(ids)
                  and all(int(count)==1 for count in used.values())
                  and bool(latest.get('snapshot_id')))
              if valid:
                  proof={'ok':True,'status':'SEVEN_REAL_SHARDS_MAC_VERIFIED',
                      'active_external_count':7,'healthy_shards':7,
                      'total_shards':7,'data_shards':4,
                      'snapshot_id':latest['snapshot_id']}
                  Path('shardvault-active-health-proof.json').write_text(
                      json.dumps(proof),encoding='utf-8')
                  print('SHARDVAULT_SEVEN_REAL_SHARDS_MAC_VERIFIED')
              else:
                  print('SHARDVAULT_READBACK_NOT_PROVEN:',json.dumps({
                      'healthy_shards':h.get('healthy_shards'),
                      'total_shards':h.get('total_shards'),
                      'active_external_count':len(ids),
                      'distinct_used_endpoints':len(used),
                      'missing_count':len(h.get('missing') or []),
                      'error_count':len(h.get('errors') or [])}))
          except Exception:
              print('SHARDVAULT_READBACK_RESPONSE_INVALID')
          PY
              fi
              rm -f shardvault-status-readback.json
            fi
            if [ "${HTTP_CODE}" = "200" ] && python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              d=json.loads(Path('shardvault-live-probe.json').read_text(encoding='utf-8'))
              proof=Path('shardvault-qualification-proof.json')
          except Exception:
              raise SystemExit(1)
          expected=int(os.environ.get('MEL_CRITICAL_CODE_SHARD_BYTES') or 0)
          raise SystemExit(0 if (
              (proof.is_file() or Path('shardvault-active-health-proof.json').is_file())
              and d.get('ok') is True
              and int(d.get('required_bytes') or 0) >= expected
              and int(d.get('active_external_count') or 0) >= 7
              and len(d.get('active_endpoint_ids') or []) >= 7
              and d.get('target_reached') is True
              and (d.get('code_sync') or {}).get('status') == 'DEFERRED_SEPARATE_OPERATION'
          ) else 1)
          PY
            then
              ready=1
              break
            fi
            echo "ShardVault target not yet proven; next bounded discovery generation."
            python - <<'PY'
          import json
          from pathlib import Path
          try:
              d=json.loads(Path('shardvault-live-probe.json').read_text(encoding='utf-8'))
              keys=('ok','required_bytes','discovered','probed','representative_probed',
                    'representative_qualified','representative_validated_count','active_external_count','cached_validated_staged','target_count','target_reached')
              print('SHARDVAULT_SAFE_COUNTS:', json.dumps({k:d.get(k) for k in keys}))
              activation=d.get('activation_cycle') or {}
              if isinstance(activation,dict):
                  print('SHARDVAULT_ACTIVATION:', json.dumps({
                      'ok':activation.get('ok') is True,
                      'status':str(activation.get('status') or 'UNSPECIFIED')[:80]
                  }))
          except Exception:
              print('SHARDVAULT_DIAGNOSTIC_RESPONSE_INVALID')
          PY
            sleep 2
          done
          test "${ready}" -eq 1

          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('shardvault-live-probe.json').read_text(encoding='utf-8'))
          qualification_path=Path('shardvault-qualification-proof.json')
          qualification=json.loads(qualification_path.read_text(encoding='utf-8')) if qualification_path.is_file() else {}
          health_path=Path('shardvault-active-health-proof.json')
          verified_health=json.loads(health_path.read_text(encoding='utf-8')) if health_path.is_file() else {}
          health_proven=(verified_health.get('ok') is True
              and verified_health.get('status')=='SEVEN_REAL_SHARDS_MAC_VERIFIED'
              and verified_health.get('active_external_count')==7
              and verified_health.get('healthy_shards')==7)
          discovered=int(qualification.get('discovered') or data.get('discovered') or 0)
          probed=int(qualification.get('probed') or data.get('probed') or 0)
          active=int(data.get('active_external_count') or 0)
          required_bytes=int(data.get('required_bytes') or 0)
          expected_required_bytes=int(os.environ.get('MEL_CRITICAL_CODE_SHARD_BYTES') or 0)
          archive_source=str(data.get('representative_archive_source') or '')
          archive_bytes=int(data.get('representative_archive_bytes') or 0)
          critical_status=str(data.get('representative_critical_status') or '')
          representative_probed=int(qualification.get('representative_probed') or 0)
          representative_qualified=int(qualification.get('representative_qualified') or 0)
          representative_validated=int(qualification.get('representative_validated_count') or 0)
          representative_ids=list(qualification.get('representative_validated_endpoint_ids') or [])
          selected=len(data.get('selected') or [])
          if data.get('ok') is not True:
              raise SystemExit('SHARDVAULT_SEARCH_FAILED: '+str(data.get('error') or data.get('status')))
          if discovered < 7 and not health_proven:
              raise SystemExit(f'SHARDVAULT_DISCOVERY_TOO_SMALL: {discovered}')
          if required_bytes < expected_required_bytes:
              raise SystemExit(f'SHARDVAULT_REPRESENTATIVE_SIZE_UNDERSIZED: required={required_bytes} expected={expected_required_bytes}')
          if archive_source != 'CRITICAL_BUNDLE' or critical_status != 'COPIED':
              raise SystemExit(f'SHARDVAULT_CRITICAL_SOURCE_NOT_BOUND: source={archive_source} critical_status={critical_status} bytes={archive_bytes}')
          if archive_bytes != int(os.environ.get('MEL_CRITICAL_CODE_BUNDLE_BYTES') or 0):
              raise SystemExit(f'SHARDVAULT_CRITICAL_SOURCE_SIZE_MISMATCH: archive={archive_bytes}')
          if not health_proven:
              if probed < 6:
                  raise SystemExit(f'SHARDVAULT_FRESH_LIVE_PROBES_LT_6: discovered={discovered} probed={probed}')
              if representative_validated < 7:
                  raise SystemExit(f'SHARDVAULT_REPRESENTATIVE_VALIDATED_LT_7: representative_validated={representative_validated} active_historical={active}')
              if len(representative_ids) < 7:
                  raise SystemExit(f'SHARDVAULT_REPRESENTATIVE_IDS_LT_7: ids={representative_ids}')
          else:
              if not verified_health.get('snapshot_id'):
                  raise SystemExit('SHARDVAULT_READBACK_SNAPSHOT_MISSING')
          if int(data.get('active_external_count') or 0)<7 or len(data.get('active_endpoint_ids') or [])<7:
              raise SystemExit('SHARDVAULT_ACTIVE_REGISTRY_LT_7')
          if data.get('target_reached') is not True:
              raise SystemExit('SHARDVAULT_TARGET_NOT_REACHED')
          if (data.get('code_sync') or {}).get('status') != 'DEFERRED_SEPARATE_OPERATION':
              raise SystemExit('SHARDVAULT_DISCOVERY_MUST_DEFER_CODE_SYNC')
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a',encoding='utf-8') as h:
                  h.write('### ShardVault live external probe\n\n')
                  h.write(f'- Candidates discovered: {discovered}\n')
                  h.write(f'- Required representative bytes: {required_bytes} (expected >= {expected_required_bytes})\n')
                  h.write(f'- Fresh small live probes passed: {probed}\n')
                  h.write(f'- Representative probes attempted: {representative_probed}\n')
                  h.write(f'- Representative full-fragment qualifications: {representative_qualified}\n')
                  h.write(f'- Representative validated targets: {representative_validated}\n')
                  h.write(f'- Historical active targets: {active}\n')
                  h.write(f'- MAC-verified active shard readback: {health_proven}\n')
                  h.write(f'- Goal reached: {data.get("target_reached")}\n')
                  h.write('- Validation rule: a target counts only after full representative chunk/write/read/reassembly/hash proof.\n')
          print(json.dumps({
              'discovered': discovered,
              'probed': probed,
              'representative_probed': representative_probed,
              'representative_qualified': representative_qualified,
              'representative_validated_count': representative_validated,
              'representative_validated_endpoint_ids': representative_ids,
              'active_external_count': active,
              'mac_verified_live_shards': 7 if health_proven else 0,
              'selected': selected,
              'target_count': data.get('target_count'),
              'target_reached': data.get('target_reached'),
              'code_sync': data.get('code_sync'),
              'rejected': data.get('rejected', [])[:12],
          }, indent=2))
          PY

      - name: Upload ShardVault live probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shardvault-live-probe-${{ github.sha }}
          path: shardvault-live-probe.json
          if-no-files-found: warn
          retention-days: 3

      - name: Prove ShardVault external code reconstruction
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          AUTH="Authorization: Bearer ${MEL_PREVIEW_PASSWORD}"

          # code-sync has a bounded per-fragment runtime budget of up to 150 s.
          # Keep the client timeout above that ceiling so the workflow does not
          # kill a valid slow-provider attempt before the Worker can persist
          # its resumable state. The 40-minute job timeout remains the hard cap.
          CODE_SYNC_HTTP_TIMEOUT_SECONDS=170
          SYNC_DONE=0
          TRANSIENT_FAILURES=0
          PREVIEW_MIRROR_FULFILLED=0
          for attempt in $(seq 1 32); do
            rm -f shardvault-code-sync.attempt.json
            HTTP_CODE="$(curl --show-error --silent --max-time "${CODE_SYNC_HTTP_TIMEOUT_SECONDS}" \
              --header "$AUTH" \
              --header "content-type: application/json" \
              --data '{}' \
              --output shardvault-code-sync.attempt.json \
              --write-out '%{http_code}' \
              "$BASE_URL/api/gen2/shardvault/code-sync" || true)"
            echo "ShardVault code-sync attempt ${attempt}: HTTP ${HTTP_CODE}"
            if [ "$HTTP_CODE" != "200" ]; then
              case "$HTTP_CODE" in
                000|502|503|504)
                  TRANSIENT_FAILURES=$((TRANSIENT_FAILURES + 1))
                  echo "Transient code-sync transport failure; durable state will be resumed."
                  if [ "$TRANSIENT_FAILURES" -ge 6 ]; then
                    echo "Too many consecutive transient code-sync failures."
                    exit 22
                  fi
                  sleep 2
                  continue
                  ;;
                *)
                  cat shardvault-code-sync.attempt.json 2>/dev/null || true
                  exit 22
                  ;;
              esac
            fi
            TRANSIENT_FAILURES=0
            mv shardvault-code-sync.attempt.json shardvault-code-sync.json
            SYNC_STATUS="$(node -e "const d=require('./shardvault-code-sync.json');process.stdout.write(String(d.status||''))")"
            SYNC_ENDPOINTS="$(node -e "const d=require('./shardvault-code-sync.json');process.stdout.write(String((d.external?.endpoints||[]).length))")"
            echo "ShardVault code-sync status=${SYNC_STATUS} endpoints=${SYNC_ENDPOINTS}/7"
            if [ "$SYNC_STATUS" = "COPIED" ] && [ "$SYNC_ENDPOINTS" -ge 7 ]; then
              SYNC_DONE=1
              break
            fi
            case "$SYNC_STATUS" in
              COPYING|RETRY_TARGETS) ;;
              QUORUM_COPIED)
                # Recoverable 4/7 or 5/7 is not the required full 7/7.
                # Quorum carries resumable state; do not stop the remaining
                # verified external shard writes at the first safe quorum.
                node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('shardvault-code-sync.json','utf8'));
          const e=d?.external||{};
          const count=new Set(e.endpoints||[]).size;
          if(d?.ok!==true||d?.status!=='QUORUM_COPIED'
              ||e.repair_pending!==true||e.reconstruction_verified!==true
              ||e.next_action!=='CALL_CODE_SYNC_AGAIN'
              ||count<5||count>=7)throw Error('SHARDVAULT_QUORUM_PROGRESS_INVALID');
          console.log('SHARDVAULT_QUORUM_PROGRESS_NOT_COMPLETE:',count+'/7');
          NODE
                ;;
              *)
                node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('shardvault-code-sync.json','utf8'));
          const v=String(d?.status||'UNKNOWN');
          console.error('SHARDVAULT_CODE_SYNC_UNEXPECTED_STATUS:',/^[A-Z0-9_:-]{1,80}$/.test(v)?v:'UNKNOWN');
          NODE
                exit 23
                ;;
            esac
            # The preview D1 relay queue has no production-side consumer.
            # Fulfill only its exact encrypted fragment through the isolated
            # preview R2 bucket and dedicated preview mirror branch.
            if [ "$SYNC_STATUS" = "RETRY_TARGETS" ] && [ "$PREVIEW_MIRROR_FULFILLED" -eq 0 ]; then
              node scripts/fulfill-preview-code-mirror.mjs
              if node - <<'NODE'
          const d=require('./shardvault-code-sync.json');
          const e=d?.external||{};
          process.exit(e.reason==='GITHUB_CODE_MIRROR_PENDING'
            && e.relay_pending===true ? 0 : 1);
          NODE
              then
                PREVIEW_MIRROR_FULFILLED=1
                echo "PREVIEW_GITHUB_CODE_MIRROR_PUBLISHED_TO_ISOLATED_BRANCH"
              fi
            fi
            sleep 1
          done
          test "$SYNC_DONE" -eq 1

          curl --fail-with-body --show-error --silent --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 900 --max-time 240 \
            --header "$AUTH" \
            --header "content-type: application/json" \
            --data '{}' \
            "$BASE_URL/api/gen2/shardvault/code-reconstruct" \
            --output shardvault-code-reconstruct.json

          LOSS3_PATTERN="$(SEED_PATTERN='[0,2,5]' node - <<'NODE'
          const fs=require('fs');
          const normal=JSON.parse(fs.readFileSync('shardvault-code-reconstruct.json','utf8'));
          const seed=JSON.parse(process.env.SEED_PATTERN||'[]');
          const real=(normal?.download_errors||[]).map(x=>Number(x?.index)).filter(Number.isInteger);
          const out=[];
          for(const x of [...real,...seed,0,1,2,3,4,5,6]){
            if(x>=0&&x<7&&!out.includes(x)) out.push(x);
            if(out.length===3) break;
          }
          if(out.length!==3) process.exit(31);
          process.stdout.write(JSON.stringify(out));
          NODE
          )"
          echo "ShardVault exact-three-loss proof pattern=${LOSS3_PATTERN}"

          curl --fail-with-body --show-error --silent --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 900 --max-time 240 \
            --header "$AUTH" \
            --header "content-type: application/json" \
            --data "{\"simulate_missing\":${LOSS3_PATTERN}}" \
            "$BASE_URL/api/gen2/shardvault/code-reconstruct" \
            --output shardvault-code-reconstruct-loss3.json

          node - <<'NODE'
          const fs=require('fs');
          const sync=JSON.parse(fs.readFileSync('shardvault-code-sync.json','utf8'));
          const normal=JSON.parse(fs.readFileSync('shardvault-code-reconstruct.json','utf8'));
          const loss3=JSON.parse(fs.readFileSync('shardvault-code-reconstruct-loss3.json','utf8'));
          const sha=process.env.GITHUB_SHA;
          if(sync?.ok!==true||sync?.status!=='COPIED') throw new Error('SHARDVAULT_CODE_SYNC_NOT_COPIED');
          if((sync?.external?.endpoints||[]).length<7) throw new Error('SHARDVAULT_CODE_SYNC_EXTERNAL_LT_7');
          for(const [label,d] of [['normal',normal],['loss3',loss3]]){
            if(d?.ok!==true||d?.status!=='CODE_RECONSTRUCTION_VERIFIED') throw new Error('SHARDVAULT_CODE_RECONSTRUCTION_FAILED:'+label+':'+String(d?.status||d?.error));
            if(String(d?.sha||d?.git_sha||'')!==String(sha||'')) throw new Error('SHARDVAULT_CODE_RECONSTRUCTION_SHA_MISMATCH:'+label);
            if(d?.independent_of_local_archive!==true) throw new Error('SHARDVAULT_CODE_RECONSTRUCTION_NOT_INDEPENDENT:'+label);
            if(Number(d?.healthy_shards||0)<Number(d?.required_shards||0)) throw new Error('SHARDVAULT_CODE_RECONSTRUCTION_INSUFFICIENT:'+label);
            if(!/^[0-9a-f]{64}$/i.test(String(d?.sha256||''))) throw new Error('SHARDVAULT_CODE_RECONSTRUCTION_HASH_INVALID:'+label);
          }
          if((loss3?.dropped_indexes||[]).length!==3) throw new Error('SHARDVAULT_LOSS3_NOT_EXERCISED');
          console.log(JSON.stringify({
            sha,
            external_code_endpoints:sync.external.endpoints.length,
            reconstruction_status:normal.status,
            reconstruction_sha256:normal.sha256,
            loss3_status:loss3.status,
            loss3_healthy_shards:loss3.healthy_shards,
            loss3_required_shards:loss3.required_shards,
            independent_of_local_archive:normal.independent_of_local_archive
          },null,2));
          NODE

      - name: Stress preview UI API and recovery paths
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          export BASE_URL MEL_PREVIEW_PASSWORD

          stress_one() {
            i="$1"
            case $((i % 9)) in
              0) path="/" ;;
              1) path="/professor" ;;
              2) path="/veille" ;;
              3) path="/shardvault" ;;
              4) path="/api/gen2/autonomy/state" ;;
              5) path="/api/work/health" ;;
              6) path="/api/memory/status" ;;
              7) path="/api/learning/progress" ;;
              8) path="/api/gen2/shardvault/status" ;;
            esac
            curl --fail --show-error --silent --max-time 30 \
              --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
              "${BASE_URL}${path}" >/dev/null
          }
          export -f stress_one
          seq 1 180 | xargs -P 18 -n 1 bash -c 'stress_one "$1"' _

          for seed_pattern in '[0,1,2]' '[1,3,6]' '[0,4,6]' '[2,4,5]' '[1,2,5]' '[3,4,5]' '[0,3,6]'; do
            curl --fail-with-body --show-error --silent --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 900 --max-time 240 \
              --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
              --header "content-type: application/json" \
              --data '{}' \
              "$BASE_URL/api/gen2/shardvault/code-reconstruct" \
              > stress-baseline.json

            pattern="$(SEED_PATTERN="$seed_pattern" node -e '
              const fs=require("fs");
              const d=JSON.parse(fs.readFileSync("stress-baseline.json","utf8"));
              if(d?.ok!==true||d?.status!=="CODE_RECONSTRUCTION_VERIFIED") process.exit(32);
              const seed=JSON.parse(process.env.SEED_PATTERN||"[]");
              const real=(d?.download_errors||[]).map(x=>Number(x?.index)).filter(Number.isInteger);
              const out=[];
              for(const x of [...real,...seed,0,1,2,3,4,5,6]){
                if(x>=0&&x<7&&!out.includes(x)) out.push(x);
                if(out.length===3) break;
              }
              if(out.length!==3) process.exit(33);
              process.stdout.write(JSON.stringify(out));
            ')"
            echo "ShardVault stress seed=${seed_pattern} effective=${pattern}"

            STRESS_OK=0
            for reconstruction_attempt in 1 2 3; do
              CURL_EXIT=0
              HTTP_CODE="$(curl --show-error --silent --max-time 240 \
                --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
                --header "content-type: application/json" \
                --data "{\"simulate_missing\":${pattern}}" \
                --output stress-reconstruct.json \
                --write-out '%{http_code}' \
                "$BASE_URL/api/gen2/shardvault/code-reconstruct")" || CURL_EXIT=$?
              if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" = "200" ]; then STRESS_OK=1; break; fi
              echo "Stress reconstruction attempt ${reconstruction_attempt} returned curl exit ${CURL_EXIT}, HTTP ${HTTP_CODE}; retrying bounded transient read."
              # Capture only safe status codes and shard indexes. Preserve
              # visibility into external availability failures without
              # uploading private response bodies or credential-bearing URLs.
              HTTP_CODE="${HTTP_CODE}" CURL_EXIT="${CURL_EXIT}" PATTERN="${pattern}" ATTEMPT="${reconstruction_attempt}" node - <<'NODE'
          const fs=require('node:fs');
          let d={};
          try{d=JSON.parse(fs.readFileSync('stress-reconstruct.json','utf8'));}catch{}
          const safeToken=value => {
            const text=String(value||'UNKNOWN').toUpperCase();
            return /^[A-Z][A-Z0-9_]{0,79}$/.test(text)?text:'UNKNOWN';
          };
          const integer=n=>Number.isInteger(Number(n))&&Number(n)>=0&&Number(n)<=6?Number(n):null;
          const issues=(Array.isArray(d.errors)?d.errors:[]).slice(0,7).map(row=>({
            index:integer(row?.index),code:safeToken(String(row?.error||'').split(/[_:0-9]/).slice(0,3).join('_')),
          }));
          const record={
            http:Number(process.env.HTTP_CODE)||0,curl_exit:Number(process.env.CURL_EXIT)||0,
            attempt:Number(process.env.ATTEMPT)||0,
            pattern:(()=>{try{return JSON.parse(process.env.PATTERN||'[]').map(integer).filter(v=>v!==null).slice(0,3);}catch{return [];}})(),
            status:safeToken(d.status||d.code),
            healthy_shards:Number.isInteger(Number(d.healthy_shards))?Number(d.healthy_shards):null,
            required_shards:Number.isInteger(Number(d.required_shards))?Number(d.required_shards):null,
            failed_indexes:issues.map(row=>row.index).filter(v=>v!==null),
          };
          fs.appendFileSync('stress-reconstruction-failures.ndjson',JSON.stringify(record)+'\\n');
          console.log('SHARDVAULT_STRESS_SAFE_FAILURE:'+JSON.stringify(record));
          NODE
              sleep 2
            done
            test "$STRESS_OK" -eq 1

            PATTERN="$pattern" node -e '
              const fs=require("fs");
              const d=JSON.parse(fs.readFileSync("stress-reconstruct.json","utf8"));
              if(d?.ok!==true||d?.status!=="CODE_RECONSTRUCTION_VERIFIED") throw new Error("STRESS_RECONSTRUCTION_FAILED:"+process.env.PATTERN+":"+String(d?.status||d?.error));
              if((d?.dropped_indexes||[]).length!==3) throw new Error("STRESS_RECONSTRUCTION_LOSS_PATTERN_MISSING");
              if(Number(d?.healthy_shards||0)<Number(d?.required_shards||0)) throw new Error("STRESS_RECONSTRUCTION_UNRECOVERABLE");
              if(String(d?.sha||d?.git_sha||"")!==String(process.env.GITHUB_SHA||"")) throw new Error("STRESS_RECONSTRUCTION_SHA_MISMATCH:"+process.env.PATTERN);
              if(d?.independent_of_local_archive!==true) throw new Error("STRESS_RECONSTRUCTION_NOT_INDEPENDENT:"+process.env.PATTERN);
              if(!/^[0-9a-f]{64}$/i.test(String(d?.sha256||""))) throw new Error("STRESS_RECONSTRUCTION_HASH_INVALID:"+process.env.PATTERN);
            '
          done

          curl --fail --show-error --silent --max-time 45 \
            --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
            "$BASE_URL/api/gen2/autonomy/state" > stress-final-state.json
          node -e "JSON.parse(require('fs').readFileSync('stress-final-state.json','utf8'))"
          echo "Bounded preview stress and recovery tests passed."

      - name: Upload ShardVault reconstruction and stress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shardvault-reconstruction-stress-${{ github.sha }}
          path: |
            shardvault-code-sync.json
            shardvault-code-reconstruct.json
            shardvault-code-reconstruct-loss3.json
            stress-final-state.json
            stress-reconstruction-failures.ndjson
          if-no-files-found: warn
          retention-days: 7

      - name: Prove autonomy launch readiness on isolated preview
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          curl --fail-with-body --show-error --silent --max-time 120 \
            --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
            "${BASE_URL}/api/gen2/autonomy/launch-readiness" \
            --output preview-launch-readiness.json

          python - <<'PY'
          import json, os
          from pathlib import Path

          data=json.loads(Path('preview-launch-readiness.json').read_text(encoding='utf-8'))
          gates=data.get('gates') or {}
          if data.get('ok') is not True:
              raise SystemExit('LAUNCH_READINESS_API_FAILED')
          if data.get('launch_ready') is not True or data.get('status') != 'GO_FOR_SUPERVISED_AUTONOMY':
              raise SystemExit('AUTONOMY_LAUNCH_NO_GO: '+json.dumps(data.get('blockers') or []))
          required=[
              'canonical_candidate_boundary',
              'bounded_failure_history',
              'no_unbounded_active_work',
              'verified_restore_dry_run',
              'shardvault_critical_survival',
              'production_release_separately_gated',
              'owner_halt_invariant',
              'zero_added_cost_fail_closed',
          ]
          failed=[key for key in required if gates.get(key) is not True]
          if failed:
              raise SystemExit('AUTONOMY_LAUNCH_GATE_FAILED: '+','.join(failed))
          restore=data.get('restore') or {}
          if restore.get('ok') is not True or restore.get('status') != 'SYNTHETIC_PREVIEW_RESTORE_VERIFIED':
              raise SystemExit('RESTORE_DRY_RUN_NOT_PROVEN')
          shard=data.get('shardvault') or {}
          if shard.get('ok') is not True or shard.get('preview_only') is not True:
              raise SystemExit('PREVIEW_SHARDVAULT_GATE_NOT_BOUND_TO_LIVE_PROBE')
          failure=data.get('failure_hygiene') or {}
          if failure.get('ok') is not True or int(failure.get('retry_cap') or 0) != 3:
              raise SystemExit('FAILURE_HYGIENE_NOT_PROVEN')
          digest=str(data.get('gate_digest') or '')
          if len(digest) != 64:
              raise SystemExit('LAUNCH_GATE_DIGEST_INVALID')

          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a',encoding='utf-8') as h:
                  h.write('### MEL autonomous launch gate\n\n')
                  h.write('- Verdict: **GO_FOR_SUPERVISED_AUTONOMY**\n')
                  h.write('- Candidate boundary: verified\n')
                  h.write('- Failure retry cap: 3\n')
                  h.write('- Restore dry-run: verified\n')
                  h.write('- ShardVault: separate live 7-target probe passed immediately before this gate\n')
                  h.write('- Production release: remains separately gated\n')
                  h.write('- Owner halt: invariant preserved\n')
          print(json.dumps({
              'status':data.get('status'),
              'launch_ready':data.get('launch_ready'),
              'gates':gates,
              'blockers':data.get('blockers'),
              'retry_cap':failure.get('retry_cap'),
              'historical_failed_count':failure.get('historical_failed_count'),
              'restore_status':restore.get('status'),
              'shardvault_status':shard.get('status'),
              'gate_digest':digest,
          },indent=2))
          PY

      - name: Upload autonomy launch readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: autonomy-launch-readiness-${{ github.sha }}
          path: preview-launch-readiness.json
          if-no-files-found: warn
          retention-days: 7

      - name: Refresh zero-cost Benchmark and LoRA readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"

          # Only the isolated preview runs these POSTs. A Worker may complete
          # a request yet drop its HTTP response (curl 56). Replay is strictly
          # bounded and restricted to transport errors, never application errors.
          # No adapter activation or promotion is performed by either endpoint.
          refresh_preview_learning() {
            local path="$1" output="$2" timeout="$3"
            local attempt code curl_exit
            for attempt in 1 2 3; do
              rm -f "$output"
              code=""
              curl_exit=0
              if code="$(curl --fail-with-body --show-error --silent --max-time "$timeout" \
                --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
                --header "content-type: application/json" \
                --data '{}' \
                --output "$output" \
                --write-out '%{http_code}' \
                "${BASE_URL}${path}")"; then
                if [ "$code" = "200" ]; then return 0; fi
                echo "PREVIEW_LEARNING_NON_200:${path}:${code}"
                return 1
              else
                curl_exit=$?
              fi
              case "$curl_exit" in
                18|28|52|55|56)
                  echo "PREVIEW_LEARNING_TRANSIENT_TRANSPORT:${path}:curl=${curl_exit}:attempt=${attempt}"
                  if [ "$attempt" -eq 3 ]; then return 1; fi
                  sleep 3
                  ;;
                *)
                  echo "PREVIEW_LEARNING_HARD_FAILURE:${path}:curl=${curl_exit}:http=${code}"
                  return 1
                  ;;
              esac
            done
            return 1
          }

          refresh_preview_learning '/api/learning/benchmark/run' benchmark-refresh.json 180
          refresh_preview_learning '/api/learning/lora/prepare' lora-prepare-refresh.json 120

          python - <<'PY'
          import json, os
          from pathlib import Path

          bench = json.loads(Path('benchmark-refresh.json').read_text(encoding='utf-8'))
          lora = json.loads(Path('lora-prepare-refresh.json').read_text(encoding='utf-8'))
          if bench.get('ok') is not True:
              raise SystemExit('BENCHMARK_REFRESH_FAILED: ' + str(bench.get('error') or bench.get('detail')))
          if lora.get('ok') is not True:
              raise SystemExit('LORA_PREPARE_REFRESH_FAILED: ' + str(lora.get('error') or lora.get('detail')))

          score = bench.get('benchmark', {}).get('score')
          cases = bench.get('benchmark', {}).get('case_count')
          plan = lora.get('plan', {})
          readiness = plan.get('readiness', {})
          examples = plan.get('examples')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as h:
                  h.write('### MEL zero-cost learning refresh\n\n')
                  h.write(f'- Benchmark score: {score}\n')
                  h.write(f'- Benchmark cases: {cases}\n')
                  h.write(f'- LoRA lessons/examples: {examples}/50\n')
                  h.write(f'- LoRA plan status: {plan.get("status")}\n')
                  h.write(f'- Ready for training: {readiness.get("ready_for_training")}\n')
          print(json.dumps({
              'benchmark_score': score,
              'benchmark_cases': cases,
              'lora_examples': examples,
              'lora_status': plan.get('status'),
              'ready_for_training': readiness.get('ready_for_training'),
          }, indent=2))
          PY

      - name: Upload learning refresh evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-learning-refresh-${{ github.sha }}
          path: |
            benchmark-refresh.json
            lora-prepare-refresh.json
          if-no-files-found: warn
          retention-days: 7

