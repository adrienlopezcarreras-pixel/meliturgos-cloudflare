      - name: Prove preview is paused then enable isolated autonomy proof
        id: preview_autonomy_proof
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          AUTH="Authorization: Bearer ${MEL_PREVIEW_PASSWORD}"

          curl --fail-with-body --show-error --silent --max-time 45 \
            --header "$AUTH" \
