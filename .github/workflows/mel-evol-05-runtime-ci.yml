name: mel-evol-05-runtime-ci

on:
  pull_request:
    paths:
      - 'src/evolution/skill-registry.js'
      - 'src/evolution/d1-skill-registry-store.js'
      - 'src/evolution/skill-registry-evidence-bridge.js'
      - 'src/capabilities/skill-registry-capabilities.js'
      - 'src/capabilities/default-bus.js'
      - 'src/router.js'
      - 'src/roadmap/master-roadmap.js'
      - 'tests/gen2/skill-registry.test.mjs'
      - 'tests/gen2/skill-registry-d1.test.mjs'
      - 'tests/gen2/skill-registry-evidence-bridge.test.mjs'
      - 'tests/gen2/skill-registry-runtime.test.mjs'
      - 'tests/release-production-smoke-routes.test.mjs'
      - '.github/workflows/deploy-cloudflare-release.yml'
      - '.github/workflows/mel-evol-05-runtime-ci.yml'
  push:
    branches:
      - 'roadmap/mel-evol-05-runtime-proof-20260925'

permissions:
  contents: read

jobs:
  skill-runtime-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/runtime-security-gate.mjs
      - name: Syntax
        run: >
          node --check src/evolution/skill-registry.js &&
          node --check src/evolution/d1-skill-registry-store.js &&
          node --check src/evolution/skill-registry-evidence-bridge.js &&
          node --check src/capabilities/skill-registry-capabilities.js &&
          node --check src/capabilities/default-bus.js &&
          node --check src/router.js
      - name: MEL-EVOL-05 targeted tests
        run: >
          node --test
          tests/gen2/skill-registry.test.mjs
          tests/gen2/skill-registry-d1.test.mjs
          tests/gen2/skill-registry-evidence-bridge.test.mjs
          tests/gen2/skill-registry-runtime.test.mjs
          tests/release-production-smoke-routes.test.mjs

  skill-runtime-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: skill-runtime-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git switch -c candidate/mel-evol-05-runtime-ci
      - run: npm test
