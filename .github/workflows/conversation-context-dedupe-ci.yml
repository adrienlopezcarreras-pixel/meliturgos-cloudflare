name: conversation-context-dedupe-ci
on:
  pull_request:
    paths:
      - 'src/core/orchestrator/conversation-context.js'
      - 'tests/conversation-context-identifierless-dedupe.test.mjs'
      - '.github/workflows/conversation-context-dedupe-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/conversation-context-identifierless-dedupe.test.mjs
