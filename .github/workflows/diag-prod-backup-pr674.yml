name: diag-prod-backup-pr674

on:
  push:
    branches:
      - 'diag/prod-backup-pr674-20260928'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Probe production backup phase
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"
          cleanup() {
            set +e
            printf 'y\n' | npx wrangler secret delete MEL_LAUNCH_BOOTSTRAP_TOKEN --env="" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' "${TOKEN}" | npx wrangler secret put MEL_LAUNCH_BOOTSTRAP_TOKEN --env="" >/dev/null
          CODE="$(curl --silent --show-error --max-time 240 \
            --header "x-mel-launch-bootstrap: ${TOKEN}" \
            --header "content-type: application/json" \
            --data '{"phase":"backup"}' \
            --output backup.json \
            --write-out '%{http_code}' \
            https://meliturgos.adrien-lopezcarreras.workers.dev/api/internal/release-launch-bootstrap || true)"
          echo "http_status=${CODE}"
          node - <<'NODE'
          const fs=require('fs');
          let d={};
          try{d=JSON.parse(fs.readFileSync('backup.json','utf8'))}catch{}
          const out={
            ok:d?.ok===true,
            status:d?.status||null,
            code:d?.code||d?.backup?.code||null,
            backup_status:d?.backup?.status||null,
            backup_ok:d?.backup?.ok===true,
            backup_id:d?.backup?.id||null,
            deployed_sha:d?.backup?.deployedSha||d?.backup?.deployed_sha||null,
            source_count:Number(d?.backup?.sourceCount||0)||0
          };
          console.log(JSON.stringify(out,null,2));
          NODE
          test "${CODE}" = "200"
