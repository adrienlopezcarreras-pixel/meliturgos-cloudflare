name: audit-c000-draft-release-bytes-readonly

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-c000-draft-release-bytes.yml'

permissions:
  contents: read

jobs:
  audit-draft:
    if: ${{ github.repository == 'adrienlopezcarreras-pixel/meliturgos-cloudflare' && github.actor == 'adrienlopezcarreras-pixel' && github.event.pull_request.number == 1253 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/lora-preserve-checkpoint-before-release-20261012' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Prove fail-closed digest/redirect tests offline
        run: node --test tests/lora-daily-trace-draft-byte-audit.test.mjs
      - name: Read exact draft weights and proof and compare their SHA-256 (no mutation)
        env:
          MEL_LORA_RELEASE_TOKEN: ${{ secrets.MEL_LORA_RELEASE_TOKEN }}
        run: node scripts/audit-c000-draft-release-assets.mjs
