name: release launch retry budget CI

on:
  push:
    branches:
      - 'fix/release-launch-attempt-budget-20260921'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/deployment-path-unicity.test.mjs tests/runtime-loop-topology-exhaustive.test.mjs tests/system-readiness.test.mjs
