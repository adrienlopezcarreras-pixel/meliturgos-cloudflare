name: temp-cloudflare-permission-groups

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - '.github/workflows/temp-cloudflare-permission-groups.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: List Workers AI permission groups
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          req=urllib.request.Request(
              "https://api.cloudflare.com/client/v4/user/tokens/permission_groups",
              headers={"Authorization":f"Bearer {token}"}
          )
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.loads(r.read().decode())
          groups=[]
          for x in data.get("result") or []:
              name=str(x.get("name") or "")
              if "worker" in name.lower() or "ai" in name.lower():
                  groups.append({
                      "id":x.get("id"),
                      "name":name,
                      "scopes":x.get("scopes"),
                  })
          print(json.dumps(groups,indent=2))
          PY
