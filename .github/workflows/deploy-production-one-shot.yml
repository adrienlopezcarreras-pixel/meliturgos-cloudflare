name: deploy-production-one-shot

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - .github/workflows/deploy-production-one-shot.yml

permissions:
  contents: read

concurrency:
  group: meliturgos-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact approved push
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "candidate/mel-clean-autonomy"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git switch -C candidate/mel-clean-autonomy "${GITHUB_SHA}"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax gate
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Deploy exact approved SHA to production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --define "MEL_DEPLOYED_GIT_SHA:'${GITHUB_SHA}'" \
            --define "MEL_DEPLOYED_GIT_BRANCH:'candidate/mel-clean-autonomy'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production HTTP
        shell: bash
        run: |
          set -euo pipefail
          PROD_STATUS="$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 --output production-root.html --write-out '%{http_code}' https://meliturgos.adrien-lopezcarreras.workers.dev)"
          case "$PROD_STATUS" in 2??|3??|401) ;; *) exit 22 ;; esac
