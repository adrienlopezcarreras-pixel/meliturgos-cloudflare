name: memory-roadmap-integration-ci

on:
  push:
    branches:
      - 'roadmap/memory-unification-hybrid-20260921'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Memory roadmap targeted tests
        run: node --test tests/memory/unified-operational-retrieval.test.mjs tests/phase6-rag-search.test.mjs tests/native-chat-memory.test.mjs tests/memory-compat-capability-bus.test.mjs
