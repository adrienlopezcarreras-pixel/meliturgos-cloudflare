name: mini-android-windows-triad-audit

on:
  pull_request:
    paths:
      - 'docs/MINI-ANDROID-WINDOWS-TRIAD-AUDIT-2026-10-10.md'
      - 'scripts/mini-triad-audit.mjs'
      - 'tests/mini-triad-protocol-stress.cpp'
      - 'tests/computer-companion-api.test.mjs'
      - 'android-companion/**'
      - 'windows-companion/**'
      - 'firmware/waveshare-terminal/**'
      - 'src/devices/computer-companion-api.js'
      - 'scripts/cloudflare-api-relay-runner.mjs'
      - '.github/workflows/mini-android-windows-triad-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-protocol-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compile exact MINI protocol/ADPCM on host
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            tests/mini-triad-protocol-stress.cpp \
            firmware/waveshare-terminal/main/mel_link_v2_protocol.cpp \
            firmware/waveshare-terminal/main/mel_ima_adpcm.cpp \
            -o /tmp/mini-triad-protocol-stress
      - name: Run 10000 frame and 1000 codec block cycles
        run: /tmp/mini-triad-protocol-stress

  backend-companion-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Backend, Companion, Android and MINI contracts
        run: node --test tests/computer-companion-api.test.mjs tests/android-companion-api.test.mjs tests/android-companion-source-contract.test.mjs tests/waveshare-terminal-api.test.mjs tests/waveshare-terminal-owner-routes.test.mjs tests/waveshare-terminal-android-sync-contract.test.mjs tests/waveshare-terminal-mobile-status.test.mjs tests/waveshare-terminal-storage.test.mjs tests/waveshare-terminal-release-safety.test.mjs tests/mini-triad-security-contract.test.mjs
      - name: Isolated candidate branch context for full suite
        if: github.event_name == 'pull_request'
        run: git checkout -b "candidate/mini-triad-pr-${{ github.event.pull_request.number }}"
      - name: Repository full regression suite
        run: npm test

  android-build-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK and run JVM unit tests (no device)
        working-directory: android-companion
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mini-triad-android-evidence-${{ github.sha }}
          path: |
            android-companion/app/build/reports/tests/**
            android-companion/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  windows-companion-package-stress:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Parse PowerShell and package desktop Companion without signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach($p in @('assets/MEL-Computer-Companion.ps1','assets/MEL-Computer-Setup.ps1',
            'scripts/build-windows-release.ps1','scripts/verify-windows-release.ps1')) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw "TRIAD_PS_PARSE_FAILED:$p" }
          }
          ./scripts/build-windows-release.ps1 -Version '2.3.12' -SourceSha '${{ github.sha }}'
          ./scripts/verify-windows-release.ps1 -PackageDir 'artifacts/windows' -Version '2.3.12' -SourceSha '${{ github.sha }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mini-triad-windows-evidence-${{ github.sha }}
          path: artifacts/windows/*
          if-no-files-found: warn
          retention-days: 14

  cross-device-architecture-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check MINI / Android / Windows integration invariants
        run: node scripts/mini-triad-audit.mjs --report artifacts/mini-triad-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mini-triad-architecture-audit-${{ github.sha }}
          path: artifacts/mini-triad-audit.json
          if-no-files-found: error
          retention-days: 30
