name: Android Wake Kotlin Compile
on:
  pull_request:
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-wake-kotlin-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Kotlin compilation
        working-directory: android-companion
        run: ./gradlew --no-daemon --console=plain :app:compileDebugKotlin
