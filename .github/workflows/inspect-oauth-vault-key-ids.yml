name: inspect-oauth-vault-key-ids

on:
  push:
    branches:
      - ops/repair-owner-auth-20261006
    paths:
      - .github/workflows/inspect-oauth-vault-key-ids.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read OAuth vault key identifiers only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx -y wrangler@4.135.0 d1 execute meliturgos-memory --remote --json \
            --command "SELECT connector_id, json_extract(envelope_json,'$.key_id') AS key_id, updated_at FROM mel_oauth_tokens ORDER BY connector_id" \
            > oauth-key-ids.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('oauth-key-ids.json','utf8'));
          const arrays=[];
          const walk=v=>{
            if(Array.isArray(v)){ arrays.push(v); for(const x of v) walk(x); }
            else if(v&&typeof v==='object') for(const x of Object.values(v)) walk(x);
          };
          walk(d);
          const rows=arrays.flat().filter(x=>x&&typeof x==='object'&&'connector_id' in x&&'key_id' in x);
          const unique=new Map();
          for(const row of rows){
            const connector=String(row.connector_id||'').slice(0,120);
            const keyId=String(row.key_id||'').slice(0,200);
            if(connector&&keyId) unique.set(connector,keyId);
          }
          if(!unique.size) console.log('OAUTH_KEY_IDS none');
          for(const [connector,keyId] of unique) console.log('OAUTH_KEY_ID connector='+connector+' key_id='+keyId);
          NODE
