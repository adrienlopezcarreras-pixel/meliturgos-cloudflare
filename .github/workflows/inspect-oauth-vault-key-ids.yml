name: inspect-oauth-vault-key-ids

on:
  push:
    branches:
      - ops/repair-owner-auth-20261006
    paths:
      - .github/workflows/inspect-oauth-vault-key-ids.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Inspect OAuth vault key identifiers through ephemeral D1 sidecar
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          NAME="mel-oauth-keyid-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CONFIG="release-tools/predeploy-backup-refresh/wrangler.oauth-keyid.jsonc"
          URL="https://${NAME}.adrien-lopezcarreras.workers.dev"
          export NAME CONFIG

          node - <<'NODE'
          const fs=require('fs');
          const source='release-tools/predeploy-backup-refresh/wrangler.jsonc';
          const target=process.env.CONFIG;
          const config=JSON.parse(fs.readFileSync(source,'utf8'));
          config.name=process.env.NAME;
          fs.writeFileSync(target,JSON.stringify(config,null,2));
          NODE

          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"
          CREATED=0
          cleanup() {
            set +e
            if [ "${CREATED:-0}" = "1" ]; then
              curl --silent --show-error --max-time 30                 --request DELETE                 --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"                 --output /tmp/delete.json                 "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${NAME}"                 >/dev/null || true
            fi
            rm -f oauth-row-page.json "$CONFIG"
          }
          trap cleanup EXIT

          npx -y wrangler@4.135.0 deploy --config "$CONFIG"             --var "MEL_PREDEPLOY_BACKUP_REFRESH_TOKEN:${TOKEN}" >/tmp/oauth-sidecar-deploy.log
          CREATED=1

          READY=0
          for ATTEMPT in $(seq 1 18); do
            CODE="$(curl --silent --show-error --max-time 30               --header "x-mel-predeploy-backup-refresh: ${TOKEN}"               --output /tmp/oauth-ready.json               --write-out '%{http_code}'               "${URL}/d1/tables" || true)"
            if [ "$CODE" = "200" ]; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" = "1"

          CODE="$(curl --silent --show-error --max-time 30             --header "x-mel-predeploy-backup-refresh: ${TOKEN}"             --output oauth-row-page.json             --write-out '%{http_code}'             "${URL}/d1/rows?table=mel_oauth_tokens&offset=0&limit=100" || true)"
          test "$CODE" = "200"

          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('oauth-row-page.json','utf8'));
          if(d?.ok!==true||d?.status!=='D1_ROWS_PAGE'||!Array.isArray(d?.rows)) throw new Error('OAUTH_D1_ROWS_INVALID');
          const unique=new Map();
          for(const row of d.rows){
            let env={};
            try{env=JSON.parse(String(row?.envelope_json||'{}'));}catch{}
            const connector=String(row?.connector_id||'').slice(0,120);
            const keyId=String(env?.key_id||'').slice(0,200);
            if(connector&&keyId) unique.set(connector,keyId);
          }
          if(!unique.size) console.log('OAUTH_KEY_IDS none');
          for(const [connector,keyId] of unique) console.log('OAUTH_KEY_ID connector='+connector+' key_id='+keyId);
          console.log('OAUTH_ROW_COUNT '+d.rows.length);
          NODE

          cleanup
          CREATED=0
          trap - EXIT
