name: inspect-oauth-vault-key-ids

on:
  push:
    branches:
      - ops/repair-owner-auth-20261006
    paths:
      - .github/workflows/inspect-oauth-vault-key-ids.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEL_BACKUP_ENCRYPTION_KEY_B64: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_B64 }}
      MEL_BACKUP_ENCRYPTION_KEY_ID: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Inspect OAuth vault key identifiers from encrypted #649 backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MEL_BACKUP_ENCRYPTION_KEY_B64:-}"
          test -n "${MEL_BACKUP_ENCRYPTION_KEY_ID:-}"
          OBJECT="meliturgos-private-media/backups/system/system-20261006054126738.enc.json"
          npx -y wrangler@4.135.0 r2 object get "$OBJECT" --file system-backup.enc.json --remote
          test -s system-backup.enc.json

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { createBackupEncryptionCodec, decodeBackupEncryptionKey } from './src/backup/encrypted-backup-storage.js';

          const keyId=String(process.env.MEL_BACKUP_ENCRYPTION_KEY_ID||'').trim();
          const keyBytes=decodeBackupEncryptionKey(String(process.env.MEL_BACKUP_ENCRYPTION_KEY_B64||'').trim());
          const codec=createBackupEncryptionCodec({keyId,keyBytes});
          const envelope=JSON.parse(fs.readFileSync('system-backup.enc.json','utf8'));
          const snapshot=await codec.open(envelope);

          const tables=snapshot?.exports?.database?.tables||[];
          const oauth=tables.find(row=>String(row?.name||'')==='mel_oauth_tokens');
          const rows=Array.isArray(oauth?.rows)?oauth.rows:[];
          if(!rows.length){
            console.log('OAUTH_KEY_IDS none');
            process.exit(0);
          }
          const unique=new Map();
          for(const row of rows){
            let env={};
            try{env=JSON.parse(String(row?.envelope_json||'{}'));}catch{}
            const connector=String(row?.connector_id||'').slice(0,120);
            const vaultKeyId=String(env?.key_id||'').slice(0,200);
            if(connector&&vaultKeyId) unique.set(connector,vaultKeyId);
          }
          if(!unique.size) console.log('OAUTH_KEY_IDS none');
          for(const [connector,vaultKeyId] of unique){
            console.log('OAUTH_KEY_ID connector='+connector+' key_id='+vaultKeyId);
          }
          NODE

          rm -f system-backup.enc.json
