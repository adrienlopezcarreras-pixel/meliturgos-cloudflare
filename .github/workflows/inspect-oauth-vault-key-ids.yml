name: inspect-oauth-vault-key-ids

on:
  push:
    branches:
      - ops/repair-owner-auth-20261006
    paths:
      - .github/workflows/inspect-oauth-vault-key-ids.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read OAuth vault key identifiers only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          set +e
          npx -y wrangler@4.135.0 d1 execute meliturgos-memory --remote --json \
            --command "SELECT connector_id, json_extract(envelope_json,'$.key_id') AS key_id, updated_at FROM mel_oauth_tokens ORDER BY connector_id" \
            > oauth-key-ids.json 2> oauth-key-ids.stderr
          CODE=$?
          set -e
          if [ "$CODE" != "0" ]; then
            echo "D1_QUERY_FAILED exit=$CODE"
            sed -n '1,120p' oauth-key-ids.stderr
            node - <<'NODE'
          const fs=require('fs');
          const raw=fs.existsSync('oauth-key-ids.json')?fs.readFileSync('oauth-key-ids.json','utf8'):'';
          if(raw) console.log(raw.slice(0,2000));
          NODE
            exit "$CODE"
          fi
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('oauth-key-ids.json','utf8'));
          const rows=[];
          const walk=v=>{
            if(Array.isArray(v)){ for(const x of v) walk(x); return; }
            if(v&&typeof v==='object'){
              if('connector_id' in v&&'key_id' in v) rows.push(v);
              for(const x of Object.values(v)) walk(x);
            }
          };
          walk(d);
          const unique=new Map();
          for(const row of rows){
            const connector=String(row.connector_id||'').slice(0,120);
            const keyId=String(row.key_id||'').slice(0,200);
            if(connector&&keyId) unique.set(connector,keyId);
          }
          if(!unique.size) console.log('OAUTH_KEY_IDS none');
          for(const [connector,keyId] of unique) console.log('OAUTH_KEY_ID connector='+connector+' key_id='+keyId);
          NODE
