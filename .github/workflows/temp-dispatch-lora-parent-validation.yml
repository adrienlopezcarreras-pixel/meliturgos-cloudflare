name: temp-dispatch-lora-parent-validation

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - '.github/workflows/temp-dispatch-lora-parent-validation.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch parent-lineage LoRA validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run lora-kaggle-free-gpu.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_sha=f8e47dd86872fd1d205a9d59e6d90da4ad96cb73 \
            -f cycle=1 \
            -f parent_release_tag=mel-lora-kaggle-ab6db29b784e-c000 \
            -f shard_size=750 \
            -f max_cycles=2 \
            -f benchmark_preview=false
