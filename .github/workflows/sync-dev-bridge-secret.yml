name: sync-dev-bridge-secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Sync Dev Bridge token to production Worker
        shell: bash
        env:
          MEL_DEV_BRIDGE_TOKEN: ${{ secrets.MEL_DEV_BRIDGE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$MEL_DEV_BRIDGE_TOKEN"
          printf '%s' "$MEL_DEV_BRIDGE_TOKEN" | npx wrangler secret put MEL_DEV_BRIDGE_TOKEN --env=""
          echo "Dev Bridge secret synchronized without exposing its value."
