name: Evolution inbox CI
on:
  pull_request:
    paths:
      - 'src/roadmap/evolution-*.js'
      - 'src/evolution/autonomy-supervisor.js'
      - 'src/evolution/autonomy-runtime-core.js'
      - 'src/capabilities/evolution-capabilities.js'
      - 'src/roadmap/evolution-gap-capture.js'
      - 'src/capabilities/default-bus.js'
      - 'src/persistence/migrations.js'
      - 'migrations/0018_evolution_development.sql'
      - 'src/core/config.js'
      - 'src/diagnostics/data-integrity.js'
      - 'tests/roadmap/evolution-*.test.mjs'
      - 'src/pages/roadmap-live-refresh-enhancer.js'
      - 'tests/roadmap-live-refresh.test.mjs'
      - 'src/security/runtime-permissions.js'
      - 'tests/gen2/runtime-permissions.test.mjs'
      - '.github/workflows/evolution-inbox-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check src/roadmap/evolution-inbox.js
          node --check src/roadmap/evolution-storage.js
          node --check src/roadmap/evolution-autonomy-queue.js
          node --check src/roadmap/evolution-gap-capture.js
          node --check src/evolution/autonomy-supervisor.js
          node --check src/evolution/autonomy-runtime-core.js
          node --check src/capabilities/evolution-capabilities.js
          node --check src/capabilities/default-bus.js
          node --check src/persistence/migrations.js
          node --check src/core/config.js
          node --check src/diagnostics/data-integrity.js
          node --check src/pages/roadmap-live-refresh-enhancer.js
          node --check src/security/runtime-permissions.js
      - name: Run evolution contract tests
        run: node --test tests/roadmap/evolution-review.test.mjs tests/roadmap/evolution-gap-capture.test.mjs tests/roadmap/evolution-autonomy-queue.test.mjs tests/roadmap/evolution-inbox.test.mjs tests/roadmap/evolution-storage.test.mjs tests/roadmap/evolution-capabilities.test.mjs tests/roadmap-live-refresh.test.mjs tests/gen2/runtime-permissions.test.mjs
  full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Full syntax validation
        run: npm run check
      - name: Preserve exact SHA with candidate-style local test branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout -B candidate/evolution-pr-ci HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Full test suite
        run: npm test
      - name: Runtime security gate
        run: node scripts/runtime-security-gate.mjs
