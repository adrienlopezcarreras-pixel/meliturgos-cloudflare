name: gen2-47-r2-byte-backup-ci

on:
  push:
    branches:
      - 'roadmap/gen2-47-*'
      - 'candidate/gen2-47-*'
  pull_request:
    branches:
      - main
    paths:
      - 'src/backup/system-backup-runtime.js'
      - 'src/backup/r2-byte-backup.js'
      - 'tests/backup-system-runtime.test.mjs'
      - 'tests/r2-byte-backup.test.mjs'
      - '.github/workflows/gen2-47-r2-byte-backup-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Targeted GEN2-47 tests
        run: node --test tests/backup-system-runtime.test.mjs tests/r2-byte-backup.test.mjs tests/encrypted-backup-storage.test.mjs
      - name: Syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/gen2-47-ci
      - name: Full test suite
        run: npm test
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
