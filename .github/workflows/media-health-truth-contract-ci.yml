name: media-health-truth-contract-ci

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/media-health-truth-contract-ci.yml'
      - 'src/capabilities/creative-media-capabilities.js'
      - 'tests/creative-media-health-truth.test.mjs'
      - 'src/router.js'
      - 'tests/dashboard-capability-health-truth.test.mjs'

permissions:
  contents: read

jobs:
  media-health-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prove health status is not false media execution success
        run: node --test tests/creative-media-health-truth.test.mjs tests/creative-media-capabilities.test.mjs tests/dashboard-capability-health-truth.test.mjs
