name: MEL external contingency monitor
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/continuity/**'
      - 'src/evolution/autonomy-runtime.js'
      - 'src/index.js'
      - 'src/security/http-auth-policy.js'
      - 'tests/contingency-*.test.mjs'
      - 'tests/life-contingency.test.mjs'
      - 'tests/countermeasure-actions.test.mjs'
      - 'tests/passive-state-recovery.test.mjs'
      - 'tests/replacement-catalog.test.mjs'
      - 'tests/replacement-attestation.test.mjs'
      - 'tests/public-contingency-heartbeat.test.mjs'
      - 'tests/shardvault-reconstruction-stress.test.mjs'
      - 'release-tools/predeploy-backup-refresh/**'
      - 'src/continuity/external-health-monitor.js'
      - 'scripts/run-external-contingency-monitor.mjs'
      - 'tests/external-health-monitor.test.mjs'
      - '.github/workflows/contingency-external-monitor.yml'
permissions:
  contents: read
concurrency:
  group: mel-contingency-monitor-${{ github.ref }}
  cancel-in-progress: false
jobs:
  monitor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Install exact lockfile
        run: npm ci
      - name: Verify all contingency contracts (127 cases, 21 life events, probes, health, recovery guards)
        run: >
          node --test tests/contingency-*.test.mjs
          tests/life-contingency.test.mjs tests/countermeasure-actions.test.mjs
          tests/replacement-catalog.test.mjs tests/replacement-attestation.test.mjs
          tests/public-contingency-heartbeat.test.mjs
          tests/external-health-monitor.test.mjs
          tests/shardvault-reconstruction-stress.test.mjs
          tests/passive-state-recovery.test.mjs
  monitor-cloudflare:
    # Use the canonical Worker origin from wrangler.jsonc by default.
    # The override variable can redirect to a future independently verified origin.
    if: ${{ github.event_name != 'pull_request' }}
    needs: monitor-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MEL_CONTINGENCY_HEALTH_URL: ${{ vars.MEL_CONTINGENCY_HEALTH_URL || 'https://meliturgos.adrien-lopezcarreras.workers.dev/api/public/contingency/heartbeat' }}
      MEL_CONTINGENCY_HEALTH_MARKER: ${{ vars.MEL_CONTINGENCY_HEALTH_MARKER }}
      MEL_CONTINGENCY_PROBE_HMAC_KEY: ${{ secrets.MEL_CONTINGENCY_PROBE_HMAC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Check live Cloudflare endpoint from outside Cloudflare
        run: node scripts/run-external-contingency-monitor.mjs
      - name: Preserve monitoring evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mel-contingency-external-health
          path: |
            artifacts/contingency/external-health.json
            artifacts/contingency/signed-health.json
          if-no-files-found: warn
          retention-days: 14
