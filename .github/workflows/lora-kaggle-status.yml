name: lora-kaggle-status

on:
  pull_request:
    paths:
      - ".github/workflows/lora-kaggle-status.yml"
      - "scripts/kaggle-readonly-status.py"
      - "tests/kaggle-readonly-status.test.mjs"
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - ".github/workflows/lora-kaggle-status.yml"
      - "scripts/kaggle-readonly-status.py"
      - "tests/kaggle-readonly-status.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - run: node --test tests/kaggle-readonly-status.test.mjs

  status:
    if: ${{ github.event_name != 'pull_request' }}
    needs: contract
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Kaggle CLI
        run: python -m pip install -q -U kaggle
      - name: Read sanitized session status without GPU execution or output download
        run: python scripts/kaggle-readonly-status.py

      - name: Upload status evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kaggle-lora-status-${{ github.run_id }}
          path: kaggle-lora-status.json
          if-no-files-found: warn
          retention-days: 7
