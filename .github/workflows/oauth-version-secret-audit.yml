name: oauth-version-secret-audit

on:
  push:
    branches:
      - diag/oauth-vault-count-20261006

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inspect recent Worker versions for OAuth secret binding names only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions list --name meliturgos --json > versions.json
          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const rows=JSON.parse(fs.readFileSync('versions.json','utf8'));
          const versions=Array.isArray(rows)?rows.slice(0,40):[];
          let found=[];
          for(const v of versions){
            const id=v.id||v.version_id;
            if(!id) continue;
            let raw='';
            try{
              raw=cp.execFileSync('npx',['wrangler','versions','view',id,'--name','meliturgos','--json'],{encoding:'utf8'});
            }catch{continue}
            let d={}; try{d=JSON.parse(raw)}catch{}
            const bindings=d.bindings||d.metadata?.bindings||[];
            const names=new Set((Array.isArray(bindings)?bindings:[]).map(x=>x?.name).filter(Boolean));
            const hasId=names.has('MEL_OAUTH_ENCRYPTION_KEY_ID');
            const hasKey=names.has('MEL_OAUTH_ENCRYPTION_KEY_B64');
            if(hasId||hasKey){
              found.push({id,created_on:v.created_on||v.created_at||null,has_id:hasId,has_key:hasKey});
            }
          }
          console.log('OAUTH_VERSION_SECRET_AUDIT '+JSON.stringify(found));
          NODE
