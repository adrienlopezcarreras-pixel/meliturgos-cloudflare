name: workers-ai-zero-cost-proof-refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: workers-ai-zero-cost-proof-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Re-prove Workers Free account and refresh runtime proof
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          ACCOUNT_CODE="$(curl --silent --show-error --max-time 30             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --output workers-ai-account.json             --write-out '%{http_code}'             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" || true)"

          ENT_CODE="$(curl --silent --show-error --max-time 30             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --output workers-ai-entitlements.json             --write-out '%{http_code}'             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/entitlements" || true)"

          test "${ACCOUNT_CODE}" = "200"
          test "${ENT_CODE}" = "200"

          curl --fail --silent --show-error --location --max-time 30 "https://developers.cloudflare.com/workers-ai/platform/pricing/" -o workers-ai-pricing.html
          curl --fail --silent --show-error --location --max-time 30 "https://developers.cloudflare.com/workers-ai/platform/errors/" -o workers-ai-errors.html
          grep -Fq "10,000 Neurons per day" workers-ai-pricing.html
          grep -Fq "N/A - Upgrade to Workers Paid" workers-ai-pricing.html
          grep -Fq "daily free allocation of 10,000 neurons" workers-ai-errors.html
          grep -Fq "429" workers-ai-errors.html

          node - <<'NODE'
          const fs=require('fs');
          const account=JSON.parse(fs.readFileSync('workers-ai-account.json','utf8'));
          const ent=JSON.parse(fs.readFileSync('workers-ai-entitlements.json','utf8'));
          if(account?.success!==true || ent?.success!==true || !Array.isArray(ent?.result)) {
            throw new Error('CLOUDFLARE_PLAN_EVIDENCE_INVALID');
          }
          const accountType=String(account?.result?.type||'').toLowerCase();
          if(accountType!=='standard') throw new Error('WORKERS_FREE_ACCOUNT_TYPE_NOT_PROVED');
          const marker=ent.result.find(row =>
            String(row?.feature?.key||row?.id||'')==='workers.static_assets.manifest_limit_file_count'
          );
          const markerValue=Number(marker?.allocation?.value);
          if(markerValue!==20000) throw new Error('WORKERS_FREE_ENTITLEMENT_NOT_PROVED:'+String(markerValue));

          const now=Date.now();
          const proof={
            schema:'mel.workers-ai.zero-cost-proof/v1',
            provider:'workers-ai',
            account_plan:'WORKERS_FREE',
            billing_path:'direct-workers-ai-binding',
            pricing_policy:'cloudflare-workers-ai-pricing-2026-10-01',
            free_allocation_neurons_per_day:10000,
            free_overage_behavior:'FAIL_NOT_BILL',
            plan_evidence:{
              source:'cloudflare-account-entitlements-api',
              account_type:'standard',
              entitlement_key:'workers.static_assets.manifest_limit_file_count',
              entitlement_value:markerValue,
              workers_free_reference_value:20000,
            },
            models:[
              '@cf/meta/llama-3.3-70b-instruct-fp8-fast',
              '@cf/google/gemma-4-26b-a4b-it',
              '@cf/nvidia/nemotron-3-120b-a12b',
              '@cf/zai-org/glm-4.7-flash',
              '@cf/black-forest-labs/flux-1-schnell',
              '@cf/black-forest-labs/flux-2-klein-4b',
              '@cf/deepgram/aura-1',
              '@cf/openai/whisper-large-v3-turbo'
            ],
            verified_at:new Date(now).toISOString(),
            expires_at:new Date(now+60*60*1000).toISOString(),
          };
          fs.writeFileSync('workers-ai-zero-cost-proof.json',JSON.stringify(proof));
          fs.writeFileSync('workers-ai-zero-cost-proof-evidence.json',JSON.stringify({
            schema:'mel.workers-ai.zero-cost-proof-refresh/v1',
            account_plan:proof.account_plan,
            verified_at:proof.verified_at,
            expires_at:proof.expires_at,
            model_count:proof.models.length,
            secret_values_exposed:false,
          },null,2));
          NODE

          PROOF="$(cat workers-ai-zero-cost-proof.json)"
          test -n "${PROOF}"
          printf '%s' "${PROOF}" | npx wrangler secret put MEL_WORKERS_AI_ZERO_COST_PROOF_JSON --name meliturgos
          echo "Workers AI zero-cost runtime proof refreshed without code deployment."

      - name: Re-prove Browser Run Workers Free hard-limit status
        shell: bash
        run: |
          set -euo pipefail
          DOC_URL="https://developers.cloudflare.com/browser-run/pricing/"
          curl --fail --silent --show-error --location --max-time 30 "${DOC_URL}" -o browser-run-pricing.html
          curl --fail --silent --show-error --location --max-time 30 "https://developers.cloudflare.com/browser-run/limits/" -o browser-run-limits.html
          grep -Fq "Workers Free" browser-run-pricing.html
          grep -Fq "10 minutes per day" browser-run-pricing.html
          grep -Fq "429" browser-run-limits.html
          grep -Fq "10 minutes per day" browser-run-limits.html
          node - <<'NODE'
          const fs=require('fs');
          const account=JSON.parse(fs.readFileSync('workers-ai-account.json','utf8'));
          if(String(account?.result?.type||'').toLowerCase()!=='standard') throw new Error('WORKERS_FREE_ACCOUNT_TYPE_NOT_PROVED');
          const html=fs.readFileSync('browser-run-pricing.html','utf8');
          const limits=fs.readFileSync('browser-run-limits.html','utf8');
          if(!html.includes('Workers Free')||!html.includes('10 minutes per day')) throw new Error('BROWSER_RUN_FREE_PRICING_NOT_PROVED');
          if(!limits.includes('429')||!limits.includes('10 minutes per day')) throw new Error('BROWSER_RUN_FREE_HARD_LIMIT_NOT_PROVED');
          const now=Date.now();
          const proof={
            schema:'mel.browser-run.zero-cost-proof/v1',
            provider:'cloudflare-browser-run',
            account_plan:'WORKERS_FREE',
            included_minutes_per_day:10,
            overage_behavior:'HARD_LIMIT_NO_BILLING',
            documentation_url:'https://developers.cloudflare.com/browser-run/pricing/',
            verified_at:new Date(now).toISOString(),
            expires_at:new Date(now+60*60*1000).toISOString(),
          };
          fs.writeFileSync('browser-run-zero-cost-proof.json',JSON.stringify(proof));
          fs.writeFileSync('browser-run-zero-cost-proof-evidence.json',JSON.stringify({
            schema:'mel.browser-run.zero-cost-proof-refresh/v1',
            account_plan:proof.account_plan,
            included_minutes_per_day:proof.included_minutes_per_day,
            overage_behavior:proof.overage_behavior,
            verified_at:proof.verified_at,
            expires_at:proof.expires_at,
            secret_values_exposed:false,
          },null,2));
          NODE
          PROOF="$(cat browser-run-zero-cost-proof.json)"
          test -n "${PROOF}"
          printf '%s' "${PROOF}" | npx wrangler secret put MEL_BROWSER_RUN_ZERO_COST_PROOF_JSON --name meliturgos
          echo "Browser Run zero-cost runtime proof refreshed without code deployment."

      - name: Upload sanitized refresh evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workers-ai-zero-cost-proof-refresh-${{ github.run_id }}
          path: |
            workers-ai-zero-cost-proof-evidence.json
            browser-run-zero-cost-proof-evidence.json
          if-no-files-found: warn
          retention-days: 7
