name: lora-runtime-pipeline-ci

on:
  push:
    branches:
      - 'candidate/mel-clean-autonomy'
      - 'fix/lora-*'
  pull_request:
    branches:
      - main
      - 'candidate/mel-clean-autonomy'
    paths:
      - 'src/learning/**'
      - 'src/evaluation/**'
      - 'src/api/native-chat.js'
      - 'src/professor-live-learning-entry.js'
      - 'src/pages/dual-lora-training-plan.js'
      - 'tests/qwen-kaggle-setup-guidance.test.mjs'
      - 'scripts/*lora*'
      - 'requirements-qwen3-lora.txt'
      - 'tests/*lora*'
      - 'tests/test_qwen3_training.py'
      - 'tests/test_qwen_corpus_packager.py'
      - 'tests/test_ultrachat_qwen_import.py'
      - 'scripts/import-ultrachat-qwen.py'
      - 'scripts/import-qwen-uncensor-jsonl.py'
      - 'tests/test_qwen_uncensor_split_import.py'
      - 'tests/test_qwen_hf_source_audit.py'
      - '.github/workflows/qwen-hf-source-audit.yml'
      - 'tests/qwen-kaggle-archive-limits.test.mjs'
      - 'tests/qwen-kaggle-kernel-metadata.test.mjs'
      - 'scripts/prepare-qwen-kaggle-corpus.py'
      - 'tests/test_abliteration_plan.py'
      - 'tests/test_abliteration_gpu.py'
      - 'tests/test_abliteration_apply.py'
      - 'scripts/abliteration-apply-gated.py'
      - 'scripts/abliteration-direction-gpu.py'
      - 'scripts/abliteration-gpu-runner.py'
      - 'tests/test_abliteration_gpu_runner.py'
      - 'tests/abliteration-gpu-readiness-guidance.test.mjs'
      - 'scripts/abliteration-gated-preflight.py'
      - 'tests/test_qwen_gpu_evidence.py'
      - 'tests/test_qwen_kaggle_output_layout.py'
      - '.github/workflows/professor-qwen-kaggle-result-verify.yml'
      - 'scripts/verify-qwen-gpu-artifacts.py'
      - 'tests/learning-engine.test.mjs'
      - 'notebooks/MEL-QLORA-SMOKE-COLAB.ipynb'
      - 'docs/LORA-FREE-GPU-RUNBOOK.md'
      - '.github/workflows/professor-qwen-kaggle-gpu.yml'
      - '.github/workflows/professor-qwen-kaggle-corpus-preflight.yml'
      - '.github/workflows/lora-runtime-pipeline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lora-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact lockfile
        run: npm ci

      - name: Syntax
        run: npm run check

      - name: Python trainer syntax
        run: python -m py_compile scripts/train-mel-lora.py scripts/train-qwen3-lora.py tests/test_qwen3_training.py tests/test_qwen_gpu_evidence.py scripts/verify-qwen-gpu-artifacts.py

      - name: Qwen3 offline evidence contract (no GPU, no model download)
        run: python -m unittest discover -s tests -p 'test_qwen3_training.py' -v

      - name: Reviewed Qwen3 Kaggle corpus packaging (offline)
        run: python -m unittest discover -s tests -p 'test_qwen_corpus_packager.py' -v

      - name: UltraChat conversion contract (offline)
        run: python -m unittest discover -s tests -p 'test_ultrachat_qwen_import.py' -v

      - name: Uncensor JSONL split-safe import (offline)
        run: python -m unittest discover -s tests -p 'test_qwen_uncensor_split_import.py' -v

      - name: Qwen HF source audit contract (offline)
        run: python -m unittest discover -s tests -p 'test_qwen_hf_source_audit.py' -v

      - name: Qwen3 GPU artifact evidence (offline)
        run: python -m unittest discover -s tests -p 'test_qwen_gpu_evidence.py' -v

      - name: Qwen3 Kaggle output layout (offline)
        run: python -m unittest discover -s tests -p 'test_qwen_kaggle_output_layout.py' -v

      - name: Abliteration reviewed offline plan (no GPU)
        run: python -m unittest discover -s tests -p 'test_abliteration_plan.py' -v

      - name: Abliteration GPU estimator offline contracts
        run: python -m unittest discover -s tests -p 'test_abliteration_gpu.py' -v

      - name: Abliteration GPU runner offline gates
        run: python -m unittest discover -s tests -p 'test_abliteration_gpu_runner.py' -v

      - name: Abliteration weight projection offline contracts
        run: python -m unittest discover -s tests -p 'test_abliteration_apply.py' -v

      - name: Abliteration GPU readiness messaging
        run: node --test tests/abliteration-gpu-readiness-guidance.test.mjs

      - name: Qwen Kaggle setup guidance
        run: node --test tests/qwen-kaggle-setup-guidance.test.mjs

      - name: Qwen Kaggle metadata identity
        run: node --test tests/qwen-kaggle-kernel-metadata.test.mjs

      - name: Targeted LoRA runtime tests
        run: >-
          node --test
          tests/lora-runtime-pipeline.test.mjs
          tests/lora-training-heartbeat.test.mjs
          tests/lora-daily-trace.test.mjs
          tests/learning-engine.test.mjs

      - name: Canonical plan digest parity
        shell: bash
        run: |
          mkdir -p .tmp-lora-ci
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('.tmp-lora-ci/dataset.jsonl')
          with out.open('w', encoding='utf-8') as fh:
              for i in range(50):
                  fh.write(json.dumps({
                      'messages': [
                          {'role': 'user', 'content': f'question {i}'},
                          {'role': 'assistant', 'content': f'answer {i}'},
                      ]
                  }, ensure_ascii=False) + '\n')
          PY

          node scripts/create-lora-plan.mjs             --dataset .tmp-lora-ci/dataset.jsonl             --output .tmp-lora-ci/plan.json             --epochs 1             --seed 42

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan = json.loads(Path('.tmp-lora-ci/plan.json').read_text(encoding='utf-8'))
          manifest = plan['training_manifest']
          canonical = json.dumps(
              manifest,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          )
          digest = 'sha256:' + hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          assert digest == plan['training_manifest_digest'], (digest, plan['training_manifest_digest'])
          assert plan['examples'] == 50
          assert plan['readiness']['ready_for_training'] is True
          assert manifest['quantization'] == 'none'
          print(json.dumps({
              'status': 'PASS',
              'training_manifest_digest': digest,
              'dataset_digest': plan['dataset_digest'],
          }, indent=2))
          PY

      - name: Full regression suite
        shell: bash
        run: |
          git checkout -B candidate/lora-ci-head "$GITHUB_SHA"
          npm test
