name: autonomy-readiness-evidence-ci

on:
  pull_request:
    paths:
      - 'src/evolution/autonomy-readiness.js'
      - 'tests/autonomy-readiness.test.mjs'
      - 'tests/autonomy-readiness-api.test.mjs'
      - '.github/workflows/autonomy-readiness-evidence-ci.yml'

permissions:
  contents: read

jobs:
  fail-closed-council:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Syntax
        run: node --check src/evolution/autonomy-readiness.js
      - name: Truthful Council autonomy readiness
        run: node --test tests/autonomy-readiness.test.mjs tests/autonomy-readiness-api.test.mjs
