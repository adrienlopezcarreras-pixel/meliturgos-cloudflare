name: shardvault-ci

on:
  pull_request:
    paths:
      - 'src/continuity/shardvault-runtime.js'
      - 'src/continuity/autonomous-repositories.js'
      - 'shardvault/**'
      - 'tests/shardvault-*.test.mjs'
      - '.github/workflows/deploy-cloudflare-release.yml'
      - '.github/workflows/shardvault-ci.yml'
  push:
    branches:
      - 'fix/shardvault-*'
    paths:
      - 'src/continuity/shardvault-runtime.js'
      - 'src/continuity/autonomous-repositories.js'
      - 'shardvault/**'
      - 'tests/shardvault-*.test.mjs'
      - '.github/workflows/deploy-cloudflare-release.yml'
      - '.github/workflows/shardvault-ci.yml'

permissions:
  contents: read

jobs:
  shardvault-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
      - name: ShardVault syntax
        run: node --check src/continuity/shardvault-runtime.js
      - name: ShardVault targeted tests
        run: node --test tests/shardvault-*.test.mjs tests/release-shardvault-prep.test.mjs

  shardvault-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: shardvault-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Repository syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/shardvault-ci
      - name: Full test suite
        run: npm test
