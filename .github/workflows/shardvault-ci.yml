name: shardvault-ci

on:
  # Verify ShardVault test contracts daily on the default branch, without
  # deploying or invoking any production reconstruction endpoints.
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/continuity/shardvault-runtime.js'
      - 'tests/gen2/sovereign-regeneration-bundle.test.mjs'
      - 'src/portability/system-bundle.js'
      - 'src/continuity/sovereign-regeneration-bundle.js'
      - 'src/continuity/shardvault-memory-export.js'
      - 'src/continuity/autonomous-repositories.js'
      - 'shardvault/**'
      - 'tests/shardvault-*.test.mjs'
      - '.github/workflows/deploy-cloudflare-release.yml'
      - '.github/workflows/shardvault-ci.yml'
  push:
    branches:
      - main
      - 'fix/shardvault-*'
    paths:
      - 'src/continuity/shardvault-runtime.js'
      - 'src/continuity/shardvault-memory-export.js'
      - 'src/continuity/sovereign-regeneration-bundle.js'
      - 'src/portability/system-bundle.js'
      - 'tests/gen2/sovereign-regeneration-bundle.test.mjs'
      - 'src/continuity/autonomous-repositories.js'
      - 'shardvault/**'
      - 'tests/shardvault-*.test.mjs'
      - '.github/workflows/deploy-cloudflare-release.yml'
      - '.github/workflows/shardvault-ci.yml'

# Drop obsolete PR test runs when newer commits supersede them.
# Scheduled read-only drills, manual drills and main-branch runs are never
# cancelled, even when a pull request is updated at the same time.
concurrency:
  group: shardvault-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shardvault-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
      - name: ShardVault syntax
        run: |
          node --check src/continuity/shardvault-runtime.js
          node --check src/continuity/shardvault-memory-export.js
          node --check src/continuity/sovereign-regeneration-bundle.js
      - name: ShardVault targeted tests
        run: node --test tests/shardvault-*.test.mjs tests/release-shardvault-prep.test.mjs tests/gen2/sovereign-regeneration-bundle.test.mjs

  shardvault-full-suite:
    # PRs stay on the fast targeted path; daily and manual runs execute the
    # full regression suite without touching production infrastructure.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: shardvault-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Repository syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/shardvault-ci
      - name: Full test suite
        run: npm test
