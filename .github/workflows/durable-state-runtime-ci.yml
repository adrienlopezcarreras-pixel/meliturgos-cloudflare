name: durable-state-runtime-ci

on:
  pull_request:
    paths:
      - 'src/capabilities/planning-capabilities.js'
      - 'src/capabilities/event-bus-capabilities.js'
      - 'src/capabilities/default-bus.js'
      - 'src/router.js'
      - 'src/roadmap/master-roadmap.js'
      - 'tests/gen2/durable-state-capabilities.test.mjs'
      - 'tests/gen2/timeline-d1.test.mjs'
      - 'tests/gen2/projects-decisions-d1.test.mjs'
      - 'tests/gen2/event-bus-d1.test.mjs'
      - 'tests/release-production-smoke-routes.test.mjs'
      - '.github/workflows/deploy-cloudflare-release.yml'
      - '.github/workflows/durable-state-runtime-ci.yml'
  push:
    branches:
      - 'roadmap/gen2-12-13-40-runtime-proof-20260925'

permissions:
  contents: read

jobs:
  durable-state-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/runtime-security-gate.mjs
      - name: Syntax
        run: >
          node --check src/capabilities/planning-capabilities.js &&
          node --check src/capabilities/event-bus-capabilities.js &&
          node --check src/capabilities/default-bus.js &&
          node --check src/router.js
      - name: GEN2-12/13/40 targeted tests
        run: >
          node --test
          tests/gen2/durable-state-capabilities.test.mjs
          tests/gen2/timeline-d1.test.mjs
          tests/gen2/projects-decisions-d1.test.mjs
          tests/gen2/event-bus-d1.test.mjs
          tests/release-production-smoke-routes.test.mjs
          tests/expanded-capability-bus.test.mjs

  durable-state-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: durable-state-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git switch -c candidate/durable-state-runtime-ci
      - run: npm test
