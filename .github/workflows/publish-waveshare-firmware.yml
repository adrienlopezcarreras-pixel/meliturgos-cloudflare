name: publish-waveshare-firmware

on:
  push:
    branches:
      - 'release/waveshare-firmware-*'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact validated hardware branch SHA
        required: true
        type: string
      approval:
        description: Type PUBLISH_FIRMWARE to upload the binary and manifest to private R2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mel-waveshare-firmware-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approval || 'PUBLISH_FIRMWARE' }}
    steps:
      - name: Require explicit firmware publication approval
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "PUBLISH_FIRMWARE"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [[ "$GITHUB_REF_NAME" == release/waveshare-firmware-* ]]
          fi

      - name: Checkout exact approved SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

      - name: Prove exact checkout and canonical identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch origin candidate/mel-clean-autonomy --depth=1
            test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          fi

      - name: Prepare pinned Waveshare base
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA=283ec84c566c096f8c30493b93dcd4b0bb608de7
          git clone --filter=blob:none https://github.com/waveshareteam/ESP32-S3-Touch-LCD-3.5.git upstream-waveshare
          git -C upstream-waveshare checkout "$UPSTREAM_SHA"
          mkdir -p build/waveshare-mel
          cp -a upstream-waveshare/ESP-IDF/03_lvgl_system/. build/waveshare-mel/
          rm -f build/waveshare-mel/main/*
          cp firmware/waveshare-terminal/main/* build/waveshare-mel/main/
          cp firmware/waveshare-terminal/partitions.csv build/waveshare-mel/partitions.csv
          cp firmware/waveshare-terminal/sdkconfig.defaults build/waveshare-mel/sdkconfig.defaults
          cp firmware/waveshare-terminal/vendor/esp_es8311_port.cpp build/waveshare-mel/components/esp_port/esp_es8311_port.cpp
          cp firmware/waveshare-terminal/vendor/esp_es8311_port.h build/waveshare-mel/components/esp_port/esp_es8311_port.h

          # Keep the publish build byte-compatible with the validated firmware CI.
          sed -i 's/camera_config_t config;/camera_config_t config = {};/' build/waveshare-mel/components/esp_port/esp_camera_port.cpp
          sed -i 's/config.sccb_i2c_port = 0;/config.sccb_i2c_port = i2c_port;/' build/waveshare-mel/components/esp_port/esp_camera_port.cpp
          grep -q 'camera_config_t config = {};' build/waveshare-mel/components/esp_port/esp_camera_port.cpp
          grep -q 'config.sccb_i2c_port = i2c_port;' build/waveshare-mel/components/esp_port/esp_camera_port.cpp

          cd build/waveshare-mel
          set_cfg_y() {
            local key="$1"
            sed -i -E "/^${key}=|^# ${key} is not set/d" sdkconfig
            printf '%s=y\n' "$key" >> sdkconfig
          }
          set_cfg_n() {
            local key="$1"
            sed -i -E "/^${key}=|^# ${key} is not set/d" sdkconfig
            printf '# %s is not set\n' "$key" >> sdkconfig
          }
          set_cfg_y CONFIG_COMPILER_OPTIMIZATION_PERF
          set_cfg_y CONFIG_LV_ATTRIBUTE_FAST_MEM_USE_IRAM
          set_cfg_y CONFIG_LV_MEMCPY_MEMSET_STD
          set_cfg_y CONFIG_ESP_COEX_SW_COEXIST_ENABLE
          set_cfg_y CONFIG_BT_NIMBLE_PINNED_TO_CORE_0
          set_cfg_n CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_0
          set_cfg_y CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_1
          set_cfg_y CONFIG_BT_ENABLED
          set_cfg_y CONFIG_BTDM_CTRL_MODE_BLE_ONLY
          set_cfg_n CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY
          set_cfg_n CONFIG_BTDM_CTRL_MODE_BTDM
          set_cfg_n CONFIG_BT_BLUEDROID_ENABLED
          set_cfg_y CONFIG_BT_NIMBLE_ENABLED
          set_cfg_n CONFIG_BT_NIMBLE_ROLE_CENTRAL
          set_cfg_y CONFIG_BT_NIMBLE_ROLE_PERIPHERAL
          set_cfg_n CONFIG_BT_NIMBLE_ROLE_OBSERVER
          set_cfg_y CONFIG_BT_NIMBLE_ROLE_BROADCASTER
          set_cfg_n CONFIG_BT_NIMBLE_GATT_CLIENT
          set_cfg_y CONFIG_BT_NIMBLE_GATT_SERVER
          set_cfg_n CONFIG_OV7670_SUPPORT
          set_cfg_n CONFIG_OV7725_SUPPORT
          set_cfg_n CONFIG_NT99141_SUPPORT
          set_cfg_y CONFIG_OV2640_SUPPORT
          set_cfg_n CONFIG_OV3660_SUPPORT
          set_cfg_y CONFIG_OV5640_SUPPORT
          set_cfg_y CONFIG_SCCB_HARDWARE_I2C_PORT0
          set_cfg_n CONFIG_SCCB_HARDWARE_I2C_PORT1
          set_cfg_n CONFIG_GC2145_SUPPORT
          set_cfg_n CONFIG_GC032A_SUPPORT
          set_cfg_n CONFIG_GC0308_SUPPORT
          set_cfg_n CONFIG_BF3005_SUPPORT
          set_cfg_n CONFIG_BF20A6_SUPPORT
          set_cfg_n CONFIG_SC101IOT_SUPPORT
          set_cfg_n CONFIG_SC030IOT_SUPPORT
          set_cfg_n CONFIG_SC031GS_SUPPORT
          set_cfg_n CONFIG_MEGA_CCM_SUPPORT
          cd ../..

      - name: Build and merge image
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          path: build/waveshare-mel
          command: idf.py build && idf.py merge-bin -o mini-first-install.bin && cp build/lvgl_system.bin build/mel-terminal.bin

      - name: Generate stable manifest
        shell: bash
        run: |
          set -euo pipefail
          FW_VERSION="$(sed -n 's/^#define MEL_FW_VERSION "\([^"]*\)".*/\1/p' firmware/waveshare-terminal/main/mel_terminal.h)"
          test -n "$FW_VERSION"
          cd build/waveshare-mel/build
          OTA_SHA256="$(sha256sum mel-terminal.bin | awk '{print $1}')"
          OTA_SIZE="$(stat -c '%s' mel-terminal.bin)"
          INSTALL_SHA256="$(sha256sum mini-first-install.bin | awk '{print $1}')"
          INSTALL_SIZE="$(stat -c '%s' mini-first-install.bin)"
          cat > ../manifest.json <<JSON
          {
            "model": "waveshare-esp32-s3-touch-lcd-3.5-c",
            "channel": "stable",
            "firmware": {
              "version": "${FW_VERSION}",
              "available": true,
              "key": "devices/waveshare-esp32-s3-touch-lcd-3.5-c/mel-terminal.bin",
              "sha256": "${OTA_SHA256}",
              "size": ${OTA_SIZE},
              "source_sha": "${EXPECTED_SHA}",
              "waveshare_upstream_sha": "283ec84c566c096f8c30493b93dcd4b0bb608de7"
            },
            "installer": {
              "available": true,
              "key": "devices/waveshare-esp32-s3-touch-lcd-3.5-c/mini-first-install.bin",
              "sha256": "${INSTALL_SHA256}",
              "size": ${INSTALL_SIZE}
            },
            "assets": { "version": "1", "items": [] }
          }
          JSON

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact Wrangler
        run: npm ci

      - name: Upload OTA app image first
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put             meliturgos-private-media/devices/waveshare-esp32-s3-touch-lcd-3.5-c/mel-terminal.bin             --file build/waveshare-mel/build/mel-terminal.bin             --content-type application/octet-stream             --cache-control no-store             --remote --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload USB first-install image
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put             meliturgos-private-media/devices/waveshare-esp32-s3-touch-lcd-3.5-c/mini-first-install.bin             --file build/waveshare-mel/build/mini-first-install.bin             --content-type application/octet-stream             --cache-control no-store             --remote --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish manifest last
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put             meliturgos-private-media/devices/waveshare-esp32-s3-touch-lcd-3.5-c/manifest.json             --file build/waveshare-mel/manifest.json             --content-type application/json             --cache-control no-store             --remote --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
