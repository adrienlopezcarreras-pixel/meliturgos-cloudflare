name: publish-waveshare-firmware

on:
  push:
    branches:
      - 'release/waveshare-firmware-v0.5.0'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact validated hardware branch SHA
        required: true
        type: string
      approval:
        description: Type PUBLISH_FIRMWARE to upload the binary and manifest to private R2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mel-waveshare-firmware-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}
      APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.approval || 'PUBLISH_FIRMWARE' }}
    steps:
      - name: Require explicit firmware publication approval
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVAL" = "PUBLISH_FIRMWARE"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "release/waveshare-firmware-v0.5.0"
          fi

      - name: Checkout exact approved SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.sha }}

      - name: Prove exact checkout and canonical identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin candidate/mel-clean-autonomy --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"

      - name: Prepare pinned Waveshare base
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA=283ec84c566c096f8c30493b93dcd4b0bb608de7
          git clone --filter=blob:none https://github.com/waveshareteam/ESP32-S3-Touch-LCD-3.5.git upstream-waveshare
          git -C upstream-waveshare checkout "$UPSTREAM_SHA"
          mkdir -p build/waveshare-mel
          cp -a upstream-waveshare/ESP-IDF/03_lvgl_system/. build/waveshare-mel/
          rm -f build/waveshare-mel/main/*
          cp firmware/waveshare-terminal/main/* build/waveshare-mel/main/
          cp firmware/waveshare-terminal/partitions.csv build/waveshare-mel/partitions.csv
          cp firmware/waveshare-terminal/sdkconfig.defaults build/waveshare-mel/sdkconfig.defaults
          bash firmware/waveshare-terminal/apply-sdkconfig.sh build/waveshare-mel/sdkconfig

      - name: Build exact OTA and USB images
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          path: build/waveshare-mel
          command: >-
            idf.py build &&
            grep -Fxq 'CONFIG_OV5640_SUPPORT=y' sdkconfig &&
            grep -Fxq '# CONFIG_OV3660_SUPPORT is not set' sdkconfig &&
            grep -Fxq 'CONFIG_COMPILER_OPTIMIZATION_PERF=y' sdkconfig &&
            grep -Fxq 'CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' sdkconfig &&
            idf.py merge-bin -o mini-first-install.bin &&
            cp build/lvgl_system.bin build/mel-terminal.bin

      - name: Generate stable manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^#define MEL_FW_VERSION "\([^"]*\)"/\1/p' firmware/waveshare-terminal/main/mel_terminal.h)"
          test -n "$VERSION"
          cd build/waveshare-mel/build
          OTA_SHA256="$(sha256sum mel-terminal.bin | awk '{print $1}')"
          OTA_SIZE="$(stat -c '%s' mel-terminal.bin)"
          INSTALL_SHA256="$(sha256sum mini-first-install.bin | awk '{print $1}')"
          INSTALL_SIZE="$(stat -c '%s' mini-first-install.bin)"
          cat > ../manifest.json <<JSON
          {
            "model": "waveshare-esp32-s3-touch-lcd-3.5-c",
            "channel": "stable",
            "firmware": {
              "version": "${VERSION}",
              "available": true,
              "key": "devices/waveshare-esp32-s3-touch-lcd-3.5-c/mel-terminal.bin",
              "sha256": "${OTA_SHA256}",
              "size": ${OTA_SIZE},
              "source_sha": "${EXPECTED_SHA}",
              "waveshare_upstream_sha": "283ec84c566c096f8c30493b93dcd4b0bb608de7"
            },
            "installer": {
              "available": true,
              "key": "devices/waveshare-esp32-s3-touch-lcd-3.5-c/mini-first-install.bin",
              "sha256": "${INSTALL_SHA256}",
              "size": ${INSTALL_SIZE}
            },
            "assets": { "version": "1", "items": [] }
          }
          JSON
          sha256sum mel-terminal.bin mini-first-install.bin ../manifest.json > ../SHA256SUMS.txt

      - name: Archive publication proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MINI-publish-${{ github.sha }}
          path: |
            build/waveshare-mel/build/mel-terminal.bin
            build/waveshare-mel/build/mini-first-install.bin
            build/waveshare-mel/manifest.json
            build/waveshare-mel/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact Wrangler
        run: npm ci

      - name: Upload OTA app image first
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put \
            meliturgos-private-media/devices/waveshare-esp32-s3-touch-lcd-3.5-c/mel-terminal.bin \
            --file build/waveshare-mel/build/mel-terminal.bin \
            --content-type application/octet-stream \
            --cache-control no-store \
            --remote --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload USB first-install image
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put \
            meliturgos-private-media/devices/waveshare-esp32-s3-touch-lcd-3.5-c/mini-first-install.bin \
            --file build/waveshare-mel/build/mini-first-install.bin \
            --content-type application/octet-stream \
            --cache-control no-store \
            --remote --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish manifest last
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put \
            meliturgos-private-media/devices/waveshare-esp32-s3-touch-lcd-3.5-c/manifest.json \
            --file build/waveshare-mel/manifest.json \
            --content-type application/json \
            --cache-control no-store \
            --remote --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
