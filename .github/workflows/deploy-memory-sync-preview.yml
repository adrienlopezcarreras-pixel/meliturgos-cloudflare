name: deploy-memory-sync-preview

on:
  push:
    branches:
      - roadmap/mel-mem-02
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meliturgos-memory-sync-preview-20260915
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Verify isolated branch
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "roadmap/mel-mem-02"
          echo "Testing isolated MEL-MEM-02 at ${GITHUB_SHA}"

      - name: Syntax gate
        run: |
          node --check src/memory/exchange-sync.js
          node --check src/conversations/sync-service.js
          node --check src/memory/exchange-sync-preview-entry.js

      - name: Targeted memory sync tests
        run: node --test tests/memory/exchange-sync.test.mjs

      - name: Deploy isolated zero-write Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RAW_LOG="${RUNNER_TEMP}/memory-sync-preview-deploy.log"
          npx wrangler deploy --config wrangler.memory-sync-preview.jsonc \
            --var "MEL_DEPLOYED_GIT_SHA:${GITHUB_SHA}" \
            --var "MEL_DEPLOYED_GIT_BRANCH:${GITHUB_REF_NAME}" \
            2>&1 | tee "$RAW_LOG"
          PREVIEW_URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' "$RAW_LOG" | tail -1 || true)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL="https://meliturgos-memory-sync-preview-20260915.adrien-lopezcarreras.workers.dev"
          fi
          echo "PREVIEW_URL=${PREVIEW_URL}" >> "$GITHUB_ENV"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          {
            echo "### MEL-MEM-02 preview"
            echo "${PREVIEW_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke health and idempotent simulation
        shell: bash
        run: |
          set -euo pipefail
          HTTP="000"
          for attempt in 1 2 3 4 5 6; do
            HTTP=$(curl --silent --show-error --location --max-time 20 \
              --output health.json --write-out '%{http_code}' "${PREVIEW_URL}/health" || true)
            [ "$HTTP" = "200" ] && break
            sleep 3
          done
          test "$HTTP" = "200"

          SIM_STATUS=$(curl --silent --show-error --max-time 20 \
            --header 'content-type: application/json' \
            --data '{"messages":[{"id":"smoke-1","conversationId":"smoke-conv","role":"user","content":"MEL doit mémoriser cet échange sans doublon.","timestamp":1700000000000,"provenance":"smoke"}]}' \
            --output simulate.json --write-out '%{http_code}' "${PREVIEW_URL}/simulate")
          test "$SIM_STATUS" = "200"

          node - <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          const sim = JSON.parse(fs.readFileSync('simulate.json', 'utf8'));
          if (!health.ok || health.persistent_writes !== false || health.d1_bound !== false) process.exit(1);
          if (!sim.ok || sim.persistent_writes !== false) process.exit(1);
          if (sim.first.inserted !== 1 || sim.replay.inserted !== 0 || sim.replay.alreadyPresent !== 1) process.exit(1);
          if (sim.ephemeral_candidates !== 1) process.exit(1);
          NODE

          {
            echo "### Smoke checks"
            echo "- /health: ${HTTP}, zero persistent writes"
            echo "- /simulate: ${SIM_STATUS}, first insert=1, replay insert=0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production still responds
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PROD_STATUS=$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            https://meliturgos.adrien-lopezcarreras.workers.dev)
          echo "Production HTTP: ${PROD_STATUS}"
          case "$PROD_STATUS" in
            2??|3??|401) ;;
            *) echo "Unexpected production HTTP status: $PROD_STATUS"; exit 22 ;;
          esac
          echo "Production read-only verification: ${PROD_STATUS}" >> "$GITHUB_STEP_SUMMARY"
