name: gen2-36-platform-connectors-ci

on:
  push:
    branches:
      - 'candidate/gen2-36-*'
  pull_request:
    branches:
      - main
    paths:
      - 'src/capabilities/platform-read-capabilities.js'
      - 'src/capabilities/platform-control-capabilities.js'
      - 'src/capabilities/default-bus.js'
      - 'src/connectors/github.js'
      - 'src/connectors/cloudflare.js'
      - 'src/connectors/vercel.js'
      - 'src/roadmap/master-roadmap.js'
      - 'wrangler.jsonc'
      - '.github/workflows/gen2-36-provider-write-smoke.yml'
      - '.github/workflows/gen2-36-authenticated-provider-smokes.yml'
      - 'tests/gen2/platform-read-capabilities.test.mjs'
      - 'tests/gen2/platform-control-capabilities.test.mjs'
      - 'tests/gen2/platform-auth-smoke-workflow.test.mjs'
      - 'tests/approval-gates.test.mjs'
      - '.github/workflows/gen2-36-platform-connectors-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Targeted GEN2-36 tests
        run: node --test tests/gen2/platform-read-capabilities.test.mjs tests/gen2/platform-control-capabilities.test.mjs tests/gen2/platform-auth-smoke-workflow.test.mjs tests/connectors-security.test.mjs tests/approval-gates.test.mjs
      - name: Syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/gen2-36-ci
      - name: Full test suite
        run: npm test
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
