name: Companion Sovereignty Timeout CI
on:
  pull_request:
    paths:
      - 'src/portability/companion-sovereignty-executor.js'
      - 'tests/gen2/companion-sovereignty-timeout-cancel.test.mjs'
      - '.github/workflows/companion-sovereignty-timeout-ci.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/gen2/companion-sovereignty-timeout-cancel.test.mjs
