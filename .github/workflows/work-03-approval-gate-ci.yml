name: work-03 approval gate CI

on:
  push:
    branches:
      - 'roadmap/work-03-approval-gate-20260922'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Targeted approval and Work tests
        run: |
          node --test             tests/approval-gates.test.mjs             tests/capability-permissions-enforcement.test.mjs             tests/work-persistent-capabilities.test.mjs             tests/gen2/computer-use.test.mjs             tests/gen2/browser-capability.test.mjs
      - name: Full suite on candidate alias
        run: |
          git checkout -B candidate/release-ci-head "$GITHUB_SHA"
          npm test
