name: Security npm audit remediate 2026-09-15

on:
  push:
    branches:
      - security/npm-audit-high-20260915
    paths:
      - .github/workflows/security-npm-audit-remediate-20260915.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile on patched Wrangler line
        run: npm install --package-lock-only --ignore-scripts --save-dev wrangler@^4.132.0
      - name: Install exact refreshed lockfile
        run: npm ci --ignore-scripts
      - name: Require zero high or critical audit findings
        run: npm audit --audit-level=high
      - name: Syntax check
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Show resolved toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./node_modules/wrangler/package.json'); console.log('wrangler='+p.version)"
          node -e "const p=require('./node_modules/miniflare/package.json'); console.log('miniflare='+p.version)"
          node -e "const p=require('./node_modules/sharp/package.json'); console.log('sharp='+p.version)"
      - name: Commit lockfile remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes to commit"
            exit 0
          fi
          git commit -m "fix(security): refresh lockfile for patched Wrangler"
          git push origin HEAD:security/npm-audit-high-20260915
