name: gen2-36-authenticated-provider-smokes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gen2-36-authenticated-provider-smokes.yml'
      - '.github/workflows/gen2-36-provider-write-smoke.yml'
      - 'src/capabilities/platform-control-capabilities.js'
      - 'src/capabilities/platform-read-capabilities.js'
      - 'wrangler.jsonc'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  github-dispatch-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch harmless authenticated GitHub smoke
        shell: bash
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/gen2-36-provider-write-smoke.yml/dispatches" \
            -f ref=main

          RUN_ID=""
          for attempt in $(seq 1 20); do
            RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gen2-36-provider-write-smoke.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            RUN_ID="$(RUN_JSON="$RUN_JSON" STARTED_AT="$STARTED_AT" node - <<'NODE'
          const payload = JSON.parse(process.env.RUN_JSON || '{}');
          const started = Date.parse(process.env.STARTED_AT || 0);
          const run = (payload.workflow_runs || []).find(row =>
            row?.event === 'workflow_dispatch'
            && row?.head_branch === 'main'
            && Date.parse(row?.created_at || 0) >= started - 5000
          );
          process.stdout.write(run ? String(run.id) : '');
          NODE
            )"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 3
          done
          test -n "$RUN_ID"

          for attempt in $(seq 1 30); do
            RUN_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            STATUS="$(RUN_STATE="$RUN_STATE" node -e "const x=JSON.parse(process.env.RUN_STATE||'{}'); process.stdout.write(String(x.status||''))")"
            CONCLUSION="$(RUN_STATE="$RUN_STATE" node -e "const x=JSON.parse(process.env.RUN_STATE||'{}'); process.stdout.write(String(x.conclusion||''))")"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success"
              echo "GitHub authenticated workflow dispatch smoke passed: run ${RUN_ID}"
              exit 0
            fi
            sleep 3
          done
          echo "Timed out waiting for dispatched GitHub smoke run ${RUN_ID}" >&2
          exit 1

  cloudflare-auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Prove authenticated Cloudflare Worker target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          HTTP_CODE="$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            --output /tmp/gen2-36-cloudflare.json \
            --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}")"
          test "$HTTP_CODE" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/gen2-36-cloudflare.json', 'utf8'));
          if (payload?.success !== true) throw new Error('CLOUDFLARE_AUTH_SMOKE_FAILED');
          const accountId = String(process.env.CLOUDFLARE_ACCOUNT_ID || '');
          if (String(payload?.result?.id || '') !== accountId) {
            throw new Error('CLOUDFLARE_ACCOUNT_TARGET_MISMATCH');
          }
          console.log('Cloudflare authenticated account smoke passed.');
          NODE

  vercel-auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Prove authenticated Vercel account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning title=GEN2-36 Vercel blocked::VERCEL_TOKEN_MISSING"
            {
              echo "### GEN2-36 Vercel"
              echo "BLOCKED_HUMAN: VERCEL_TOKEN is not configured in GitHub Actions."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          HTTP_CODE="$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Accept: application/json" \
            --output /tmp/gen2-36-vercel.json \
            --write-out '%{http_code}' \
            "https://api.vercel.com/v2/user")"
          test "$HTTP_CODE" = "200"
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/gen2-36-vercel.json', 'utf8'));
          if (!payload?.user?.id) throw new Error('VERCEL_AUTH_SMOKE_FAILED');
          console.log('Vercel authenticated account smoke passed.');
          NODE
