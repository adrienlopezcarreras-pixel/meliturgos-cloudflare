name: mini-windows-updater
# AUDIO ZERO proof package. Do not replace this firmware with a voice/BLE build.

on:
  workflow_dispatch:
  push:
    branches:
      - proof/mini-audio-zero-es8311-20261008
    paths:
      - ".github/workflows/mini-windows-updater.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install packager
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check esptool==4.8.1 pyinstaller==6.11.1

      - name: Verify exact audio-zero firmware run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 37788061341 --repo "${{ github.repository }}" --exit-status --interval 10

      - name: Download exact audio-zero firmware
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37788061341 `
            --repo "${{ github.repository }}" `
            --name "MEL-Waveshare-3.5-C-7552c853123138e20217a3668722ced965ef1921" `
            --dir firmware-artifact
          if (!(Test-Path "firmware-artifact/build/mel-terminal.bin")) {
            throw "Validated AUDIO ZERO firmware binary missing"
          }

      - name: Build standalone updater
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "MEL-MINI-AUDIO-ZERO-PROOF" `
            --collect-all esptool `
            --collect-all serial `
            --add-data "firmware-artifact/build/mel-terminal.bin;." `
            tools/mini-updater/mini_updater.py

      - name: Self-test updater
        shell: pwsh
        run: |
          & ".\dist\MEL-MINI-AUDIO-ZERO-PROOF.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash ".\dist\MEL-MINI-AUDIO-ZERO-PROOF.exe" -Algorithm SHA256 |
            Format-List | Out-File ".\dist\MEL-MINI-AUDIO-ZERO-PROOF.sha256.txt"

      - name: Upload updater
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL-MINI-AUDIO-ZERO-PROOF
          path: |
            dist/MEL-MINI-AUDIO-ZERO-PROOF.exe
            dist/MEL-MINI-AUDIO-ZERO-PROOF.sha256.txt
          if-no-files-found: error
          retention-days: 30
