name: mini-windows-updater

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mini-wifi-internet-diagnostics
    paths:
      - "tools/mini-updater/**"
      - ".github/workflows/mini-windows-updater.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install packager
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check esptool==4.8.1 pyinstaller==6.11.1

      - name: Download validated 0.6.14 firmware
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37780393051 `
            --repo "${{ github.repository }}" `
            --name "MEL-Waveshare-3.5-C-4e81ce9fb9c689a1d237cde535bf6b218566be92" `
            --dir firmware-artifact
          if (!(Test-Path "firmware-artifact/build/mel-terminal.bin")) {
            throw "Validated firmware binary missing"
          }

      - name: Build standalone updater
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "MEL-MINI-Updater-0.6.14" `
            --collect-all esptool `
            --collect-all serial `
            --add-data "firmware-artifact/build/mel-terminal.bin;." `
            tools/mini-updater/mini_updater.py

      - name: Self-test updater
        shell: pwsh
        run: |
          & ".\dist\MEL-MINI-Updater-0.6.14.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash ".\dist\MEL-MINI-Updater-0.6.14.exe" -Algorithm SHA256 |
            Format-List | Out-File ".\dist\MEL-MINI-Updater-0.6.14.sha256.txt"

      - name: Upload updater
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL-MINI-Updater-0.6.14
          path: |
            dist/MEL-MINI-Updater-0.6.14.exe
            dist/MEL-MINI-Updater-0.6.14.sha256.txt
          if-no-files-found: error
          retention-days: 30
