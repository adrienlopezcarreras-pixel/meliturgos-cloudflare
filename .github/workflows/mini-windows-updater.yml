name: mini-windows-updater

on:
  workflow_dispatch:
  push:
    branches:
      - fix/mini-wifi-internet-diagnostics
      - package/mini-updater-v2-20261006
      - fix/mini-apk-v2-token-relay-20261006
      - fix/mini-v0.5.15-native-16k-audio-20261006
    paths:
      - "tools/mini-updater/**"
      - ".github/workflows/mini-windows-updater.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install packager
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check esptool==4.8.1 pyinstaller==6.11.1

      - name: Wait for exact Link V2 firmware
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 37526313483 --repo "${{ github.repository }}" --exit-status --interval 10

      - name: Download exact Link V2 firmware
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 37526313483 `
            --repo "${{ github.repository }}" `
            --name "MEL-Waveshare-3.5-C-d3614d15b9d9c0aa8c8d0014c7d5914d33a667eb" `
            --dir firmware-artifact
          if (!(Test-Path "firmware-artifact/build/mel-terminal.bin")) {
            throw "Validated Link V2 firmware binary missing"
          }

      - name: Build standalone updater
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "MEL-MINI-Updater-0.5.15-Native16kAudio" `
            --collect-all esptool `
            --collect-all serial `
            --add-data "firmware-artifact/build/mel-terminal.bin;." `
            tools/mini-updater/mini_updater.py

      - name: Self-test updater
        shell: pwsh
        run: |
          & ".\dist\MEL-MINI-Updater-0.5.15-Native16kAudio.exe" --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash ".\dist\MEL-MINI-Updater-0.5.15-Native16kAudio.exe" -Algorithm SHA256 |
            Format-List | Out-File ".\dist\MEL-MINI-Updater-0.5.15-Native16kAudio.sha256.txt"

      - name: Upload updater
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL-MINI-Updater-0.5.15-Native16kAudio
          path: |
            dist/MEL-MINI-Updater-0.5.15-Native16kAudio.exe
            dist/MEL-MINI-Updater-0.5.15-Native16kAudio.sha256.txt
          if-no-files-found: error
          retention-days: 30
