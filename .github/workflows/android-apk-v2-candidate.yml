name: android-apk-v2-candidate

on:
  push:
    branches:
      - fix/mini-v0.5.15-native-16k-audio-20261006

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/android-companion-source-contract.test.mjs tests/mini-link-v2-audio-contract.test.mjs

      - name: Run Android unit tests
        working-directory: android-companion
        shell: bash
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mel-stable-test.jks"

      - name: Build signed APK
        working-directory: android-companion
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mel-stable-test.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/MEL-Android-0.7.1-Link-V2.apk
          sha256sum dist/MEL-Android-0.7.1-Link-V2.apk | tee dist/MEL-Android-0.7.1-Link-V2.apk.sha256
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/MEL-Android-0.7.1-Link-V2.apk

      - name: Upload candidate APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL-Android-0.7.1-Link-V2-${{ github.sha }}
          path: |
            android-companion/dist/MEL-Android-0.7.1-Link-V2.apk
            android-companion/dist/MEL-Android-0.7.1-Link-V2.apk.sha256
          if-no-files-found: error
          retention-days: 14
