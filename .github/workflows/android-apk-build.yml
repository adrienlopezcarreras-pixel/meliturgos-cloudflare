name: android-apk-build

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - "android-companion/**"
      - ".github/workflows/android-apk-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build installable debug APK
        working-directory: android-companion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MEL-Android-debug.apk
          sha256sum dist/MEL-Android-debug.apk | tee dist/MEL-Android-debug.apk.sha256

      - name: Verify APK package
        working-directory: android-companion
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/MEL-Android-debug.apk"
          aapt dump badging "$APK" | tee dist/apk-badging.txt
          grep -q "package: name='fr.veriteinterdite.mel'" dist/apk-badging.txt
          grep -q "launchable-activity:" dist/apk-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL-Android-debug-${{ github.sha }}
          path: |
            android-companion/dist/MEL-Android-debug.apk
            android-companion/dist/MEL-Android-debug.apk.sha256
            android-companion/dist/apk-badging.txt
          if-no-files-found: error
          retention-days: 14
