name: android-apk-build

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - "android-companion/**"
      - ".github/workflows/android-apk-build.yml"
      - "tests/android-companion-*.test.mjs"
      - "src/devices/android-companion-api.js"
      - "src/api/file-upload.js"
  pull_request:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - "android-companion/**"
      - ".github/workflows/android-apk-build.yml"
      - "tests/android-companion-*.test.mjs"
      - "src/devices/android-companion-api.js"
      - "src/api/file-upload.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Android source and API contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/android-companion-source-contract.test.mjs tests/android-companion-api.test.mjs

      - name: Run Android companion unit tests
        working-directory: android-companion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build installable debug APK
        working-directory: android-companion
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MEL-Android-debug.apk
          sha256sum dist/MEL-Android-debug.apk | tee dist/MEL-Android-debug.apk.sha256

      - name: Verify APK package
        working-directory: android-companion
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/MEL-Android-debug.apk"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee dist/apk-badging.txt
          grep -q "package: name='fr.veriteinterdite.mel'" dist/apk-badging.txt
          grep -q "launchable-activity:" dist/apk-badging.txt

      - name: Prepare persistent signing key for installable test APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mel-stable-test.jks"
          test -s "$RUNNER_TEMP/mel-stable-test.jks"

      - name: Build persistent-signed installable APK
        working-directory: android-companion
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mel-stable-test.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" dist/MEL-Android-stable-test.apk
          sha256sum dist/MEL-Android-stable-test.apk | tee dist/MEL-Android-stable-test.apk.sha256
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/MEL-Android-stable-test.apk | tee dist/stable-test-signature.txt

      - name: Validate unsigned release variant
        working-directory: android-companion
        env:
          ANDROID_KEYSTORE_PATH: ""
          ANDROID_KEYSTORE_PASSWORD: ""
          ANDROID_KEY_ALIAS: ""
          ANDROID_KEY_PASSWORD: ""
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee dist/release-preflight-badging.txt
          grep -q "package: name='fr.veriteinterdite.mel'" dist/release-preflight-badging.txt
          grep -q "launchable-activity:" dist/release-preflight-badging.txt
          sha256sum "$APK" | tee dist/release-preflight.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL-Android-debug-${{ github.sha }}
          path: |
            android-companion/dist/MEL-Android-debug.apk
            android-companion/dist/MEL-Android-debug.apk.sha256
            android-companion/dist/apk-badging.txt
            android-companion/dist/MEL-Android-stable-test.apk
            android-companion/dist/MEL-Android-stable-test.apk.sha256
            android-companion/dist/stable-test-signature.txt
            android-companion/dist/release-preflight-badging.txt
            android-companion/dist/release-preflight.apk.sha256
          if-no-files-found: error
          retention-days: 14
