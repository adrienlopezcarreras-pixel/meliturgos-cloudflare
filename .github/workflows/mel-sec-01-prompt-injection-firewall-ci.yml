name: MEL-SEC-01 prompt injection firewall CI

on:
  push:
    branches:
      - 'roadmap/mel-sec-01-prompt-injection-firewall-20260921'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Prompt injection boundary tests
        run: node --test tests/prompt-injection-firewall.test.mjs tests/context-priority.test.mjs tests/tool-context-grounding.test.mjs
