name: check-runtime-secret-sources

on:
  push:
    branches:
      - ops/repair-owner-auth-20261006
    paths:
      - .github/workflows/check-runtime-secret-sources.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MEL_OAUTH_ENCRYPTION_KEY_ID: ${{ secrets.MEL_OAUTH_ENCRYPTION_KEY_ID }}
      MEL_OAUTH_ENCRYPTION_KEY_B64: ${{ secrets.MEL_OAUTH_ENCRYPTION_KEY_B64 }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.MICROSOFT_OAUTH_CLIENT_SECRET }}
      YAHOO_OAUTH_CLIENT_ID: ${{ secrets.YAHOO_OAUTH_CLIENT_ID }}
      YAHOO_OAUTH_CLIENT_SECRET: ${{ secrets.YAHOO_OAUTH_CLIENT_SECRET }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          set -euo pipefail
          for NAME in             MEL_OAUTH_ENCRYPTION_KEY_ID             MEL_OAUTH_ENCRYPTION_KEY_B64             VERCEL_TOKEN             GOOGLE_OAUTH_CLIENT_ID             GOOGLE_OAUTH_CLIENT_SECRET             MICROSOFT_OAUTH_CLIENT_ID             MICROSOFT_OAUTH_CLIENT_SECRET             YAHOO_OAUTH_CLIENT_ID             YAHOO_OAUTH_CLIENT_SECRET
          do
            if [ -n "${!NAME:-}" ]; then
              echo "SECRET_PRESENT ${NAME}=true"
            else
              echo "SECRET_PRESENT ${NAME}=false"
            fi
          done
