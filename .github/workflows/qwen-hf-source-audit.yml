name: Qwen3 Hugging Face source audit (no GPU)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/qwen-hf-source-audit.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: "Immutable 40-character Hugging Face dataset commit SHA"
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_REVISION: ${{ inputs.revision || 'a7c5a771f9f44fb04f35ec9f05abeccd32ecca83' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download pinned source, hash and validate splits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-qwen-audit artifacts
          python - <<'PY'
          import hashlib,json,os,re,urllib.parse,urllib.request
          from pathlib import Path
          rev=os.environ['HF_REVISION']
          if not re.fullmatch(r'[0-9a-f]{40}',rev):
              raise SystemExit('QWEN_HF_REVISION_MUST_BE_IMMUTABLE_SHA')
          name='exported (1).jsonl'
          url=('https://huggingface.co/datasets/Guilherme34/uncensor/resolve/'
               +rev+'/'+urllib.parse.quote(name))
          request=urllib.request.Request(url,headers={'User-Agent':'MEL-Qwen-source-audit/1.0'})
          target=Path('.tmp-qwen-audit/source.jsonl')
          h=hashlib.sha256()
          size=0
          with urllib.request.urlopen(request,timeout=45) as response,target.open('wb') as dest:
              while True:
                  block=response.read(65536)
                  if not block: break
                  size+=len(block)
                  if size>10_000_000:
                      raise SystemExit('QWEN_HF_FILE_EXCEEDS_AUDIT_LIMIT')
                  h.update(block)
                  dest.write(block)
          sha='sha256:'+h.hexdigest()
          print('QWEN_HF_SOURCE_SHA256='+sha)
          os.environ['QWEN_HF_SOURCE_SHA256']=sha
          import importlib.util
          spec=importlib.util.spec_from_file_location('qwen_import','scripts/import-qwen-uncensor-jsonl.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          result=mod.convert(target,Path('.tmp-qwen-audit/train-only.jsonl'),sha)
          result.update(source_repo='Guilherme34/uncensor',source_revision=rev,
                        source_filename=name,source_bytes=size,
                        license_review_passed=False,kaggle_published=False,
                        model_activated=False)
          Path('artifacts/source-audit.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          print('QWEN_HF_UNREVIEWED_AUDIT_COMPLETED_NO_GPU')
          PY
      - name: Upload audit summary only (no dataset)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-hf-source-audit-${{ github.run_id }}
          path: artifacts/source-audit.json
          if-no-files-found: error
