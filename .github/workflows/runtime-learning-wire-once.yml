name: Runtime learning wiring once

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - .github/workflows/runtime-learning-wire-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/mel-clean-autonomy
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical runtime wiring
        run: node scripts/patch-runtime-learning-settings.mjs
      - name: Targeted tests
        run: node --test tests/native-chat-inference-settings.test.mjs
      - name: Syntax
        run: npm ci && npm run check
      - name: Commit candidate changes
        run: |
          git config user.name "mel-autonomy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/api/native-chat.js tests/native-chat-inference-settings.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: consume promoted inference settings in native chat"
          git push origin HEAD:candidate/mel-clean-autonomy
