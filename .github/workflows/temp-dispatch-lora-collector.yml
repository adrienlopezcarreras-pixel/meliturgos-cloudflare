name: temp-dispatch-lora-collector

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - '.github/workflows/temp-dispatch-lora-collector.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical LoRA collector
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run lora-kaggle-free-collect.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f activate_preview=false \
            -f wait_for_completion=true \
            -f max_wait_minutes=90
