name: final-production-shardvault-until-found-d62f63b8

on:
  push:
    branches:
      - release/shardvault-until-found-d62f63b8
    paths:
      - .github/workflows/final-production-shardvault-until-found-d62f63b8.yml

permissions:
  contents: read

concurrency:
  group: meliturgos-cloudflare-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact approved SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d62f63b8153e9beb9c06fe2657822e67f7da6885
          fetch-depth: 1

      - name: Prove immutable promotion identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d62f63b8153e9beb9c06fe2657822e67f7da6885"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax gate
        run: npm run check

      - name: Full regression gate
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B candidate/release-ci-head d62f63b8153e9beb9c06fe2657822e67f7da6885
          npm test

      - name: Probe documented external providers
        id: external_probe
        shell: bash
        run: |
          set +e
          head -c 1024 /dev/urandom > shard-probe.bin
          success=0

          echo "Testing temp.sh..."
          temp_url="$(curl -fsS --max-time 20 -F "file=@shard-probe.bin" https://temp.sh/upload 2>/tmp/temp.err)"
          if printf '%s' "$temp_url" | grep -q '^https://'; then
            curl -fsSL --max-time 20 "$temp_url" -o temp-roundtrip.bin
            if cmp -s shard-probe.bin temp-roundtrip.bin; then
              echo "temp.sh round-trip: PASS"
              success=1
            else
              echo "temp.sh round-trip: content mismatch"
            fi
          else
            echo "temp.sh upload failed: $(cat /tmp/temp.err)"
          fi

          echo "Testing filebin..."
          bin="melshardvault-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          filebin_url="https://filebin.net/${bin}/shard.bin"
          curl -fsS --max-time 20 -X POST --data-binary @shard-probe.bin "$filebin_url" -o /tmp/filebin-upload.json
          upload_rc=$?
          if [ "$upload_rc" -eq 0 ]; then
            curl -sS --max-time 20 -c /tmp/filebin.cookies "$filebin_url" -o /tmp/filebin-preflight || true
            curl -fsSL --max-time 20 -b /tmp/filebin.cookies "$filebin_url" -o filebin-roundtrip.bin
            if cmp -s shard-probe.bin filebin-roundtrip.bin; then
              echo "filebin round-trip: PASS"
              success=1
            else
              echo "filebin round-trip: unavailable or content mismatch"
            fi
          else
            echo "filebin upload unavailable"
          fi

          echo "external_provider_available=$success" >> "$GITHUB_OUTPUT"
          if [ "$success" -eq 1 ]; then
            echo "At least one documented external provider passed a real write/read probe."
          else
            echo "No provider passed right now; MEL will continue hourly search after deployment."
          fi
          exit 0

      - name: Build immutable source survival archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=mel-source-d62f63b8153e9beb9c06fe2657822e67f7da6885.tar.gz d62f63b8153e9beb9c06fe2657822e67f7da6885
          test -s mel-source-d62f63b8153e9beb9c06fe2657822e67f7da6885.tar.gz

      - name: Seed exact code archive into R2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put "meliturgos-private-media/shardvault/code/adrienlopezcarreras-pixel__meliturgos-cloudflare/d62f63b8153e9beb9c06fe2657822e67f7da6885.tar.gz" \
            --file="mel-source-d62f63b8153e9beb9c06fe2657822e67f7da6885.tar.gz" \
            --content-type="application/gzip" \
            --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy exact approved SHA
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --define "MEL_DEPLOYED_GIT_SHA:'d62f63b8153e9beb9c06fe2657822e67f7da6885'" \
            --define "MEL_DEPLOYED_GIT_BRANCH:'release/shardvault-until-found-d62f63b8'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production responds
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 --output production-root.html --write-out '%{http_code}' https://meliturgos.adrien-lopezcarreras.workers.dev)"
          case "$code" in
            2??|3??|401) ;;
            *) echo "Unexpected production HTTP status: $code"; exit 22 ;;
          esac
