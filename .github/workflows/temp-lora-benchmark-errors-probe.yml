name: temp-lora-benchmark-errors-probe

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - '.github/workflows/temp-lora-benchmark-errors-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read latest LoRA benchmark errors from preview
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_PASSWORD="$(python - <<'PY'
          import hashlib,hmac,os
          token=os.environ['CLOUDFLARE_API_TOKEN'].encode()
          print(hmac.new(token,b'meliturgos-preview-auth-v1',hashlib.sha256).hexdigest())
          PY
          )"
          echo "::add-mask::$PREVIEW_PASSWORD"
          BASE="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          curl --fail-with-body --show-error --silent --max-time 45             --header "Authorization: Bearer $PREVIEW_PASSWORD"             "$BASE/api/learning/progress" > progress.json
          node - <<'NODE'
          const d=require('./progress.json');
          function walk(x,path='root',out=[]){
            if(!x||typeof x!=='object') return out;
            if(Array.isArray(x)){
              x.forEach((v,i)=>walk(v,path+'['+i+']',out));
              return out;
            }
            const kind=String(x.kind||x.type||'');
            const model=String(x.model_id||'');
            const adapter=String(x.adapter_id||'');
            const cases=Array.isArray(x.cases)?x.cases:null;
            if(/lora/i.test(kind) || /mistral-7b-instruct-v0\.2-lora/i.test(model) || adapter){
              out.push({
                path,kind,model_id:model||null,adapter_id:adapter||null,
                overall:x.overall??x.score??x.measured_score??null,
                metadata:x.metadata||null,
                cases:cases?cases.map(c=>({id:c.id,score:c.score,error:c.error||null,latency_ms:c.latency_ms??null})):null
              });
            }
            for(const [k,v] of Object.entries(x)) walk(v,path+'.'+k,out);
            return out;
          }
          const rows=walk(d);
          const filtered=rows.filter(r=>r.adapter_id||/lora-(baseline|candidate)/i.test(r.kind||'')||/lora-impact/i.test(r.kind||''));
          console.log(JSON.stringify(filtered.slice(-20),null,2));
          NODE
