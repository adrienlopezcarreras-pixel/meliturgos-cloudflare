name: preview-learning-transport-ci

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-candidate-preview.yml'
      - '.github/workflows/preview-learning-transport-ci.yml'
      - 'tests/preview-learning-transport-retry.test.mjs'

permissions:
  contents: read

jobs:
  bounded-preview-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Check shell transport retries with local simulated curl
        run: node --test tests/preview-learning-transport-retry.test.mjs
