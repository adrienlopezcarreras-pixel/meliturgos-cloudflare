name: MEL Core model deadline CI

on:
  pull_request:
    paths:
      - 'src/models/ModelRouter.js'
      - 'src/models/refusal-analyzer.js'
      - 'tests/model-router-deadline-coverage.test.mjs'
      - 'tests/model-router-augmentio.test.mjs'
      - '.github/workflows/mel-core-model-deadline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-deadline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and imports
        run: npm run check
      - name: Model router timeout and compatibility
        run: node --test tests/model-router-deadline-coverage.test.mjs tests/model-router-augmentio.test.mjs tests/phase5-model-router.test.mjs
      - name: Full regression suite
        run: |
          git checkout -B candidate/mel-core-model-deadline-ci "$(git rev-parse HEAD)"
          npm test
