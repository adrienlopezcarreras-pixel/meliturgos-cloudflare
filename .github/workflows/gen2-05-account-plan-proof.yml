name: gen2-05-live-provider-proof

on:
  push:
    branches:
      - 'feat/gen2-05-runtime-capability'
    paths:
      - '.github/workflows/gen2-05-account-plan-proof.yml'

permissions:
  contents: read

concurrency:
  group: gen2-05-live-provider-proof
  cancel-in-progress: true

jobs:
  live-workers-ai-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Validate GEN2-05 proof parser before any inference
        run: node --test tests/gen2/workers-ai-zero-cost-proof.test.mjs

      - name: Build authoritative short-lived Workers Free proof
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          ACCOUNT_CODE="$(curl --silent --show-error --max-time 30             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --output account.json             --write-out '%{http_code}'             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" || true)"
          ENT_CODE="$(curl --silent --show-error --max-time 30             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             --output entitlements.json             --write-out '%{http_code}'             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/entitlements" || true)"

          test "${ACCOUNT_CODE}" = "200"
          test "${ENT_CODE}" = "200"

          node - <<'NODE'
          const fs=require('fs');
          const account=JSON.parse(fs.readFileSync('account.json','utf8'));
          const ent=JSON.parse(fs.readFileSync('entitlements.json','utf8'));
          if(account?.success!==true || ent?.success!==true || !Array.isArray(ent?.result)) {
            throw new Error('CLOUDFLARE_PLAN_EVIDENCE_INVALID');
          }
          const accountType=String(account?.result?.type||'').toLowerCase();
          if(accountType!=='standard') throw new Error('WORKERS_FREE_ACCOUNT_TYPE_NOT_PROVED');

          const marker=ent.result.find(row =>
            String(row?.feature?.key||row?.id||'') === 'workers.static_assets.manifest_limit_file_count'
          );
          const markerValue=Number(marker?.allocation?.value);
          if(markerValue!==20000) {
            throw new Error('WORKERS_FREE_ENTITLEMENT_NOT_PROVED:'+String(markerValue));
          }

          const now=Date.now();
          const proof={
            schema:'mel.workers-ai.zero-cost-proof/v1',
            provider:'workers-ai',
            account_plan:'WORKERS_FREE',
            billing_path:'direct-workers-ai-binding',
            pricing_policy:'cloudflare-workers-ai-pricing-2026-08-28',
            free_allocation_neurons_per_day:10000,
            free_overage_behavior:'FAIL_NOT_BILL',
            plan_evidence:{
              source:'cloudflare-account-entitlements-api',
              account_type:'standard',
              entitlement_key:'workers.static_assets.manifest_limit_file_count',
              entitlement_value:markerValue,
              workers_free_reference_value:20000,
            },
            models:[
              '@cf/zai-org/glm-4.7-flash',
              '@cf/meta/llama-3.3-70b-instruct-fp8-fast',
              '@cf/google/gemma-3-12b-it',
            ],
            verified_at:new Date(now).toISOString(),
            expires_at:new Date(now+30*60*1000).toISOString(),
          };

          const config={
            $schema:'node_modules/wrangler/config-schema.json',
            name:'meliturgos-gen2-05-live-proof',
            main:'src/visual-final-entry.js',
            compatibility_date:'2026-09-04',
            workers_dev:true,
            ai:{binding:'AI'},
            vars:{
              MELITURGOS_USER:'adrien',
              MEL_RUNTIME_ENV:'gen2-05-live-proof',
              MEL_GITHUB_REPOSITORY:'adrienlopezcarreras-pixel/meliturgos-cloudflare',
              MEL_WORKERS_AI_ZERO_COST_PROOF_JSON:JSON.stringify(proof),
            },
          };
          fs.writeFileSync('wrangler.gen2-05-live-proof.json',JSON.stringify(config,null,2));

          const safe={
            schema:'mel.gen2-05.live-plan-proof/v1',
            account_type:accountType,
            entitlement_key:proof.plan_evidence.entitlement_key,
            entitlement_value:markerValue,
            account_plan:proof.account_plan,
            pricing_policy:proof.pricing_policy,
            free_allocation_neurons_per_day:proof.free_allocation_neurons_per_day,
            free_overage_behavior:proof.free_overage_behavior,
            verified_at:proof.verified_at,
            expires_at:proof.expires_at,
            models:proof.models,
          };
          fs.writeFileSync('gen2-05-live-plan-proof.json',JSON.stringify(safe,null,2));
          console.log(JSON.stringify(safe,null,2));
          NODE

      - name: Deploy isolated Worker with short-lived zero-cost proof
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.gen2-05-live-proof.json             --define "MEL_DEPLOYED_GIT_SHA:'${GITHUB_SHA}'"             --define "MEL_DEPLOYED_GIT_BRANCH:'${GITHUB_REF_NAME}'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure isolated proof authentication
        shell: bash
        run: |
          set -euo pipefail
          PROOF_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::${PROOF_PASSWORD}"
          echo "GEN2_05_PROOF_PASSWORD=${PROOF_PASSWORD}" >> "${GITHUB_ENV}"
          printf '%s' "${PROOF_PASSWORD}" | npx wrangler secret put MELITURGOS_PASSWORD             --config wrangler.gen2-05-live-proof.json             --name meliturgos-gen2-05-live-proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prove two real providers plus separate MEL synthesis
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-gen2-05-live-proof.adrien-lopezcarreras.workers.dev"

          ready=0
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --max-time 30               --header "Authorization: Bearer ${GEN2_05_PROOF_PASSWORD}"               --output readiness.json               --write-out '%{http_code}'               "${BASE_URL}/api/gen2/readiness?refresh=1" || true)"
            if [ "${code}" = "200" ]; then ready=1; break; fi
            sleep 3
          done
          test "${ready}" -eq 1

          council_code="$(curl --silent --show-error --max-time 120             --header "Authorization: Bearer ${GEN2_05_PROOF_PASSWORD}"             --header "content-type: application/json"             --data '{"request":{"prompt":"Independently assess this factual statement in one short sentence: 2 + 2 = 4. State whether it is correct."},"capability":"GENERAL","maxCandidates":2,"timeoutMs":90000}'             --output council.json             --write-out '%{http_code}'             "${BASE_URL}/api/gen2/model-council" || true)"
          test "${council_code}" = "200"

          GITHUB_SHA="${GITHUB_SHA}" node - <<'NODE'
          const fs=require('fs');
          const readiness=JSON.parse(fs.readFileSync('readiness.json','utf8'));
          const council=JSON.parse(fs.readFileSync('council.json','utf8'));
          const runtime=readiness?.models?.runtime_zero_cost||{};

          if(readiness?.bindings?.ai!==true) throw new Error('AI_BINDING_NOT_LIVE');
          if(runtime.status!=='ONLINE') throw new Error('ZERO_COST_RUNTIME_NOT_ONLINE:'+String(runtime.status));
          if(Number(runtime.authorized_zero_cost_count||0)<2) throw new Error('ZERO_COST_QUORUM_LT_2');
          if(council?.ok!==true || council?.schema!=='mel.model-council') throw new Error('COUNCIL_RUNTIME_RESPONSE_INVALID');
          if(Number(council?.independent_response_count||0)<2) throw new Error('LIVE_COUNCIL_RESPONSES_LT_2');
          if(Number(council?.unique_model_count||0)<2) throw new Error('LIVE_COUNCIL_MODELS_LT_2');
          if(council?.synthesis?.status!=='COMPLETE') throw new Error('LIVE_COUNCIL_SYNTHESIS_NOT_COMPLETE');
          if(council?.consensus?.inferred_consensus!==false) throw new Error('LIVE_COUNCIL_FAKE_CONSENSUS');
          const critiques=Array.isArray(council?.critiques)?council.critiques:[];
          if(new Set(critiques.map(x=>x?.identity)).size<2) throw new Error('LIVE_COUNCIL_DUPLICATE_IDENTITY');
          if(!critiques.every(x=>x?.provenance?.provider==='workers-ai')) throw new Error('LIVE_COUNCIL_PROVENANCE_PROVIDER_MISMATCH');
          if(!critiques.every(x=>x?.cost?.allowed===true && x?.cost?.added_cost===0)) throw new Error('LIVE_COUNCIL_ZERO_COST_METADATA_INVALID');
          if(council?.synthesis?.provenance?.provider!=='workers-ai') throw new Error('LIVE_SYNTHESIS_PROVENANCE_MISMATCH');
          if(council?.synthesis?.cost?.allowed!==true || council?.synthesis?.cost?.added_cost!==0) throw new Error('LIVE_SYNTHESIS_ZERO_COST_METADATA_INVALID');

          const proof={
            schema:'mel.gen2-05.live-provider-proof/v1',
            sha:process.env.GITHUB_SHA,
            cloudflare_runtime:true,
            ai_binding_live:true,
            zero_cost_status:runtime.status,
            healthy_provider_count:Number(runtime.healthy_provider_count||0),
            authorized_zero_cost_count:Number(runtime.authorized_zero_cost_count||0),
            independent_response_count:Number(council.independent_response_count||0),
            unique_model_count:Number(council.unique_model_count||0),
            critique_models:critiques.map(x=>x?.provenance?.model).sort(),
            critique_provider_ids:critiques.map(x=>x?.identity).sort(),
            critique_latencies_ms:critiques.map(x=>Number(x?.latency_ms||0)),
            provider_failure_count:Number(council?.provider_failure_count||0),
            synthesis_status:council?.synthesis?.status,
            synthesis_model:council?.synthesis?.provenance?.model||null,
            synthesis_latency_ms:Number(council?.synthesis?.latency_ms||0),
            zero_added_cost_metadata:true,
            fake_consensus:false,
            verdict:'LIVE_MULTI_PROVIDER_COUNCIL_VERIFIED',
          };
          fs.writeFileSync('gen2-05-live-provider-proof.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof,null,2));
          NODE

      - name: Upload sanitized live GEN2-05 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gen2-05-live-provider-proof-${{ github.sha }}
          path: |
            gen2-05-live-plan-proof.json
            gen2-05-live-provider-proof.json
          if-no-files-found: warn
          retention-days: 7

      - name: Delete isolated live proof Worker
        if: always()
        shell: bash
        run: |
          set +e
          printf 'y\n' | npx wrangler delete             --config wrangler.gen2-05-live-proof.json             --name meliturgos-gen2-05-live-proof
          exit 0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
