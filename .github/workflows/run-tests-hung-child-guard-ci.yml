name: run-tests-hung-child-guard-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-tests.mjs'
      - 'tests/run-tests-hung-child-guard.test.mjs'
      - '.github/workflows/run-tests-hung-child-guard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax validation
        run: npm run check
      - name: Test hung-child cleanup contract
        run: node --test tests/run-tests-hung-child-guard.test.mjs
