name: MEL project experience sync 2026-09-15

on:
  push:
    branches:
      - experience/full-history-20260915
    paths:
      - docs/experience/MEL_PROJECT_EXPERIENCE_FULL_HISTORY_20260915.md
      - docs/experience/MEL_PROJECT_EXPERIENCE_SYNC_INCIDENTS_20260915.md
      - .github/workflows/mel-project-experience-sync-20260915.yml

permissions:
  contents: read

concurrency:
  group: mel-project-experience-sync-20260915
  cancel-in-progress: false

jobs:
  sync-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact experience branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Compile canonical experience documents to idempotent D1 SQL
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const sourcePaths = [
            'docs/experience/MEL_PROJECT_EXPERIENCE_FULL_HISTORY_20260915.md',
            'docs/experience/MEL_PROJECT_EXPERIENCE_SYNC_INCIDENTS_20260915.md'
          ];
          const re = /^### \d+\. `([^`]+)` — ([^—\n]+) — ([^\n]+)\n([\s\S]*?)(?=^### \d+\.|^## )/gm;
          const pick = (body, a, b) => {
            const start = body.indexOf(a);
            if (start < 0) return '';
            const from = start + a.length;
            const end = b ? body.indexOf(b, from) : body.length;
            return body.slice(from, end < 0 ? body.length : end).trim();
          };
          const normalize = (s) => String(s).normalize('NFKC').toLocaleLowerCase('fr').replace(/[\u0000-\u001f\u007f]/g, ' ').replace(/\s+/g, ' ').trim();
          const sqlq = (s) => "'" + String(s).replaceAll("'", "''") + "'";
          const rows = [];
          let expected = 0;
          for (const sourcePath of sourcePaths) {
            const md = fs.readFileSync(sourcePath, 'utf8');
            const declarations = [...md.matchAll(/## Catalogue causal(?: complet| complémentaire) \((\d+) entrées\)/g)];
            if (declarations.length !== 1) throw new Error(`Expected one declared experience count in ${sourcePath}`);
            expected += Number(declarations[0][1]);
            const parseText = md.endsWith('\n') ? md + '## END\n' : md + '\n## END\n';
            for (const m of parseText.matchAll(re)) {
              const [_, id, domainRaw, statusRaw, body] = m;
              const domain = domainRaw.trim();
              const status = statusRaw.trim();
              const period = pick(body, '**Période :**', '\n\n**Problème.**');
              const problem = pick(body, '**Problème.**', '\n\n**Cause.**');
              const cause = pick(body, '**Cause.**', '\n\n**Correction.**');
              const correction = pick(body, '**Correction.**', '\n\n**Leçon.**');
              const lesson = pick(body, '**Leçon.**', '\n\n**Règle active.**');
              const rule = pick(body, '**Règle active.**', '\n\n**Preuves / références.**');
              const evidence = pick(body, '**Preuves / références.**', null);
              if (![id, domain, status, period, problem, cause, correction, lesson, rule].every(Boolean)) {
                throw new Error(`Incomplete experience block: ${id}`);
              }
              const content = `MEL expérience ${id} [${status}; ${period}; ${domain}]. Erreur/problème: ${problem} Cause: ${cause} Correction: ${correction} Leçon: ${lesson} Règle active: ${rule}`;
              const fingerprint = crypto.createHash('sha256').update(normalize(content)).digest('hex');
              rows.push({id, domain, status, period, evidence, sourcePath, content, fingerprint});
            }
          }
          if (rows.length !== expected) throw new Error(`Expected ${expected} experience entries, parsed ${rows.length}`);
          if (new Set(rows.map(r => r.id)).size !== rows.length) throw new Error('Duplicate experience id');
          if (new Set(rows.map(r => r.fingerprint)).size !== rows.length) throw new Error('Duplicate experience fingerprint');
          const created = 1789500600000;
          const statements = ['-- generated from canonical MEL experience documents'];
          for (const row of rows) {
            const confidence = ['current_open_not_merged','current_unproven_guard','current_warning_unresolved'].includes(row.status) ? 0.82 : 0.96;
            const metadata = JSON.stringify({
              experience_schema: 'mel.project.experience/v1',
              experience_id: row.id,
              experience_status: row.status,
              period: row.period,
              domain: row.domain,
              evidence: row.evidence,
              source_document: row.sourcePath,
              consolidated_at: '2026-09-15T21:30:00+02:00'
            });
            statements.push(`INSERT INTO memories(created_at,kind,content,importance,confidence,valid_from,valid_until,supersedes_id,source,provenance,metadata,fingerprint) VALUES(${created},'lesson',${sqlq(row.content)},0.92,${confidence},${created},NULL,NULL,'project_experience_consolidation_v1','full-history-20260915',${sqlq(metadata)},${sqlq(row.fingerprint)}) ON CONFLICT(fingerprint) WHERE fingerprint IS NOT NULL DO UPDATE SET importance=MAX(memories.importance,excluded.importance),confidence=MAX(memories.confidence,excluded.confidence),provenance=excluded.provenance,metadata=excluded.metadata;`);
          }
          statements.push("SELECT COUNT(*) AS mel_project_experience_count FROM memories WHERE source='project_experience_consolidation_v1';");
          fs.writeFileSync('/tmp/mel-project-experience.sql', statements.join('\n') + '\n');
          fs.writeFileSync('/tmp/mel-project-experience-count', String(expected));
          console.log(`Compiled ${rows.length} sanitized experience memories from ${sourcePaths.length} canonical documents.`);
          NODE

      - name: Validate production D1 target and generated SQL structure
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"database_name": "meliturgos-memory"' wrangler.jsonc
          node <<'NODE'
          const fs = require('node:fs');
          const expected = Number(fs.readFileSync('/tmp/mel-project-experience-count', 'utf8').trim());
          const lines = fs.readFileSync('/tmp/mel-project-experience.sql', 'utf8')
            .split(/\r?\n/)
            .map(s => s.trim())
            .filter(s => s && !s.startsWith('--'));
          const inserts = lines.filter(s => s.startsWith('INSERT INTO memories('));
          const selects = lines.filter(s => s.startsWith('SELECT COUNT(*) AS mel_project_experience_count'));
          const unexpected = lines.filter(s => !s.startsWith('INSERT INTO memories(') && !s.startsWith('SELECT COUNT(*) AS mel_project_experience_count'));
          if (inserts.length !== expected) throw new Error(`Expected ${expected} INSERT statements, got ${inserts.length}`);
          if (selects.length !== 1) throw new Error(`Expected one verification SELECT, got ${selects.length}`);
          if (unexpected.length) throw new Error(`Unexpected SQL statements: ${unexpected.slice(0, 3).join(' | ')}`);
          console.log(`Validated ${expected} insert/upsert statements plus one count query.`);
          NODE

      - name: Import canonical experience into MEL production memory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --config wrangler.jsonc --file /tmp/mel-project-experience.sql

      - name: Verify consolidated experience memories are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat /tmp/mel-project-experience-count)"
          OUT="$(npx wrangler d1 execute DB --remote --config wrangler.jsonc --command "SELECT COUNT(*) AS n FROM memories WHERE source='project_experience_consolidation_v1';")"
          echo "$OUT"
          printf '%s\n' "$OUT" | grep -Eq "(^|[^0-9])${EXPECTED}([^0-9]|$)"
