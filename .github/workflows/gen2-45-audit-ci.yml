name: gen2-45-audit-ci

on:
  pull_request:
    paths:
      - 'src/capabilities/capability-bus.js'
      - 'src/audit/**'
      - 'src/core/orchestrator/gen2-runtime.js'
      - 'src/roadmap/master-roadmap.js'
      - 'tests/gen2/audit-sensitive-correlation.test.mjs'
      - 'tests/gen2/contracts.test.mjs'
      - '.github/workflows/gen2-45-audit-ci.yml'
  push:
    branches:
      - 'work/gen2-45-audit-correlation-proof'

permissions:
  contents: read

jobs:
  gen2-45-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
      - name: Audit syntax
        run: >
          node --check src/capabilities/capability-bus.js &&
          node --check src/audit/audit-service.js &&
          node --check src/core/orchestrator/gen2-runtime.js
      - name: Audit targeted tests
        run: >
          node --test
          tests/gen2/audit-sensitive-correlation.test.mjs
          tests/capability-permissions-enforcement.test.mjs
          tests/approval-gates.test.mjs
          tests/gen2/runtime-observability.test.mjs

  gen2-45-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: gen2-45-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Repository syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/gen2-45-audit-ci
      - name: Full test suite
        run: npm test
