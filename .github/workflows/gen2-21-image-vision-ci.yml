name: gen2-21-image-vision-ci

on:
  push:
    branches:
      - 'roadmap/gen2-21-*'
      - 'candidate/gen2-21-*'
  pull_request:
    branches:
      - main
    paths:
      - 'src/media/images.js'
      - 'src/media/image-vision-runtime.js'
      - 'src/multimodal/provider-contract.js'
      - 'src/multimodal/dreamina-runner.js'
      - 'src/multimodal/dreamina-volcengine-adapter.js'
      - 'tests/gen2/image-vision-runtime.test.mjs'
      - 'tests/creative-media-capabilities.test.mjs'
      - 'tests/dreamina-runner.test.mjs'
      - 'tests/dreamina-volcengine-adapter.test.mjs'
      - '.github/workflows/gen2-21-image-vision-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Targeted GEN2-21 tests
        run: node --test tests/gen2/image-vision-runtime.test.mjs tests/creative-media-capabilities.test.mjs tests/dreamina-runner.test.mjs tests/dreamina-volcengine-adapter.test.mjs
      - name: Syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/gen2-21-ci
      - name: Full test suite
        run: npm test
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
