name: cancel-lora-kaggle-free-gpu

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - ".github/workflows/cancel-lora-kaggle-free-gpu.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mel-lora-kaggle-free-gpu
  cancel-in-progress: true

jobs:
  cancel-current-train-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel previous Kaggle LoRA waiter by concurrency
        run: |
          echo "This no-op run exists only to cancel the previous mel-lora-kaggle-free-gpu concurrency holder."
          echo "No Kaggle training is started."
