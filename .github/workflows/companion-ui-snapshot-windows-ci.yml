name: companion-ui-snapshot-windows-ci

# Static PowerShell integrity on GitHub-hosted Windows. A hosted runner does
# not expose a normal interactive Notepad UIA tree. F5/F6 functional acceptance
# must run on the user's authorized, interactive Windows Companion.
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/MEL-Computer-Companion.ps1'
      - 'dist/MEL-Computer-Companion.ps1'
      - 'src/devices/computer-agent*.js'
      - 'src/devices/computer-use.js'
      - 'tests/computer-agent.test.mjs'
      - 'tests/windows/companion-dev-executor-controls.ps1'
      - 'scripts/mel-dev-bridge.mjs'
      - 'windows-companion/MEL-Companion.cs'
      - '.github/workflows/companion-ui-snapshot-windows-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-snapshot:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Compile native Companion controls
        shell: powershell
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $csc /nologo /target:winexe /out:"$env:RUNNER_TEMP\MEL-Companion-controls.exe" /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /reference:System.Security.dll windows-companion/MEL-Companion.cs
          if ($LASTEXITCODE -ne 0) { throw 'COMPANION_NATIVE_COMPILE_FAILED' }
      - name: Dev Executor controls with real Windows Node processes
        shell: powershell
        run: .\tests\windows\companion-dev-executor-controls.ps1 -NativeAssembly "$env:RUNNER_TEMP\MEL-Companion-controls.exe"
      - name: Engine parses and assets/dist are identical
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'assets/MEL-Computer-Companion.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { $errors | ForEach-Object { Write-Host $_ }; throw "ENGINE_PARSE_FAILED" }
          if ((Get-FileHash assets/MEL-Computer-Companion.ps1).Hash -ne (Get-FileHash dist/MEL-Computer-Companion.ps1).Hash) { throw "ENGINE_COPIES_DIFFER" }
      - name: Assert live Windows UIA scenario is reserved for interactive Companion acceptance
        shell: powershell
        run: |
          # GitHub-hosted runners have a non-user desktop; their Notepad window
          # exposes only anonymous Pane nodes. Do not mislabel CI as a real-PC test.
          # This job validates engine syntax and distribution parity only.
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'assets/MEL-Computer-Companion.ps1'), [ref]$tokens, [ref]$errors)
          $functions = @($ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true) | ForEach-Object { $_.Name })
          foreach ($required in @('Get-UiSnapshot', 'Perform-Step')) {
            if ($required -notin $functions) { throw "COMPANION_ENTRYPOINT_MISSING:$required" }
          }
          Write-Host "::notice title=Real PC acceptance still required::F5/F6 UIA, typing and screenshot need Windows Companion running on an interactive user desktop; this CI does not certify them."
