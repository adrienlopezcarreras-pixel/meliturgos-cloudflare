name: cloudflare-api-relay

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/cloudflare-api-relay-runner.mjs'
      - 'src/api/cloudflare-api-relay.js'
      - 'src/security/http-auth-policy.js'
      - 'tests/gen2/cloudflare-api-relay.test.mjs'
      - '.github/workflows/cloudflare-api-relay.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ["deploy-cloudflare-release"]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudflare-api-relay
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check scripts/cloudflare-api-relay-runner.mjs
      - run: node --test tests/gen2/cloudflare-api-relay.test.mjs

  relay:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Request scoped GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=meliturgos-worker")"
          TOKEN="$(printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})')"
          echo "::add-mask::${TOKEN}"
          echo "MEL_CLOUDFLARE_RELAY_OIDC=${TOKEN}" >> "$GITHUB_ENV"

      - name: Heartbeat and process queued Cloudflare API jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEL_MINI_RESET_APPROVED: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha == 'c17f04b6a4488346e6e613f15bcb00cd29319083')) && '1' || '0' }}
        run: node scripts/cloudflare-api-relay-runner.mjs
