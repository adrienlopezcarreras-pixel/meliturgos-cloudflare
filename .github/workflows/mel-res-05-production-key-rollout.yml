name: mel-res-05-production-key-rollout

on:
  push:
    branches:
      - proof/mel-res-05-key-rollout-20260926
    paths:
      - .github/workflows/mel-res-05-production-key-rollout.yml

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Provision production AES-GCM backup key without disclosure
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          KEY_B64="$(openssl rand -base64 32 | tr -d '\n')"
          KEY_ID="mel-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "::add-mask::${KEY_B64}"
          echo "::add-mask::${KEY_ID}"
          test "$(printf '%s' "${KEY_B64}" | base64 -d | wc -c | tr -d ' ')" = "32"
          printf '%s' "${KEY_B64}" | npx wrangler secret put MEL_BACKUP_ENCRYPTION_KEY_B64 --env=""
          printf '%s' "${KEY_ID}" | npx wrangler secret put MEL_BACKUP_ENCRYPTION_KEY_ID --env=""
          unset KEY_B64 KEY_ID
          npx wrangler secret list --format json > secrets.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('secrets.json','utf8'));
          const rows=Array.isArray(raw)?raw:(raw.secrets||[]);
          const names=new Set(rows.map(x=>String(x?.name||'')));
          const proof={
            schema:'mel.res-05-key-rollout.v1',
            key_b64_present:names.has('MEL_BACKUP_ENCRYPTION_KEY_B64'),
            key_id_present:names.has('MEL_BACKUP_ENCRYPTION_KEY_ID'),
            secret_values_exposed:false
          };
          if(!proof.key_b64_present||!proof.key_id_present) throw new Error('MEL_RES_05_SECRET_ROLLOUT_FAILED');
          fs.writeFileSync('mel-res-05-key-rollout-proof.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof,null,2));
          NODE

      - name: Fast-forward release pointer to current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main release/mel-hardware-v0.1.0
          MAIN_SHA="$(git rev-parse origin/main)"
          RELEASE_SHA="$(git rev-parse origin/release/mel-hardware-v0.1.0)"
          git merge-base --is-ancestor "${RELEASE_SHA}" "${MAIN_SHA}"
          gh api --method PATCH             "repos/${GITHUB_REPOSITORY}/git/refs/heads/release/mel-hardware-v0.1.0"             -f sha="${MAIN_SHA}"             -F force=false >/dev/null
          printf '{"main_sha":"%s","release_was":"%s","release_updated":true}\n' "${MAIN_SHA}" "${RELEASE_SHA}" > mel-res-05-release-trigger.json

      - name: Upload sanitized rollout proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mel-res-05-key-rollout-proof
          path: |
            mel-res-05-key-rollout-proof.json
            mel-res-05-release-trigger.json
          if-no-files-found: error
          retention-days: 14
