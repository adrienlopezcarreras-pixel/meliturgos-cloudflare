name: sovereignty-stress-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/portability/**
      - tests/gen2/companion-storage-database.test.mjs
      - src/portability/companion-database-adapter.js
      - src/portability/companion-object-storage-adapter.js
      - tests/gen2/companion-scheduler-observability.test.mjs
      - src/portability/companion-observability-adapter.js
      - src/portability/companion-scheduler-adapter.js
      - tests/gen2/companion-ci-provider-adapter.test.mjs
      - src/portability/companion-ci-provider-adapter.js
      - tests/gen2/companion-source-control-adapter.test.mjs
      - src/portability/companion-source-control-adapter.js
      - tests/gen2/configured-ai-candidate-sync.test.mjs
      - src/portability/configured-ai-candidate-validation-runtime.js
      - src/portability/configured-ai-candidate-sync.js
      - tests/gen2/sovereignty-candidate-readiness.test.mjs
      - src/portability/sovereignty-candidate-readiness.js
      - tests/gen2/sovereignty-candidate-validator.test.mjs
      - src/portability/sovereignty-candidate-validator.js
      - tests/gen2/sovereignty-candidate-store.test.mjs
      - src/portability/sovereignty-candidate-store.js
      - tests/gen2/sovereignty-gap-planner.test.mjs
      - src/portability/sovereignty-gap-planner.js
      - tests/gen2/infrastructure-alternative-prevalidator.test.mjs
      - src/portability/infrastructure-alternative-prevalidator.js
      - tests/gen2/observability-adapter.test.mjs
      - tests/gen2/scheduler-adapter.test.mjs
      - tests/gen2/secret-store-adapter.test.mjs
      - src/portability/observability-adapter.js
      - src/portability/scheduler-adapter.js
      - src/portability/secret-store-adapter.js
      - tests/gen2/ci-provider-adapter.test.mjs
      - src/portability/ci-provider-adapter.js
      - tests/gen2/database-adapter.test.mjs
      - tests/gen2/object-storage-adapter.test.mjs
      - src/portability/database-adapter.js
      - src/portability/object-storage-adapter.js
      - tests/gen2/runtime-alternative-prevalidator.test.mjs
      - src/portability/runtime-alternative-prevalidator.js
      - tests/gen2/ai-low-refusal-probe.test.mjs
      - src/portability/ai-low-refusal-probe.js
      - tests/gen2/source-control-reseed.test.mjs
      - src/portability/source-control-reseed.js
      - tests/gen2/ai-alternative-prevalidation-runtime.test.mjs
      - tests/gen2/ai-alternative-prevalidator.test.mjs
      - src/portability/ai-alternative-prevalidation-runtime.js
      - src/portability/ai-alternative-prevalidator.js
      - tests/gen2/autonomy-sovereignty-status.test.mjs
      - tests/gen2/technical-sovereignty-live.test.mjs
      - tests/gen2/alternative-revalidation.test.mjs
      - tests/gen2/d1-alternative-registry-store.test.mjs
      - src/evolution/autonomy-api.js
      - src/continuity/**
      - tests/gen2/cold-standby.test.mjs
      - src/resilience/cold-standby.js
      - src/evaluation/dependency-longevity-watch*.js
      - tests/gen2/sovereignty-watch-runtime-wiring.test.mjs
      - tests/gen2/sovereignty-watch-candidates.test.mjs
      - src/evaluation/sovereignty-watch-runtime.js
      - src/evaluation/sovereignty-watch-catalog.js
      - tests/gen2/dependency-longevity-watch.test.mjs
      - tests/gen2/prevalidated-alternative-registry.test.mjs
      - src/portability/prevalidated-alternative-registry.js
      - tests/gen2/sovereignty-stress.test.mjs
      - tests/gen2/sovereign-regeneration-stress.test.mjs
      - .github/workflows/sovereignty-stress-ci.yml

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Syntax gate
        run: |
          node --check src/portability/provider-switch-controller.js
          node --check src/portability/emergency-sovereignty-failover.js
          node --check src/continuity/sovereign-regeneration-bundle.js
          node --check src/evaluation/dependency-longevity-watch.js
          node --check src/evaluation/sovereignty-watch-catalog.js
          node --check src/evaluation/sovereignty-watch-runtime.js
          node --check src/portability/prevalidated-alternative-registry.js
          node --check src/portability/alternative-revalidation.js
          node --check src/portability/d1-alternative-registry-store.js
          node --check src/evolution/autonomy-api.js
          node --check src/resilience/cold-standby.js
          node --check src/portability/ai-alternative-prevalidator.js
          node --check src/portability/ai-low-refusal-probe.js
          node --check src/portability/ai-alternative-prevalidation-runtime.js
          node --check src/portability/source-control-reseed.js
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
      - name: Sovereignty stress
        run: node --test tests/gen2/sovereignty-stress.test.mjs tests/gen2/sovereign-regeneration-stress.test.mjs tests/gen2/prevalidated-alternative-registry.test.mjs tests/gen2/dependency-longevity-watch.test.mjs tests/gen2/d1-alternative-registry-store.test.mjs tests/gen2/alternative-revalidation.test.mjs tests/gen2/autonomy-sovereignty-status.test.mjs tests/gen2/technical-sovereignty-live.test.mjs tests/gen2/ai-alternative-prevalidator.test.mjs tests/gen2/ai-alternative-prevalidation-runtime.test.mjs tests/gen2/cold-standby.test.mjs tests/gen2/source-control-reseed.test.mjs tests/gen2/ai-low-refusal-probe.test.mjs tests/gen2/runtime-alternative-prevalidator.test.mjs tests/gen2/object-storage-adapter.test.mjs tests/gen2/database-adapter.test.mjs tests/gen2/ci-provider-adapter.test.mjs tests/gen2/secret-store-adapter.test.mjs tests/gen2/scheduler-adapter.test.mjs tests/gen2/observability-adapter.test.mjs tests/gen2/infrastructure-alternative-prevalidator.test.mjs tests/gen2/sovereignty-watch-runtime-wiring.test.mjs tests/gen2/sovereignty-watch-candidates.test.mjs tests/gen2/sovereignty-gap-planner.test.mjs tests/augmentio-http-chat-adapter.test.mjs tests/gen2/sovereignty-candidate-store.test.mjs tests/gen2/sovereignty-candidate-validator.test.mjs tests/gen2/sovereignty-candidate-readiness.test.mjs tests/gen2/configured-ai-candidate-sync.test.mjs tests/gen2/companion-source-control-adapter.test.mjs tests/gen2/companion-ci-provider-adapter.test.mjs tests/gen2/companion-scheduler-observability.test.mjs tests/gen2/companion-storage-database.test.mjs
      - name: Existing ShardVault reconstruction stress
        run: node --test tests/shardvault-reconstruction-stress.test.mjs
