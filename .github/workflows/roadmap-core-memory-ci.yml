name: roadmap-core-memory-ci

on:
  push:
    branches:
      - roadmap/core-memory-20260925
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Syntax
        run: |
          node --check src/memory/timeline.js
          node --check src/roadmap/master-roadmap.js
          node --check src/roadmap/completion-matrix.js
          node --check src/roadmap/final-status-report.js
      - name: Targeted memory and roadmap tests
        run: |
          node --test tests/gen2/timeline.test.mjs
          node --test tests/gen2/projects-decisions.test.mjs
          node --test tests/memory/portable-export.test.mjs
          node --test tests/gen2/completion-matrix.test.mjs
          node --test tests/gen2/final-status-report.test.mjs
          node --test tests/roadmap-consolidation.test.mjs
