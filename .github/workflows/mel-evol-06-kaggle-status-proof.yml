name: mel-evol-06-kaggle-status-proof

on:
  push:
    branches:
      - proof/mel-evol-06-kaggle-status-20260926
    paths:
      - .github/workflows/mel-evol-06-kaggle-status-proof.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: pip install --disable-pip-version-check --no-input kaggle
      - name: Read current immutable training kernel status
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          STATUS="$(kaggle kernels status adrienlopezcarreras/mel-lora-uncensored-notebook-t4 2>&1)"
          printf '%s\n' "$STATUS"
          LOWER="$(printf '%s' "$STATUS" | tr '[:upper:]' '[:lower:]')"
          STATE=UNKNOWN
          if printf '%s' "$LOWER" | grep -Eq 'complete|completed|success'; then STATE=COMPLETE
          elif printf '%s' "$LOWER" | grep -Eq 'running'; then STATE=RUNNING
          elif printf '%s' "$LOWER" | grep -Eq 'cancel'; then STATE=CANCELLED
          elif printf '%s' "$LOWER" | grep -Eq 'error|failed|failure'; then STATE=FAILED
          fi
          printf '{"schema":"mel.evol-06-kaggle-status-proof.v1","kernel":"adrienlopezcarreras/mel-lora-uncensored-notebook-t4","state":"%s"}\n' "$STATE" | tee kaggle-status-proof.json
      - name: Upload sanitized status proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mel-evol-06-kaggle-status-proof
          path: kaggle-status-proof.json
          if-no-files-found: error
          retention-days: 7
