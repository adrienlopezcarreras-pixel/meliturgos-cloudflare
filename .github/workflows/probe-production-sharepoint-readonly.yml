name: probe-MEL-production-SharePoint-Graph-readonly

# Owner-only, one-path PR diagnostics. A failing OAuth/Graph read remains RED.
# NO GitHub release, Cloudflare deployment, D1 migration, Graph write or MAX.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-production-sharepoint-readonly.yml'

permissions:
  contents: read

jobs:
  live-sharepoint-read:
    if: ${{ github.repository == 'adrienlopezcarreras-pixel/meliturgos-cloudflare' && github.event.pull_request.number == 1228 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'candidate/mel-clean-autonomy' && github.actor == 'adrienlopezcarreras-pixel' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      PROOF_KEY_B64: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_B64 }}
    steps:
      - name: Run isolated live read-only SharePoint Graph proof with exact deployment authentication
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const repo='adrienlopezcarreras-pixel/meliturgos-cloudflare';
          const base='https://meliturgos.adrien-lopezcarreras.workers.dev';
          const key=Buffer.from(String(process.env.PROOF_KEY_B64||''),'base64');
          if(key.length!==32)throw Error('SHAREPOINT_PARALLEL_PROOF_KEY_UNAVAILABLE');
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          let branch;
          try{
            branch=await fetch('https://api.github.com/repos/'+repo+'/branches/release%2Fmel-hardware-v0.1.0',{
              method:'GET',headers,redirect:'error',signal:AbortSignal.timeout(15000),
            });
          }catch{throw Error('SHAREPOINT_RELEASE_REF_LOOKUP_FAILED');}
          if(!branch.ok)throw Error('SHAREPOINT_RELEASE_REF_UNAVAILABLE_HTTP_'+branch.status);
          const ref=await branch.json();
          const sha=String(ref?.commit?.sha||'');
          if(!/^[a-f0-9]{40}$/.test(sha))throw Error('SHAREPOINT_RELEASE_SHA_INVALID');
          const token=Buffer.from(crypto.hkdfSync('sha256',key,
            Buffer.from('meliturgos-parallel-proof-salt-v1'),
            Buffer.from('MEL_PARALLEL_PROOF_V1:'+sha),32)).toString('base64url');
          console.log('SHAREPOINT_PROOF_SHA_RESOLVED_40_HEX');
          const proofHeaders={'x-mel-release-smoke':'1','x-mel-parallel-proof':token};
          async function request(path,body){
            let response;
            try{
              response=await fetch(base+path,{
                method:body===undefined?'GET':'POST',
                headers:body===undefined?proofHeaders:{...proofHeaders,'content-type':'application/json'},
                ...(body===undefined?{}:{body:JSON.stringify(body)}),
                redirect:'error',signal:AbortSignal.timeout(45000),
              });
            }catch{return {http:0,data:null};}
            let data=null;
            try{data=await response.json();}catch{}
            return {http:response.status,data};
          }
          const auth=await request('/api/gen2/code/self-check');
          console.log('SHAREPOINT_EXACT_SHA_PARALLEL_AUTH_HTTP_'+auth.http);
          if(auth.http!==200 || auth.data?.ok!==true){
            throw Error('SHAREPOINT_PROOF_AUTH_NOT_CONFIRMED_NO_PROVIDER_CLAIM');
          }
          // These endpoints use Graph GET site-search; no returned site names or
          // file contents appear in CI output. A linked account alone is NOT proof.
          const native=await request('/api/gen2/connections/microsoft/test',
            {connector_id:'microsoft-sharepoint'});
          const pipedream=await request('/api/gen2/connections/pipedream/test',
            {probe:'sharepoint_sites_read'});
          const cleanCode=value=>/^[A-Z][A-Z0-9_]{0,100}$/.test(String(value||''))?value:'UNKNOWN';
          for(const [id,row] of [['NATIVE',native],['PIPEDREAM',pipedream]]){
            console.log('SHAREPOINT_'+id+'_HTTP_'+row.http);
            console.log('SHAREPOINT_'+id+'_CODE_'+cleanCode(row.data?.code||row.data?.error));
            console.log('SHAREPOINT_'+id+'_ACTION_'+cleanCode(row.data?.action_required));
            console.log('SHAREPOINT_'+id+'_GRAPH_GET_VERIFIED_'+(
              id==='NATIVE'
                ? String(row.http===200 && row.data?.ok===true &&
                    row.data?.connector_id==='microsoft-sharepoint' && row.data?.live_probe===true)
                : String(row.http===200 && row.data?.ok===true &&
                    row.data?.graph_site_read_proven===true && row.data?.read_only===true &&
                    row.data?.private_content_returned===false)
            ));
          }
          const nativeOk=native.http===200 && native.data?.ok===true &&
            native.data?.connector_id==='microsoft-sharepoint' && native.data?.live_probe===true;
          const pdOk=pipedream.http===200 && pipedream.data?.ok===true &&
            pipedream.data?.graph_site_read_proven===true && pipedream.data?.read_only===true &&
            pipedream.data?.private_content_returned===false;
          if(!nativeOk&&!pdOk)throw Error('SHAREPOINT_LIVE_GRAPH_SITE_READ_NOT_PROVEN');
          console.log('SHAREPOINT_LIVE_GRAPH_SITE_READ_CONFIRMED_NO_CONTENT_RETURNED');
          NODE
