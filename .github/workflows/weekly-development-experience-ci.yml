name: weekly-development-experience-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - src/learning/development-experience-pack.js
      - src/learning/bootstrap-corrections.js
      - tests/weekly-development-experience-20260927.test.mjs
      - .agents/WEEKLY_HANDOFF_20260927.md
      - .agents/DEVELOPMENT_EXPERIENCE_INDEX.md
      - .github/workflows/weekly-development-experience-ci.yml

permissions:
  contents: read

jobs:
  weekly-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Syntax
        run: |
          node --check src/learning/development-experience-pack.js
          node --check tests/weekly-development-experience-20260927.test.mjs

      - name: Weekly experience reaches LearningEngine
        run: node --test tests/weekly-development-experience-20260927.test.mjs
