name: LoRA c000 draft release readback (GET only)
on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/lora-c000-release-readback.yml
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ github.repository == 'adrienlopezcarreras-pixel/meliturgos-cloudflare' && github.actor == 'adrienlopezcarreras-pixel' && github.event.pull_request.number == 1261 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'probe/lora-c000-draft-release-20261013' && github.event.pull_request.base.ref == 'fix/lora-preserve-checkpoint-before-release-20261012' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      RELEASE_TOKEN: ${{ secrets.MEL_LORA_RELEASE_TOKEN }}
    steps:
      - name: Inspect GitHub draft and asset identities without mutation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const repo='adrienlopezcarreras-pixel/meliturgos-cloudflare';
          const tag='mel-lora-kaggle-635c4786b39b-c000';
          const expected='635c4786b39b9c3a5458126d64ec7bb726a282e7';
          const token=process.env.RELEASE_TOKEN;
          if(!token){console.error('LORA_READBACK_TOKEN_MISSING');process.exit(1);}
          const headers={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          let res;
          try{res=await fetch('https://api.github.com/repos/'+repo+'/releases/tags/'+tag,{method:'GET',headers,redirect:'error',signal:AbortSignal.timeout(15000)});}
          catch{console.error('LORA_READBACK_NETWORK_ERROR');process.exit(1);}
          console.log('LORA_RELEASE_READBACK_HTTP='+res.status);
          if(!res.ok){process.exitCode=1;}else{
            const data=await res.json();
            const assets=Array.isArray(data.assets)?data.assets:[];
            const names=assets.map(a=>({name:String(a.name||'').slice(0,100),bytes:Number(a.size||0)}));
            console.log('LORA_RELEASE_DRAFT='+String(data.draft===true));
            console.log('LORA_RELEASE_PRERELEASE='+String(data.prerelease===true));
            console.log('LORA_RELEASE_TAG_MATCH='+String(data.tag_name===tag));
            console.log('LORA_RELEASE_TARGET_SHA_MATCH='+String(data.target_commitish===expected));
            console.log('LORA_RELEASE_TARGET_COMMITISH_TYPE='+String(/^[0-9a-f]{40}$/.test(data.target_commitish||'')?'SHA40':'NON_SHA'));
            console.log('LORA_RELEASE_ASSETS='+JSON.stringify(names));
            console.log('LORA_RELEASE_CREATED_AT_PRESENT='+String(!!data.created_at));
            const allowed=new Set(['mel-lora-bundle.tar.gz','checkpoint-draft-proof.json']);
            const okay=data.draft===true&&data.tag_name===tag&&assets.length===2&&new Set(assets.map(a=>a.name)).size===2&&assets.every(a=>allowed.has(a.name)&&Number(a.size)>0);
            console.log('LORA_RELEASE_DRAFT_ASSET_SAFETY='+String(okay?'PASS':'FAIL'));
            if(!okay)process.exitCode=1;
          }
          NODE
