name: evolution-ledger-ci

on:
  pull_request:
    paths:
      - 'src/evolution/evolution-ledger.js'
      - 'src/capabilities/evolution-ledger-capabilities.js'
      - 'src/core/orchestrator/gen2-runtime.js'
      - 'src/dev/d1-dev-job-repository.js'
      - 'tests/gen2/evolution-ledger.test.mjs'
      - '.github/workflows/evolution-ledger-ci.yml'

permissions:
  contents: read

jobs:
  evolution-ledger-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/runtime-security-gate.mjs
      - run: node --check src/evolution/evolution-ledger.js
      - run: node --check src/capabilities/evolution-ledger-capabilities.js
      - run: node --check src/core/orchestrator/gen2-runtime.js
      - run: node --check src/dev/d1-dev-job-repository.js
      - run: node --test tests/gen2/evolution-ledger.test.mjs

  evolution-ledger-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: evolution-ledger-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git switch -c candidate/evolution-ledger-ci
      - run: npm test
