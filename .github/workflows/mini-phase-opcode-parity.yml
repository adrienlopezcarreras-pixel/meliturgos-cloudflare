name: MINI phase opcode parity
on:
  pull_request:
    paths:
      - 'tests/mini-linkv2-phase-opcode-parity.test.mjs'
      - 'android-companion/app/src/main/java/fr/veriteinterdite/mel/MelLinkV2Protocol.kt'
      - 'firmware/waveshare-terminal/main/mel_link_v2_protocol.h'
      - '.github/workflows/mini-phase-opcode-parity.yml'
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/mini-linkv2-phase-opcode-parity.test.mjs
