name: fides-workers-ai-binding-probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fides-workers-ai-binding-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Probe isolated Workers AI binding and delete temporary script
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          PROBE_NAME="mel-fides-probe-${GITHUB_RUN_ID}"
          PROBE_TOKEN="$(openssl rand -hex 24)"
          echo "::add-mask::${PROBE_TOKEN}"
          export PROBE_NAME
          cleanup() {
            set +e
            code="$(curl --silent --show-error --max-time 25 -X DELETE \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -o /tmp/fides-probe-delete-response.json -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PROBE_NAME}")"
            echo "temporary_worker_delete_http=${code}"
          }
          trap cleanup EXIT
          mkdir -p /tmp/fides-probe .tmp-fides-probe
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('/tmp/fides-probe/wrangler.json', JSON.stringify({
            name:process.env.PROBE_NAME,main:'./.tmp-fides-probe/worker.mjs',
            compatibility_date:'2026-11-01',workers_dev:true,
            account_id:process.env.CLOUDFLARE_ACCOUNT_ID,
            ai:{binding:'AI'}
          }));
          NODE
          cat > .tmp-fides-probe/worker.mjs <<'JS'
          import {handlePublicFidesChat} from '../src/api/public-fides-chat.js';

          const rateRows=new Map();
          const DB={
            prepare(sql){
              let args=[];
              return {
                bind(...values){args=values;return this;},
                async run(){
                  if(sql.startsWith('INSERT INTO public_rate_limits')){
                    const [key,now,,resetBefore]=args;
                    const row=rateRows.get(key);
                    rateRows.set(key,!row||row.window_started<=resetBefore
                      ?{window_started:now,count:1}
                      :{window_started:row.window_started,count:row.count+1});
                  }
                  return {};
                },
                async first(){return rateRows.get(args[0])||null;}
              };
            }
          };
          export default {
            async fetch(request,env){
              if(request.headers.get('x-probe-secret')!==env.FIDES_PROBE_TOKEN)
                return new Response('Not found',{status:404});
              const failures=[];
              const original=console.error;
              console.error=(...args)=>{
                if(args[0]==='[FIDES public] inference failure')failures.push(String(args[1]||'').slice(0,50));
                if(args[0]==='[FIDES public] primary inference failed; trying bounded free-model fallback')failures.push('PRIMARY_FAILED_FALLBACK_STARTED');
              };
              try{
                const result=await handlePublicFidesChat(
                  new Request('https://mel.example/api/public/fides/chat',{
                    method:'POST',headers:{
                      'content-type':'application/json','cf-connecting-ip':'127.0.0.1'
                    },
                    body:JSON.stringify({message:'Qui est saint Jean l Evangéliste ?'})
                  }),
                  {AI:env.AI,DB,FIDES_PUBLIC_CHAT_ENABLED:'true'}
                );
                const data=await result.json().catch(()=>({}));
                const text=typeof data.answer==='string'?data.answer:'';
                return Response.json({
                  handler_http:result.status,ok:data.ok===true,
                  error_code:String(data.error||'').slice(0,50),
                  failure_kinds:failures,
                  answer_length:text.length,
                  provider:String(data.provider||'').slice(0,40),
                  model:String(data.model||'').slice(0,80),
                  isolation:data.private_data_access===false&&data.action_access===false
                    &&data.mel_memory_persistence===false
                });
              }finally{console.error=original;}
            }
          };
          JS
          npx wrangler deploy --config /tmp/fides-probe/wrangler.json \
            --var "FIDES_PROBE_TOKEN:${PROBE_TOKEN}" >/tmp/fides-probe-deploy.log 2>&1 || {
              echo "temporary_worker_deploy_failed"; exit 1;
            }
          sleep 3
          http="$(curl --silent --show-error --max-time 60 \
            -H "x-probe-secret: ${PROBE_TOKEN}" \
            -o /tmp/fides-probe-result.json -w '%{http_code}' \
            "https://${PROBE_NAME}.adrien-lopezcarreras.workers.dev")"
          export PROBE_HTTP="$http"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let d={};try{d=JSON.parse(fs.readFileSync('/tmp/fides-probe-result.json','utf8'))}catch{}
          console.log(JSON.stringify({http:Number(process.env.PROBE_HTTP),...d}));
          if(Number(process.env.PROBE_HTTP)!==200)process.exit(1);
          NODE
