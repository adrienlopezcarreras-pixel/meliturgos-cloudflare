name: MEL OK wake current lifecycle
on:
  pull_request:
    paths:
      - 'tests/ok-mel-current-wake-lifecycle.test.mjs'
      - 'android-companion/app/src/main/java/fr/veriteinterdite/mel/MainActivity.kt'
      - 'android-companion/app/src/main/java/fr/veriteinterdite/mel/WakePhraseTrainer.kt'
      - 'firmware/waveshare-terminal/main/mel_terminal.cpp'
      - '.github/workflows/ok-mel-current-wake-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wake-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node --test tests/ok-mel-current-wake-lifecycle.test.mjs
