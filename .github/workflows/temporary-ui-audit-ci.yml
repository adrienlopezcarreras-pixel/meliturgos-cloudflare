name: temporary-ui-audit-ci
on:
  push:
    branches:
      - 'fix/professor-ergonomics-performance-20260922'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Syntax
        run: npm run check
      - name: Targeted UI ergonomics and performance tests
        run: node --test tests/ui-performance-ergonomics.test.mjs tests/ui-control-contract-exhaustive.test.mjs tests/mvp-product.test.mjs tests/professor-control-surface.test.mjs tests/phase6-pwa.test.mjs tests/site-hardening-cleanup.test.mjs
      - name: Normalize branch for candidate-only integration tests
        run: git checkout -B candidate/ui-audit-validation
      - name: Full test suite
        run: npm test
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
