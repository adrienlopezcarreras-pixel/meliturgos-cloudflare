name: gen2-58-signed-install-emulator-proof

on:
  push:
    branches:
      - proof/gen2-58-signed-install-emulator-20260926
    paths:
      - .github/workflows/gen2-58-signed-install-emulator-proof.yml

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact proof SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      - name: Install Android 35 emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Prepare protected release signing material
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mel-release.jks"
          test -s "$RUNNER_TEMP/mel-release.jks"

      - name: Build canonical signed release APK
        working-directory: android-companion
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mel-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/MEL-Android-release.apk
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/MEL-Android-release.apk | tee dist/built-signature.txt
          "$BUILD_TOOLS/aapt" dump badging dist/MEL-Android-release.apk | tee dist/badging.txt
          grep -q "package: name='fr.veriteinterdite.mel'" dist/badging.txt
          grep -q "launchable-activity:" dist/badging.txt
          sha256sum dist/MEL-Android-release.apk | tee dist/MEL-Android-release.apk.sha256

      - name: Create Android 35 AVD
        shell: bash
        run: |
          set -euo pipefail
          echo no | avdmanager create avd --force --name mel-proof --package "system-images;android-35;google_apis;x86_64" --device "pixel_5"
          sudo chmod 666 /dev/kvm || true

      - name: Boot emulator and install signed APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd mel-proof -no-window -noaudio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          READY=0
          for i in $(seq 1 120); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$BOOT" == "1" ]]; then READY=1; break; fi
            sleep 2
          done
          test "$READY" = "1"
          adb install -r android-companion/dist/MEL-Android-release.apk
          VERSION="$(adb shell dumpsys package fr.veriteinterdite.mel | sed -n 's/.*versionName=//p' | head -1 | tr -d '\r')"
          test -n "$VERSION"
          adb shell monkey -p fr.veriteinterdite.mel -c android.intent.category.LAUNCHER 1 >/tmp/mel-monkey.txt
          sleep 4
          PID="$(adb shell pidof fr.veriteinterdite.mel | tr -d '\r' || true)"
          test -n "$PID"
          DEVICE_APK="$(adb shell pm path fr.veriteinterdite.mel | head -1 | sed 's/^package://' | tr -d '\r')"
          test -n "$DEVICE_APK"
          adb pull "$DEVICE_APK" "$RUNNER_TEMP/installed-base.apk" >/dev/null

          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs android-companion/dist/MEL-Android-release.apk > "$RUNNER_TEMP/built-cert.txt"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/installed-base.apk" > "$RUNNER_TEMP/installed-cert.txt"
          BUILT_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/built-cert.txt" | awk '{print $NF}')"
          INSTALLED_CERT="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/installed-cert.txt" | awk '{print $NF}')"
          test -n "$BUILT_CERT"
          test "$BUILT_CERT" = "$INSTALLED_CERT"
          BUILT_HASH="$(sha256sum android-companion/dist/MEL-Android-release.apk | awk '{print $1}')"
          INSTALLED_HASH="$(sha256sum "$RUNNER_TEMP/installed-base.apk" | awk '{print $1}')"

          node - "$VERSION" "$BUILT_CERT" "$BUILT_HASH" "$INSTALLED_HASH" <<'NODE'
          const fs=require('fs');
          const [version,cert,builtHash,installedHash]=process.argv.slice(2);
          const proof={
            schema:'mel.gen2-58-signed-install-proof.v1',
            package:'fr.veriteinterdite.mel',
            source_sha:process.env.GITHUB_SHA,
            version,
            release_apk_signed:true,
            installed_signature_matches_build:true,
            launch_process_observed:true,
            emulator_api:35,
            built_apk_sha256:builtHash,
            installed_base_sha256:installedHash,
            signer_cert_sha256:cert,
            signing_secret_material_exposed:false
          };
          console.log(JSON.stringify(proof,null,2));
          fs.writeFileSync('gen2-58-proof.json',JSON.stringify(proof,null,2));
          NODE

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mel-release.jks"

      - name: Upload sanitized proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen2-58-signed-install-emulator-proof
          path: |
            gen2-58-proof.json
            android-companion/dist/MEL-Android-release.apk.sha256
            android-companion/dist/badging.txt
          if-no-files-found: warn
          retention-days: 14
