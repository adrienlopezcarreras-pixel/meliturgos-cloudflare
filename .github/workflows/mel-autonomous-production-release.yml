name: mel-autonomous-production-release

# A narrow MEL entrypoint. The GitHub Actions GITHUB_TOKEN cannot trigger
# another workflow by pushing a ref; the Node script dispatches production
# explicitly after a verified, non-forced release-pointer update.
on:
  # Releases are batched: at most one per hour, only when main has moved
  # (exact-SHA deduplication in the dispatch script). Releasing on every merge,
  # every 15 minutes and again after each deployment produced 61 production
  # releases in one morning, each re-running Workers AI production proofs and
  # exhausting the free daily AI allocation. Urgent fixes: workflow_dispatch.
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: mel-autonomous-production-release-promotion
  cancel-in-progress: false

jobs:
  promote-and-dispatch:
    if: ${{ (github.actor == 'adrienlopezcarreras-pixel' || github.actor == 'github-actions[bot]') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Authorize and dispatch MEL autonomous release
        env:
          GH_TOKEN: ${{ github.token }}
          MEL_REQUIRE_PROTECTED_REFS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'true' || 'false' }}
          MEL_SKIP_ALREADY_ATTEMPTED_SHA: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          MEL_CATCHUP_COMPLETED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: node scripts/mel-autonomous-release-dispatch.mjs
