name: audit-probe-timeout-ci
on:
  pull_request:
    paths:
      - 'src/diagnostics/development-audit.js'
      - 'tests/development-audit.test.mjs'
      - '.github/workflows/audit-probe-timeout-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check src/diagnostics/development-audit.js && node --check tests/development-audit.test.mjs
      - run: node --test tests/development-audit.test.mjs
      - run: npm test
