name: refresh-dev-lock-once

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - .github/workflows/refresh-dev-lock-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: candidate/mel-clean-autonomy
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Refresh Wrangler lock
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev wrangler@4.135.0 --package-lock-only --ignore-scripts
          npm audit --package-lock-only --audit-level=high

      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore(dev): update Wrangler to 4.135.0"
          git push origin HEAD:candidate/mel-clean-autonomy
