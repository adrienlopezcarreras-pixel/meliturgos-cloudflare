name: Godot private five-game test

on:
  push:
    branches:
      - godot-private-test-20260919
    paths:
      - ".github/workflows/godot-private-test.yml"

permissions:
  contents: read

jobs:
  godot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout handshake branch
        uses: actions/checkout@v4
        with:
          ref: godot-private-test-20260919

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl openssl xvfb libgl1 libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libwayland-client0

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             -o /tmp/godot.zip             "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n1)"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Generate one-run encryption key and wait for encrypted payload
        env:
          BRANCH: godot-private-test-20260919
          REPO: adrienlopezcarreras-pixel/meliturgos-cloudflare
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem >/dev/null 2>&1
          echo "GODOT_TEST_RUN_ID=$GITHUB_RUN_ID"
          echo "GODOT_TEST_PUBKEY_B64=$(base64 -w0 /tmp/public.pem)"
          PAYLOAD_URL="https://raw.githubusercontent.com/$REPO/$BRANCH/ci-godot-test/payload-$GITHUB_RUN_ID.txt"
          echo "Waiting for encrypted payload: ci-godot-test/payload-$GITHUB_RUN_ID.txt"
          found=0
          for i in $(seq 1 90); do
            if curl -fsSL "$PAYLOAD_URL?cache=$i-$(date +%s)" -o /tmp/payload.txt; then
              if grep -q '^KEY_B64=' /tmp/payload.txt && grep -q '^CIPHER_B64=' /tmp/payload.txt; then
                found=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$found" -ne 1 ]; then
            echo "PAYLOAD_TIMEOUT"
            exit 90
          fi
          sed -n 's/^KEY_B64=//p' /tmp/payload.txt | base64 -d > /tmp/key.enc
          sed -n 's/^CIPHER_B64=//p' /tmp/payload.txt | base64 -d > /tmp/bundle.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem             -pkeyopt rsa_padding_mode:oaep             -in /tmp/key.enc -out /tmp/pass.bin
          openssl enc -d -aes-256-cbc -pbkdf2             -in /tmp/bundle.enc -out /tmp/games.tar.gz             -pass file:/tmp/pass.bin
          mkdir -p "$RUNNER_TEMP/games"
          tar -xzf /tmp/games.tar.gz -C "$RUNNER_TEMP/games"
          rm -f /tmp/private.pem /tmp/public.pem /tmp/key.enc /tmp/bundle.enc /tmp/pass.bin /tmp/games.tar.gz /tmp/payload.txt
          echo "GAMES_ROOT=$RUNNER_TEMP/games" >> "$GITHUB_ENV"

      - name: Execute five projects in Godot
        run: |
          set +e
          mkdir -p /tmp/godot-results
          overall=0
          projects=(TARNEN DIVISION_AZUL CHEVALIER_IMMORTEL ORPHELINS_DU_CODE_3D CIVITAS)
          for name in "${projects[@]}"; do
            proj="$GAMES_ROOT/$name"
            echo "===== TEST $name ====="
            if [ ! -f "$proj/project.godot" ]; then
              echo "$name RESULT=FAIL reason=missing_project.godot"
              overall=1
              continue
            fi

            "$GODOT" --headless --path "$proj" --editor --quit --verbose               > "/tmp/godot-results/$name-import.log" 2>&1
            import_rc=$?

            "$GODOT" --headless --path "$proj" --quit-after 120 --verbose               > "/tmp/godot-results/$name-runtime.log" 2>&1
            runtime_rc=$?

            bad=0
            if [ "$import_rc" -ne 0 ] || [ "$runtime_rc" -ne 0 ]; then
              bad=1
            fi
            if grep -Eqi 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Failed loading resource|Invalid call|Invalid get index|Attempt to call|Node not found'               "/tmp/godot-results/$name-import.log" "/tmp/godot-results/$name-runtime.log"; then
              bad=1
            fi

            echo "--- import log tail ($name) ---"
            tail -n 80 "/tmp/godot-results/$name-import.log"
            echo "--- runtime log tail ($name) ---"
            tail -n 120 "/tmp/godot-results/$name-runtime.log"

            if [ "$bad" -eq 0 ]; then
              echo "$name RESULT=PASS import_rc=$import_rc runtime_rc=$runtime_rc"
            else
              echo "$name RESULT=FAIL import_rc=$import_rc runtime_rc=$runtime_rc"
              overall=1
            fi
          done
          echo "OVERALL_RESULT=$([ "$overall" -eq 0 ] && echo PASS || echo FAIL)"
          exit "$overall"
