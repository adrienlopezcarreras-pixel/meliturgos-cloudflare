name: Godot private five-game test

on:
  push:
    branches:
      - godot-private-test-20260919
    paths:
      - ".github/workflows/godot-private-test.yml"

permissions:
  contents: write

jobs:
  godot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout handshake branch
        uses: actions/checkout@v4
        with:
          ref: godot-private-test-20260919

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl openssl xvfb libgl1 libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libwayland-client0

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n1)"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Publish one-run key and wait for encrypted payload parts
        env:
          BRANCH: godot-private-test-20260919
          REPO: adrienlopezcarreras-pixel/meliturgos-cloudflare
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem >/dev/null 2>&1

          PUBKEY_B64="$(base64 -w0 /tmp/public.pem)"
          mkdir -p ci-godot-test
          printf '%s\n' "$PUBKEY_B64" > "ci-godot-test/pubkey-$GITHUB_RUN_ID.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci-godot-test/pubkey-$GITHUB_RUN_ID.txt"
          git commit -m "ci: publish ephemeral Godot test key $GITHUB_RUN_ID [skip ci]"
          git push origin "HEAD:$BRANCH"

          echo "GODOT_TEST_RUN_ID=$GITHUB_RUN_ID"
          echo "Ephemeral public key published for run $GITHUB_RUN_ID"

          MANIFEST_URL="https://raw.githubusercontent.com/$REPO/$BRANCH/ci-godot-test/payload-$GITHUB_RUN_ID-manifest.txt"
          found=0
          for i in $(seq 1 120); do
            if curl -fsSL "$MANIFEST_URL?cache=$i-$(date +%s)" -o /tmp/manifest.txt; then
              if grep -q '^PARTS=' /tmp/manifest.txt; then
                found=1
                break
              fi
            fi
            sleep 5
          done
          if [ "$found" -ne 1 ]; then
            echo "PAYLOAD_MANIFEST_TIMEOUT"
            exit 90
          fi

          PARTS="$(sed -n 's/^PARTS=//p' /tmp/manifest.txt | head -n1)"
          if ! [[ "$PARTS" =~ ^[0-9]+$ ]] || [ "$PARTS" -lt 1 ] || [ "$PARTS" -gt 100 ]; then
            echo "INVALID_PART_COUNT:$PARTS"
            exit 91
          fi

          : > /tmp/payload.txt
          for n in $(seq -w 1 "$PARTS"); do
            URL="https://raw.githubusercontent.com/$REPO/$BRANCH/ci-godot-test/payload-$GITHUB_RUN_ID-part$n.txt"
            ok=0
            for attempt in $(seq 1 60); do
              if curl -fsSL "$URL?cache=$attempt-$(date +%s)" -o "/tmp/part$n"; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "PAYLOAD_PART_TIMEOUT:$n"
              exit 92
            fi
            cat "/tmp/part$n" >> /tmp/payload.txt
          done

          if ! grep -q '^KEY_B64=' /tmp/payload.txt || ! grep -q '^CIPHER_B64=' /tmp/payload.txt; then
            echo "PAYLOAD_FORMAT_INVALID"
            exit 93
          fi

          sed -n 's/^KEY_B64=//p' /tmp/payload.txt | base64 -d > /tmp/key.enc
          sed -n 's/^CIPHER_B64=//p' /tmp/payload.txt | base64 -d > /tmp/bundle.enc

          openssl pkeyutl -decrypt -inkey /tmp/private.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -in /tmp/key.enc -out /tmp/pass.bin

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/bundle.enc -out /tmp/games.tar.gz \
            -pass file:/tmp/pass.bin

          mkdir -p "$RUNNER_TEMP/games"
          tar -xzf /tmp/games.tar.gz -C "$RUNNER_TEMP/games"

          rm -f /tmp/private.pem /tmp/public.pem /tmp/key.enc /tmp/bundle.enc /tmp/pass.bin /tmp/games.tar.gz /tmp/payload.txt /tmp/manifest.txt /tmp/part*
          echo "GAMES_ROOT=$RUNNER_TEMP/games" >> "$GITHUB_ENV"

      - name: Execute five projects in Godot
        run: |
          set +e
          mkdir -p /tmp/godot-results
          overall=0
          projects=(TARNEN DIVISION_AZUL CHEVALIER_IMMORTEL ORPHELINS_DU_CODE_3D CIVITAS)

          for name in "${projects[@]}"; do
            proj="$GAMES_ROOT/$name"
            echo "===== TEST $name ====="

            if [ ! -f "$proj/project.godot" ]; then
              echo "$name RESULT=FAIL reason=missing_project.godot"
              overall=1
              continue
            fi

            "$GODOT" --headless --path "$proj" --editor --quit --verbose \
              > "/tmp/godot-results/$name-import.log" 2>&1
            import_rc=$?

            "$GODOT" --headless --path "$proj" --quit-after 120 --verbose \
              > "/tmp/godot-results/$name-runtime.log" 2>&1
            runtime_rc=$?

            bad=0
            if [ "$import_rc" -ne 0 ] || [ "$runtime_rc" -ne 0 ]; then
              bad=1
            fi

            if grep -Eqi 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Failed loading resource|Invalid call|Invalid get index|Attempt to call|Node not found' \
              "/tmp/godot-results/$name-import.log" "/tmp/godot-results/$name-runtime.log"; then
              bad=1
            fi

            echo "--- import log ($name) ---"
            tail -n 120 "/tmp/godot-results/$name-import.log"
            echo "--- runtime log ($name) ---"
            tail -n 180 "/tmp/godot-results/$name-runtime.log"

            if [ "$bad" -eq 0 ]; then
              echo "$name RESULT=PASS import_rc=$import_rc runtime_rc=$runtime_rc"
            else
              echo "$name RESULT=FAIL import_rc=$import_rc runtime_rc=$runtime_rc"
              overall=1
            fi
          done

          if [ "$overall" -eq 0 ]; then
            echo "OVERALL_RESULT=PASS"
          else
            echo "OVERALL_RESULT=FAIL"
          fi

          exit "$overall"
