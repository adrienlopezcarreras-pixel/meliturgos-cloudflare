name: Godot private five-game test
# screenshot capture run 10

on:
  push:
    branches:
      - godot-private-test-20260919
    paths:
      - ".github/workflows/godot-private-test.yml"

permissions:
  contents: write

jobs:
  godot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout handshake branch
        uses: actions/checkout@v4
        with:
          ref: godot-private-test-20260919

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl openssl xvfb imagemagick x11-apps libgl1 libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libwayland-client0

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip             "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n1)"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Publish one-run key and receive encrypted private manifest
        env:
          BRANCH: godot-private-test-20260919
          REPO: adrienlopezcarreras-pixel/meliturgos-cloudflare
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem >/dev/null 2>&1
          PUBKEY_B64="$(base64 -w0 /tmp/public.pem)"

          mkdir -p ci-godot-test
          printf '%s\\n' "$PUBKEY_B64" > "ci-godot-test/pubkey-$GITHUB_RUN_ID.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci-godot-test/pubkey-$GITHUB_RUN_ID.txt"
          git commit -m "ci: publish ephemeral Godot manifest key $GITHUB_RUN_ID [skip ci]"
          git push origin "HEAD:$BRANCH"

          echo "GODOT_TEST_RUN_ID=$GITHUB_RUN_ID"
          PAYLOAD_API="https://api.github.com/repos/$REPO/contents/ci-godot-test/manifest-$GITHUB_RUN_ID.txt?ref=$BRANCH"
          found=0
          for i in $(seq 1 100); do
            if curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "$PAYLOAD_API" -o /tmp/payload.txt; then
              if grep -q '^KEY_B64=' /tmp/payload.txt && grep -q '^CIPHER_B64=' /tmp/payload.txt; then
                found=1
                break
              fi
            fi
            sleep 3
          done
          if [ "$found" -ne 1 ]; then
            echo "PRIVATE_MANIFEST_TIMEOUT"
            exit 90
          fi

          sed -n 's/^KEY_B64=//p' /tmp/payload.txt | base64 -d > /tmp/key.enc
          sed -n 's/^CIPHER_B64=//p' /tmp/payload.txt | base64 -d > /tmp/manifest.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem             -pkeyopt rsa_padding_mode:oaep             -in /tmp/key.enc -out /tmp/pass.bin
          openssl enc -d -aes-256-cbc -pbkdf2             -in /tmp/manifest.enc -out /tmp/manifest.env             -pass file:/tmp/pass.bin
          chmod 600 /tmp/manifest.env
          source /tmp/manifest.env

          mkdir -p "$RUNNER_TEMP/games"
          download_game () {
            name="$1"
            url="$2"
            zip="/tmp/$name.zip"
            echo "Downloading encrypted-manifest source for $name"
            curl -L --fail --retry 3 --silent --show-error "$url" -o "$zip"
            mkdir -p "$RUNNER_TEMP/games/$name"
            unzip -q "$zip" -d "$RUNNER_TEMP/games/$name"
            if [ ! -f "$RUNNER_TEMP/games/$name/project.godot" ]; then
              nested="$(find "$RUNNER_TEMP/games/$name" -mindepth 2 -maxdepth 3 -type f -name project.godot | head -n1)"
              if [ -n "$nested" ]; then
                root="$(dirname "$nested")"
                shopt -s dotglob
                mv "$root"/* "$RUNNER_TEMP/games/$name"/
                shopt -u dotglob
              fi
            fi
            rm -f "$zip"
          }

          download_game TARNEN "$TARNEN_URL"
          download_game DIVISION_AZUL "$DIVISION_URL"
          download_game CHEVALIER_IMMORTEL "$CHEVALIER_URL"
          download_game ORPHELINS_DU_CODE_3D "$ORPHELINS_URL"
          download_game CIVITAS "$CIVITAS_URL"

          rm -f /tmp/private.pem /tmp/public.pem /tmp/key.enc /tmp/manifest.enc /tmp/pass.bin /tmp/manifest.env /tmp/payload.txt
          echo "GAMES_ROOT=$RUNNER_TEMP/games" >> "$GITHUB_ENV"

      - name: Execute five projects in Godot
        run: |
          set +e
          mkdir -p /tmp/godot-results
          overall=0
          projects=(TARNEN DIVISION_AZUL CHEVALIER_IMMORTEL ORPHELINS_DU_CODE_3D CIVITAS)
          for name in "${projects[@]}"; do
            proj="$GAMES_ROOT/$name"
            echo "===== TEST $name ====="
            if [ ! -f "$proj/project.godot" ]; then
              echo "$name RESULT=FAIL reason=missing_project.godot"
              overall=1
              continue
            fi

            "$GODOT" --headless --path "$proj" --editor --quit --verbose               > "/tmp/godot-results/$name-import.log" 2>&1
            import_rc=$?

            "$GODOT" --headless --path "$proj" --quit-after 120 --verbose               > "/tmp/godot-results/$name-runtime.log" 2>&1
            runtime_rc=$?

            bad=0
            if [ "$import_rc" -ne 0 ] || [ "$runtime_rc" -ne 0 ]; then bad=1; fi
            if grep -Eqi 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Failed loading resource|Invalid call|Invalid get index|Attempt to call|Node not found'               "/tmp/godot-results/$name-import.log" "/tmp/godot-results/$name-runtime.log"; then
              bad=1
            fi

            echo "--- import log ($name) ---"
            tail -n 120 "/tmp/godot-results/$name-import.log"
            echo "--- runtime log ($name) ---"
            tail -n 180 "/tmp/godot-results/$name-runtime.log"

            if [ "$bad" -eq 0 ]; then
              echo "$name RESULT=PASS import_rc=$import_rc runtime_rc=$runtime_rc"
            else
              echo "$name RESULT=FAIL import_rc=$import_rc runtime_rc=$runtime_rc"
              overall=1
            fi
          done
          if [ "$overall" -eq 0 ]; then echo "OVERALL_RESULT=PASS"; else echo "OVERALL_RESULT=FAIL"; fi
          exit "$overall"

      - name: Capture real rendered screenshots
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-screenshots
          projects=(TARNEN DIVISION_AZUL CHEVALIER_IMMORTEL ORPHELINS_DU_CODE_3D CIVITAS)

          for name in "${projects[@]}"; do
            proj="$GAMES_ROOT/$name"
            shot="/tmp/godot-screenshots/$name.png"
            echo "===== CAPTURE $name ====="

            xvfb-run -a -s "-screen 0 1280x720x24" bash -lc "
              set +e
              '$GODOT' --path '$proj' --resolution 1280x720 --position 0,0 >/tmp/${name}-visual.log 2>&1 &
              pid=\$!
              sleep 5
              import -window root '$shot'
              rc=\$?
              kill \$pid >/dev/null 2>&1 || true
              wait \$pid >/dev/null 2>&1 || true
              exit \$rc
            "

            test -s "$shot"
            identify "$shot"
          done

      - name: Upload real Godot screenshots
        uses: actions/upload-artifact@v4
        with:
          name: godot-real-screenshots
          path: /tmp/godot-screenshots/*.png
          if-no-files-found: error
          retention-days: 1

