name: Godot private five-game test
# unified gamedev runtime run 30 c611-secondary-context

on:
  push:
    branches:
      - godot-private-test-20260919
    paths:
      - ".github/workflows/godot-private-test.yml"

permissions:
  contents: write

jobs:
  godot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout handshake branch
        uses: actions/checkout@v4
        with:
          ref: godot-private-test-20260919

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl openssl xvfb imagemagick x11-apps libgl1 libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libwayland-client0

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip             "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          GODOT="$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' | head -n1)"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Generate one-run encryption key
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem >/dev/null 2>&1
          chmod 600 /tmp/private.pem
          echo "GODOT_TEST_RUN_ID=$GITHUB_RUN_ID"

      - name: Upload ephemeral public key
        uses: actions/upload-artifact@v4
        with:
          name: godot-ephemeral-public-key-${{ github.run_id }}
          path: /tmp/public.pem
          if-no-files-found: error
          retention-days: 1

      - name: Receive encrypted private manifest and download sources
        env:
          BRANCH: godot-private-test-20260919
          REPO: adrienlopezcarreras-pixel/meliturgos-cloudflare
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PAYLOAD_API="https://api.github.com/repos/$REPO/contents/ci-godot-test/manifest-$GITHUB_RUN_ID.txt?ref=$BRANCH"
          found=0
          for i in $(seq 1 160); do
            if curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "$PAYLOAD_API" -o /tmp/payload.txt; then
              if grep -q '^KEY_B64=' /tmp/payload.txt && grep -q '^CIPHER_B64=' /tmp/payload.txt; then
                found=1
                break
              fi
            fi
            sleep 3
          done
          if [ "$found" -ne 1 ]; then
            echo "PRIVATE_MANIFEST_TIMEOUT"
            exit 90
          fi

          sed -n 's/^KEY_B64=//p' /tmp/payload.txt | base64 -d > /tmp/key.enc
          sed -n 's/^CIPHER_B64=//p' /tmp/payload.txt | base64 -d > /tmp/manifest.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -in /tmp/key.enc -out /tmp/pass.bin
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/manifest.enc -out /tmp/manifest.env \
            -pass file:/tmp/pass.bin

          chmod 600 /tmp/manifest.env
          get_b64_value () {
            key="$1"
            grep "^$key=" /tmp/manifest.env | head -n1 | cut -d= -f2-
          }
          TARNEN_URL="$(get_b64_value TARNEN_B64 | base64 -d)"
          DIVISION_URL="$(get_b64_value DIVISION_B64 | base64 -d)"
          CHEVALIER_URL="$(get_b64_value CHEVALIER_B64 | base64 -d)"
          ORPHELINS_URL="$(get_b64_value ORPHELINS_B64 | base64 -d)"
          CIVITAS_URL="$(get_b64_value CIVITAS_B64 | base64 -d)"

          test -n "$TARNEN_URL"
          test -n "$DIVISION_URL"
          test -n "$CHEVALIER_URL"
          test -n "$ORPHELINS_URL"
          test -n "$CIVITAS_URL"

          mkdir -p "$RUNNER_TEMP/games"
          download_game () {
            name="$1"
            url="$2"
            zip="/tmp/$name.zip"
            echo "Downloading encrypted-manifest source for $name"
            curl -L --fail --retry 3 --silent --show-error "$url" -o "$zip"
            mkdir -p "$RUNNER_TEMP/games/$name"
            unzip -q "$zip" -d "$RUNNER_TEMP/games/$name"
            if [ ! -f "$RUNNER_TEMP/games/$name/project.godot" ]; then
              nested="$(find "$RUNNER_TEMP/games/$name" -mindepth 2 -maxdepth 3 -type f -name project.godot | head -n1)"
              if [ -n "$nested" ]; then
                root="$(dirname "$nested")"
                shopt -s dotglob
                mv "$root"/* "$RUNNER_TEMP/games/$name"/
                shopt -u dotglob
              fi
            fi
            rm -f "$zip"
          }

          download_game TARNEN "$TARNEN_URL"
          download_game DIVISION_AZUL "$DIVISION_URL"
          download_game CHEVALIER_IMMORTEL "$CHEVALIER_URL"
          download_game ORPHELINS_DU_CODE_3D "$ORPHELINS_URL"
          download_game CIVITAS "$CIVITAS_URL"

          rm -f /tmp/private.pem /tmp/public.pem /tmp/key.enc /tmp/manifest.enc /tmp/pass.bin /tmp/manifest.env /tmp/payload.txt
          echo "GAMES_ROOT=$RUNNER_TEMP/games" >> "$GITHUB_ENV"

      - name: Execute five projects in Godot
        run: |
          set +e
          mkdir -p /tmp/godot-results
          overall=0
          projects=(TARNEN DIVISION_AZUL CHEVALIER_IMMORTEL ORPHELINS_DU_CODE_3D CIVITAS)
          for name in "${projects[@]}"; do
            proj="$GAMES_ROOT/$name"
            echo "===== TEST $name ====="
            if [ ! -f "$proj/project.godot" ]; then
              echo "$name RESULT=FAIL reason=missing_project.godot"
              overall=1
              continue
            fi

            "$GODOT" --headless --path "$proj" --editor --quit --verbose               > "/tmp/godot-results/$name-import.log" 2>&1
            import_rc=$?

            "$GODOT" --headless --path "$proj" --quit-after 120 --verbose               > "/tmp/godot-results/$name-runtime.log" 2>&1
            runtime_rc=$?

            bad=0
            if [ "$import_rc" -ne 0 ] || [ "$runtime_rc" -ne 0 ]; then bad=1; fi
            if grep -Eqi 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Failed loading resource|Invalid call|Invalid get index|Attempt to call|Node not found'               "/tmp/godot-results/$name-import.log" "/tmp/godot-results/$name-runtime.log"; then
              bad=1
            fi

            echo "--- import log ($name) ---"
            tail -n 120 "/tmp/godot-results/$name-import.log"
            echo "--- runtime log ($name) ---"
            tail -n 180 "/tmp/godot-results/$name-runtime.log"

            if [ "$bad" -eq 0 ]; then
              echo "$name RESULT=PASS import_rc=$import_rc runtime_rc=$runtime_rc"
            else
              echo "$name RESULT=FAIL import_rc=$import_rc runtime_rc=$runtime_rc"
              overall=1
            fi
          done
          if [ "$overall" -eq 0 ]; then echo "OVERALL_RESULT=PASS"; else echo "OVERALL_RESULT=FAIL"; fi
          exit "$overall"

      - name: Execute persistence and input tests
        run: |
          set +e
          overall=0
          projects=(TARNEN DIVISION_AZUL CHEVALIER_IMMORTEL ORPHELINS_DU_CODE_3D CIVITAS)
          for name in "${projects[@]}"; do
            proj="$GAMES_ROOT/$name"
            echo "===== INFRA TEST $name ====="
            "$GODOT" --headless --path "$proj" --script "res://tests/save_service_v55_test.gd" > "/tmp/${name}-save-test.log" 2>&1
            save_rc=$?
            "$GODOT" --headless --path "$proj" --script "res://tests/input_router_v55_test.gd" > "/tmp/${name}-input-test.log" 2>&1
            input_rc=$?
            "$GODOT" --headless --path "$proj" --script "res://tests/command_router_v56_test.gd" > "/tmp/${name}-command-test.log" 2>&1
            command_rc=$?
            "$GODOT" --headless --path "$proj" --script "res://tests/action_context_c609_test.gd" > "/tmp/${name}-c609-test.log" 2>&1
            c609_rc=$?
            "$GODOT" --headless --path "$proj" --script "res://tests/consequence_feedback_c610_test.gd" > "/tmp/${name}-c610-test.log" 2>&1
            c610_rc=$?
            "$GODOT" --headless --path "$proj" --script "res://tests/secondary_context_c611_test.gd" > "/tmp/${name}-c611-test.log" 2>&1
            c611_rc=$?
            cat "/tmp/${name}-save-test.log"
            cat "/tmp/${name}-input-test.log"
            cat "/tmp/${name}-command-test.log"
            cat "/tmp/${name}-c609-test.log"
            cat "/tmp/${name}-c610-test.log"
            cat "/tmp/${name}-c611-test.log"
            if [ "$save_rc" -ne 0 ] || [ "$input_rc" -ne 0 ] || [ "$command_rc" -ne 0 ] || [ "$c609_rc" -ne 0 ] || [ "$c610_rc" -ne 0 ] || [ "$c611_rc" -ne 0 ]; then
              echo "$name INFRA_TEST=FAIL save_rc=$save_rc input_rc=$input_rc command_rc=$command_rc c609_rc=$c609_rc c610_rc=$c610_rc c611_rc=$c611_rc"
              overall=1
            else
              echo "$name INFRA_TEST=PASS save_rc=$save_rc input_rc=$input_rc command_rc=$command_rc c609_rc=$c609_rc c610_rc=$c610_rc c611_rc=$c611_rc"
            fi
          done
          if [ "$overall" -eq 0 ]; then echo "INFRA_OVERALL=PASS"; else echo "INFRA_OVERALL=FAIL"; fi
          exit "$overall"

      - name: Capture real rendered screenshots
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-screenshots /tmp/godot-movie
          projects=(TARNEN DIVISION_AZUL CHEVALIER_IMMORTEL ORPHELINS_DU_CODE_3D CIVITAS)

          for name in "${projects[@]}"; do
            proj="$GAMES_ROOT/$name"
            echo "===== MOVIE CAPTURE $name ====="
            rm -f /tmp/godot-movie/${name}*.png /tmp/godot-movie/${name}.wav

            xvfb-run -a -s "-screen 0 1280x720x24" \
              "$GODOT" --path "$proj" \
              --write-movie "/tmp/godot-movie/${name}.png" \
              --fixed-fps 30 --quit-after 3 --resolution 1280x720 \
              > "/tmp/${name}-movie.log" 2>&1

            frame="$(find /tmp/godot-movie -maxdepth 1 -type f -name "${name}*.png" | sort | tail -n 1)"
            if [ -z "$frame" ] || [ ! -s "$frame" ]; then
              echo "NO_MOVIE_FRAME:$name"
              cat "/tmp/${name}-movie.log" || true
              exit 97
            fi
            cp "$frame" "/tmp/godot-screenshots/$name.png"
            identify "/tmp/godot-screenshots/$name.png"
          done

      - name: Upload real Godot screenshots
        uses: actions/upload-artifact@v4
        with:
          name: godot-real-screenshots
          path: /tmp/godot-screenshots/*.png
          if-no-files-found: error
          retention-days: 1


# c603 visual validation trigger
