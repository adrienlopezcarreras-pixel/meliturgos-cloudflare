name: dependency-audit-temp

on:
  push:
    branches:
      - cleanup/dependency-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Audit dependencies
        shell: bash
        run: |
          set +e
          npm audit --json
          echo "audit_exit=$?"
          exit 0
