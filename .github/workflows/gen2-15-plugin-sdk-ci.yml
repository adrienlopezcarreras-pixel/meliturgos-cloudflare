name: gen2-15-plugin-sdk-ci

on:
  pull_request:
    paths:
      - 'src/plugins/**'
      - 'tests/gen2/plugin-*.test.mjs'
      - '.github/workflows/gen2-15-plugin-sdk-ci.yml'

permissions:
  contents: read

jobs:
  plugin-sdk-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
      - name: Plugin syntax
        run: >
          node --check src/plugins/sdk.js &&
          node --check src/plugins/validator.js &&
          node --check src/plugins/version-manager.js &&
          node --check src/plugins/d1-version-store.js
      - name: GEN2-15 targeted tests
        run: >
          node --test
          tests/gen2/plugin-d1-version-store.test.mjs
          tests/gen2/plugin-manifest-control-plane.test.mjs
          tests/gen2/plugin-version-manager.test.mjs

  plugin-sdk-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: plugin-sdk-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git switch -c candidate/gen2-15-plugin-sdk-ci
      - run: npm test
