name: canonical-branch-unicity

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-branch-unicity
  cancel-in-progress: true

jobs:
  unicity:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reject parallel production deployment paths
        shell: bash
        run: |
          set -euo pipefail
          canonical=".github/workflows/deploy-cloudflare-release.yml"
          guard=".github/workflows/canonical-branch-unicity.yml"
          violations=()

          while IFS= read -r file; do
            [[ "$file" = "$canonical" || "$file" = "$guard" ]] && continue

            if ! grep -Eiq 'cloudflare/wrangler-action|(^|[[:space:]])(npx[[:space:]]+|pnpm[[:space:]]+exec[[:space:]]+)?wrangler[[:space:]]+(deploy|publish)|npm[[:space:]]+run[[:space:]]+deploy|workers/scripts' "$file"; then
              continue
            fi

            case "$file" in
              .github/workflows/deploy-candidate-preview.yml)
                grep -Fq -- '--env preview' "$file" || violations+=("$file")
                ;;
              .github/workflows/deploy-dreamina-preview.yml|.github/workflows/deploy-memory-export-preview.yml|.github/workflows/deploy-memory-sync-preview.yml|.github/workflows/gen2-31-browser-live-preview.yml)
                grep -Eq -- '--config[[:space:]]+wrangler[.][A-Za-z0-9._-]*preview[.]jsonc' "$file" || violations+=("$file")
                ;;
              *)
                violations+=("$file")
                ;;
            esac
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)

          if (( ${#violations[@]} )); then
            echo "PARALLEL_PRODUCTION_DEPLOYMENT_PATHS:"
            printf ' - %s\n' "${violations[@]}"
            exit 1
          fi

          grep -Fq 'workflow_dispatch:' "$canonical"
          grep -Fq 'DEPLOY_APPROVED' "$canonical"
          grep -Fq 'expected_sha' "$canonical"
          grep -Fq 'release/*' "$canonical"
          grep -Fq 'MEL_DEPLOYED_GIT_SHA' "$canonical"
          echo "Production deployment unicity verified: production can only be mutated by the canonical approved release workflow."

      - name: Fetch all branch refs
        shell: bash
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Reject every non-exempt branch divergence
        shell: bash
        run: |
          set -euo pipefail
          canonical="refs/remotes/origin/candidate/mel-clean-autonomy"
          divergent=()

          # Every active MEL code branch, including LoRA/compat workspaces, must converge.
          # Only explicitly isolated non-production laboratories may diverge inside their strict path allowlists.

          while IFS= read -r remote_ref; do
            branch="${remote_ref#origin/}"

            case "$branch" in
              HEAD|candidate/mel-clean-autonomy|teacher-bridge/runtime|archive/*)
                continue
                ;;

              feature/mel-waveshare-terminal|feature/mel-device-and-computer-interface)
                branch_ref="refs/remotes/origin/$branch"
                base="$(git merge-base "$branch_ref" "$canonical")"
                unexpected="$(git diff --name-only "$base" "$branch_ref" | grep -Ev '^(assets/MEL-Computer-[A-Za-z0-9._-]+[.]ps1|src/devices/[A-Za-z0-9._/-]+[.]js|src/capabilities/computer-runtime-capabilities[.]js|tests/[A-Za-z0-9._/-]*(computer|waveshare)[A-Za-z0-9._/-]*[.]test[.]mjs|scripts/[A-Za-z0-9._/-]*(computer|waveshare)[A-Za-z0-9._/-]*)$' || true)"
                if [[ -n "$unexpected" ]]; then
                  echo "HARDWARE_LAB_SCOPE_VIOLATION:$branch"
                  printf '%s\n' "$unexpected"
                  divergent+=("$branch")
                else
                  echo "Isolated hardware lab branch accepted: $branch"
                fi
                continue
                ;;

              godot-private-test-*)
                branch_ref="refs/remotes/origin/$branch"
                base="$(git merge-base "$branch_ref" "$canonical")"
                unexpected="$(git diff --name-only "$base" "$branch_ref" | grep -Ev '^(\.github/workflows/godot-private-test\.yml|ci-godot-test/)' || true)"
                if [[ -n "$unexpected" ]]; then
                  echo "GODOT_LAB_SCOPE_VIOLATION:$branch"
                  printf '%s\n' "$unexpected"
                  divergent+=("$branch")
                else
                  echo "Isolated Godot lab branch accepted: $branch"
                fi
                continue
                ;;
            esac

            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" "$canonical"; then
              divergent+=("$branch")
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)

          if (( ${#divergent[@]} )); then
            printf 'DIVERGENT_NON_EXEMPT_BRANCHES:\n'
            printf ' - %s\n' "${divergent[@]}"
            exit 1
          fi

          echo "Canonical unicity verified: every active branch is convergent or strictly isolated."
