name: stt-server-ci

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/api/voice-transcribe.js'
      - 'tests/voice-mobile.test.mjs'
      - 'tests/voice-internal-device.test.mjs'
      - '.github/workflows/stt-server-ci.yml'
  push:
    branches:
      - fix/stt-production-fallback-20261005
    paths:
      - 'src/api/voice-transcribe.js'
      - 'tests/voice-mobile.test.mjs'
      - 'tests/voice-internal-device.test.mjs'
      - '.github/workflows/stt-server-ci.yml'

permissions:
  contents: read

jobs:
  stt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: STT server tests
        run: node --test tests/voice-mobile.test.mjs tests/voice-internal-device.test.mjs
