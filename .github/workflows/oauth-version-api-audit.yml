name: oauth-version-api-audit

on:
  push:
    branches:
      - diag/oauth-vault-count-20261006

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Inspect up to 100 Worker versions for OAuth secret bindings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/meliturgos/versions"
          curl --silent --show-error --fail             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "${BASE}?per_page=100&page=1" > versions.json

          node - <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const root=JSON.parse(fs.readFileSync('versions.json','utf8'));
          const rows=Array.isArray(root?.result)
            ? root.result
            : Array.isArray(root?.result?.items)
              ? root.result.items
              : Array.isArray(root?.items)
                ? root.items
                : [];
          console.log('OAUTH_VERSION_API_SHAPE '+JSON.stringify({
            top:Object.keys(root||{}),
            result:Array.isArray(root?.result)?'array':typeof root?.result,
            result_keys:root?.result&&typeof root.result==='object'&&!Array.isArray(root.result)?Object.keys(root.result):[]
          }));
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const hits=[];
          for(const v of rows){
            const id=v?.id;
            if(!id) continue;
            let raw='';
            try{
              raw=cp.execFileSync('curl',[
                '--silent','--show-error','--fail',
                '--header',`Authorization: Bearer ${token}`,
                `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/meliturgos/versions/${id}`
              ],{encoding:'utf8'});
            }catch{continue}
            let d={}; try{d=JSON.parse(raw)}catch{}
            const bindings=d?.result?.resources?.bindings || d?.result?.metadata?.bindings || d?.result?.bindings || [];
            const names=new Set((Array.isArray(bindings)?bindings:[]).map(x=>x?.name).filter(Boolean));
            const hasId=names.has('MEL_OAUTH_ENCRYPTION_KEY_ID');
            const hasKey=names.has('MEL_OAUTH_ENCRYPTION_KEY_B64');
            if(hasId||hasKey){
              hits.push({
                id,
                number:v?.number??null,
                created_on:v?.metadata?.created_on||null,
                has_id:hasId,
                has_key:hasKey,
                commit_sha:v?.metadata?.annotations?.['workers/commit_sha']||null
              });
            }
          }
          console.log('OAUTH_VERSION_API_AUDIT '+JSON.stringify({scanned:rows.length,hits}));
          NODE
