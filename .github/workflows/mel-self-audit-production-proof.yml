name: mel-self-audit-production-proof

on:
  workflow_run:
    workflows: ["deploy-cloudflare-release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact deployed SHA to prove
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mel-self-audit-production-proof.yml'
      - 'tests/gen2/self-audit-production-proof.test.mjs'
      - 'src/diagnostics/self-audit-supervisor.js'
      - 'src/capabilities/self-audit-capability.js'
      - 'src/router.js'

permissions:
  contents: read

concurrency:
  group: mel-launch-bootstrap-token
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/gen2/self-audit-production-proof.test.mjs tests/gen2/self-audit-supervisor.test.mjs

  production-proof:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.event.workflow_run.head_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Prove exact-SHA persistent self-audit heartbeat
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"

          cleanup() {
            set +e
            printf 'y\n' | npx wrangler secret delete MEL_LAUNCH_BOOTSTRAP_TOKEN --env="" >/tmp/self-audit-proof-secret-delete.log 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' "${TOKEN}" | npx wrangler secret put MEL_LAUNCH_BOOTSTRAP_TOKEN --env=""

          READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE="$(curl --silent --show-error --max-time 45               --header "x-mel-release-smoke: 1"               --header "x-mel-launch-bootstrap: ${TOKEN}"               --output self-check.json               --write-out '%{http_code}'               "${BASE_URL}/api/gen2/code/self-check" || true)"
            if [ "${CODE}" = "200" ]; then
              if EXPECTED_SHA="${EXPECTED_SHA}" node -e 'const d=require("./self-check.json"); if(d?.ok!==true || String(d?.deployed_sha||"").toLowerCase()!==String(process.env.EXPECTED_SHA||"").toLowerCase()) process.exit(2);'; then
                READY=1
                break
              fi
            fi
            sleep 2
          done
          test "${READY}" = "1"

          RUN_READY=0
          for ATTEMPT in $(seq 1 12); do
            RUN_CODE="$(curl --silent --show-error --max-time 60               --header "x-mel-release-smoke: 1"               --header "x-mel-launch-bootstrap: ${TOKEN}"               --header "content-type: application/json"               --data '{"id":"self.audit.run","input":{"level":"HEARTBEAT"}}'               --output self-audit-run.json               --write-out '%{http_code}'               "${BASE_URL}/api/gen2/capabilities/execute" || true)"
            if [ "${RUN_CODE}" = "200" ]; then
              RUN_READY=1
              break
            fi
            echo "Self-audit run propagation attempt ${ATTEMPT}/12 returned HTTP ${RUN_CODE}."
            test ! -s self-audit-run.json || cat self-audit-run.json
            sleep 2
          done
          test "${RUN_READY}" = "1"

          STATUS_READY=0
          for ATTEMPT in $(seq 1 12); do
            STATUS_CODE="$(curl --silent --show-error --max-time 45               --header "x-mel-release-smoke: 1"               --header "x-mel-launch-bootstrap: ${TOKEN}"               --header "content-type: application/json"               --data '{"id":"self.audit.status","input":{}}'               --output self-audit-status.json               --write-out '%{http_code}'               "${BASE_URL}/api/gen2/capabilities/execute" || true)"
            if [ "${STATUS_CODE}" = "200" ]; then
              STATUS_READY=1
              break
            fi
            echo "Self-audit status propagation attempt ${ATTEMPT}/12 returned HTTP ${STATUS_CODE}."
            test ! -s self-audit-status.json || cat self-audit-status.json
            sleep 2
          done
          test "${STATUS_READY}" = "1"

          EXPECTED_SHA="${EXPECTED_SHA}" node - <<'NODE'
          const fs=require('fs');
          const run=require('./self-audit-run.json');
          const status=require('./self-audit-status.json');
          const self=require('./self-check.json');
          const r=run?.result||{};
          const s=status?.result||{};
          const report=r?.report||{};
          const persisted=s?.state?.last_report||{};
          const ledger=s?.state?.capability_ledger||{};

          if(run?.ok!==true || run?.capability!=='self.audit.run') throw new Error('SELF_AUDIT_RUN_NOT_OK');
          if(!['SELF_AUDIT_OK','SELF_AUDIT_DEGRADED'].includes(String(r?.status||''))) throw new Error('SELF_AUDIT_STATUS_INVALID');
          if(!Array.isArray(report?.levels) || !report.levels.includes('HEARTBEAT')) throw new Error('SELF_AUDIT_HEARTBEAT_NOT_EXECUTED');
          if(report?.policy?.repair_enabled!==false) throw new Error('SELF_AUDIT_RELEASE_PROOF_MUTATION_NOT_DISABLED');
          if(Number(report?.capability_health?.total||0)<1) throw new Error('SELF_AUDIT_CAPABILITY_LEDGER_EMPTY');
          if(status?.ok!==true || status?.capability!=='self.audit.status') throw new Error('SELF_AUDIT_STATUS_READ_NOT_OK');
          if(Number(s?.state?.last_runs?.HEARTBEAT||0)<=0) throw new Error('SELF_AUDIT_HEARTBEAT_NOT_PERSISTED');
          if(persisted?.schema!=='mel.self-audit-report/v1') throw new Error('SELF_AUDIT_REPORT_NOT_PERSISTED');
          if(Object.keys(ledger).length<1) throw new Error('SELF_AUDIT_LEDGER_NOT_PERSISTED');
          if(String(self?.deployed_sha||'').toLowerCase()!==String(process.env.EXPECTED_SHA||'').toLowerCase()) throw new Error('SELF_AUDIT_DEPLOYED_SHA_MISMATCH');

          const proof={
            schema:'mel.self-audit-production-proof/v1',
            source_sha:process.env.EXPECTED_SHA,
            exact_sha_runtime:true,
            heartbeat_executed:true,
            heartbeat_persisted:true,
            capability_ledger_count:Object.keys(ledger).length,
            repair_disabled_for_release_smoke:true,
            scheduler_contract:'hourly-heartbeat-plus-daily-supervisor',
            weekly_stress_contract:report?.policy?.weekly_full_capability_stress===true,
            monthly_survival_contract:report?.policy?.monthly_non_destructive_survival_drill===true,
            secret_values_exposed:false,
          };
          fs.writeFileSync('self-audit-production-proof.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof,null,2));
          NODE

          cleanup
          trap - EXIT

      - name: Upload sanitized self-audit proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mel-self-audit-production-proof-${{ github.event.workflow_run.head_sha }}
          path: self-audit-production-proof.json
          if-no-files-found: warn
          retention-days: 30
