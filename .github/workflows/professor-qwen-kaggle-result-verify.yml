name: Professor Qwen3 Kaggle result verification
on:
  workflow_dispatch:
    inputs:
      kernel_slug:
        description: "Completed reviewed Kaggle kernel owner/slug"
        required: true
        type: string
      source_sha:
        description: "Exact 40-character source SHA embedded by training workflow"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: professor-qwen-result-verification
  cancel-in-progress: false
jobs:
  verify-qwen-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_SLUG: ${{ inputs.kernel_slug }}
      EXPECTED_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate request and tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$KERNEL_SLUG" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ ]] || { echo "QWEN_INVALID_KERNEL_SLUG"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "QWEN_INVALID_SOURCE_SHA"; exit 1; }
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_CREDENTIALS_MISSING"; exit 1; }
          python -m unittest discover -s tests -p test_qwen_gpu_evidence.py -v
      - name: Install Kaggle CLI
        run: python -m pip install -q kaggle
      - name: Retrieve completed Kaggle output and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qwen-verified
          # Download output; an unfinished run must fail, never report success.
          kaggle kernels output "$KERNEL_SLUG" -p artifacts/qwen-verified --force
          # Kaggle output may contain the original subdirectory or its files
          # flattened at the destination. Accept only one unambiguous layout.
          candidate=$(python - <<'PY'
          from pathlib import Path
          root=Path('artifacts/qwen-verified')
          candidates=[p for p in (root/'qwen3-candidate',root) if
                      (p/'training-evidence.json').is_file() and
                      (p/'adapter_model.safetensors').is_file() and
                      (p/'adapter_config.json').is_file()]
          if len(candidates)!=1:
              raise SystemExit('QWEN_CANDIDATE_OUTPUT_MISSING_OR_AMBIGUOUS')
          print(candidates[0])
          PY
          )
          python scripts/verify-qwen-gpu-artifacts.py "$candidate" --source-sha "$EXPECTED_SHA" > artifacts/qwen-verification.json
          # Only the non-secret digest summary is uploaded. Never expose weights.
          cat artifacts/qwen-verification.json
      - name: Upload verified digest summary only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-gpu-verified-${{ github.run_id }}
          path: artifacts/qwen-verification.json
          if-no-files-found: error
