name: shardvault-pastebinca-cloudflare-probe

on:
  push:
    branches:
      - 'probe/cnet-cloudflare-roundtrip'
    paths:
      - '.github/workflows/shardvault-pastebinca-cloudflare-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Deploy pastebin.ca schema probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/pbca-probe
          WORKER_NAME="mel-pbca-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "WORKER_NAME=${WORKER_NAME}" >> "$GITHUB_ENV"
          cat > .tmp/pbca-probe/worker.mjs <<'EOF'
          async function inspect(method){
            try{
              const r=await fetch('https://pastebin.ca/api/v1/pastes/pow-challenge',{
                method,
                headers:{'accept':'application/json','content-type':'application/json','user-agent':'MEL-ShardVault/1.0'},
                body:method==='POST'?JSON.stringify({}):undefined,
              });
              const text=await r.text();
              let d=null;try{d=JSON.parse(text)}catch{}
              const safe=d&&typeof d==='object'?Object.fromEntries(Object.entries(d).map(([k,v])=>[
                k,
                typeof v==='string'?(k.toLowerCase().includes('token')?'[redacted]':v.slice(0,160)):
                typeof v==='number'||typeof v==='boolean'?v:
                Array.isArray(v)?{array_length:v.length}:
                v&&typeof v==='object'?{keys:Object.keys(v).slice(0,30)}:v
              ])):null;
              return {method,status:r.status,ok:r.ok,json:safe,text_preview:d?null:text.slice(0,240)};
            }catch(error){
              return {method,status:0,ok:false,error:String(error?.message||error).slice(0,240)};
            }
          }
          export default {
            async fetch(){
              return Response.json({get:await inspect('GET'),post:await inspect('POST')},{headers:{'cache-control':'no-store'}});
            }
          };
          EOF
          cat > .tmp/pbca-probe/wrangler.jsonc <<EOF
          {"name":"${WORKER_NAME}","main":"worker.mjs","compatibility_date":"2026-10-03","workers_dev":true}
          EOF
          npx wrangler deploy --config .tmp/pbca-probe/wrangler.jsonc
      - name: Execute pastebin.ca schema probe
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${WORKER_NAME}.adrien-lopezcarreras.workers.dev/"
          CODE="$(curl --silent --show-error --max-time 120 --output pbca-probe.json --write-out '%{http_code}' "${URL}" || true)"
          echo "probe_http=${CODE}"
          test ! -s pbca-probe.json || cat pbca-probe.json
          test "${CODE}" = "200"
      - name: Delete probe worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          curl --silent --show-error --max-time 30 --request DELETE \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/pbca-delete.json --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}"
          echo
