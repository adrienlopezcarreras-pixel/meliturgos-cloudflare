name: GEN2-42 apply READY bridge package

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Exact dev_jobs id whose READY bridge package must be applied"
        required: true
      chain_depth:
        description: "Bounded event-driven autonomy chain depth"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: gen2-42-cloud-bridge
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Prepare GitHub OIDC bridge identity
        shell: bash
        run: |
          set -euo pipefail
          # No Worker secret is installed: Cloudflare refuses secret edits while a
          # newer Worker version is pending (10215). Each bridge call carries a fresh
          # GitHub Actions OIDC token for this exact workflow instead.
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          HELPER="${RUNNER_TEMP}/mel-oidc.sh"
          cat > "$HELPER" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=meliturgos-worker" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})'
          SH
          chmod +x "$HELPER"
          echo "MEL_OIDC_HELPER=${HELPER}" >> "$GITHUB_ENV"
          BRIDGE_JOB_FILE="${RUNNER_TEMP}/mel-cloud-bridge-job-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          echo "BRIDGE_JOB_FILE=${BRIDGE_JOB_FILE}" >> "$GITHUB_ENV"
          test -n "$("$HELPER")"
          echo "GitHub OIDC bridge identity ready."

      - name: Claim exact READY bridge package atomically
        id: claim
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          test -x "$MEL_OIDC_HELPER"
          [[ "$JOB_ID" =~ ^[A-Za-z0-9_.:-]+$ ]]
          JOB_ID="$JOB_ID" node -e "process.stdout.write(JSON.stringify({job_id:process.env.JOB_ID}))" > claim-request.json
          CLAIM_READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE="$(curl --silent --show-error --max-time 45               --request POST               --header "x-mel-github-oidc: $("$MEL_OIDC_HELPER")"               --header "Content-Type: application/json"               --data-binary @claim-request.json               --output "$BRIDGE_JOB_FILE"               --write-out '%{http_code}'               "$BASE_URL/api/dev-bridge/claim" || true)"
            if [ "$CODE" = "200" ]; then
              CLAIM_READY=1
              break
            fi
            if [ "$CODE" = "409" ]; then
              echo '{"status":"SKIPPED_NOT_CLAIMABLE","needs_repair":false}' > bridge-apply-result.json
              echo "claimed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Cloud bridge auth propagation attempt $ATTEMPT/12 returned HTTP $CODE."
            sleep 2
          done
          test "$CLAIM_READY" = "1"
          node - <<'NODE'
          const fs=require('fs');
          const job=JSON.parse(fs.readFileSync(process.env.BRIDGE_JOB_FILE,'utf8'));
          const prep=job?.result_json?.bridge_preparation;
          const teacher=job?.result_json?.teacher_bridge;
          const impl=job?.result_json?.implementation_proposal;
          if(job.status!=='CLAIMED') throw new Error('APPLY_JOB_NOT_CLAIMED');
          if(teacher?.status!=='ANSWERED'||teacher?.review?.verdict!=='APPROVE_PLAN'||teacher?.review?.development_allowed!==true) throw new Error('APPLY_TEACHER_APPROVAL_REQUIRED');
          if(impl?.status!=='READY') throw new Error('APPLY_IMPLEMENTATION_NOT_READY');
          if(prep?.status!=='READY') throw new Error('APPLY_BRIDGE_NOT_READY');
          if(!/^candidate\//.test(String(prep.candidate_branch||''))) throw new Error('APPLY_CANDIDATE_BRANCH_INVALID');
          if(!/^[a-f0-9]{40}$/i.test(String(prep.candidate_sha||''))) throw new Error('APPLY_CANDIDATE_SHA_INVALID');
          if(!Array.isArray(job.files_json)||job.files_json.length<1||job.files_json.length>10) throw new Error('APPLY_FILES_INVALID');
          if(!Array.isArray(job.tests_json)||job.tests_json.length<1||job.tests_json.length>4) throw new Error('APPLY_TESTS_INVALID');
          fs.appendFileSync(process.env.GITHUB_ENV,`CANDIDATE_BRANCH=${prep.candidate_branch}\nCANDIDATE_SHA=${prep.candidate_sha}\n`);
          NODE
          echo "claimed=true" >> "$GITHUB_OUTPUT"

      - name: Reconcile package already satisfied on main
        id: reconcile
        if: steps.claim.outputs.claimed == 'true'
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          git cat-file -e "$CANDIDATE_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$CANDIDATE_SHA"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const job=JSON.parse(fs.readFileSync(process.env.BRIDGE_JOB_FILE,'utf8'));
          let exact=true;
          for(const item of job.files_json||[]){
            const rel=String(item?.path||'').replace(/\\/g,'/');
            const target=path.resolve(process.cwd(),rel);
            if(!fs.existsSync(target)||fs.readFileSync(target,'utf8')!==String(item?.content??'')){ exact=false; break; }
            // A package equal to main still repairs a candidate that diverged
            // from main; only cancel when the candidate already matches too.
            const onCandidate=spawnSync('git',['show',`${process.env.CANDIDATE_SHA}:${rel}`],{encoding:'utf8',maxBuffer:64*1024*1024});
            if(onCandidate.status!==0||onCandidate.stdout!==String(item?.content??'')){ exact=false; break; }
          }
          fs.writeFileSync('bridge-main-exact.txt',exact?'true':'false');
          NODE
          if [ "$(cat bridge-main-exact.txt)" != "true" ]; then
            echo "already_satisfied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const allowed=new Set(['test','test:mel','test:integration','test:acceptance','test:smoke','test:mvp','test:routes']);
          const job=JSON.parse(fs.readFileSync(process.env.BRIDGE_JOB_FILE,'utf8'));
          const results=[];
          let failed=false;
          // [GPT6] Exact-main reconciliation must apply the same syntax/import gate.
          const check=spawnSync('npm',['run','check'],{stdio:'inherit',shell:false,timeout:180000});
          results.push({name:'syntax-and-imports',command:'check',passed:check.status===0,executed:!check.error,exit_code:check.status??1,error_code:check.error?.code||null,signal:check.signal||null});
          if(check.status!==0) failed=true;
          // [GPT6] The exact-on-main branch must apply the same mandatory full-regression gate.
          const requested=[...(job.tests_json||[])];
          if(!requested.some(spec=>spec.command==='test')) requested.unshift({name:'full-regression',command:'test'});
          for(const spec of requested){
            const name=String(spec?.command||'').trim();
            if(!allowed.has(name)){
              results.push({name:String(spec?.name||name||'unnamed'),command:name,passed:false,executed:false,error:'TEST_NOT_EXECUTED'});
              failed=true;
              continue;
            }
            const args=name==='test'?['test']:['run',name];
            const r=spawnSync('npm',args,{stdio:'inherit',shell:false,timeout:name==='test'?600000:180000});
            const row={name:String(spec?.name||name),command:name,passed:r.status===0,executed:!r.error,exit_code:r.status??1,error_code:r.error?.code||null,signal:r.signal||null};
            results.push(row); if(r.status!==0) failed=true;
          }
          fs.writeFileSync('bridge-main-tests.json',JSON.stringify(results,null,2));
          if(failed) process.exit(3);
          NODE

          MAIN_SHA="$MAIN_SHA" node - <<'NODE'
          const fs=require('fs');
          const tests=JSON.parse(fs.readFileSync('bridge-main-tests.json','utf8'));
          fs.writeFileSync('bridge-apply-result.json',JSON.stringify({
            status:'CANCELLED',
            needs_repair:false,
            mode:'ALREADY_SATISFIED_ON_MAIN',
            deployed_sha:process.env.MAIN_SHA,
            tests
          },null,2));
          NODE
          echo "already_satisfied=true" >> "$GITHUB_OUTPUT"

      - name: Report already-satisfied reconciliation
        id: report_satisfied
        if: steps.claim.outputs.claimed == 'true' && steps.reconcile.outputs.already_satisfied == 'true'
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const job=JSON.parse(fs.readFileSync(process.env.BRIDGE_JOB_FILE,'utf8'));
          const result=JSON.parse(fs.readFileSync('bridge-apply-result.json','utf8'));
          fs.writeFileSync('bridge-result-request.json',JSON.stringify({
            job_id:job.id,
            status:'CANCELLED',
            candidate_branch:job?.result_json?.bridge_preparation?.candidate_branch||null,
            tests_json:result.tests||[],
            diff_summary:'ALREADY_SATISFIED_ON_MAIN:'+String(result.deployed_sha||''),
            needs_repair:false,
            result_json:result
          }));
          NODE
          REPORT_READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE="$(curl --silent --show-error --max-time 45               --request POST               --header "x-mel-github-oidc: $("$MEL_OIDC_HELPER")"               --header "Content-Type: application/json"               --data-binary @bridge-result-request.json               --output bridge-result-response.json               --write-out '%{http_code}'               "https://meliturgos.adrien-lopezcarreras.workers.dev/api/dev-bridge/result" || true)"
            if [ "$CODE" = "200" ]; then REPORT_READY=1; break; fi
            echo "Cloud bridge result propagation attempt $ATTEMPT/12 returned HTTP $CODE."
            test ! -s bridge-result-response.json || cat bridge-result-response.json
            sleep 2
          done
          test "$REPORT_READY" = "1"

      - name: Checkout exact approved candidate
        if: steps.claim.outputs.claimed == 'true' && steps.reconcile.outputs.already_satisfied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_BRANCH" --depth=200
          git clean -fd
          HEAD_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$HEAD_SHA" != "$CANDIDATE_SHA" ]; then
            # Only rebase readied work over append-only, disjoint candidate
            # commits. Never reinterpret approval if a package file changed.
            git merge-base --is-ancestor "$CANDIDATE_SHA" "$HEAD_SHA" || {
              echo "TEACHER_APPROVAL_CANDIDATE_SHA_STALE_NON_ANCESTOR"
              exit 1
            }
            mapfile -d '' -t APPROVED_PATHS < <(node - <<'NODE'
          const fs=require('fs');
          const job=JSON.parse(fs.readFileSync(process.env.BRIDGE_JOB_FILE,'utf8'));
          for(const item of job.files_json||[]){
            const path=String(item?.path||'');
            if(!path||path.startsWith('/')||path.includes('..')||path.includes('\\')||path.startsWith('-')) process.exit(2);
            process.stdout.write(path+'\\0');
          }
          NODE
            )
            test "${#APPROVED_PATHS[@]}" -gt 0
            if ! git diff --quiet "$CANDIDATE_SHA" "$HEAD_SHA" -- "${APPROVED_PATHS[@]}"; then
              echo "TEACHER_APPROVAL_CANDIDATE_SHA_STALE_OVERLAPPING_FILES"
              exit 1
            fi
            echo "CANDIDATE_DISJOINT_REBASE approved=$CANDIDATE_SHA current=$HEAD_SHA"
            echo "APPROVED_SNAPSHOT_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
            echo "CANDIDATE_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
            CANDIDATE_SHA="$HEAD_SHA"
          fi
          git checkout -B "$CANDIDATE_BRANCH" "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git branch --show-current)" = "$CANDIDATE_BRANCH"

      - name: Apply bounded approved files
        if: steps.claim.outputs.claimed == 'true' && steps.reconcile.outputs.already_satisfied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { isSensitivePath } from './src/dev/dev-bridge.js';
          const job=JSON.parse(await fs.readFile(process.env.BRIDGE_JOB_FILE,'utf8'));
          for(const item of job.files_json){
            const rel=String(item?.path||'').replace(/\\/g,'/');
            const body=String(item?.content??'');
            if(!rel||path.posix.isAbsolute(rel)||rel.includes('..')||isSensitivePath(rel)) throw new Error('APPLY_PATH_DENIED:'+rel);
            if(body.length>200000) throw new Error('APPLY_CONTENT_TOO_LARGE:'+rel);
            const trailingMatches=body.match(/[ \t]+(?=\r?\n|$)/g)||[];
            const normalizedBody=trailingMatches.length
              ? body.replace(/[ \t]+(?=\r?\n|$)/g,'')
              : body;
            if(trailingMatches.length){
              console.log('CANDIDATE_TRAILING_WHITESPACE_NORMALIZED path='+rel+' occurrences='+trailingMatches.length);
            }
            const target=path.resolve(process.cwd(),rel);
            if(!target.startsWith(process.cwd()+path.sep)) throw new Error('APPLY_OUTSIDE_REPO:'+rel);
            await fs.mkdir(path.dirname(target),{recursive:true});
            await fs.writeFile(target,normalizedBody,'utf8');
          }
          NODE
          git diff --check

      - name: Run exact bounded requested tests
        id: tests
        if: steps.claim.outputs.claimed == 'true' && steps.reconcile.outputs.already_satisfied != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import fsSync from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const allowed=new Set(['test','test:mel','test:integration','test:acceptance','test:smoke','test:mvp','test:routes']);
          const job=JSON.parse(await fs.readFile(process.env.BRIDGE_JOB_FILE,'utf8'));
          // [GPT6] Persist large test output outside spawnSync buffers; capture only bounded evidence.
          function commandEvidence(args){
            const dir=fsSync.mkdtempSync(path.join(os.tmpdir(),'mel-bridge-test-'));
            const logfile=path.join(dir,'command.log');
            let result;
            try {
              const fd=fsSync.openSync(logfile,'w');
              try {
                result=spawnSync(args[0],args.slice(1),{
                  shell:false,stdio:['ignore',fd,fd],timeout:args[1]==='test'?600000:180000
                });
              } finally { fsSync.closeSync(fd); }
              const stat=fsSync.statSync(logfile);
              const keep=32768;
              const size=Math.min(stat.size,keep);
              const buf=Buffer.alloc(size);
              const source=fsSync.openSync(logfile,'r');
              try { fsSync.readSync(source,buf,0,size,stat.size-size); }
              finally { fsSync.closeSync(source); }
              const tail=buf.toString('utf8');
              if(tail) process.stdout.write(tail);
              if(stat.size>keep) process.stdout.write('\n[GPT6] TEST_OUTPUT_TRUNCATED bytes='+stat.size+'\n');
              const failedFiles=tail.split(/\r?\n/).filter(line=>/✗ .*\.test\.mjs|[0-9]+ passed, [1-9][0-9]* failed|::error title=Test file timed out/.test(line)).slice(-8);
              const errorCode=String(result.error?.code|| (result.signal ? 'PROCESS_SIGNAL_'+result.signal : '') || '');
              const diagnosticLines=tail.split(/\r?\n/).map(line=>line.trim()).filter(line=>/Unresolved import|SyntaxError|Error:|Cannot find|ERR_/i.test(line)).slice(-8);
              const diagnostic=[errorCode,...failedFiles,...diagnosticLines].filter(Boolean).join(' | ').slice(0,1200);
              return {
                status:result.status,signal:result.signal||null,error_code:errorCode||null,
                executed:!result.error || result.error.code!=='ENOENT',
                stdout:tail.slice(-4000),stderr:'',
                error:diagnostic || (result.status===0?'':'TEST_COMMAND_FAILED')
              };
            } finally { fsSync.rmSync(dir,{recursive:true,force:true}); }
          }
          const results=[];
          let failed=false;
          // Mandatory gate before any requested test: every module parses and
          // every import resolves (a requested smoke test does not load new files).
          // Keep the checker text: the mentor only sees this result, not the log.
          {
            const r=commandEvidence(['npm','run','check']);
            results.push({name:'syntax-and-imports',command:'check',passed:r.status===0,exit_code:r.status??1,executed:r.executed,error_code:r.error_code,signal:r.signal,error:r.status===0?'':r.error,stdout:r.status===0?'':r.stdout,stderr:r.status===0?'':r.stderr});
            if(r.status!==0) failed=true;
          }
          if(!results.some(row=>row.command==='check'&&row.executed===true&&row.passed===true)) failed=true;
          const requested=[...(job.tests_json||[])];
          if(!requested.some(spec=>spec.command==='test')) requested.unshift({name:'full-regression',command:'test'});
          for(const spec of requested){
            const name=String(spec?.command||'').trim();
            if(!allowed.has(name)){
              results.push({name:String(spec?.name||name||'unnamed'),command:name,passed:false,executed:false,error:'TEST_NOT_EXECUTED'});
              failed=true;
              continue;
            }
            const args=name==='test'?['npm','test']:['npm','run',name];
            const r=commandEvidence(args);
            results.push({name:String(spec?.name||name),command:name,passed:r.status===0,executed:r.executed,exit_code:r.status??1,error_code:r.error_code,signal:r.signal,error:r.status===0?'':r.error,stdout:r.status===0?'':r.stdout,stderr:r.status===0?'':r.stderr});
            if(r.status!==0) failed=true;
          }
          await fs.writeFile('bridge-apply-result.json',JSON.stringify({
            status:failed?'REPAIR_REQUIRED':'READY_FOR_REVIEW',
            needs_repair:failed,
            tests:results,
            mode:'GITHUB_CLOUD_BRIDGE'
          },null,2));
          process.stdout.write(failed?'failed':'passed');
          NODE
          if node -e "const r=require('./bridge-apply-result.json');process.exit(r.needs_repair?0:1)"; then
            echo "tests_passed=false" >> "$GITHUB_OUTPUT"
          else
            echo "tests_passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push exact candidate change
        id: commit
        if: steps.claim.outputs.claimed == 'true' && steps.reconcile.outputs.already_satisfied != 'true' && steps.tests.outputs.tests_passed == 'true'
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "MEL Cloud Dev Bridge"
          git config user.email "mel-cloud-bridge@localhost"
          # Generated evidence is excluded by the repository's canonical .gitignore.
          git add --all
          set +e
          HYGIENE_OUTPUT="$(git diff --cached --check 2>&1)"
          HYGIENE_CODE=$?
          set -e
          if [ "$HYGIENE_CODE" -ne 0 ]; then
            printf '%s\n' "$HYGIENE_OUTPUT"
            HYGIENE_OUTPUT="$HYGIENE_OUTPUT" node - <<'NODE'
          const fs=require('fs');
          const current=fs.existsSync('bridge-apply-result.json')?JSON.parse(fs.readFileSync('bridge-apply-result.json','utf8')):{tests:[]};
          const tests=Array.isArray(current.tests)?[...current.tests]:[];
          tests.push({
            name:'candidate hygiene',
            command:'git.diff.cached.check',
            passed:false,
            exit_code:2,
            error:'CANDIDATE_HYGIENE_FAILED',
            stderr:String(process.env.HYGIENE_OUTPUT||'').slice(0,4000)
          });
          fs.writeFileSync('bridge-apply-result.json',JSON.stringify({
            ...current,
            status:'REPAIR_REQUIRED',
            needs_repair:true,
            tests
          },null,2));
          NODE
            echo "candidate_ready=false" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
            echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "no_changes=$NO_CHANGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # [GPT6] Even a no-diff candidate must dispatch full exact-SHA CI.
          NO_CHANGES=false
          if [ -z "$(git diff --cached --name-only)" ]; then
            NO_CHANGES=true
            NEW_SHA="$(git rev-parse HEAD)"
          else
            git commit -m "GEN2-42: apply approved bridge package $JOB_ID"
            NEW_SHA="$(git rev-parse HEAD)"
          fi
          # Test evidence and Teacher approval bind this exact base. A moving
          # head requires fresh review; never rebase an already-tested package.
          PUSHED=0
          git fetch origin "$CANDIDATE_BRANCH"
          REMOTE_SHA="$(git rev-parse FETCH_HEAD)"
          # Atomic compare-and-swap: reject branch movement between fetch and push.
          # The explicit lease is the approved SHA; HEAD is a descendant of it.
          if [ "$REMOTE_SHA" = "$CANDIDATE_SHA" ] && { [ "$NO_CHANGES" = "true" ] || git push --force-with-lease="refs/heads/$CANDIDATE_BRANCH:$CANDIDATE_SHA" origin "HEAD:refs/heads/$CANDIDATE_BRANCH"; }; then
            PUSHED=1
          fi
          if [ "$PUSHED" != "1" ]; then
            node - <<'NODE'
            const fs=require('fs');
            const current=fs.existsSync('bridge-apply-result.json')?JSON.parse(fs.readFileSync('bridge-apply-result.json','utf8')):{tests:[]};
            const tests=Array.isArray(current.tests)?[...current.tests]:[];
            tests.push({name:'candidate push',command:'git.push',passed:false,executed:false,error:'CANDIDATE_PUSH_NOT_FAST_FORWARD'});
            fs.writeFileSync('bridge-apply-result.json',JSON.stringify({...current,status:'REPAIR_REQUIRED',needs_repair:true,tests},null,2));
          NODE
            echo "candidate_ready=false" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
            echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "no_changes=$NO_CHANGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # workflow_dispatch resolves a mutable ref. Never dispatch a candidate
          # CI while another writer has already moved that ref beyond NEW_SHA.
          DISPATCH_HEAD="$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          if [ "$DISPATCH_HEAD" != "$NEW_SHA" ]; then
            node - <<'NODE'
            const fs=require('fs');
            const current=fs.existsSync('bridge-apply-result.json')?JSON.parse(fs.readFileSync('bridge-apply-result.json','utf8')):{tests:[]};
            const tests=Array.isArray(current.tests)?[...current.tests]:[];
            tests.push({name:'candidate CI identity',command:'git.ls-remote',passed:false,executed:true,error:'CANDIDATE_HEAD_MOVED_BEFORE_CI_DISPATCH'});
            fs.writeFileSync('bridge-apply-result.json',JSON.stringify({...current,status:'REPAIR_REQUIRED',needs_repair:true,tests},null,2));
          NODE
            echo "candidate_ready=false" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
            echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "no_changes=$NO_CHANGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A push made with the workflow token does not start other workflows:
          # run the full candidate suite explicitly on the exact new head.
          code="$(curl --silent --show-error --max-time 30 --request POST \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
            --data "{\"ref\":\"$CANDIDATE_BRANCH\"}" --output /dev/null --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/full-candidate-ci.yml/dispatches" || true)"
          echo "FULL_CANDIDATE_CI_DISPATCH http=$code sha=$NEW_SHA"
          # [GPT6] A pushed candidate without dispatched CI is not ready for review.
          if [ "$code" != "204" ]; then
            node - <<'NODE'
          const fs=require('fs');
          const current=JSON.parse(fs.readFileSync('bridge-apply-result.json','utf8'));
          const tests=Array.isArray(current.tests)?[...current.tests]:[];
          tests.push({name:'full candidate CI dispatch',command:'github.actions.workflow_dispatch',passed:false,executed:true,error:'FULL_CANDIDATE_CI_DISPATCH_FAILED'});
          fs.writeFileSync('bridge-apply-result.json',JSON.stringify({...current,status:'REPAIR_REQUIRED',needs_repair:true,tests},null,2));
          NODE
            echo "candidate_ready=false" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
            echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "no_changes=$NO_CHANGES" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "candidate_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "no_changes=$NO_CHANGES" >> "$GITHUB_OUTPUT"

      - name: Report cloud bridge result to production D1
        id: report_result
        if: always() && steps.claim.outputs.claimed == 'true' && steps.reconcile.outputs.already_satisfied != 'true'
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          TESTS_PASSED: ${{ steps.tests.outputs.tests_passed }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          CANDIDATE_READY: ${{ steps.commit.outputs.candidate_ready }}
          NEW_SHA: ${{ steps.commit.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const job=JSON.parse(fs.readFileSync(process.env.BRIDGE_JOB_FILE,'utf8'));
          const base=fs.existsSync('bridge-apply-result.json')?JSON.parse(fs.readFileSync('bridge-apply-result.json','utf8')):{tests:[]};
          const testsPassed=process.env.TESTS_PASSED==='true';
          const commitOk=process.env.COMMIT_OUTCOME==='success';
          const candidateReady=process.env.CANDIDATE_READY==='true';
          const status=!testsPassed
            ? 'REPAIR_REQUIRED'
            : commitOk && !candidateReady
              ? 'REPAIR_REQUIRED'
              : commitOk && candidateReady
                ? 'READY_FOR_REVIEW'
                : 'FAILED';
          const sha=String(process.env.NEW_SHA||job?.result_json?.bridge_preparation?.candidate_sha||'');
          const result={
            ...base,
            status,
            mode:'GITHUB_CLOUD_BRIDGE',
            candidate_sha:/^[a-f0-9]{40}$/i.test(sha)?sha:null,
            github_run_id:Number(process.env.GITHUB_RUN_ID||0),
            github_run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT||0)
          };
          fs.writeFileSync('bridge-apply-result.json',JSON.stringify(result,null,2));
          fs.writeFileSync('bridge-result-request.json',JSON.stringify({
            job_id:job.id,
            status,
            candidate_branch:job?.result_json?.bridge_preparation?.candidate_branch||null,
            tests_json:Array.isArray(result.tests)?result.tests:[],
            diff_summary:status+':'+(result.candidate_sha||'NO_SHA'),
            needs_repair:status==='REPAIR_REQUIRED',
            error:status==='FAILED'?'CLOUD_BRIDGE_COMMIT_FAILED':null,
            result_json:result
          }));
          NODE
          REPORT_READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE="$(curl --silent --show-error --max-time 45               --request POST               --header "x-mel-github-oidc: $("$MEL_OIDC_HELPER")"               --header "Content-Type: application/json"               --data-binary @bridge-result-request.json               --output bridge-result-response.json               --write-out '%{http_code}'               "https://meliturgos.adrien-lopezcarreras.workers.dev/api/dev-bridge/result" || true)"
            if [ "$CODE" = "200" ]; then REPORT_READY=1; break; fi
            echo "Cloud bridge result propagation attempt $ATTEMPT/12 returned HTTP $CODE."
            test ! -s bridge-result-response.json || cat bridge-result-response.json
            sleep 2
          done
          test "$REPORT_READY" = "1"

      - name: Persist claimed bridge failure before exit
        id: report_emergency
        if: always() && steps.claim.outputs.claimed == 'true' && steps.report_satisfied.outcome != 'success' && steps.report_result.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const job=JSON.parse(fs.readFileSync(process.env.BRIDGE_JOB_FILE,'utf8'));
          const result=fs.existsSync('bridge-apply-result.json')
            ? JSON.parse(fs.readFileSync('bridge-apply-result.json','utf8'))
            : {status:'REPAIR_REQUIRED',needs_repair:true,tests:[],mode:'GITHUB_CLOUD_BRIDGE_EMERGENCY'};
          const normalized={
            ...result,
            status:'REPAIR_REQUIRED',
            needs_repair:true,
            mode:result.mode||'GITHUB_CLOUD_BRIDGE_EMERGENCY',
            github_run_id:Number(process.env.GITHUB_RUN_ID||0),
            github_run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT||0)
          };
          fs.writeFileSync('bridge-apply-result.json',JSON.stringify(normalized,null,2));
          fs.writeFileSync('bridge-result-request.json',JSON.stringify({
            job_id:job.id,
            status:'REPAIR_REQUIRED',
            candidate_branch:job?.result_json?.bridge_preparation?.candidate_branch||null,
            tests_json:Array.isArray(normalized.tests)?normalized.tests:[],
            diff_summary:'EMERGENCY_REPAIR_REQUIRED:GITHUB_RUN_'+String(process.env.GITHUB_RUN_ID||'0'),
            needs_repair:true,
            error:null,
            result_json:normalized
          }));
          NODE
          REPORT_READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE="$(curl --silent --show-error --max-time 45               --request POST               --header "x-mel-github-oidc: $("$MEL_OIDC_HELPER")"               --header "Content-Type: application/json"               --data-binary @bridge-result-request.json               --output bridge-result-response.json               --write-out '%{http_code}'               "https://meliturgos.adrien-lopezcarreras.workers.dev/api/dev-bridge/result" || true)"
            if [ "$CODE" = "200" ]; then REPORT_READY=1; break; fi
            echo "Emergency bridge result attempt $ATTEMPT/12 returned HTTP $CODE."
            sleep 2
          done
          test "$REPORT_READY" = "1"

      - name: Continue autonomy after persisted bridge result
        if: always() && steps.claim.outputs.claimed == 'true' && (steps.report_satisfied.outcome == 'success' || steps.report_result.outcome == 'success' || steps.report_emergency.outcome == 'success')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_DEPTH: ${{ inputs.chain_depth || '0' }}
        run: |
          set -euo pipefail
          [[ "$CHAIN_DEPTH" =~ ^[0-9]+$ ]]
          if [ "$CHAIN_DEPTH" -ge 20 ]; then
            echo "AUTONOMY_CHAIN_LIMIT_REACHED depth=$CHAIN_DEPTH"
            exit 0
          fi
          NEXT_DEPTH="$((CHAIN_DEPTH + 1))"
          NEXT_DEPTH="$NEXT_DEPTH" node -e "process.stdout.write(JSON.stringify({ref:'main',inputs:{chain_depth:process.env.NEXT_DEPTH}}))" > autonomy-next-dispatch.json
          CODE="$(curl --silent --show-error --max-time 30             --request POST             --header "Authorization: Bearer $GH_TOKEN"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --header "Content-Type: application/json"             --data-binary @autonomy-next-dispatch.json             --output autonomy-next-dispatch-response.txt             --write-out '%{http_code}'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/gen2-42-runtime-tick.yml/dispatches")"
          test "$CODE" = "204"
          echo "AUTONOMY_CHAIN_CONTINUED_AFTER_BRIDGE depth=$NEXT_DEPTH"

      - name: Upload sanitized apply evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen2-42-bridge-apply-${{ github.run_id }}
          path: bridge-apply-result.json
          if-no-files-found: warn
          retention-days: 7
