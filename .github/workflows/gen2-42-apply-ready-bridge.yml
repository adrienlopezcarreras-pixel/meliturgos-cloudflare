name: GEN2-42 apply READY bridge package

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Exact dev_jobs id whose READY bridge package must be applied"
        required: true
        default: "ecosystem-watch-c3bfaf443b1287cf885033ecd760bc94"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Read exact READY bridge package from production D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          [[ "$JOB_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          npx wrangler d1 execute DB --remote --json \
            --command "SELECT id,status,files_json,tests_json,patch_json,result_json FROM dev_jobs WHERE id='$JOB_ID' LIMIT 1" \
            > bridge-job.raw.json
          node - <<'NODE'
          const fs=require('fs');
          const raw=JSON.parse(fs.readFileSync('bridge-job.raw.json','utf8'));
          const parts=Array.isArray(raw)?raw:[raw];
          const rows=parts.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          if(rows.length!==1) throw new Error('APPLY_JOB_NOT_FOUND');
          const row=rows[0];
          const parse=(v)=>typeof v==='string'&&v?JSON.parse(v):v;
          const job={...row,files_json:parse(row.files_json)||[],tests_json:parse(row.tests_json)||[],patch_json:parse(row.patch_json)||{},result_json:parse(row.result_json)||{}};
          const prep=job?.result_json?.bridge_preparation;
          const teacher=job?.result_json?.teacher_bridge;
          const impl=job?.result_json?.implementation_proposal;
          if(job.status!=='TEACHER_APPROVED') throw new Error('APPLY_JOB_NOT_TEACHER_APPROVED');
          if(teacher?.status!=='ANSWERED'||teacher?.review?.verdict!=='APPROVE_PLAN'||teacher?.review?.development_allowed!==true) throw new Error('APPLY_TEACHER_APPROVAL_REQUIRED');
          if(impl?.status!=='READY') throw new Error('APPLY_IMPLEMENTATION_NOT_READY');
          if(prep?.status!=='READY') throw new Error('APPLY_BRIDGE_NOT_READY');
          if(!/^candidate\//.test(String(prep.candidate_branch||''))) throw new Error('APPLY_CANDIDATE_BRANCH_INVALID');
          if(!/^[a-f0-9]{40}$/i.test(String(prep.candidate_sha||''))) throw new Error('APPLY_CANDIDATE_SHA_INVALID');
          if(!Array.isArray(job.files_json)||job.files_json.length<1||job.files_json.length>10) throw new Error('APPLY_FILES_INVALID');
          if(!Array.isArray(job.tests_json)||job.tests_json.length<1||job.tests_json.length>4) throw new Error('APPLY_TESTS_INVALID');
          fs.writeFileSync('bridge-job.json',JSON.stringify(job));
          fs.appendFileSync(process.env.GITHUB_ENV,`CANDIDATE_BRANCH=${prep.candidate_branch}\nCANDIDATE_SHA=${prep.candidate_sha}\n`);
          NODE

      - name: Checkout exact approved candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANDIDATE_BRANCH" --depth=100
          git checkout -B "$CANDIDATE_BRANCH" "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git branch --show-current)" = "$CANDIDATE_BRANCH"

      - name: Apply bounded approved files
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { isSensitivePath } from './src/dev/dev-bridge.js';
          const job=JSON.parse(await fs.readFile('bridge-job.json','utf8'));
          for(const item of job.files_json){
            const rel=String(item?.path||'').replace(/\\/g,'/');
            const body=String(item?.content??'');
            if(!rel||path.posix.isAbsolute(rel)||rel.includes('..')||isSensitivePath(rel)) throw new Error('APPLY_PATH_DENIED:'+rel);
            if(body.length>200000) throw new Error('APPLY_CONTENT_TOO_LARGE:'+rel);
            const target=path.resolve(process.cwd(),rel);
            if(!target.startsWith(process.cwd()+path.sep)) throw new Error('APPLY_OUTSIDE_REPO:'+rel);
            await fs.mkdir(path.dirname(target),{recursive:true});
            await fs.writeFile(target,body,'utf8');
          }
          NODE
          git diff --check
          test -n "$(git status --short)"

      - name: Run exact bounded requested tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          const allowed=new Set(['test','test:mel','test:integration','test:acceptance','test:smoke','test:mvp','test:routes']);
          const job=JSON.parse(await fs.readFile('bridge-job.json','utf8'));
          const results=[];
          for(const spec of job.tests_json){
            const name=String(spec?.command||'').trim();
            if(!allowed.has(name)) throw new Error('APPLY_TEST_NOT_ALLOWED:'+name);
            const args=name==='test'?['test']:['run',name];
            const r=spawnSync('npm',args,{stdio:'inherit',shell:false});
            results.push({name:String(spec?.name||name),command:name,passed:r.status===0,exit_code:r.status??1});
            if(r.status!==0){
              await fs.writeFile('bridge-apply-result.json',JSON.stringify({status:'REPAIR_REQUIRED',needs_repair:true,tests:results},null,2));
              process.exit(r.status||1);
            }
          }
          await fs.writeFile('bridge-apply-result.json',JSON.stringify({status:'READY_FOR_REVIEW',needs_repair:false,tests:results},null,2));
          NODE

      - name: Commit and push exact candidate change
        id: commit
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          git config user.name "MEL Dev Bridge"
          git config user.email "mel-bridge@localhost"
          git add --all
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "GEN2-42: apply approved bridge package $JOB_ID"
          NEW_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:$CANDIDATE_BRANCH"
          echo "candidate_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$CANDIDATE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized apply evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen2-42-bridge-apply-${{ github.run_id }}
          path: bridge-apply-result.json
          if-no-files-found: warn
          retention-days: 7
