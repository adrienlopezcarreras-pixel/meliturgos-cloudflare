name: sync-preview-auth-secret-v2

on:
  push:
    branches:
      - ops/cloudflare-ai-token-diagnose
    paths:
      - ".github/workflows/sync-preview-auth-secret-v2.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Sync preview MELITURGOS password
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          PREVIEW_PASSWORD="$(python - <<'PY'
          import hashlib,hmac,os
          token=os.environ['CLOUDFLARE_API_TOKEN'].encode('utf-8')
          print(hmac.new(token,b'meliturgos-preview-auth-v1',hashlib.sha256).hexdigest())
          PY
          )"
          echo "::add-mask::$PREVIEW_PASSWORD"
          printf '%s' "$PREVIEW_PASSWORD" | npx wrangler secret put MELITURGOS_PASSWORD --env preview
          echo "PREVIEW_AUTH_SECRET_SYNCED"

# rerun after token permission update
