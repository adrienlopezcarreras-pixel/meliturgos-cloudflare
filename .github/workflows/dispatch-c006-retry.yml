name: dispatch-c006-retry

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-c006-retry.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ contains(github.event.head_commit.message, '[dispatch-c006-retry]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Launch corrected c006 preview cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run lora-kaggle-free-gpu.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_sha="093f4e996eb77d484c99a246b085b3d24fa34f3b" \
            -f cycle="6" \
            -f parent_release_tag="mel-lora-kaggle-093f4e996eb7-c005" \
            -f shard_size="750" \
            -f max_cycles="100" \
            -f benchmark_preview="true"
          echo "Corrected c006 preview cycle dispatched."
