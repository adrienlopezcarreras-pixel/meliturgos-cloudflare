name: temp-kaggle-lora-log-probe

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - '.github/workflows/temp-kaggle-lora-log-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Probe live Kaggle LoRA
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          python -m pip install -q -U kaggle
          OWNER="$(python - <<'PY'
          import os
          from kagglesdk.kaggle_client import KaggleClient
          from kagglesdk.kaggle_creds import KaggleCredentials
          client=KaggleClient(user_agent="meliturgos-kaggle-probe/1.0")
          creds=KaggleCredentials(client=client, access_token=os.environ["KAGGLE_API_TOKEN"])
          print(creds.introspect())
          PY
          )"
          REF="$OWNER/mel-lora-uncensored-notebook-t4"
          echo "=== STATUS ==="
          kaggle kernels status "$REF" || true
          echo "=== LOGS ==="
          kaggle kernels logs "$REF" || true
          echo "=== OUTPUT SNAPSHOT ==="
          rm -rf /tmp/kaggle-live-output
          mkdir -p /tmp/kaggle-live-output
          kaggle kernels output "$REF" -p /tmp/kaggle-live-output --force || true
          find /tmp/kaggle-live-output -maxdepth 3 -type f -printf '%P %s bytes\n' || true
          for f in /tmp/kaggle-live-output/*; do
            if [[ -f "$f" ]]; then
              echo "--- $(basename "$f") ---"
              tail -n 40 "$f" 2>/dev/null || true
            fi
          done
