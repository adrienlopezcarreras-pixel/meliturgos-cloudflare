name: oauth-secret-presence-audit

on:
  push:
    branches:
      - diag/oauth-vault-count-20261006

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository-held OAuth key availability without disclosure
        shell: bash
        env:
          OAUTH_KEY_ID: ${{ secrets.MEL_OAUTH_ENCRYPTION_KEY_ID }}
          OAUTH_KEY_B64: ${{ secrets.MEL_OAUTH_ENCRYPTION_KEY_B64 }}
        run: |
          set -euo pipefail
          ID_PRESENT=0
          KEY_PRESENT=0
          KEY_VALID=0
          if [ -n "${OAUTH_KEY_ID:-}" ]; then ID_PRESENT=1; fi
          if [ -n "${OAUTH_KEY_B64:-}" ]; then KEY_PRESENT=1; fi
          if [ "${KEY_PRESENT}" = "1" ]; then
            export OAUTH_KEY_B64
            KEY_VALID="$(node - <<'NODE'
          const raw=String(process.env.OAUTH_KEY_B64||'').trim();
          let ok=0;
          try { ok=Buffer.from(raw,'base64').length===32 ? 1 : 0; } catch {}
          process.stdout.write(String(ok));
          NODE
            )"
          fi
          echo "OAUTH_SECRET_AUDIT id_present=${ID_PRESENT} key_present=${KEY_PRESENT} key_valid_32b=${KEY_VALID}"
