name: preview-shardvault-stress-evidence-ci

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-candidate-preview.yml'
      - '.github/workflows/preview-shardvault-stress-evidence-ci.yml'
      - 'tests/preview-shardvault-stress-sanitized-diagnostics.test.mjs'

permissions:
  contents: read

jobs:
  safe-stress-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Prove failure telemetry remains sanitized and recovery gates remain strict
        run: node --test tests/preview-shardvault-stress-sanitized-diagnostics.test.mjs tests/preview-shardvault-transport-retry.test.mjs
