name: gen2-05-model-council-ci

on:
  pull_request:
    paths:
      - 'src/models/model-council.js'
      - 'src/roadmap/master-roadmap.js'
      - 'tests/gen2/workers-ai-zero-cost-proof.test.mjs'
      - 'src/augmentio/workers-ai-zero-cost-proof.js'
      - 'src/augmentio/default-pool.js'
      - 'tests/gen2/model-council-runtime.test.mjs'
      - '.github/workflows/gen2-05-model-council-ci.yml'
  push:
    branches:
      - 'gen2-05-model-council-providers'
    paths:
      - 'src/models/model-council.js'
      - 'tests/gen2/model-council-runtime.test.mjs'
      - '.github/workflows/gen2-05-model-council-ci.yml'

permissions:
  contents: read

jobs:
  council-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEL_TEST_VERIFIED_ZERO_COST_PROVIDERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Council syntax
        run: node --check src/models/model-council.js
      - name: Council and adjacent targeted tests
        run: >
          node --test
          tests/gen2/model-council-runtime.test.mjs
          tests/gen2/workers-ai-zero-cost-proof.test.mjs
          tests/augmentio-adapters.test.mjs
          tests/augmentio-core.test.mjs
          tests/augmentio-council.test.mjs
          tests/council-api.test.mjs
          tests/degraded-zero-cost-council.test.mjs
          tests/model-router-augmentio.test.mjs
          tests/benchmark-cadence.test.mjs
          tests/benchmark-evidence.test.mjs
          tests/benchmark-null-score.test.mjs
          tests/benchmark-runtime-wiring.test.mjs
          tests/benchmark-suite-summary.test.mjs
          tests/learning-benchmark.test.mjs
          tests/module-lab-council-gate.test.mjs
          tests/zero-euro-invocation-revalidation.test.mjs

  council-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: council-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Repository syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/gen2-05-ci
      - name: Full test suite
        run: npm test
