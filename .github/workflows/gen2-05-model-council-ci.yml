name: gen2-05-model-council-ci

on:
  push:
    branches:
      - 'feat/gen2-05-model-council'
    paths:
      - 'src/models/model-council.js'
      - 'tests/model-council-runtime.test.mjs'
      - '.github/workflows/gen2-05-model-council-ci.yml'
  pull_request:
    paths:
      - 'src/models/model-council.js'
      - 'tests/model-council-runtime.test.mjs'
      - '.github/workflows/gen2-05-model-council-ci.yml'

permissions:
  contents: read

jobs:
  gen2-05:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: GEN2-05 targeted tests
        run: node --test tests/model-council-runtime.test.mjs
      - name: Syntax check
        run: npm run check
      - name: Use candidate branch identity for legacy bridge integration test
        run: git switch -c candidate/gen2-05-ci
      - name: Full test suite
        run: npm test
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
