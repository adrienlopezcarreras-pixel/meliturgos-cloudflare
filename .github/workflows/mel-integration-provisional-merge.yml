name: MEL isolated provisional merge
on:
  push:
    branches:
      - integration/mel-main-candidate-20261013
    paths:
      - '.github/workflows/mel-integration-provisional-merge.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge main into isolated branch and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "integration/mel-main-candidate-20261013"
          git config user.name "MEL isolated integration"
          git config user.email "mel-integration@users.noreply.github.com"
          git fetch --no-tags origin main
          echo "Provisional integration only; production and candidate are never pushed."
          git merge --no-commit --no-ff -X ours origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/release-predeploy-backup-reuse.test.mjs')
          src=p.read_text()
          block = "  const d1Export = delegatedD1\n    ? await readFile(new URL('../release-tools/predeploy-backup-refresh/d1-export.mjs', import.meta.url), 'utf8')\n    : runner;\n"
          if src.count(block)!=1: raise SystemExit('D1_BACKUP_CONFLICT_SHAPE_CHANGED')
          p.write_text(src.replace(block,"  // Reuse the canonical d1Export declaration above.\n"))
          PY
          git add tests/release-predeploy-backup-reuse.test.mjs
          test -z "$(git ls-files -u)"
          git diff --cached --check
          for f in src/continuity/shardvault-runtime.js scripts/fulfill-preview-code-mirror.mjs; do node --check "$f"; done
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/shardvault-github-code-mirror.test.mjs tests/shardvault-github-authoritative-readback.test.mjs tests/release-predeploy-backup-reuse.test.mjs tests/preview-resource-isolation.test.mjs
          git commit -m "merge(integration): validated provisional main merge (artifact only)"
          mkdir -p integration-handoff
          git bundle create integration-handoff/mel-isolated-merge.bundle origin/main..HEAD
          git rev-parse HEAD > integration-handoff/merged-sha.txt
          git rev-parse origin/main > integration-handoff/base-main-sha.txt
          git bundle verify integration-handoff/mel-isolated-merge.bundle
          echo "Bundle prepared for authorized import, never automatically pushed."
          echo "### Isolated integration dry-run" >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo "TARGETED TESTS ONLY. Merge is not published. Manual review and authorized promotion required." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact merged Git bundle for authorized handoff
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mel-authorized-merge-bundle
          path: integration-handoff/
          retention-days: 7
