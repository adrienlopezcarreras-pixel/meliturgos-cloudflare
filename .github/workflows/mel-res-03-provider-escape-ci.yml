name: mel-res-03-provider-escape-ci

on:
  pull_request:
    paths:
      - 'src/portability/provider-escape-capsule.js'
      - 'src/capabilities/default-bus.js'
      - 'tests/gen2/provider-escape-capsule.test.mjs'
      - '.github/workflows/mel-res-03-provider-escape-ci.yml'

permissions:
  contents: read

jobs:
  provider-escape-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/runtime-security-gate.mjs
      - run: node --check src/portability/provider-escape-capsule.js
      - run: node --check src/capabilities/default-bus.js
      - run: node --test tests/gen2/provider-escape-capsule.test.mjs

  provider-escape-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: provider-escape-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git switch -c candidate/mel-res-03-ci
      - run: npm test
