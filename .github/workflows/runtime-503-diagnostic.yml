name: runtime-503-diagnostic

on:
  push:
    branches:
      - fix/runtime-503-diagnostic-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_MELITURGOS_PASSWORD: ${{ secrets.MELITURGOS_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture production HTTP bodies
        shell: bash
        run: |
          set -euo pipefail
          base="https://meliturgos.adrien-lopezcarreras.workers.dev"
          for path in "/" "/api/v1/version" "/api/gen2/autonomy/control"; do
            out="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 30 --output "$out" --write-out '%{http_code}' "$base$path" || true)"
            echo "=== $path HTTP $code ==="
            head -c 4000 "$out" || true
            echo
          done
      - name: Prove secret presence without values
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GH_MELITURGOS_PASSWORD:-}" ]; then
            echo "GITHUB_MELITURGOS_PASSWORD_PRESENT=true"
          else
            echo "GITHUB_MELITURGOS_PASSWORD_PRESENT=false"
          fi
          npx wrangler secret list --name meliturgos --format json > /tmp/secrets.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/secrets.json','utf8'));
          const rows=Array.isArray(d)?d:(Array.isArray(d?.result)?d.result:[]);
          const names=rows.map(x=>String(x?.name||x?.key||'')).filter(Boolean).sort();
          console.log('CLOUDFLARE_SECRET_NAMES='+JSON.stringify(names));
          console.log('CLOUDFLARE_MELITURGOS_PASSWORD_PRESENT='+String(names.includes('MELITURGOS_PASSWORD')));
          NODE
