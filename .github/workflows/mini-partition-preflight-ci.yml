name: MINI partition preflight CI
on:
  pull_request:
    paths:
      - 'tools/mini-updater/inspect_partitions.py'
      - 'tests/mini-partition-python-fixtures.test.mjs'
      - 'tests/mini-local-readonly-preflight.test.mjs'
      - 'tools/mini-updater/local_readonly_preflight.py'
      - 'tools/mini-updater/inspect_image.py'
      - 'tools/mini-updater/inspect_ota_state.py'
      - 'tests/mini-ota-select-preflight.test.mjs'
      - 'tools/mini-updater/inspect_ota_backup.py'
      - 'tools/mini-updater/ota_backup_worker.py'
      - 'tools/mini-updater/plan_ota_upgrade.py'
      - 'tests/mini-ota-upgrade-plan.test.mjs'
      - 'tests/mini-ota-backup-preflight.test.mjs'
      - 'tests/mini-companion-owner-readonly.test.mjs'
      - 'tests/mini-companion-async-backup.test.mjs'
      - 'src/devices/mini-readonly-companion.js'
      - 'src/devices/mini-maintenance-companion.js'
      - 'tests/mini-companion-maintenance-assess.test.mjs'
      - 'scripts/cloudflare-api-relay-runner.mjs'
      - 'assets/MEL-Computer-Companion.ps1'
      - 'dist/MEL-Computer-Companion.ps1'
      - 'src/devices/computer-companion-api.js'
      - 'tests/mini-firmware-image-preflight.test.mjs'
      - '.github/workflows/mini-partition-preflight-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mini-updater/inspect_partitions.py'
      - 'tests/mini-partition-python-fixtures.test.mjs'
      - 'tests/mini-local-readonly-preflight.test.mjs'
      - 'tools/mini-updater/local_readonly_preflight.py'
      - 'tools/mini-updater/inspect_image.py'
      - 'tools/mini-updater/inspect_ota_state.py'
      - 'tests/mini-ota-select-preflight.test.mjs'
      - 'tools/mini-updater/inspect_ota_backup.py'
      - 'tools/mini-updater/ota_backup_worker.py'
      - 'tools/mini-updater/plan_ota_upgrade.py'
      - 'tests/mini-ota-upgrade-plan.test.mjs'
      - 'tests/mini-ota-backup-preflight.test.mjs'
      - 'tests/mini-companion-owner-readonly.test.mjs'
      - 'tests/mini-companion-async-backup.test.mjs'
      - 'src/devices/mini-readonly-companion.js'
      - 'src/devices/mini-maintenance-companion.js'
      - 'tests/mini-companion-maintenance-assess.test.mjs'
      - 'scripts/cloudflare-api-relay-runner.mjs'
      - 'assets/MEL-Computer-Companion.ps1'
      - 'dist/MEL-Computer-Companion.ps1'
      - 'src/devices/computer-companion-api.js'
      - 'tests/mini-firmware-image-preflight.test.mjs'
      - '.github/workflows/mini-partition-preflight-ci.yml'
permissions:
  contents: read
jobs:
  partition-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -m py_compile tools/mini-updater/inspect_partitions.py
      - run: python3 -m py_compile tools/mini-updater/local_readonly_preflight.py tools/mini-updater/inspect_image.py tools/mini-updater/inspect_ota_state.py tools/mini-updater/inspect_ota_backup.py tools/mini-updater/ota_backup_worker.py tools/mini-updater/plan_ota_upgrade.py
      - run: python3 tools/mini-updater/ota_backup_worker.py --help
      - run: python3 tools/mini-updater/local_readonly_preflight.py --help
      - run: python3 tools/mini-updater/plan_ota_upgrade.py --help
      - run: node --test tests/mini-partition-python-fixtures.test.mjs tests/mini-local-readonly-preflight.test.mjs tests/mini-firmware-image-preflight.test.mjs tests/mini-ota-select-preflight.test.mjs tests/mini-ota-backup-preflight.test.mjs tests/mini-companion-owner-readonly.test.mjs tests/mini-companion-async-backup.test.mjs tests/mini-companion-maintenance-assess.test.mjs tests/mini-ota-upgrade-plan.test.mjs
