name: MINI partition preflight CI
on:
  pull_request:
    paths:
      - 'tools/mini-updater/inspect_partitions.py'
      - 'tests/mini-partition-python-fixtures.test.mjs'
      - '.github/workflows/mini-partition-preflight-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mini-updater/inspect_partitions.py'
      - 'tests/mini-partition-python-fixtures.test.mjs'
      - '.github/workflows/mini-partition-preflight-ci.yml'
permissions:
  contents: read
jobs:
  partition-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python3 -m py_compile tools/mini-updater/inspect_partitions.py
      - run: node --test tests/mini-partition-python-fixtures.test.mjs
