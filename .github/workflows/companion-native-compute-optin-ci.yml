name: Companion Local Compute Opt-in CI
on:
  pull_request:
    paths:
      - 'windows-companion/MEL-Companion.cs'
      - 'assets/MEL-Computer-Companion.ps1'
      - 'tests/gen2/companion-native-compute-optin.test.mjs'
      - '.github/workflows/companion-native-compute-optin-ci.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/gen2/companion-native-compute-optin.test.mjs
