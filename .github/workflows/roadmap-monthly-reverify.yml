name: roadmap-monthly-reverify

# Once a month every test file runs again on main. A DONE_VERIFIED roadmap item
# named by a test that now fails is recorded as regressed in production D1;
# MAX then reopens it until a job for it completes again.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      record:
        description: Write the regression list to production D1
        type: boolean
        default: true

concurrency:
  group: roadmap-monthly-reverify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reverify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci
      - name: Replay every test file
        run: node scripts/ops/roadmap-reverify.mjs
      - name: Record regressions in production D1
        if: github.event_name == 'schedule' || inputs.record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          SQL="$(node -e "
            const r=require('./roadmap-reverify.json');
            const ids=r.regressed.filter(id=>/^(?:MEL-[A-Z]+-\d{2,3}|GEN2-\d{1,3})$/.test(id));
            const meta=JSON.stringify({ids,at:Date.now()}).replace(/'/g,\"''\");
            process.stdout.write(\"INSERT INTO dev_bridge_state(bridge_id,last_seen,status,metadata_json) VALUES('roadmap-regressions',\"+Date.now()+\",'\"+(ids.length?'REGRESSED':'CLEAN')+\"','\"+meta+\"') ON CONFLICT(bridge_id) DO UPDATE SET last_seen=excluded.last_seen,status=excluded.status,metadata_json=excluded.metadata_json\");
          ")"
          npx wrangler d1 execute DB --remote --command "$SQL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: roadmap-reverify
          path: roadmap-reverify.json
          if-no-files-found: ignore
