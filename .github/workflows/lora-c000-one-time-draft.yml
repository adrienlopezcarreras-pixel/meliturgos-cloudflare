name: One-time LoRA c000 draft checkpoint publish

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/lora-c000-one-time-draft.yml

permissions:
  contents: read
  actions: read

jobs:
  publish-verified-draft:
    if: ${{ github.repository == 'adrienlopezcarreras-pixel/meliturgos-cloudflare' && github.actor == 'adrienlopezcarreras-pixel' && github.event.pull_request.number == 1261 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'probe/lora-c000-draft-release-20261013' && github.event.pull_request.base.ref == 'fix/lora-preserve-checkpoint-before-release-20261012' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: mel-lora-c000-one-time-draft-write
      cancel-in-progress: false
    steps:
      - name: Checkout verified recovery code from internal PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Download existing proof and bundle (NO GPU)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/existing-recovery
          gh run download 38302570850 --repo "$GITHUB_REPOSITORY" \
            --name mel-lora-c000-existing-verified-checkpoint \
            --dir artifacts/existing-recovery
          test -s artifacts/existing-recovery/mel-lora-bundle.tar.gz
          test -s artifacts/existing-recovery/existing-lora-recovery-proof.json
      - name: Prove artifact bytes and source before any write
        run: |
          set -euo pipefail
          python scripts/verify-existing-kaggle-lora-bundle.py \
            artifacts/existing-recovery/mel-lora-bundle.tar.gz \
            > artifacts/checkpoint-draft-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path('artifacts/checkpoint-draft-proof.json').read_text())
          existing=json.loads(Path('artifacts/existing-recovery/existing-lora-recovery-proof.json').read_text())
          assert proof==existing, 'RECOVERY_PROOF_DIFFERENT'
          assert proof['source_sha']=='635c4786b39b9c3a5458126d64ec7bb726a282e7'
          assert proof['bundle_sha256']=='1e15f90e19ab03c5067a543ec78b8bee9f3e29c25f23697fff3a98fad0c801b0'
          assert proof['adapter_sha256']=='9c9957a6ab31b7c43f4ee0a3699b9d9292cbdd3fd3fd7368ace74657fb83f6aa'
          assert proof['global_step']==32 and proof['cycle']==0
          assert proof['activated'] is False and proof['benchmark_verified'] is False
          print('EXACT_RECOVERED_C000_BYTES_VERIFIED_NO_GPU')
          PY
      - name: Create ONLY a DRAFT release; fail closed on existing tag or missing owner token
        env:
          GH_TOKEN: ${{ secrets.MEL_LORA_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "LORA_RELEASE_OWNER_TOKEN_REQUIRED" >&2; exit 1; }
          TAG=mel-lora-kaggle-635c4786b39b-c000
          TAG_STATUS="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          case "$TAG_STATUS" in
            404) : ;;
            200) echo 'HISTORICAL_CHECKPOINT_TAG_ALREADY_EXISTS_NO_OVERWRITE' >&2; exit 1 ;;
            *) echo "HISTORICAL_TAG_PREFLIGHT_HTTP_${TAG_STATUS}" >&2; exit 1 ;;
          esac
          gh release create "$TAG" \
            artifacts/existing-recovery/mel-lora-bundle.tar.gz \
            artifacts/checkpoint-draft-proof.json \
            --repo "$GITHUB_REPOSITORY" \
            --target 635c4786b39b9c3a5458126d64ec7bb726a282e7 \
            --title "MEL LoRA c000 — trained, not benchmarked or activated" \
            --notes "Existing Kaggle checkpoint recovered with SHA-256. DRAFT ONLY. Benchmark and activation explicitly NOT approved." \
            --draft >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '{draft,tag_name,target_commitish,assets:[.assets[]|{name,size}]}' \
          | node -e '
            let source="";
            process.stdin.on("data",s=>source+=s);
            process.stdin.on("end",()=>{
              const d=JSON.parse(source);
              const expected=new Set(["mel-lora-bundle.tar.gz","checkpoint-draft-proof.json"]);
              if(d.draft!==true || d.tag_name!=="mel-lora-kaggle-635c4786b39b-c000" ||
                d.target_commitish!=="635c4786b39b9c3a5458126d64ec7bb726a282e7" ||
                !Array.isArray(d.assets) || d.assets.length!==2 ||
                new Set(d.assets.map(x=>x.name)).size!==2 ||
                d.assets.some(x=>!expected.has(x.name)||!(x.size>0))){
                  console.error("DRAFT_RELEASE_POSTCREATE_VERIFICATION_FAILED");process.exitCode=1;
              }else console.log("DRAFT_RELEASE_AND_TWO_ASSETS_VERIFIED_NO_ACTIVATION");
            });
          '
