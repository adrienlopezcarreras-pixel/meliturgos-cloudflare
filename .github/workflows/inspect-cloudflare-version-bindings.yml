name: inspect-cloudflare-version-bindings

on:
  push:
    branches:
      - ops/repair-owner-auth-20261006
    paths:
      - .github/workflows/inspect-cloudflare-version-bindings.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect Cloudflare version listing shape
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/meliturgos/versions"
          curl -fsSL -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${API}?per_page=100" > versions.json
          node - <<'NODE'
          const d=require('./versions.json');
          console.log('TOP_KEYS',Object.keys(d||{}).join(','));
          console.log('RESULT_TYPE',Array.isArray(d?.result)?'array':typeof d?.result);
          if(d?.result && typeof d.result==='object') console.log('RESULT_KEYS',Object.keys(d.result).join(','));
          const candidates = Array.isArray(d?.result) ? d.result
            : Array.isArray(d?.result?.items) ? d.result.items
            : Array.isArray(d?.result?.versions) ? d.result.versions
            : [];
          console.log('COUNT',candidates.length);
          for(const v of candidates.slice(0,100)) console.log('VERSION',String(v?.id||''),'number='+String(v?.number||''),'created='+String(v?.metadata?.created_on||v?.created_on||''),'preview='+String(v?.metadata?.hasPreview??v?.hasPreview??''));
          NODE
