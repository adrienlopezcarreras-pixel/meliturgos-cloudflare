name: inspect-cloudflare-version-bindings

on:
  push:
    branches:
      - ops/repair-owner-auth-20261006
    paths:
      - .github/workflows/inspect-cloudflare-version-bindings.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect current Cloudflare version bindings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/meliturgos/versions"
          curl -fsSL -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${API}?per_page=100" > versions.json
          node - <<'NODE' > version-ids.txt
          const d=require('./versions.json');
          const items=Array.isArray(d?.result?.items)?d.result.items:[];
          for(const v of items) console.log(String(v?.id||''));
          NODE

          while IFS= read -r V; do
            [ -n "${V}" ] || continue
            curl -fsSL -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${API}/${V}" > version.json
            V="${V}" node - <<'NODE'
          const d=require('./version.json');
          const b=d?.result?.resources?.bindings ?? {};
          const rows=Array.isArray(b) ? b : Object.entries(b).flatMap(([k,v]) => {
            if(Array.isArray(v)) return v.map(x=>({key:k,...(x||{})}));
            if(v && typeof v==='object') return [{key:k,...v}];
            return [{key:k,value:v}];
          });
          const names=rows.map(x=>String(x?.name||x?.binding||x?.key||'')).filter(Boolean);
          console.log('BINDING_CHECK',process.env.V,'has_owner_password='+String(names.includes('MELITURGOS_PASSWORD')),'binding_count='+String(names.length));
          NODE
          done < version-ids.txt

          rm -f versions.json version.json version-ids.txt
