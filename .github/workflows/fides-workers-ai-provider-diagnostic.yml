name: fides-workers-ai-provider-diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fides-workers-ai-provider-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect one Workers AI model response without logging content
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          http="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"Dis bonjour."}],"max_tokens":80,"chat_template_kwargs":{"enable_thinking":false}}' \
            --output /tmp/fides-provider-diagnostic.json \
            --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/zai-org/glm-4.7-flash")"
          export MODEL_PROBE_HTTP="$http"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let d = {};
          try { d = JSON.parse(fs.readFileSync('/tmp/fides-provider-diagnostic.json','utf8')); } catch {}
          const errors = Array.isArray(d?.errors) ? d.errors : [];
          const result = d?.result;
          const answer = typeof result?.response === 'string' ? result.response
            : typeof result?.output_text === 'string' ? result.output_text : '';
          const safeErrorCodes = errors.map(e => String(e?.code ?? '').slice(0,24));
          console.log(JSON.stringify({
            http_status:Number(process.env.MODEL_PROBE_HTTP||0),
            cloudflare_success:d?.success === true,
            error_codes:safeErrorCodes,
            has_result:result != null,
            visible_response_chars:answer.trim().length
          }));
          if(Number(process.env.MODEL_PROBE_HTTP)!==200 || d?.success!==true) process.exit(1);
          NODE
