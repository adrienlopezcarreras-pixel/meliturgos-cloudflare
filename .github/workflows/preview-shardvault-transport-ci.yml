name: preview-shardvault-transport-ci

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-candidate-preview.yml'
      - 'tests/preview-shardvault-transport-retry.test.mjs'
      - '.github/workflows/preview-shardvault-transport-ci.yml'

permissions:
  contents: read

jobs:
  retry-and-crypto-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Check exact preview transport and fail-closed proof contract
        run: node --test tests/preview-shardvault-transport-retry.test.mjs
