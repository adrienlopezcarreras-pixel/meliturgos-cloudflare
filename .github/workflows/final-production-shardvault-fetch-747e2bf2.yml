name: final-production-shardvault-fetch-747e2bf2

on:
  push:
    branches:
      - release/shardvault-internet-fetch-747e2bf2
    paths:
      - .github/workflows/final-production-shardvault-fetch-747e2bf2.yml

permissions:
  contents: read

concurrency:
  group: meliturgos-cloudflare-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact approved SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 747e2bf2d14553c10b05a049218d269b2fa01a42
          fetch-depth: 1

      - name: Prove immutable promotion identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "747e2bf2d14553c10b05a049218d269b2fa01a42"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax gate
        run: npm run check

      - name: Full regression gate
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B candidate/release-ci-head 747e2bf2d14553c10b05a049218d269b2fa01a42
          npm test

      - name: Build immutable source survival archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=mel-source-747e2bf2d14553c10b05a049218d269b2fa01a42.tar.gz 747e2bf2d14553c10b05a049218d269b2fa01a42
          test -s mel-source-747e2bf2d14553c10b05a049218d269b2fa01a42.tar.gz

      - name: Seed exact code archive into R2
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler r2 object put "meliturgos-private-media/shardvault/code/adrienlopezcarreras-pixel__meliturgos-cloudflare/747e2bf2d14553c10b05a049218d269b2fa01a42.tar.gz" \
            --file="mel-source-747e2bf2d14553c10b05a049218d269b2fa01a42.tar.gz" \
            --content-type="application/gzip" \
            --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy exact approved SHA
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy \
            --define "MEL_DEPLOYED_GIT_SHA:'747e2bf2d14553c10b05a049218d269b2fa01a42'" \
            --define "MEL_DEPLOYED_GIT_BRANCH:'release/shardvault-internet-fetch-747e2bf2'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production responds
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 --output production-root.html --write-out '%{http_code}' https://meliturgos.adrien-lopezcarreras.workers.dev)"
          case "$code" in
            2??|3??|401) ;;
            *) echo "Unexpected production HTTP status: $code"; exit 22 ;;
          esac
