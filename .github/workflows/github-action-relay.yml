name: github-action-relay

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/github-action-relay.yml'
      - 'scripts/github-action-relay-runner.mjs'
      - 'src/platform/github-action-relay.js'
      - 'src/api/github-action-relay-api.js'
      - 'src/capabilities/platform-control-capabilities.js'
      - 'src/router.js'
      - 'tests/gen2/github-action-relay.test.mjs'

permissions:
  contents: read
  actions: write

concurrency:
  group: github-action-relay
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/gen2/github-action-relay.test.mjs tests/gen2/platform-control-capabilities.test.mjs

  relay:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MEL_DEV_BRIDGE_TOKEN: ${{ secrets.MEL_DEV_BRIDGE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Heartbeat, claim and dispatch queued GitHub actions
        run: node scripts/github-action-relay-runner.mjs

