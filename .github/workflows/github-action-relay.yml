name: github-action-relay

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/github-action-relay.yml'
      - 'scripts/github-action-relay-runner.mjs'
      - 'src/platform/github-action-relay.js'
      - 'src/api/github-action-relay-api.js'
      - 'src/capabilities/platform-control-capabilities.js'
      - 'src/router.js'
      - 'tests/gen2/github-action-relay.test.mjs'

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: github-action-relay
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test tests/gen2/github-action-relay.test.mjs tests/gen2/platform-control-capabilities.test.mjs

  relay:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Request scoped GitHub Actions OIDC token
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=meliturgos-worker")"
          TOKEN="$(printf '%s' "$RESPONSE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.value)process.exit(2);process.stdout.write(j.value)})')"
          echo "::add-mask::${TOKEN}"
          echo "MEL_GITHUB_OIDC_TOKEN=${TOKEN}" >> "$GITHUB_ENV"

      - name: Heartbeat, claim and dispatch queued GitHub actions
        run: node scripts/github-action-relay-runner.mjs

