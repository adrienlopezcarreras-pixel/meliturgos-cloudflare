name: mel-avatar-03-identity-ci

on:
  pull_request:
    paths:
      - 'src/pages/avatar-identity.js'
      - 'src/pages/mel-avatar-assets.js'
      - 'tests/gen2/mel-avatar-identity.test.mjs'
      - '.github/workflows/mel-avatar-03-identity-ci.yml'

permissions:
  contents: read

jobs:
  identity-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/runtime-security-gate.mjs
      - run: node --check src/pages/avatar-identity.js
      - run: node --check src/pages/mel-avatar-assets.js
      - run: node --test tests/gen2/mel-avatar-identity.test.mjs tests/theme-avatar-assets.test.mjs

  identity-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: identity-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git switch -c candidate/mel-avatar-03-ci
      - run: npm test
