name: council-rich-ui-production-proof

on:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact deployed SHA to prove; defaults to current main"
        required: false
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/council-rich-ui-production-proof.yml'
      - 'tests/gen2/council-rich-ui-production-proof.test.mjs'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('council-rich-ui-contract-{0}', github.event.pull_request.number) || 'mel-launch-bootstrap-token' }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/gen2/council-rich-ui-production-proof.test.mjs

  resolve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      expected_sha: ${{ steps.sha.outputs.expected_sha }}
    steps:
      - id: sha
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.expected_sha }}
          FALLBACK_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="${INPUT_SHA:-${FALLBACK_SHA}}"
          [[ "${SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "expected_sha=${SHA,,}" >> "$GITHUB_OUTPUT"

  production-proof:
    needs: resolve
    if: needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Re-run exact-SHA Council recovery and rich-renderer contracts
        run: |
          node --test             tests/native-chat-negative-feedback-council.test.mjs             tests/chat-rich-renderer.test.mjs             tests/response-quality.test.mjs

      - name: Prove Council recovery dependencies and rich rendering in production
        shell: bash
        env:
          PROOF_KEY_B64: ${{ secrets.MEL_BACKUP_ENCRYPTION_KEY_B64 }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          TOKEN="$(PROOF_KEY_B64="${PROOF_KEY_B64}" TARGET_SHA="${EXPECTED_SHA}" node - <<'NODE'
          const crypto=require('crypto');
          const source=Buffer.from(String(process.env.PROOF_KEY_B64||''),'base64');
          const sha=String(process.env.TARGET_SHA||'').toLowerCase();
          if(source.length!==32||!/^[0-9a-f]{40}$/.test(sha)) throw new Error('PARALLEL_PROOF_DERIVATION_INVALID');
          process.stdout.write(Buffer.from(crypto.hkdfSync(
            'sha256',
            source,
            Buffer.from('meliturgos-parallel-proof-salt-v1'),
            Buffer.from('MEL_PARALLEL_PROOF_V1:'+sha),
            32,
          )).toString('base64url'));
          NODE
          )"
          SESSION="council-rich-ui-${EXPECTED_SHA:0:12}"
          export TOKEN SESSION EXPECTED_SHA
          echo "::add-mask::${TOKEN}"

          READY=0
          for ATTEMPT in $(seq 1 12); do
            CODE="$(curl --silent --show-error --max-time 45               --header "x-mel-release-smoke: 1"               --header "x-mel-parallel-proof: ${TOKEN}"               --output self-check.json               --write-out '%{http_code}'               "${BASE_URL}/api/gen2/code/self-check" || true)"
            if [ "${CODE}" = "200" ]; then READY=1; break; fi
            sleep 2
          done
          test "${READY}" = "1"

          node - <<'NODE'
          const d=require('./self-check.json');
          const expected=String(process.env.EXPECTED_SHA||'').toLowerCase();
          if(d?.ok!==true || d?.capability!=='code.read') throw new Error('EXACT_SHA_SELF_CHECK_NOT_OK');
          if(String(d?.deployed_sha||'').toLowerCase()!==expected) throw new Error('EXACT_SHA_SELF_CHECK_MISMATCH');
          NODE

          COUNCIL_READY=0
          COUNCIL_MAX_ATTEMPTS=2
          for ATTEMPT in $(seq 1 "${COUNCIL_MAX_ATTEMPTS}"); do
            COUNCIL_CODE="$(curl --silent --show-error --max-time 90               --header "x-mel-release-smoke: 1"               --header "x-mel-parallel-proof: ${TOKEN}"               --header "content-type: application/json"               --data '{"id":"model.council","input":{"request":{"kind":"OWNER_NEGATIVE_FEEDBACK_RECOVERY","original_request":"Vérifie l intégrité du code MEL.","failed_response":"Je n ai pas exécuté la vérification.","owner_feedback":"tu n y arrives pas","instruction":"Analyse l échec et propose une correction concrète sans contourner les garde-fous."},"capability":"GENERAL","maxCandidates":4,"timeoutMs":12000}}'               --output council-live.json               --write-out '%{http_code}'               "${BASE_URL}/api/gen2/capabilities/execute" || true)"
            if [ "${COUNCIL_CODE}" = "200" ] && node - <<'NODE'
          const d=require('./council-live.json');
          const r=d?.result||{};
          const ok=d?.ok===true
            && d?.capability==='model.council'
            && r?.status==='COMPLETE'
            && Number(r?.independent_response_count||0)>=2
            && r?.synthesis?.status==='COMPLETE';
          process.exit(ok ? 0 : 1);
          NODE
            then
              COUNCIL_READY=1
              break
            fi
            COUNCIL_ERROR_CODE="$(node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("council-live.json","utf8"))}catch{};process.stdout.write(String(d?.code||d?.error||"UNKNOWN"))')"
            echo "Council live proof attempt ${ATTEMPT}/${COUNCIL_MAX_ATTEMPTS} incomplete (HTTP ${COUNCIL_CODE}, ${COUNCIL_ERROR_CODE})." >&2
            if [ "${COUNCIL_CODE}" = "401" ] && [ "${COUNCIL_ERROR_CODE}" = "AUTH_REQUIRED" ]; then
              sleep 2
              continue
            fi
            cat council-live.json >&2 || true
            sleep 3
          done
          test "${COUNCIL_READY}" = "1"

          BODY="$(node - <<'NODE'
          const session=process.env.SESSION;
          const token=process.env.TOKEN;
          const origin='https://meliturgos.adrien-lopezcarreras.workers.dev';
          const approvals=[
            {approved:true,session_id:session,step_id:'set-auth',action:'browser.set-headers'},
            {approved:true,session_id:session,step_id:'type-normal',action:'browser.type'},
            {approved:true,session_id:session,step_id:'type-full',action:'browser.type'},
          ];
          const steps=[
            {id:'set-auth',action:'browser.set-headers',headers:{'x-mel-release-smoke':'1','x-mel-parallel-proof':token}},
            {id:'navigate-normal',action:'browser.navigate',url:origin+'/'},
            {id:'type-normal',action:'browser.type',selector:'#promptInput',text:'Lis src/router.js'},
            {id:'send-normal',action:'browser.click',selector:'#send'},
            {id:'wait-normal',action:'browser.wait-text',selector:'#messages',text:'RELEASE_CODE_SMOKE_OK'},
            {id:'read-normal-rich',action:'browser.read-text',selector:'#messages .msg.mel > div[data-rich-rendered="true"]'},
            {id:'navigate-full',action:'browser.navigate',url:origin+'/professor'},
            {id:'open-full-chat',action:'browser.click',selector:'.nav button[data-view="chat"]'},
            {id:'type-full',action:'browser.type',selector:'#chatInput',text:'Lis src/router.js'},
            {id:'send-full',action:'browser.click',selector:'#chatSend'},
            {id:'wait-full',action:'browser.wait-text',selector:'#chatlog',text:'RELEASE_CODE_SMOKE_OK'},
            {id:'read-full-rich',action:'browser.read-text',selector:'#chatlog .msg.mel[data-rich-rendered="true"]:last-child'},
          ];
          process.stdout.write(JSON.stringify({id:'browser.execute',input:{
            session_id:session,
            device:{id:'cloudflare-browser',capabilities:['browser.control']},
            sandbox:{allowed_origins:[origin],max_steps:steps.length},
            approvals,
            steps,
          }}));
          NODE
          )"

          BROWSER_CODE="000"
          for ATTEMPT in $(seq 1 12); do
            BROWSER_CODE="$(curl --silent --show-error --max-time 150             --header "x-mel-release-smoke: 1"             --header "x-mel-parallel-proof: ${TOKEN}"             --header "content-type: application/json"             --data "${BODY}"             --output rich-ui-browser.json             --write-out '%{http_code}'             "${BASE_URL}/api/gen2/capabilities/execute" || true)"
            if [ "${BROWSER_CODE}" = "200" ]; then
              break
            fi
            BROWSER_ERROR_CODE="$(node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("rich-ui-browser.json","utf8"))}catch{};process.stdout.write(String(d?.code||d?.error||d?.status||"UNKNOWN"))')"
            if [ "${BROWSER_CODE}" = "401" ] && [ "${BROWSER_ERROR_CODE}" = "AUTH_REQUIRED" ]; then
              echo "Rich UI browser proof auth is still propagating; retry ${ATTEMPT}/12."
              sleep 2
              continue
            fi
            case "${BROWSER_CODE}" in
              409|429|500|502|503|504)
                echo "Transient rich UI browser proof status ${BROWSER_CODE} (${BROWSER_ERROR_CODE}); retry ${ATTEMPT}/12."
                sleep $((ATTEMPT < 8 ? ATTEMPT * 2 : 15))
                continue
                ;;
              *)
                echo "Non-retryable rich UI browser proof status ${BROWSER_CODE} (${BROWSER_ERROR_CODE})."
                if [ -s rich-ui-browser.json ]; then
                  node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("rich-ui-browser.json","utf8"))}catch{};console.log(JSON.stringify({ok:d?.ok===true,code:d?.code||d?.error||d?.status||"UNKNOWN"}))'
                fi
                exit 31
                ;;
            esac
          done
          test "${BROWSER_CODE}" = "200"

          node - <<'NODE'
          const fs=require('fs');
          const browser=require('./rich-ui-browser.json');
          const council=require('./council-live.json');
          const self=require('./self-check.json');
          const r=browser?.result||{};
          if(browser?.ok!==true || browser?.capability!=='browser.execute') throw new Error('RICH_UI_BROWSER_NOT_OK');
          if(r?.ok!==true || Number(r?.steps_completed||0)!==12) throw new Error('RICH_UI_BROWSER_INCOMPLETE');
          const output=id=>(r.outputs||[]).find(x=>x?.step_id===id)?.output||{};
          const normal=output('read-normal-rich');
          const full=output('read-full-rich');
          if(normal?.kind!=='text' || !String(normal?.text||'').includes('RELEASE_CODE_SMOKE_OK')) throw new Error('NORMAL_RICH_RENDER_NOT_PROVED');
          if(full?.kind!=='text' || !String(full?.text||'').includes('RELEASE_CODE_SMOKE_OK')) throw new Error('FULL_RICH_RENDER_NOT_PROVED');
          const cr=council?.result||{};
          const proof={
            schema:'mel.council-rich-ui-production-proof/v1',
            source_sha:process.env.EXPECTED_SHA,
            exact_sha_runtime:self?.deployed_sha===process.env.EXPECTED_SHA,
            council_recovery_contract_tests:true,
            council_live:{
              status:cr?.status||null,
              independent_response_count:Number(cr?.independent_response_count||0),
              unique_model_count:Number(cr?.unique_model_count||0),
              synthesis_status:cr?.synthesis?.status||null,
            },
            rich_ui:{
              normal:{rendered:true,marker:'RELEASE_CODE_SMOKE_OK'},
              full:{rendered:true,marker:'RELEASE_CODE_SMOKE_OK'},
            },
            secret_values_exposed:false,
          };
          fs.writeFileSync('council-rich-ui-production-proof.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof,null,2));
          NODE

      - name: Upload sanitized Council + rich UI proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: council-rich-ui-production-proof-${{ needs.resolve.outputs.expected_sha }}
          path: council-rich-ui-production-proof.json
          if-no-files-found: warn
          retention-days: 30
