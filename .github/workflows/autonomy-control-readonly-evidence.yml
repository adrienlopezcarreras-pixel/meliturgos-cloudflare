name: autonomy-control-readonly-evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/autonomy-control-readonly-evidence.yml'
      - 'scripts/read-autonomy-d1-evidence.mjs'
      - 'tests/autonomy-d1-readonly-evidence.test.mjs'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node --test tests/autonomy-d1-readonly-evidence.test.mjs

  read-control:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'adrienlopezcarreras-pixel' }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read one control record with constant SELECT and no raw owner text
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/read-autonomy-d1-evidence.mjs
      - name: Retain sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: autonomy-d1-readonly-evidence-${{ github.run_id }}
          path: autonomy-d1-readonly-evidence.json
          if-no-files-found: warn
          retention-days: 7
