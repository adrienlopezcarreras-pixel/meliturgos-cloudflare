name: lora-kaggle-free-collect

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lora-kaggle-free-collect.yml"
      - "scripts/finalize-lora.mjs"
      - "src/learning/operator-actions.js"
      - "src/professor-live-learning-entry.js"
      - "scripts/validate-lora-benchmark-readiness.mjs"
      - "scripts/check-lora-preview-version.mjs"
      - "scripts/check-lora-preview-workflow-run.mjs"
  workflow_dispatch:
    inputs:
      activate_preview:
        description: "Activate exact adapter in isolated preview after all gates pass"
        required: true
        default: false
        type: boolean
      wait_for_completion:
        description: "Wait for the currently running Kaggle kernel before collecting"
        required: true
        default: true
        type: boolean
      max_wait_minutes:
        description: "Maximum wait for Kaggle completion"
        required: true
        default: "180"
        type: string
      existing_finetune_id:
        description: "Optional already-uploaded Cloudflare finetune id for recovery/benchmark-only runs"
        required: false
        default: ""
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: mel-lora-kaggle-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      RECOVERY_FINETUNE_ID: ${{ github.event_name == 'push' && 'faf28a8f-2d3a-473b-b793-54afed874422' || inputs.existing_finetune_id }}
    steps:
      - name: Checkout exact collector SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Credentials preflight
        id: creds
        shell: bash
        run: |
          if [ -n "${KAGGLE_API_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Kaggle credentials absent; collector exits without fallback or spend."
          fi

      - name: Install Kaggle CLI
        if: steps.creds.outputs.ready == 'true'
        run: python -m pip install -U kaggle

      - name: Resolve Kaggle account
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="$(python - <<'PY'
          import os
          from kagglesdk.kaggle_client import KaggleClient
          from kagglesdk.kaggle_creds import KaggleCredentials
          client = KaggleClient(user_agent="meliturgos-kaggle-lora/1.0")
          creds = KaggleCredentials(client=client, access_token=os.environ["KAGGLE_API_TOKEN"])
          print(creds.introspect())
          PY
          )"
          test -n "$USERNAME"
          echo "KAGGLE_USERNAME=$USERNAME" >> "$GITHUB_ENV"
          echo "Resolved Kaggle account: $USERNAME"

      - name: Check Kaggle run
        if: steps.creds.outputs.ready == 'true'
        id: status
        shell: bash
        env:
          WAIT_FOR_COMPLETION: ${{ github.event_name == 'push' && 'false' || inputs.wait_for_completion }}
          MAX_WAIT_MINUTES: ${{ github.event_name == 'push' && '1' || inputs.max_wait_minutes }}
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/mel-lora-uncensored-notebook-t4"
          [[ "$MAX_WAIT_MINUTES" =~ ^[0-9]+$ ]] || { echo "INVALID_MAX_WAIT_MINUTES"; exit 1; }
          (( MAX_WAIT_MINUTES >= 1 && MAX_WAIT_MINUTES <= 220 )) || { echo "MAX_WAIT_MINUTES_OUT_OF_RANGE"; exit 1; }
          COMPLETE=false
          ATTEMPTS=$MAX_WAIT_MINUTES
          for attempt in $(seq 1 "$ATTEMPTS"); do
            RAW="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            printf '[%s] %s\n' "$attempt" "$RAW"
            printf '%s\n' "$RAW" > kaggle-status.txt
            LOWER="$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$LOWER" | grep -Eq 'complete|completed|success'; then
              COMPLETE=true
              break
            fi
            if printf '%s' "$LOWER" | grep -Eq 'error|failed|failure|cancelled|canceled|cancel_acknowledged|cancel acknowledged'; then
              echo "KAGGLE_RUN_FAILED"
              exit 1
            fi
            if [[ "$WAIT_FOR_COMPLETION" != "true" ]]; then
              break
            fi
            sleep 60
          done
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"
          if [[ "$WAIT_FOR_COMPLETION" == "true" && "$COMPLETE" != "true" ]]; then
            echo "KAGGLE_WAIT_TIMEOUT"
            exit 1
          fi

      - name: Download completed training output
        if: steps.status.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kaggle-output
          kaggle kernels output "${KAGGLE_USERNAME}/mel-lora-uncensored-notebook-t4"             -p artifacts/kaggle-output --force
          find artifacts/kaggle-output -maxdepth 4 -type f -print

      - name: Locate exact evidence bundle
        if: steps.status.outputs.complete == 'true'
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          DIR="artifacts/kaggle-output/mel-lora-output"
          test -s "$DIR/training-evidence.json"
          for f in adapter_model.safetensors adapter_config.json training-evidence.json artifact-evidence.json lora-plan.json kaggle-run.json; do
            test -s "$DIR/$f"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir='artifacts/kaggle-output/mel-lora-output';
          const training=JSON.parse(fs.readFileSync(dir+'/training-evidence.json','utf8'));
          const artifact=JSON.parse(fs.readFileSync(dir+'/artifact-evidence.json','utf8'));
          const stage=String(training.stage||'');
          if (stage === 'uncensored-continue') {
            const parent=String(training.parent_artifact_digest||'').toLowerCase();
            const current=String(artifact.digest||'').toLowerCase();
            if (!parent || !current || parent === current) throw new Error('KAGGLE_COLLECTOR_SELECTED_PARENT_INSTEAD_OF_CURRENT');
          }
          console.log(JSON.stringify({status:'CURRENT_KAGGLE_CHECKPOINT_SELECTED',stage,artifact_digest:artifact.digest,parent_artifact_digest:training.parent_artifact_digest||null},null,2));
          NODE
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Validate uncensored artifact provenance
        if: steps.status.outputs.complete == 'true'
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { assertAdapterArtifact } from './src/learning/lora-plan.js';
          const dir=process.env.BUNDLE_DIR;
          const plan=JSON.parse(fs.readFileSync(dir+'/lora-plan.json','utf8'));
          const artifact=JSON.parse(fs.readFileSync(dir+'/artifact-evidence.json','utf8'));
          const training=JSON.parse(fs.readFileSync(dir+'/training-evidence.json','utf8'));
          const run=JSON.parse(fs.readFileSync(dir+'/kaggle-run.json','utf8'));
          const checked=assertAdapterArtifact(artifact);
          const stage=String(training.stage||'');
          if (!['uncensored','uncensored-continue'].includes(stage)) throw new Error('KAGGLE_STAGE_NOT_UNCENSORED');
          if (stage === 'uncensored-continue') {
            const parent=String(training.parent_artifact_digest||'').toLowerCase();
            if (!/^sha256:[0-9a-f]{64}$/.test(parent)) throw new Error('KAGGLE_CONTINUATION_PARENT_DIGEST_MISSING');
            if (String(artifact.parent_artifact_digest||'').toLowerCase() !== parent) throw new Error('KAGGLE_CONTINUATION_ARTIFACT_PARENT_MISMATCH');
            if (String(run.parent_artifact_digest||'').toLowerCase() !== parent) throw new Error('KAGGLE_CONTINUATION_RUN_PARENT_MISMATCH');
          }
          if (checked.finetune_id) throw new Error('PREEXISTING_FINETUNE_ID_FORBIDDEN');
          if (String(training.dataset_digest||'') !== String(plan.dataset_digest||'')) throw new Error('KAGGLE_DATASET_MISMATCH');
          if (String(training.training_manifest_digest||'').toLowerCase() !== String(plan.training_manifest_digest||'').toLowerCase()) throw new Error('KAGGLE_MANIFEST_MISMATCH');
          console.log(JSON.stringify({status:'KAGGLE_BUNDLE_VERIFIED',artifact_digest:checked.digest,examples:training?.dataset?.examples},null,2));
          NODE

      - name: Attach pre-uploaded Cloudflare finetune
        if: steps.status.outputs.complete == 'true' && env.RECOVERY_FINETUNE_ID != ''
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.locate.outputs.dir }}
          EXISTING_FINETUNE_ID: ${{ env.RECOVERY_FINETUNE_ID }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const dir=process.env.BUNDLE_DIR;
          const id=String(process.env.EXISTING_FINETUNE_ID||'').trim();
          if (!/^[A-Za-z0-9][A-Za-z0-9._:-]{5,127}$/.test(id)) throw new Error('INVALID_EXISTING_FINETUNE_ID');
          const path=dir+'/artifact-evidence.json';
          const artifact=JSON.parse(fs.readFileSync(path,'utf8'));
          if (artifact.finetune_id) throw new Error('KAGGLE_ARTIFACT_ALREADY_HAS_FINETUNE_ID');
          artifact.finetune_id=id;
          artifact.uri='cloudflare-finetune:'+id;
          fs.writeFileSync(path,JSON.stringify(artifact,null,2)+'\n');
          console.log(JSON.stringify({status:'EXISTING_FINETUNE_ATTACHED',finetune_id:id,artifact_digest:artifact.digest},null,2));
          NODE

      - name: Upload exact adapter to Cloudflare fine-tunes
        if: steps.status.outputs.complete == 'true' && env.RECOVERY_FINETUNE_ID == ''
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_FINETUNES_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          node scripts/upload-cloudflare-lora.mjs             --dir "$BUNDLE_DIR"             --name "mel-kaggle-uncensored-${GITHUB_RUN_ID}"

      - name: Approve exact uploaded artifact
        if: steps.status.outputs.complete == 'true'
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          node scripts/approve-lora-artifact.mjs             --dir "$BUNDLE_DIR"             --approval-id "kaggle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Derive preview credential
        if: steps.status.outputs.complete == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PREVIEW_PASSWORD="$(python - <<'PY'
          import hashlib,hmac,os
          token=os.environ['CLOUDFLARE_API_TOKEN'].encode()
          print(hmac.new(token,b'meliturgos-preview-auth-v1',hashlib.sha256).hexdigest())
          PY
          )"
          echo "::add-mask::$PREVIEW_PASSWORD"
          echo "MEL_PREVIEW_PASSWORD=$PREVIEW_PASSWORD" >> "$GITHUB_ENV"

      - name: Align isolated preview authentication
        if: steps.status.outputs.complete == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${MEL_PREVIEW_PASSWORD:-}"
          printf '%s' "$MEL_PREVIEW_PASSWORD" | npx wrangler secret put MELITURGOS_PASSWORD --env preview

      - name: Wait for preview auth propagation
        if: steps.status.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          READY=0
          for attempt in $(seq 1 20); do
            status="$(curl --silent --show-error --max-time 20 \
              --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
              --output /tmp/preview-auth-probe.json \
              --write-out '%{http_code}' \
              "$BASE_URL/api/learning/progress" || true)"
            echo "preview-auth-probe[$attempt] http=$status"
            if [[ "$status" =~ ^2 ]]; then
              READY=1
              break
            fi
            sleep 3
          done
          [[ "$READY" == "1" ]] || {
            echo "PREVIEW_AUTH_PROPAGATION_TIMEOUT"
            cat /tmp/preview-auth-probe.json || true
            exit 1
          }

      - name: Wait for isolated preview exact collector SHA
        if: steps.status.outputs.complete == 'true'
        timeout-minutes: 46
        shell: bash
        env:
          PREVIEW_EXPECTED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          test -n "${MEL_PREVIEW_PASSWORD:-}"
          # Preview's own job is allowed 40 minutes. Permit propagation,
          # but refuse indefinitely waiting or testing a stale Worker SHA.
          deadline=$((SECONDS + 43 * 60))
          attempt=0
          # An unscheduled exact-SHA preview cannot become green by waiting.
          # Count only successful GitHub API responses that prove no matching run.
          absent_preview_checks=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            # First require the GitHub-isolated preview workflow to have
            # COMPLETED successfully for this exact SHA. Worker deployment alone
            # is insufficient: a late GEN2-42/ShardVault failure must block LoRA.
            API_CODE="$(curl --silent --show-error --max-time 20 --connect-timeout 10 \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --output /tmp/mel-lora-preview-workflow-runs.json \
              --write-out '%{http_code}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${PREVIEW_EXPECTED_SHA}&per_page=100" || true)"
            if [ "${API_CODE}" = "401" ] || [ "${API_CODE}" = "403" ] || [ "${API_CODE}" = "404" ]; then
              echo "LORA_PREVIEW_WORKFLOW_API_AUTH_OR_SCOPE_FAILED"
              exit 1
            fi
            if [ "${API_CODE}" != "200" ]; then
              echo "LORA_PREVIEW_WORKFLOW_API_TRANSIENT attempt=${attempt} http=${API_CODE}"
              sleep 15
              continue
            fi
            if ! node scripts/check-lora-preview-workflow-run.mjs \
                /tmp/mel-lora-preview-workflow-runs.json "$PREVIEW_EXPECTED_SHA" > /tmp/mel-lora-preview-workflow-verdict.json; then
              # Fail immediately if the newest exact-SHA preview already
              # completed unsuccessfully. Never mistake a failed preview for a
              # merely pending one, and never expose workflow response bodies.
              if node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("/tmp/mel-lora-preview-workflow-verdict.json","utf8"))}catch{};process.exit(d?.code==="LORA_PREVIEW_WORKFLOW_TERMINAL_FAILURE"?0:1)'; then
                echo "LORA_PREVIEW_TERMINAL_FAILURE"
                exit 1
              fi
              if node -e 'const fs=require("fs");let d={};try{d=JSON.parse(fs.readFileSync("/tmp/mel-lora-preview-workflow-verdict.json","utf8"))}catch{};process.exit(d?.code==="LORA_PREVIEW_WORKFLOW_NOT_FOUND"?0:1)'; then
                absent_preview_checks=$((absent_preview_checks + 1))
                if [ "$absent_preview_checks" -ge 8 ]; then
                  echo "LORA_PREVIEW_EXACT_SHA_NOT_SCHEDULED"
                  exit 1
                fi
              else
                # A real matching run is pending or active; wait for its proof.
                absent_preview_checks=0
              fi
              echo "LORA_PREVIEW_WORKFLOW_NOT_YET_SUCCESSFUL attempt=${attempt}"
              sleep 15
              continue
            fi
            STATUS="$(curl --silent --show-error --max-time 20 --connect-timeout 10 \
              --request POST \
              --header "Authorization: Bearer ${MEL_PREVIEW_PASSWORD}" \
              --header "content-type: application/json" \
              --data '{"id":"code.read","input":{"path":"src/router.js"}}' \
              --output /tmp/mel-lora-preview-version.json \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/gen2/capabilities/execute" || true)"
            if [ "${STATUS}" = "200" ] && node scripts/check-lora-preview-version.mjs /tmp/mel-lora-preview-version.json "$PREVIEW_EXPECTED_SHA"; then
              echo "LORA_PREVIEW_EXACT_SHA_READY"
              exit 0
            fi
            echo "LORA_PREVIEW_EXACT_SHA_WAIT attempt=${attempt} remaining_seconds=$((deadline - SECONDS))"
            sleep 15
          done
          echo "LORA_PREVIEW_EXACT_SHA_TIMEOUT"
          exit 1

      - name: Benchmark exact Kaggle adapter
        if: steps.status.outputs.complete == 'true'
        shell: bash
        env:
          MEL_BASE_URL: "https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          ACTIVATE_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_preview && 'true' || 'false' }}
          MEL_LORA_ACTIVATION_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_preview && 'true' || 'false' }}
          BUNDLE_DIR: ${{ steps.locate.outputs.dir }}
          BENCHMARK_CONCURRENCY: ${{ github.event_name == 'push' && '1' || '4' }}
          BENCHMARK_SERIAL: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: |
          export MELITURGOS_PASSWORD="$MEL_PREVIEW_PASSWORD"
          node scripts/finalize-lora.mjs             --dir "$BUNDLE_DIR"             --url "$MEL_BASE_URL"             --activate "$ACTIVATE_PREVIEW"             --concurrency "$BENCHMARK_CONCURRENCY"             --serial "$BENCHMARK_SERIAL"             --allow-not-activated true | tee artifacts/finalize-result.json

      - name: Validate LoRA benchmark readiness
        if: steps.status.outputs.complete == 'true'
        shell: bash
        run: |
          node scripts/validate-lora-benchmark-readiness.mjs artifacts/finalize-result.json

      - name: Upload Kaggle training evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kaggle-lora-collect-${{ github.run_id }}
          path: |
            kaggle-status.txt
            artifacts/kaggle-output/**/training-evidence.json
            artifacts/kaggle-output/**/artifact-evidence.json
            artifacts/kaggle-output/**/lora-plan.json
            artifacts/kaggle-output/**/dataset-metadata.json
            artifacts/kaggle-output/**/kaggle-run.json
            artifacts/kaggle-output/**/approval-evidence.json
            artifacts/kaggle-output/**/benchmark-evidence.json
            artifacts/finalize-result.json
          if-no-files-found: warn
          retention-days: 14
