name: lora-kaggle-free-collect

on:
  workflow_dispatch:
    inputs:
      activate_preview:
        description: "Activate exact adapter in isolated preview after all gates pass"
        required: true
        default: false
        type: boolean
      wait_for_completion:
        description: "Wait for the currently running Kaggle kernel before collecting"
        required: true
        default: true
        type: boolean
      max_wait_minutes:
        description: "Maximum wait for Kaggle completion"
        required: true
        default: "180"
        type: string
  schedule:
    - cron: "2,17,32,47 * * * *"

permissions:
  contents: read

concurrency:
  group: mel-lora-kaggle-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: candidate/mel-clean-autonomy

      - name: Credentials preflight
        id: creds
        shell: bash
        run: |
          if [ -n "${KAGGLE_API_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Kaggle credentials absent; collector exits without fallback or spend."
          fi

      - name: Install Kaggle CLI
        if: steps.creds.outputs.ready == 'true'
        run: python -m pip install -U kaggle

      - name: Resolve Kaggle account
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="$(python - <<'PY'
          import os
          from kagglesdk.kaggle_client import KaggleClient
          from kagglesdk.kaggle_creds import KaggleCredentials
          client = KaggleClient(user_agent="meliturgos-kaggle-lora/1.0")
          creds = KaggleCredentials(client=client, access_token=os.environ["KAGGLE_API_TOKEN"])
          print(creds.introspect())
          PY
          )"
          test -n "$USERNAME"
          echo "KAGGLE_USERNAME=$USERNAME" >> "$GITHUB_ENV"
          echo "Resolved Kaggle account: $USERNAME"

      - name: Check Kaggle run
        if: steps.creds.outputs.ready == 'true'
        id: status
        shell: bash
        env:
          WAIT_FOR_COMPLETION: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_for_completion || false }}
          MAX_WAIT_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_wait_minutes || '1' }}
        run: |
          set -euo pipefail
          KERNEL="${KAGGLE_USERNAME}/mel-lora-uncensored-max"
          [[ "$MAX_WAIT_MINUTES" =~ ^[0-9]+$ ]] || { echo "INVALID_MAX_WAIT_MINUTES"; exit 1; }
          (( MAX_WAIT_MINUTES >= 1 && MAX_WAIT_MINUTES <= 220 )) || { echo "MAX_WAIT_MINUTES_OUT_OF_RANGE"; exit 1; }
          COMPLETE=false
          ATTEMPTS=$MAX_WAIT_MINUTES
          for attempt in $(seq 1 "$ATTEMPTS"); do
            RAW="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            printf '[%s] %s\n' "$attempt" "$RAW"
            printf '%s\n' "$RAW" > kaggle-status.txt
            LOWER="$(printf '%s' "$RAW" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$LOWER" | grep -Eq 'complete|completed|success'; then
              COMPLETE=true
              break
            fi
            if printf '%s' "$LOWER" | grep -Eq 'error|failed|failure|cancelled|canceled'; then
              echo "KAGGLE_RUN_FAILED"
              exit 1
            fi
            if [[ "$WAIT_FOR_COMPLETION" != "true" ]]; then
              break
            fi
            sleep 60
          done
          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"
          if [[ "$WAIT_FOR_COMPLETION" == "true" && "$COMPLETE" != "true" ]]; then
            echo "KAGGLE_WAIT_TIMEOUT"
            exit 1
          fi

      - name: Download completed training output
        if: steps.status.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kaggle-output
          kaggle kernels output "${KAGGLE_USERNAME}/mel-lora-uncensored-max"             -p artifacts/kaggle-output --force
          find artifacts/kaggle-output -maxdepth 4 -type f -print

      - name: Locate exact evidence bundle
        if: steps.status.outputs.complete == 'true'
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ADAPTER="$(find artifacts/kaggle-output -type f -name adapter_model.safetensors -print -quit)"
          test -n "$ADAPTER"
          DIR="$(dirname "$ADAPTER")"
          for f in adapter_model.safetensors adapter_config.json training-evidence.json artifact-evidence.json lora-plan.json kaggle-run.json; do
            test -s "$DIR/$f"
          done
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Validate uncensored artifact provenance
        if: steps.status.outputs.complete == 'true'
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { assertAdapterArtifact } from './src/learning/lora-plan.js';
          const dir=process.env.BUNDLE_DIR;
          const plan=JSON.parse(fs.readFileSync(dir+'/lora-plan.json','utf8'));
          const artifact=JSON.parse(fs.readFileSync(dir+'/artifact-evidence.json','utf8'));
          const training=JSON.parse(fs.readFileSync(dir+'/training-evidence.json','utf8'));
          const checked=assertAdapterArtifact(artifact);
          if (String(training.stage||'') !== 'uncensored') throw new Error('KAGGLE_STAGE_NOT_UNCENSORED');
          if (checked.finetune_id) throw new Error('PREEXISTING_FINETUNE_ID_FORBIDDEN');
          if (String(training.dataset_digest||'') !== String(plan.dataset_digest||'')) throw new Error('KAGGLE_DATASET_MISMATCH');
          if (String(training.training_manifest_digest||'').toLowerCase() !== String(plan.training_manifest_digest||'').toLowerCase()) throw new Error('KAGGLE_MANIFEST_MISMATCH');
          console.log(JSON.stringify({status:'KAGGLE_BUNDLE_VERIFIED',artifact_digest:checked.digest,examples:training?.dataset?.examples},null,2));
          NODE

      - name: Upload exact adapter to Cloudflare fine-tunes
        if: steps.status.outputs.complete == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          node scripts/upload-cloudflare-lora.mjs             --dir "$BUNDLE_DIR"             --name "mel-kaggle-uncensored-${GITHUB_RUN_ID}"

      - name: Approve exact uploaded artifact
        if: steps.status.outputs.complete == 'true'
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          node scripts/approve-lora-artifact.mjs             --dir "$BUNDLE_DIR"             --approval-id "kaggle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Derive preview credential
        if: steps.status.outputs.complete == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          PREVIEW_PASSWORD="$(python - <<'PY'
          import hashlib,hmac,os
          token=os.environ['CLOUDFLARE_API_TOKEN'].encode()
          print(hmac.new(token,b'meliturgos-preview-auth-v1',hashlib.sha256).hexdigest())
          PY
          )"
          echo "::add-mask::$PREVIEW_PASSWORD"
          echo "MEL_PREVIEW_PASSWORD=$PREVIEW_PASSWORD" >> "$GITHUB_ENV"

      - name: Benchmark exact Kaggle adapter
        if: steps.status.outputs.complete == 'true'
        shell: bash
        env:
          MELITURGOS_PASSWORD: ${{ env.MEL_PREVIEW_PASSWORD }}
          MEL_BASE_URL: "https://meliturgos-preview.adrien-lopezcarreras.workers.dev"
          ACTIVATE_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_preview || false }}
          BUNDLE_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          node scripts/finalize-lora.mjs             --dir "$BUNDLE_DIR"             --url "$MEL_BASE_URL"             --activate "$ACTIVATE_PREVIEW"             --allow-not-activated true | tee artifacts/finalize-result.json

      - name: Upload Kaggle training evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kaggle-lora-collect-${{ github.run_id }}
          path: |
            kaggle-status.txt
            artifacts/kaggle-output/**/training-evidence.json
            artifacts/kaggle-output/**/artifact-evidence.json
            artifacts/kaggle-output/**/lora-plan.json
            artifacts/kaggle-output/**/dataset-metadata.json
            artifacts/kaggle-output/**/kaggle-run.json
            artifacts/finalize-result.json
          if-no-files-found: warn
          retention-days: 14
