name: Android OK MEL microphone worker lifecycle contract

on:
  pull_request:
    paths:
      - 'android-companion/app/src/main/java/fr/veriteinterdite/mel/MainActivity.kt'
      - 'tests/android-wake-worker-generation.test.mjs'
      - '.github/workflows/android-wake-worker-lifecycle-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-worker-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Assert lifecycle and stale-callback invariants
        run: node --test tests/android-wake-worker-generation.test.mjs
