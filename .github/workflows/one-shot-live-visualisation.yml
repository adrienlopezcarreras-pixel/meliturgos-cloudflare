name: one-shot-live-visualisation

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - .github/workflows/one-shot-live-visualisation.yml

permissions:
  contents: write
  actions: write

jobs:
  rename-live-view:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify expected source
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "candidate/mel-clean-autonomy"
          test "$(git hash-object src/learning-entry.js)" = "c7f89f65ebbf6052f0b87461874d2ba90cb89b86"

      - name: Rename live view in French
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/learning-entry.js')
          text = path.read_text(encoding='utf-8')
          count = text.count('Contrôle live')
          if count != 3:
              raise SystemExit(f'Expected exactly 3 live labels, found {count}')
          text = text.replace('Contrôle live', 'Visualisation live')
          path.write_text(text, encoding='utf-8')
          PY
          test "$(grep -o 'Visualisation live' src/learning-entry.js | wc -l)" -eq 3
          ! grep -q 'Contrôle live' src/learning-entry.js

      - name: Install exact lockfile
        run: npm ci

      - name: Syntax gate
        run: npm run check

      - name: Test gate
        run: npm test

      - name: Commit source and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/learning-entry.js
          git rm .github/workflows/one-shot-live-visualisation.yml
          git commit -m "feat(ui): rename live view in French"
          git push origin HEAD:candidate/mel-clean-autonomy

      - name: Dispatch canonical verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 2
          for workflow in full-candidate-ci.yml deploy-candidate-preview.yml; do
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"candidate/mel-clean-autonomy"}'
          done
