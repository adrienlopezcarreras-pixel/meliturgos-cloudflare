name: augmentio-ci

on:
  push:
    branches:
      - 'candidate/augmentio-*'
  pull_request:
    paths:
      - 'src/augmentio/**'
      - 'tests/augmentio-*.test.mjs'
      - '.github/workflows/augmentio-ci.yml'

permissions:
  contents: read

jobs:
  augmentio-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          for file in src/augmentio/*.js; do node --check "$file"; done
      - name: Augmentio tests
        run: node --test tests/augmentio-*.test.mjs
