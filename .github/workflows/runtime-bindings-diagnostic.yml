name: runtime-bindings-diagnostic

on:
  push:
    branches:
      - diag/runtime-bindings-20260929
    paths:
      - .github/workflows/runtime-bindings-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: mel-launch-bootstrap-token
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read sanitized production bindings
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"
          cleanup() {
            set +e
            printf 'y\n' | npx wrangler secret delete MEL_LAUNCH_BOOTSTRAP_TOKEN --env="" >/tmp/bindings-secret-delete.log 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' "${TOKEN}" | npx wrangler secret put MEL_LAUNCH_BOOTSTRAP_TOKEN --env=""
          READY=0
          for attempt in $(seq 1 24); do
            code="$(curl --silent --show-error --max-time 30 \
              --header "x-mel-release-smoke: 1" \
              --header "x-mel-launch-bootstrap: ${TOKEN}" \
              --header "content-type: application/json" \
              --data '{"id":"system.bindings","input":{}}' \
              --output /tmp/bindings.json \
              --write-out '%{http_code}' \
              "${BASE_URL}/api/gen2/capabilities/execute" || true)"
            if [ "${code}" = "200" ] && node -e 'const d=require("/tmp/bindings.json");process.exit(d?.ok===true?0:1)'; then
              READY=1
              break
            fi
            sleep 3
          done
          test "${READY}" = "1"
          node - <<'NODE'
          const d=require('/tmp/bindings.json');
          const b=d?.result||{};
          console.log(JSON.stringify({
            github_control_configured:b.github_control_configured===true,
            cloudflare_control_configured:b.cloudflare_control_configured===true,
            vercel_control_configured:b.vercel_control_configured===true,
            browser_companion:b.browser_companion===true,
            ai:b.ai===true,
            db:b.db===true,
            media_bucket:b.media_bucket===true,
            github_repository:b.github_repository||null,
            github_branch:b.github_branch||null
          },null,2));
          NODE
          cleanup
          trap - EXIT
