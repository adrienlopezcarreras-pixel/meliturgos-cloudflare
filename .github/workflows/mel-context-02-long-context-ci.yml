name: mel-context-02-long-context-ci

on:
  pull_request:
    paths:
      - 'src/core/orchestrator/context-builder.js'
      - 'src/roadmap/master-roadmap.js'
      - 'tests/context-builder-budget.test.mjs'
      - 'tests/context-priority.test.mjs'
      - 'tests/tool-context-grounding.test.mjs'
      - '.github/workflows/mel-context-02-long-context-ci.yml'
  push:
    branches:
      - 'roadmap/mel-context-02-reconciled-20260925'

permissions:
  contents: read

jobs:
  context-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/runtime-security-gate.mjs
      - run: node --check src/core/orchestrator/context-builder.js
      - name: Context targeted tests
        run: >
          node --test
          tests/context-builder-budget.test.mjs
          tests/context-priority.test.mjs
          tests/tool-context-grounding.test.mjs
          tests/conversation-latest-window.test.mjs

  context-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: context-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git switch -c candidate/mel-context-02-long-context-ci
      - run: npm test
