name: MEL release outcome ledger

on:
  workflow_run:
    workflows: ['deploy-cloudflare-release']
    types: [completed]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/release-outcome-ledger.mjs'
      - 'tests/release-outcome-ledger.test.mjs'
      - '.github/workflows/release-outcome-ledger.yml'

permissions:
  contents: read

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Run scoped release event and formatting tests
        run: node --test tests/release-outcome-ledger.test.mjs

  record:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'deploy-cloudflare-release' &&
      ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'release/mel-hardware-v0.1.0') ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'release/mel-hardware-v0.1.0'))) &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Record sanitized completed release outcome in reconciliation PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-outcome-ledger.mjs > /tmp/mel-release-outcome.md
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/issues/1516/comments" \
            -f "body=$(cat /tmp/mel-release-outcome.md)" >/dev/null
