name: MAX D1 readonly queue diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/max-d1-readonly-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: max-d1-readonly-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Read aggregated MAX state without modifying production
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          # Only fixed, aggregate SELECTs. No job IDs, goals, prompts, private
          # data, provider traces, secrets, or raw result_json leave D1.
          SQL="SELECT status,
            COALESCE(json_extract(result_json,'$.autonomy_deferral.code'),'NONE') AS block_code,
            COALESCE(json_extract(result_json,'$.autonomy_deferral.phase'),'NONE') AS phase,
            COUNT(*) AS jobs,
            SUM(CASE WHEN json_extract(result_json,'$.autonomy_deferral.exhausted') = 1 THEN 1 ELSE 0 END) AS exhausted,
            MAX(COALESCE(json_extract(result_json,'$.autonomy_deferral.attempts'),0)) AS attempts_max,
            MIN(json_extract(result_json,'$.autonomy_deferral.retry_after')) AS earliest_retry_ms,
            MAX(COALESCE(json_extract(result_json,'$.council_provider_cooldown.authorized'),0)) AS authorized_count_max,
            MAX(COALESCE(json_extract(result_json,'$.council_provider_cooldown.eligible'),0)) AS eligible_count_max
            FROM dev_jobs
            WHERE requested_by='mel-autonomy'
              AND status IN ('QUEUED','CLAIMED','TEACHER_APPROVED','WAITING_TEACHER','COUNCIL_COMPLETE','READY_FOR_REVIEW','COMMITTED')
            GROUP BY status,block_code,phase ORDER BY jobs DESC LIMIT 30;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --env="" --command "$SQL"
          # Never print provider IDs or raw provider errors. Map failure
          # traces into a fixed allowlist of harmless diagnostic classes.
          FAILURE_SQL="SELECT CASE
            WHEN json_extract(attempt.value,'$.error') IN
              ('COUNCIL_PROVIDER_TIMEOUT','COUNCIL_REVIEW_DEADLINE',
               'COUNCIL_EMPTY_RESPONSE','EMPTY_WORKERS_AI_RESPONSE',
               'WORKERS_AI_BINDING_UNAVAILABLE','MODEL_UNAVAILABLE',
               'NO_ELIGIBLE_PROVIDER','COUNCIL_PROVIDER_FAILED',
               'ZERO_EURO_POLICY_BLOCKED')
              THEN json_extract(attempt.value,'$.error')
            WHEN UPPER(COALESCE(json_extract(attempt.value,'$.error'),'')) LIKE '%QUOTA%'
              THEN 'QUOTA_RELATED'
            WHEN UPPER(COALESCE(json_extract(attempt.value,'$.error'),'')) LIKE '%RATE_LIMIT%'
              THEN 'RATE_LIMIT_RELATED'
            ELSE 'OTHER_OR_UNKNOWN'
          END AS failure_class,
          COUNT(*) AS attempts,
          MAX(COALESCE(json_extract(attempt.value,'$.duration_ms'),0)) AS maximum_duration_ms
          FROM dev_jobs AS job, json_each(job.result_json,'$.council_model_attempts') AS attempt
          WHERE job.requested_by='mel-autonomy'
            AND job.status IN ('QUEUED','CLAIMED','TEACHER_APPROVED','WAITING_TEACHER','COUNCIL_COMPLETE','READY_FOR_REVIEW','COMMITTED')
            AND COALESCE(json_extract(attempt.value,'$.status'),'') <> 'OK'
          GROUP BY failure_class ORDER BY attempts DESC LIMIT 20;"
          npx wrangler d1 execute DB --remote --config wrangler.jsonc --env="" --command "$FAILURE_SQL"
