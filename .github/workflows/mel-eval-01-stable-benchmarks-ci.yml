name: mel-eval-01-stable-benchmarks-ci

on:
  pull_request:
    paths:
      - 'src/evaluation/stable-benchmark-suites.js'
      - 'src/evaluation/benchmarks.js'
      - 'src/evaluation/benchmark-evidence.js'
      - 'src/evaluation/regression.js'
      - 'src/capabilities/default-bus.js'
      - 'src/roadmap/master-roadmap.js'
      - 'tests/stable-benchmark-suites.test.mjs'
      - 'tests/evaluation-benchmark.test.mjs'
      - 'tests/learning-benchmark.test.mjs'
      - 'tests/benchmark-evidence.test.mjs'
      - '.github/workflows/mel-eval-01-stable-benchmarks-ci.yml'
  push:
    branches:
      - 'roadmap/mel-eval-01-stable-benchmark-suites-20260925'

permissions:
  contents: read

jobs:
  stable-benchmarks-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
      - name: Evaluation syntax
        run: >
          node --check src/evaluation/stable-benchmark-suites.js &&
          node --check src/evaluation/benchmarks.js &&
          node --check src/evaluation/benchmark-evidence.js &&
          node --check src/evaluation/regression.js &&
          node --check src/capabilities/default-bus.js
      - name: Stable benchmark targeted tests
        run: >
          node --test
          tests/stable-benchmark-suites.test.mjs
          tests/evaluation-benchmark.test.mjs
          tests/learning-benchmark.test.mjs
          tests/benchmark-evidence.test.mjs
          tests/benchmark-null-score.test.mjs

  stable-benchmarks-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: stable-benchmarks-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Repository syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/mel-eval-01-stable-benchmarks-ci
      - name: Full test suite
        run: npm test
