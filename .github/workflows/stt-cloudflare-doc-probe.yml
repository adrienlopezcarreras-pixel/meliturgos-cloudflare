name: stt-cloudflare-doc-probe

on:
  push:
    branches:
      - fix/mini-clock-voice-companion-ui
    paths:
      - '.github/workflows/stt-cloudflare-doc-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download Cloudflare-documented speech sample
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3             https://raw.githubusercontent.com/craigsdennis/notebooks-cloudflare-workers-ai/main/assets/craig-rambling.mp3             -o /tmp/sample.mp3
          file /tmp/sample.mp3
          test -s /tmp/sample.mp3
      - name: Build both documented request shapes
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const bytes=fs.readFileSync('/tmp/sample.mp3');
          fs.writeFileSync('/tmp/base64.json',JSON.stringify({
            audio:bytes.toString('base64'),
            task:'transcribe',
            language:'en'
          }));
          fs.writeFileSync('/tmp/bytes.json',JSON.stringify({
            audio:Array.from(bytes)
          }));
          console.log(JSON.stringify({bytes:bytes.length,base64_json:fs.statSync('/tmp/base64.json').size,bytes_json:fs.statSync('/tmp/bytes.json').size}));
          NODE
      - name: Probe tutorial base64 form
        shell: bash
        run: |
          set +e
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/openai/whisper-large-v3-turbo"
          CODE="$(curl -sS --max-time 90 -o /tmp/base64-result.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             --data-binary @/tmp/base64.json             "$URL" || true)"
          echo "BASE64_HTTP=${CODE}"
          cat /tmp/base64-result.json
          echo
          echo "BASE64_HTTP=${CODE}" >> "$GITHUB_ENV"
      - name: Probe REST byte-array form
        shell: bash
        run: |
          set +e
          URL="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run/@cf/openai/whisper-large-v3-turbo"
          CODE="$(curl -sS --max-time 90 -o /tmp/bytes-result.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H "Content-Type: application/json"             --data-binary @/tmp/bytes.json             "$URL" || true)"
          echo "BYTES_HTTP=${CODE}"
          cat /tmp/bytes-result.json
          echo
          echo "BYTES_HTTP=${CODE}" >> "$GITHUB_ENV"
      - name: Require at least one documented shape to work
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          function read(p){try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}}
          const b64=read('/tmp/base64-result.json');
          const arr=read('/tmp/bytes-result.json');
          function text(d){return String(d?.result?.text ?? d?.result?.transcription_info?.text ?? d?.text ?? '').trim()}
          console.log(JSON.stringify({
            base64_ok:b64?.success===true,
            base64_text:text(b64).slice(0,120),
            bytes_ok:arr?.success===true,
            bytes_text:text(arr).slice(0,120)
          }));
          if(!text(b64) && !text(arr)) process.exit(1);
          NODE
