name: Conversation Sync Cursor CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/conversations/conversation-service.js'
      - 'tests/conversation-sync-composite-cursor.test.mjs'
      - 'tests/conversation-service.test.mjs'
      - '.github/workflows/conversation-sync-cursor-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/conversations/conversation-service.js'
      - 'tests/conversation-sync-composite-cursor.test.mjs'
      - '.github/workflows/conversation-sync-cursor-ci.yml'

permissions:
  contents: read

jobs:
  cursor-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Prove timestamp+ID cursor and legacy conversation contract
        run: node --test tests/conversation-sync-composite-cursor.test.mjs tests/conversation-service.test.mjs
