name: Companion sovereignty server safety
on:
  pull_request:
    paths:
      - 'src/portability/companion-sovereignty-command-bridge.js'
      - 'tests/gen2/companion-sovereignty-server-safety.test.mjs'
      - '.github/workflows/companion-sovereignty-server-safety-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion-sovereignty-server-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify relay safety contracts
        run: node --test tests/gen2/companion-sovereignty-server-safety.test.mjs
