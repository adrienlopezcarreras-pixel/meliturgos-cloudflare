name: Predeploy binder safety CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/predeploy-backup-sidecar-unique-name.test.mjs'
      - 'tests/predeploy-backup-binder.test.mjs'
      - '.github/workflows/predeploy-binder-safety-ci.yml'
      - '.github/workflows/deploy-cloudflare-release.yml'
      - 'release-tools/predeploy-backup-binder/worker.js'
      - 'src/evolution/autonomy-control.js'
      - 'src/evolution/release-launch-bootstrap.js'
      - 'src/evolution/autonomy-api.js'
      - 'tests/release-max-recovery.test.mjs'

permissions:
  contents: read

jobs:
  predeploy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify exact tested SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      # [ChatGPT-GPT6] Full dependency closure is needed: MAX and release tests
      # import the Mentor AST contract (acorn) via the real production runtime.
      # Keep the exact lockfile as the single source of truth for every CI job.
      - name: Install exact lockfile
        run: npm ci
      - name: Verify binder tests syntax
        run: |
          node --check tests/predeploy-backup-sidecar-unique-name.test.mjs
          node --check tests/predeploy-backup-binder.test.mjs
      - name: Verify fail-closed backup gates and Cloudflare 1042 propagation
        run: |
          node --test tests/predeploy-backup-sidecar-unique-name.test.mjs tests/predeploy-backup-binder.test.mjs

      - name: Verify cancellation recovery, owner pause and exact-SHA restore safety
        run: >-
          node --test tests/release-gen2-38-replay.test.mjs tests/release-max-recovery.test.mjs
          tests/autonomy-control.test.mjs tests/release-launch-bootstrap.test.mjs
          tests/release-predeploy-backup-reuse.test.mjs tests/release-shardvault-prep.test.mjs tests/autonomy-runtime-lease.test.mjs
          tests/release-outcome-ledger.test.mjs tests/release-outcome-reconcile.test.mjs
          tests/max-mode-self-knowledge.test.mjs tests/autonomy-activity-detail.test.mjs
      - name: Verify embedded release proof shell
        run: node scripts/check-release-proof-shell.mjs
