name: android-release-build

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Confirm signed Android release build"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

jobs:
  signed-release:
    if: ${{ github.event_name == 'push' || inputs.confirm_release == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Restrict manual releases to canonical release branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/release/mel-hardware-v0.1.0" ]]; then
            echo "Manual signed release must run from release/mel-hardware-v0.1.0" >&2
            exit 1
          fi

      - name: Require exact canonical release SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin release/mel-hardware-v0.1.0
          EXPECTED_SHA="$(git rev-parse origin/release/mel-hardware-v0.1.0)"
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Signed Android release refused: checked-out SHA $ACTUAL_SHA is not canonical release $EXPECTED_SHA" >&2
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate protected signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mel-release.jks"
          test -s "$RUNNER_TEMP/mel-release.jks"

      - name: Validate Android source and API contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/android-companion-source-contract.test.mjs tests/android-companion-api.test.mjs

      - name: Build signed release APK
        working-directory: android-companion
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mel-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/MEL-Android-release.apk
          sha256sum dist/MEL-Android-release.apk | tee dist/MEL-Android-release.apk.sha256

      - name: Verify release signature and package
        working-directory: android-companion
        shell: bash
        run: |
          set -euo pipefail
          APK="dist/MEL-Android-release.apk"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dist/apk-signature.txt
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dist/apk-badging.txt
          grep -q "package: name='fr.veriteinterdite.mel'" dist/apk-badging.txt
          grep -q "launchable-activity:" dist/apk-badging.txt

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mel-release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL-Android-release-${{ github.sha }}
          path: |
            android-companion/dist/MEL-Android-release.apk
            android-companion/dist/MEL-Android-release.apk.sha256
            android-companion/dist/apk-signature.txt
            android-companion/dist/apk-badging.txt
          if-no-files-found: error
          retention-days: 30
