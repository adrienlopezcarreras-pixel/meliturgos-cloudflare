name: one-shot-promote-f333bbb-prod

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - .github/workflows/one-shot-promote-f333bbb-prod.yml

permissions:
  contents: read

concurrency:
  group: meliturgos-cloudflare-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: f333bbb70a5828b5ca7d0a8c19e8e637c63160b4
      TARGET_BRANCH: candidate/mel-clean-autonomy
    steps:
      - name: Checkout exact validated SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f333bbb70a5828b5ca7d0a8c19e8e637c63160b4

      - name: Verify exact target on canonical local branch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git switch -c "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"
          echo "Promoting validated preview SHA ${TARGET_SHA} on ${TARGET_BRANCH}"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Syntax gate
        run: npm run check

      - name: Test gate
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "${RUNNER_TEMP}/prod-test.log"

      - name: Upload test diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prod-test-diagnostic-${{ github.run_attempt }}-${{ github.run_id }}
          path: ${{ runner.temp }}/prod-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Deploy exact validated SHA to production
        shell: bash
        run: |
          npx wrangler deploy \
            --define "MEL_DEPLOYED_GIT_SHA:'${TARGET_SHA}'" \
            --define "MEL_DEPLOYED_GIT_BRANCH:'${TARGET_BRANCH}'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production HTTP
        shell: bash
        run: |
          set +e
          PROD_STATUS=$(curl --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
            --output production-root.html \
            --write-out '%{http_code}' \
            https://meliturgos.adrien-lopezcarreras.workers.dev)
          CURL_STATUS=$?
          test "$CURL_STATUS" -eq 0 || exit "$CURL_STATUS"
          case "$PROD_STATUS" in
            2??|3??|401) ;;
            *) echo "Unexpected production HTTP status: $PROD_STATUS"; exit 22 ;;
          esac
          echo "Production HTTP verification passed with status ${PROD_STATUS}."
