name: ChatGPT Collector CI

on:
  push:
    paths:
      - "browser-companion/chatgpt-collector/**"
      - "tests/chatgpt-collector-integrity.test.mjs"
      - ".github/workflows/chatgpt-collector-ci.yml"
  pull_request:
    paths:
      - "browser-companion/chatgpt-collector/**"
      - "tests/chatgpt-collector-integrity.test.mjs"
      - ".github/workflows/chatgpt-collector-ci.yml"
  workflow_dispatch:

jobs:
  collector-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run collector integrity tests
        run: node --test tests/chatgpt-collector-integrity.test.mjs
      - name: Package Collector 0.6.0
        run: |
          cd browser-companion/chatgpt-collector
          zip -r ../../MEL_ChatGPT_Collector_0.6.0.zip .
      - name: Upload Collector archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MEL_ChatGPT_Collector_0.6.0
          path: MEL_ChatGPT_Collector_0.6.0.zip
          if-no-files-found: error
          retention-days: 7
