name: mel-pr-council-review

# Independent code review ONLY. Never writes source, never deploys or promotes.
# Available from main after this workflow and the matching Worker handler are
# safely released through the normal, independently approved release process.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing same-repository PR to examine
        type: string
        required: true
      expected_sha:
        description: Exact immutable 40-character PR head to review
        type: string
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: mel-pr-council-review-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Bind Council to live open PR, main base and exact head SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]{1,6}$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          META="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state,.base.ref,.head.sha,.head.repo.full_name] | @tsv')"
          IFS=$'\t' read -r STATE TARGET HEAD REPO <<< "$META"
          test "$STATE" = "open"
          test "$TARGET" = "main"
          test "$REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD" = "$EXPECTED_SHA"
          git fetch origin "refs/pull/$PR_NUMBER/head"
          FETCHED="$(git rev-parse FETCH_HEAD)"
          test "$FETCHED" = "$HEAD"
          git fetch origin main
          MAIN="$(git rev-parse FETCH_HEAD)"
          # The Council runner itself must first reach main. The candidate
          # under review may therefore still descend from an earlier main.
          # Review ONLY its exact changes since the common ancestor, and
          # reject overlapping main changes instead of reviewing a stale merge.
          BASE="$(git merge-base "$MAIN" "$HEAD")"
          test -n "$BASE"
          if [ "$BASE" != "$MAIN" ]; then
            OVERLAP="$(comm -12 <(git diff --name-only "$BASE" "$MAIN" | LC_ALL=C sort) <(git diff --name-only "$BASE" "$HEAD" | LC_ALL=C sort))"
            if [ -n "$OVERLAP" ]; then
              echo "::error::COUNCIL_PR_MAIN_HEAD_PATH_CONFLICT"
              printf '%s\n' "$OVERLAP"
              exit 1
            fi
          fi
          echo "MEL_COUNCIL_HEAD_SHA=$HEAD" >> "$GITHUB_ENV"
          echo "MEL_COUNCIL_BASE_SHA=$BASE" >> "$GITHUB_ENV"
          echo "MEL_COUNCIL_MAIN_SHA=$MAIN" >> "$GITHUB_ENV"
          echo "MEL_COUNCIL_PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "Verified immutable PR head $HEAD, review base $BASE and current main $MAIN"
      - name: Construct complete immutable Council diff
        shell: bash
        run: |
          set -euo pipefail
          git diff "$MEL_COUNCIL_BASE_SHA" "$MEL_COUNCIL_HEAD_SHA" -- . ':(exclude)bridge-apply-result.json' > council.diff
          test -s council.diff
          git log --format=%s "$MEL_COUNCIL_BASE_SHA..$MEL_COUNCIL_HEAD_SHA" > council.log
          node scripts/prepare-council-review-batches.mjs council.diff council-review-manifest.json
      - name: Full multi-batch independent Council verdict
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-council-batch-review.mjs council.diff council.log > council-verdict.json
          node - <<'NODE'
          const fs=require('node:fs');
          const result=JSON.parse(fs.readFileSync('council-verdict.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('council-review-manifest.json','utf8'));
          if(result.decision!=='APPROVED'||result.complete_review!==true
            ||result.head!==process.env.MEL_COUNCIL_HEAD_SHA
            ||result.root_sha256!==manifest.sha256
            ||result.reviewed_file_count!==manifest.file_count
            ||result.reviewed_batch_count!==manifest.batch_count)
            throw Error('COUNCIL_PR_FINAL_VERDICT_NOT_VERIFIED');
          NODE
      - name: Recheck immutable head and main after all independent votes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$MEL_COUNCIL_PR_NUMBER" --jq '.head.sha')"
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$CURRENT_HEAD" != "$MEL_COUNCIL_HEAD_SHA" ] || [ "$CURRENT_MAIN" != "$MEL_COUNCIL_MAIN_SHA" ]; then
            echo "::error::COUNCIL_PR_HEAD_OR_BASE_CHANGED_DURING_REVIEW"
            rm -f council-verdict.json
            exit 1
          fi
      - name: Preserve content-free independent review receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: council-pr-review-receipt
          path: |
            council-review-manifest.json
            council-verdict.json
          if-no-files-found: warn
          retention-days: 14
