name: mel-pr-council-review

on:
  # Review the Contingence release candidate automatically after each
  # relevant completed CI workflow; never run untrusted PR code.
  workflow_run:
    workflows:
      - gen2-17-multi-cycle-ci
      - MEL-RES-05 encrypted backup CI
      - Professor UI audit CI
      - MEL Core durable work CI
      - mel-conn-01-public-chat-ci
      - shardvault-ci
      - MEL external contingency monitor
      - mel-work-free-validation
      - hardware-lab-ci
      - lora-runtime-pipeline-ci
      - mel-self-audit-supervisor-ci
      - cloudflare-api-relay
    types: [completed]
  # Recover a CI-complete PR that predates installation of this workflow on main.
  schedule:
    # Even-hour historical audit for merged #3094.
    - cron: '47 */2 * * *'
    # Odd-hour maintenance review for open #3103; keep the audit slot separate.
    - cron: '17 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing same-repository PR to examine
        type: string
        required: true
      expected_sha:
        description: Exact immutable 40-character PR head to review
        type: string
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  id-token: write

concurrency:
  group: mel-pr-council-review-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || '3094' }}
  cancel-in-progress: false

jobs:
  discover:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      head: ${{ steps.resolve.outputs.head }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve the pending Contingence PR from GitHub metadata
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          case "$SCHEDULE_CRON" in
            '47 */2 * * *') SELECTED_PR=3094 ;;
            '17 1-23/2 * * *') SELECTED_PR=3103 ;;
            *) echo "::error::COUNCIL_UNRECOGNIZED_SCHEDULE"; exit 1 ;;
          esac
          META="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$SELECTED_PR" --jq '[.state,.base.ref,.head.sha,.head.repo.full_name,(.merged_at // ""),(.merge_commit_sha // "")] | @tsv')"
          IFS=$'\t' read -r STATE BASE HEAD REPO MERGED_AT MERGE_SHA <<< "$META"
          if [ "$STATE" = "open" ]; then
            echo "Council pre-merge review candidate is open."
          elif [ "$STATE" = "closed" ] && [ -n "$MERGED_AT" ]; then
            [[ "$MERGE_SHA" =~ ^[a-f0-9]{40}$ ]]
            if [ "$SELECTED_PR" != 3094 ]; then
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "Maintenance PR merged; do not substitute historical release audit."
              exit 0
            fi
            echo "::notice title=Council post-merge audit::PR #3094 already merged. Audit historic diff, NEVER issue retroactive deployment approval."
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "No eligible open/merged Contingence PR."
            exit 0
          fi
          test "$BASE" = "main"
          test "$REPO" = "$GITHUB_REPOSITORY"
          [[ "$HEAD" =~ ^[a-f0-9]{40}$ ]]
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
          echo "pr_number=$SELECTED_PR" >> "$GITHUB_OUTPUT"
          echo "Read-only Council candidate pinned to PR #$SELECTED_PR head: $HEAD"
  preflight:
    needs: [discover]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
       needs.discover.result == 'success' && needs.discover.outputs.eligible == 'true') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       (github.event.workflow_run.head_branch == 'integration/max-contingency-release-candidate' ||
        github.event.workflow_run.head_branch == 'fix/council-historical-audit-main-advance-20261104' ||
        github.event.workflow_run.head_branch == 'fix/max-audit02-manual-recovery-20261104' ||
        github.event.workflow_run.head_branch == 'fix/max-owner-stop-pauses-runtime-20261104') &&
       github.event.workflow_run.pull_requests[0].number != null))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.ci_gate.outputs.ready }}
    steps:
      - name: Bind exact candidate for a read-only CI prerequisite check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || needs.discover.outputs.pr_number }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha || needs.discover.outputs.head }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]{1,6}$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          META="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state,.base.ref,.head.sha,.head.repo.full_name,(.merged_at // ""),(.merge_commit_sha // "")] | @tsv')"
          IFS=$'\t' read -r STATE TARGET HEAD REPO MERGED_AT MERGE_SHA <<< "$META"
          test "$TARGET" = "main"
          test "$REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD" = "$EXPECTED_SHA"
          if [ "$STATE" = "open" ]; then
            echo "Council pre-merge CI preflight."
          elif [ "$STATE" = "closed" ] && [ -n "$MERGED_AT" ]; then
            [[ "$MERGE_SHA" =~ ^[a-f0-9]{40}$ ]]
            echo "::notice title=Council post-merge audit::Review only; never grant retroactive merge or deployment approval."
          else
            echo "::error::COUNCIL_PR_NOT_OPEN_OR_MERGED"
            exit 1
          fi
          case "$PR_NUMBER" in
            3094) test "$STATE" = "closed" || test "$STATE" = "open" ;;
            3103) test "$STATE" = "open" ;;
            3112|3113) test "$STATE" = "open" ;;
            *) echo "::error::COUNCIL_PR_NOT_ALLOWLISTED"; exit 1 ;;
          esac
          echo "MEL_COUNCIL_PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "MEL_COUNCIL_HEAD_SHA=$HEAD" >> "$GITHUB_ENV"
      - name: Require every exact-SHA CI gate before automatic Council review
        id: ci_gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$MEL_COUNCIL_HEAD_SHA/check-runs?per_page=100" > council-checks.json
          node - <<'NODE'
          const fs=require('node:fs');
          const response=JSON.parse(fs.readFileSync('council-checks.json','utf8'));
          const checks=response.check_runs||[];
          if(!Number.isSafeInteger(response.total_count)||response.total_count!==checks.length)
            throw Error('COUNCIL_CI_INCOMPLETE_CHECK_LIST');
          const latest=new Map();
          for(const row of checks){
            const current=latest.get(row.name);
            if(!current||Number(row.id)>Number(current.id))latest.set(row.name,row);
          }
          const releaseMandatory=[
            'gen2-17-targeted','gen2-17-full-suite','monitor-contract',
            'encrypted-backup','professor-audit','shardvault-targeted',
            'public-chat-targeted','public-chat-full-suite','durable-work',
            'node-validation','lora-runtime-contract','self-audit-contract',
            'MEL WORK free validation (no Vercel, no deployment)',
          ];
          // Maintenance PR #3103 changes only Council review wiring and tests.
          // Never relax the 13-gate release profile for #3094.
          const maintenanceMandatory=['gen2-17-targeted','gen2-17-full-suite','encrypted-backup'];
          // MAX audit repair: explicit PR allowlist and exact per-PR CI profile.
          // Never reduce #3094's full 13-gate release profile or #3103's gates.
          const audit02Mandatory=['test','self-audit-contract','contract','max-cloud-scheduler'];
          const ownerStopMandatory=[
            'gen2-17-targeted','gen2-17-full-suite','mentor-fallback-isolated',
            'predeploy-contract','targeted','encrypted-backup',
            'evolution-ledger-targeted','evolution-ledger-full-suite','max-cloud-scheduler',
          ];
          const prNumber=process.env.MEL_COUNCIL_PR_NUMBER;
          if(!['3094','3103','3112','3113'].includes(prNumber))throw Error('COUNCIL_PR_NOT_ALLOWLISTED');
          const mandatory=prNumber==='3094'?releaseMandatory
            :prNumber==='3103'?maintenanceMandatory
            :prNumber==='3112'?audit02Mandatory:ownerStopMandatory;
          const pending=mandatory.filter(name=>latest.get(name)?.conclusion!=='success');
          const unfinished=[...latest.values()].filter(row=>!['success','skipped'].includes(row.conclusion));
          const ready=pending.length===0&&unfinished.length===0;
          const fsOut=process.env.GITHUB_OUTPUT;
          if(!fsOut)throw Error('COUNCIL_CI_OUTPUT_REQUIRED');
          fs.appendFileSync(fsOut,'ready='+String(ready)+'\n');
          if(!ready){
            console.log('::notice title=Council pending CI::' + 'COUNCIL_CI_REQUIRED_CHECK_NOT_GREEN='
              +pending.join(',')+'; COUNCIL_CI_NOT_ALL_COMPLETE_AND_GREEN='
              +unfinished.map(row=>row.name).join(','));
          }else console.log('COUNCIL_CI_ALL_GREEN_FOR_EXACT_SHA');
          NODE

  review:
    needs: [discover, preflight]
    # The review job cannot appear green without an actual independent vote.
    # Pending CI produces a successful preflight plus SKIPPED review, not
    # an apparent Council approval.
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Bind Council to live open PR, main base and exact head SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || needs.discover.outputs.pr_number }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.expected_sha || needs.discover.outputs.head }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]{1,6}$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          META="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state,.base.ref,.head.sha,.head.repo.full_name,(.merged_at // ""),(.merge_commit_sha // "")] | @tsv')"
          IFS=$'\t' read -r STATE TARGET HEAD REPO MERGED_AT MERGE_SHA <<< "$META"
          test "$TARGET" = "main"
          test "$REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD" = "$EXPECTED_SHA"
          git fetch origin "refs/pull/$PR_NUMBER/head"
          FETCHED="$(git rev-parse FETCH_HEAD)"
          test "$FETCHED" = "$HEAD"
          git fetch origin main
          MAIN="$(git rev-parse FETCH_HEAD)"
          if [ "$STATE" = "open" ]; then
            REVIEW_KIND="PRE_MERGE_REVIEW"
            BASE="$(git merge-base "$MAIN" "$HEAD")"
            test -n "$BASE"
            if [ "$BASE" != "$MAIN" ]; then
              OVERLAP="$(comm -12 <(git diff --name-only "$BASE" "$MAIN" | LC_ALL=C sort) <(git diff --name-only "$BASE" "$HEAD" | LC_ALL=C sort))"
              if [ -n "$OVERLAP" ]; then
                echo "::error::COUNCIL_PR_MAIN_HEAD_PATH_CONFLICT"
                printf '%s\n' "$OVERLAP"
                exit 1
              fi
            fi
          elif [ "$STATE" = "closed" ] && [ -n "$MERGED_AT" ]; then
            # GitHub merge commits preserve the complete original PR diff as
            # FIRST_PARENT..SECOND_PARENT. Never use merge-base(main,head):
            # after a merge that would be HEAD and silently yield EMPTY DIFF.
            REVIEW_KIND="POST_MERGE_AUDIT_ONLY"
            [[ "$MERGE_SHA" =~ ^[a-f0-9]{40}$ ]]
            git merge-base --is-ancestor "$MERGE_SHA" "$MAIN"
            read -ra PARENTS <<< "$(git rev-list --parents -n 1 "$MERGE_SHA")"
            test "${#PARENTS[@]}" -eq 3
            test "${PARENTS[0]}" = "$MERGE_SHA"
            test "${PARENTS[2]}" = "$HEAD"
            BASE="${PARENTS[1]}"
            echo "::notice title=Council historical audit::Review immutable merge parents; no retroactive deployment authorization."
          else
            echo "::error::COUNCIL_PR_NOT_OPEN_OR_MERGED"
            exit 1
          fi
          echo "MEL_COUNCIL_REVIEW_KIND=$REVIEW_KIND" >> "$GITHUB_ENV"
          echo "MEL_COUNCIL_MERGE_SHA=${MERGE_SHA:-}" >> "$GITHUB_ENV"
          echo "MEL_COUNCIL_HEAD_SHA=$HEAD" >> "$GITHUB_ENV"
          echo "MEL_COUNCIL_BASE_SHA=$BASE" >> "$GITHUB_ENV"
          echo "MEL_COUNCIL_MAIN_SHA=$MAIN" >> "$GITHUB_ENV"
          echo "MEL_COUNCIL_PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "Verified immutable $REVIEW_KIND diff $BASE..$HEAD for PR #$PR_NUMBER (current main $MAIN)"
      - name: Construct complete immutable Council diff
        shell: bash
        run: |
          set -euo pipefail
          git diff "$MEL_COUNCIL_BASE_SHA" "$MEL_COUNCIL_HEAD_SHA" -- . ':(exclude)bridge-apply-result.json' > council.diff
          test -s council.diff
          git log --format=%s "$MEL_COUNCIL_BASE_SHA..$MEL_COUNCIL_HEAD_SHA" > council.log
          node scripts/prepare-council-review-batches.mjs council.diff council-review-manifest.json
      - name: Full multi-batch independent Council verdict
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-council-batch-review.mjs council.diff council.log > council-verdict.json
          node - <<'NODE'
          const fs=require('node:fs');
          const result=JSON.parse(fs.readFileSync('council-verdict.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('council-review-manifest.json','utf8'));
          const auditOnly=process.env.MEL_COUNCIL_REVIEW_KIND==='POST_MERGE_AUDIT_ONLY';
          const expected=auditOnly?'POST_MERGE_AUDIT_APPROVED':'APPROVED';
          if(result.decision!==expected||result.complete_review!==true
            ||result.audit_only!==auditOnly||result.release_authorized!==false
            ||result.head!==process.env.MEL_COUNCIL_HEAD_SHA
            ||result.root_sha256!==manifest.sha256
            ||result.reviewed_file_count!==manifest.file_count
            ||result.reviewed_batch_count!==manifest.batch_count)
            throw Error('COUNCIL_PR_FINAL_VERDICT_NOT_VERIFIED');
          NODE
      - name: Recheck immutable head and main after all independent votes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$MEL_COUNCIL_PR_NUMBER" --jq '.head.sha')"
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [ "$CURRENT_HEAD" != "$MEL_COUNCIL_HEAD_SHA" ]; then
            echo "::error::COUNCIL_PR_HEAD_CHANGED_DURING_REVIEW"
            rm -f council-verdict.json
            exit 1
          fi
          if [ "$MEL_COUNCIL_REVIEW_KIND" = "POST_MERGE_AUDIT_ONLY" ]; then
            # The audited merge and its parents are immutable; main may safely advance
            # while independent historical votes are being collected.
            # Require that the original merge still belongs to the live main history.
            git fetch origin main
            LIVE_MAIN="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$MEL_COUNCIL_MERGE_SHA" "$LIVE_MAIN"; then
              echo "::error::COUNCIL_HISTORICAL_MERGE_NO_LONGER_IN_MAIN"
              rm -f council-verdict.json
              exit 1
            fi
          elif [ "$CURRENT_MAIN" != "$MEL_COUNCIL_MAIN_SHA" ]; then
            echo "::error::COUNCIL_PR_BASE_CHANGED_DURING_REVIEW"
            rm -f council-verdict.json
            exit 1
          fi
      - name: Record exact-SHA audit provenance without granting release authorization
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const verdict=JSON.parse(fs.readFileSync('council-verdict.json','utf8'));
          const mode=process.env.MEL_COUNCIL_REVIEW_KIND;
          if(!['PRE_MERGE_REVIEW','POST_MERGE_AUDIT_ONLY'].includes(mode))
            throw Error('COUNCIL_REVIEW_KIND_REQUIRED');
          const expected=mode==='POST_MERGE_AUDIT_ONLY'?'POST_MERGE_AUDIT_APPROVED':'APPROVED';
          if(verdict.decision!==expected||verdict.complete_review!==true
            ||verdict.audit_only!==(mode==='POST_MERGE_AUDIT_ONLY')
            ||verdict.release_authorized!==false)
            throw Error('COUNCIL_AUDIT_VERDICT_NOT_APPROVED');
          const receipt={
            schema:'mel.council.pr-review-provenance/v1',
            mode,
            pr_number:Number(process.env.MEL_COUNCIL_PR_NUMBER),
            reviewed_head_sha:process.env.MEL_COUNCIL_HEAD_SHA,
            review_base_sha:process.env.MEL_COUNCIL_BASE_SHA,
            merge_sha:mode==='POST_MERGE_AUDIT_ONLY'?process.env.MEL_COUNCIL_MERGE_SHA:null,
            diff_sha256:verdict.root_sha256,
            independently_reviewed: true,
            retroactive_premerge_approval:false,
            release_authorized:false,
          };
          fs.writeFileSync('council-review-provenance.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
      - name: Preserve content-free independent review receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: council-pr-review-receipt
          path: |
            council-review-manifest.json
            council-verdict.json
            council-review-provenance.json
          if-no-files-found: warn
          retention-days: 14
