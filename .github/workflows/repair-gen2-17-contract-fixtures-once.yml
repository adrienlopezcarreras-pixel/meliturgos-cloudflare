name: repair-gen2-17-contract-fixtures-once

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - scripts/repair-gen2-17-contract-fixtures-once.mjs
      - scripts/repair-gen2-17-contract-fixtures-pass2.mjs
      - .github/workflows/repair-gen2-17-contract-fixtures-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/mel-clean-autonomy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Apply strict contract fixture repair
        run: |
          node scripts/repair-gen2-17-contract-fixtures-once.mjs
          node scripts/repair-gen2-17-contract-fixtures-pass2.mjs
      - name: Run formerly failing GEN2-17 tests
        run: >-
          node --test
          tests/autonomous-work-loop.test.mjs
          tests/autonomy-runtime.test.mjs
          tests/council-api.test.mjs
          tests/development-coordinator.test.mjs
          tests/github-reply-reconciler.test.mjs
          tests/public-teacher-api.test.mjs
          tests/work-dag-resume.test.mjs
      - name: Commit repaired fixtures
        run: |
          git config user.name "mel-autonomy"
          git config user.email "mel-autonomy@users.noreply.github.com"
          git add tests/autonomous-work-loop.test.mjs tests/autonomy-runtime.test.mjs tests/council-api.test.mjs tests/development-coordinator.test.mjs tests/github-reply-reconciler.test.mjs tests/public-teacher-api.test.mjs tests/work-dag-resume.test.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo "No fixture changes to commit"; exit 1; }
          git commit -m "test(gen2-17): align fixtures with exact SHA teacher contract"
          git push origin HEAD:candidate/mel-clean-autonomy
