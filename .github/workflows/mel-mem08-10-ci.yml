name: mel-mem08-10-ci

on:
  push:
    branches:
      - 'roadmap/mel-mem08-10-20260921'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: MEL-MEM-08-10 proof suite
        run: node --test tests/memory/provenance-recall-recovery.test.mjs tests/memory/unified-operational-retrieval.test.mjs tests/memory-compat-capability-bus.test.mjs
