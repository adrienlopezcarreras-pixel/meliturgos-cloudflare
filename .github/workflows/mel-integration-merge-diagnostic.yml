name: MEL integration merge conflict diagnosis
on:
  push:
    branches:
      - integration/mel-main-candidate-20261013
    paths:
      - '.github/workflows/mel-integration-merge-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Attempt isolated non-committing merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "integration_sha=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "MEL merge diagnostic"
          git config user.email "mel-merge-diagnostic@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/main > merge-output.txt 2>&1
          code=$?
          set -e
          printf 'merge_exit_code=%s\n' "$code" > merge-result.txt
          git ls-files -u | cut -f2 | sort -u > merge-unmerged-paths.txt
          git status --short > merge-status.txt
          cat merge-output.txt >> merge-result.txt
          echo "=== MERGE OUTPUT ==="
          cat merge-output.txt
          echo "=== UNMERGED PATHS ==="
          cat merge-unmerged-paths.txt
          echo "=== END DIAGNOSIS ==="
          printf '\n## Merge diagnosis\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Merge exit code: %s\n\n' "$code" >> "$GITHUB_STEP_SUMMARY"
          printf '### Unmerged paths\n' >> "$GITHUB_STEP_SUMMARY"
          if [ -s merge-unmerged-paths.txt ]; then
            sed 's/^/- /' merge-unmerged-paths.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'None' >> "$GITHUB_STEP_SUMMARY"
          fi
          # Preserve full, bounded conflict context for manual resolution.
          git diff --cc -- .github/workflows/deploy-candidate-preview.yml src/continuity/shardvault-runtime.js tests/release-predeploy-backup-reuse.test.mjs tests/shardvault-github-code-mirror.test.mjs > merge-conflict-hunks.diff || true
          echo '=== CONFLICT HUNKS (first 360 lines) ==='
          sed -n '1,360p' merge-conflict-hunks.diff
          echo '=== CONFLICT HUNK COUNTS ==='
          for p in .github/workflows/deploy-candidate-preview.yml src/continuity/shardvault-runtime.js tests/release-predeploy-backup-reuse.test.mjs tests/shardvault-github-code-mirror.test.mjs; do
            printf '%s: ' "$p"; grep -c '^<<<<<<<' "$p" || true
          done
          git merge --abort >/dev/null 2>&1 || true
          # Read-only diagnosis: no commit, push, secret access, or production deployment.
      - uses: actions/upload-artifact@v4
        with:
          name: mel-integration-merge-diagnostic
          path: |
            merge-result.txt
            merge-unmerged-paths.txt
            merge-status.txt
            merge-conflict-hunks.diff
