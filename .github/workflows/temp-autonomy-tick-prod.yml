name: temp-autonomy-tick-prod

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - '.github/workflows/temp-autonomy-tick-prod.yml'

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      MEL_OPERATOR_PASSWORD: ${{ secrets.MELITURGOS_PASSWORD }}
    steps:
      - name: Execute one authenticated production autonomy tick
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://meliturgos.adrien-lopezcarreras.workers.dev"
          test -n "${MEL_OPERATOR_PASSWORD:-}" || { echo "MELITURGOS_PASSWORD_SECRET_MISSING"; exit 42; }
          echo "::add-mask::${MEL_OPERATOR_PASSWORD}"
          curl --silent --show-error --fail --max-time 30             "${BASE_URL}/api/gen2/autonomy/control"             -o control.json
          node - <<'NODE'
          const d=require('./control.json');
          console.log(JSON.stringify({
            paused:d?.paused===true,
            max_autonomy:d?.max_autonomy===true,
            owner_override:d?.owner_override===true,
            status:d?.status||null
          }));
          NODE
          curl --silent --show-error --fail --max-time 180             --header "Authorization: Bearer ${MEL_OPERATOR_PASSWORD}"             --header "content-type: application/json"             --request POST             "${BASE_URL}/api/gen2/autonomy/tick"             -o tick.json
          node - <<'NODE'
          const d=require('./tick.json');
          const j=d?.state?.current_job||d?.state?.active_job||d?.state?.current||null;
          console.log(JSON.stringify({
            ok:d?.ok===true,
            tick_status:d?.tick?.status||null,
            tick_advanced:d?.tick?.advanced===true,
            owner_max_applied:d?.tick?.owner_max_applied===true,
            owner_max_error:d?.tick?.owner_max_error||null,
            teacher_status:d?.tick?.teacher?.status||d?.tick?.internal_teacher_mirror?.status||null,
            job:j?{id:j.id||null,status:j.status||null,roadmap_id:j.roadmap_id||null,teacher:j.teacher||null,completion:j.completion||null}:null
          },null,2));
          NODE
