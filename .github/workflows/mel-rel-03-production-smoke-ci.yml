name: mel-rel-03 production smoke CI

on:
  push:
    branches:
      - 'roadmap/mel-rel-03-production-smokes-20260922'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Targeted release smoke tests
        run: |
          node --test             tests/operator-auth.test.mjs             tests/release-production-smoke-routes.test.mjs             tests/deployment-path-unicity.test.mjs             tests/release-code-chat-smoke.test.mjs
      - name: Full suite on candidate alias
        run: |
          git checkout -B candidate/release-ci-head "$GITHUB_SHA"
          npm test
