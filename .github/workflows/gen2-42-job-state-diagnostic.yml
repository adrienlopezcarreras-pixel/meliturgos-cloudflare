name: gen2-42-job-state-diagnostic
# refresh_seq: 19

on:
  push:
    branches:
      - diag/gen2-42-job-state-20260929
    paths:
      - .github/workflows/gen2-42-job-state-diagnostic.yml

permissions:
  contents: read

jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read live Dev Bridge heartbeat and approved jobs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DIAG_NAME="mel-gen2-42-diag"
          DIAG_CONFIG="release-tools/predeploy-backup-refresh/wrangler.diag.jsonc"
          DIAG_URL="https://${DIAG_NAME}.adrien-lopezcarreras.workers.dev"
          DIAG_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${DIAG_TOKEN}"

          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('release-tools/predeploy-backup-refresh/wrangler.jsonc','utf8'));d.name='mel-gen2-42-diag';fs.writeFileSync('release-tools/predeploy-backup-refresh/wrangler.diag.jsonc',JSON.stringify(d,null,2));"

          cleanup() {
            set +e
            curl --silent --show-error --max-time 30 --request DELETE               --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${DIAG_NAME}"               >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx wrangler deploy --config "${DIAG_CONFIG}" >/tmp/diag-deploy.log
          printf '%s' "${DIAG_TOKEN}" | npx wrangler secret put MEL_PREDEPLOY_BACKUP_REFRESH_TOKEN --config "${DIAG_CONFIG}" >/tmp/diag-secret.log

          READY=0
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --max-time 30               --header "x-mel-predeploy-backup-refresh: ${DIAG_TOKEN}"               --output /tmp/tables.json               --write-out '%{http_code}'               "${DIAG_URL}/d1/tables" || true)"
            if [ "${code}" = "200" ]; then READY=1; break; fi
            sleep 2
          done
          test "${READY}" = "1"

          DIAG_URL="${DIAG_URL}" DIAG_TOKEN="${DIAG_TOKEN}" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=process.env.DIAG_URL;
          const token=process.env.DIAG_TOKEN;
          const headers={'x-mel-predeploy-backup-refresh':token};

          async function getJson(url){
            let last='';
            for(let attempt=1;attempt<=8;attempt++){
              const r=await fetch(url,{headers,cache:'no-store'});
              const text=await r.text();
              if(r.ok) return JSON.parse(text);
              last='HTTP_'+r.status+':'+text.slice(0,300);
              if(![401,500,503].includes(r.status)) break;
              await new Promise(resolve=>setTimeout(resolve,1500));
            }
            throw new Error(last||'D1_DIAG_FETCH_FAILED');
          }
          async function table(name){
            const rows=[];
            for(let offset=0;offset<=10000;offset+=100){
              const page=await getJson(base+'/d1/rows?table='+encodeURIComponent(name)+'&limit=100&offset='+offset);
              rows.push(...(Array.isArray(page.rows)?page.rows:[]));
              if(page.has_more!==true) break;
            }
            return rows;
          }
          const parse=v=>{try{const x=typeof v==='string'&&v?JSON.parse(v):v;return x&&typeof x==='object'?x:{};}catch{return {};}};
          const now=Date.now();
          const stateRows=await table('dev_bridge_state');
          const jobs=await table('dev_jobs');

          const bridges=stateRows.map(r=>({
            bridge_id:r.bridge_id,
            status:r.status,
            last_seen:Number(r.last_seen||0),
            age_ms:Math.max(0,now-Number(r.last_seen||0)),
            online_60s:(now-Number(r.last_seen||0))<60000
          })).sort((a,b)=>String(a.bridge_id).localeCompare(String(b.bridge_id)));

          const summarize=r=>{
            const result=parse(r.result_json);
            return {
              id:r.id,status:r.status,requested_by:r.requested_by,
              goal:String(r.goal||'').slice(0,220),updated_at:Number(r.updated_at||0),
              error:r.error?String(r.error).slice(0,240):null,
              teacher_status:result?.teacher_bridge?.status||null,
              teacher_verdict:result?.teacher_bridge?.review?.verdict||null,
              owner_override:result?.teacher_bridge?.review?.owner_override===true,
              implementation_status:result?.implementation_proposal?.status||null,
              bridge_preparation_status:result?.bridge_preparation?.status||null,
              candidate_branch:result?.bridge_preparation?.candidate_branch||null,
              candidate_sha:result?.bridge_preparation?.candidate_sha||null,
              bridge_result_status:result?.bridge_result?.status||result?.status||null,
              needs_repair:result?.bridge_result?.needs_repair===true||result?.needs_repair===true,
              runtime_retry_attempts:Number(result?.runtime_retry_attempts||0),
              runtime_retry_last_error:result?.runtime_retry_last_error||null,
              autonomy_completion:result?.autonomy_completion||null
            };
          };
          const approved=jobs.filter(r=>String(r.status||'').toUpperCase()==='TEACHER_APPROVED').map(summarize).sort((a,b)=>b.updated_at-a.updated_at);
          const target=jobs.filter(r=>String(r.id||'')==='mel-autonomy-mel-ui-06-1').map(summarize);
          const status_counts={};
          for(const r of jobs){const s=String(r.status||'UNKNOWN').toUpperCase();status_counts[s]=(status_counts[s]||0)+1;}

          const out={generated_at:new Date(now).toISOString(),bridges,target_jobs:target,approved_jobs:approved,status_counts};
          fs.writeFileSync('bridge-live-audit.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE

          cleanup
          trap - EXIT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-live-audit-${{ github.run_id }}
          path: bridge-live-audit.json
          if-no-files-found: error
          retention-days: 3
