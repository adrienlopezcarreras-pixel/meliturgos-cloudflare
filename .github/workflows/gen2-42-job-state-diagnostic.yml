name: gen2-42-job-state-diagnostic

on:
  push:
    branches:
      - diag/gen2-42-job-state-20260929
    paths:
      - .github/workflows/gen2-42-job-state-diagnostic.yml

permissions:
  contents: read

jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read bridge heartbeat and approved jobs from production D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json --command "SELECT bridge_id,last_seen,status,metadata_json FROM dev_bridge_state ORDER BY bridge_id" > bridge-state.raw.json
          npx wrangler d1 execute DB --remote --json --command "SELECT id,status,requested_by,goal,updated_at,result_json FROM dev_jobs WHERE status='TEACHER_APPROVED' ORDER BY updated_at DESC LIMIT 20" > approved-jobs.raw.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = raw => {
            const d=JSON.parse(fs.readFileSync(raw,'utf8'));
            const parts=Array.isArray(d)?d:[d];
            return parts.flatMap(x=>Array.isArray(x?.results)?x.results:[]);
          };
          const parse=v=>{try{const x=typeof v==='string'&&v?JSON.parse(v):v;return x&&typeof x==='object'?x:{};}catch{return {};}};
          const now=Date.now();
          const bridges=rows('bridge-state.raw.json').map(r=>({
            bridge_id:r.bridge_id,
            status:r.status,
            last_seen:Number(r.last_seen||0),
            age_ms:Math.max(0,now-Number(r.last_seen||0)),
            online_60s:(now-Number(r.last_seen||0))<60000
          }));
          const approved=rows('approved-jobs.raw.json').map(r=>{
            const result=parse(r.result_json);
            return {
              id:r.id,status:r.status,requested_by:r.requested_by,
              goal:String(r.goal||'').slice(0,220),updated_at:Number(r.updated_at||0),
              teacher_status:result?.teacher_bridge?.status||null,
              teacher_verdict:result?.teacher_bridge?.review?.verdict||null,
              owner_override:result?.teacher_bridge?.review?.owner_override===true,
              implementation_status:result?.implementation_proposal?.status||null,
              bridge_preparation_status:result?.bridge_preparation?.status||null,
              candidate_branch:result?.bridge_preparation?.candidate_branch||null,
              candidate_sha:result?.bridge_preparation?.candidate_sha||null
            };
          });
          const out={generated_at:new Date(now).toISOString(),bridges,approved_jobs:approved};
          fs.writeFileSync('bridge-live-audit.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-live-audit-${{ github.run_id }}
          path: bridge-live-audit.json
          if-no-files-found: error
          retention-days: 3
