name: retired-main-cloudflare-deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy production deployment
        run: |
          echo "RETIRED: production deployment from main is forbidden."
          echo "Use .github/workflows/deploy-cloudflare-release.yml from the canonical candidate/release path."
          exit 1
