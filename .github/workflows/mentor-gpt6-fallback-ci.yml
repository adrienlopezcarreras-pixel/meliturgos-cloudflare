# ChatGPT-GPT6 / MEL-MENTOR-FALLBACK — removable with PR #2327
name: mentor-gpt6-fallback-ci
on:
  pull_request:
    paths:
      - 'src/learning/mentor-engine.js'
      - 'src/learning/mentor-companion-provider.js'
      - 'tests/mentor-engine.test.mjs'
      - 'tests/mentor-companion-provider.test.mjs'
      - '.github/workflows/mentor-gpt6-fallback-ci.yml'
permissions:
  contents: read
jobs:
  mentor-fallback-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Syntax
        run: |
          node --check src/learning/mentor-engine.js
          node --check src/learning/mentor-companion-provider.js
          node --check tests/mentor-engine.test.mjs
          node --check tests/mentor-companion-provider.test.mjs
      - name: Isolated mentor regressions
        run: node --test tests/mentor-engine.test.mjs tests/mentor-companion-provider.test.mjs
