name: Professor UI audit CI

on:
  pull_request:
    paths:
      - "src/pages/full-interface-v2.js"
      - "src/pages/revenue-interface.js"
      - "scripts/verify-interface-browser.mjs"
      - "tests/ui-audit-controls.test.mjs"
      - "src/evolution/autonomy-activity.js"
      - "src/evolution/autonomy-runtime-core.js"
      - "src/teachers/github-completion-reconciler.js"
      - "tests/full-candidate-ci-lookup.test.mjs"
      - "tests/autonomy-activity-detail.test.mjs"
      - "src/pages/mvp-interface-v3.js"
      - "src/pages/mvp-runtime.js"
      - "src/pages/chat-rich-renderer.js"
      - "src/pages/full-mode-control-enhancer.js"
      - "src/api/response-quality.js"
      - "src/api/chat-stream.js"
      - "src/api/native-chat.js"
      - "tests/chat-stream.test.mjs"
      - "src/api/response-grounding.js"
      - "src/identity/mel-operating-manual.js"
      - "src/capabilities/**"
      - "src/router.js"
      - "src/roadmap/master-roadmap.js"
      - "tests/ui-control-contract-exhaustive.test.mjs"
      - "tests/ui-performance-ergonomics.test.mjs"
      - "tests/chat-rich-renderer.test.mjs"
      - "tests/professor-file-upload-runtime.test.mjs"
      - "tests/response-quality.test.mjs"
      - "tests/response-grounding.test.mjs"
      - "tests/mel-operating-manual.test.mjs"
      - "tests/capability-protected-health.test.mjs"
      - "tests/gen2/platform-read-capabilities.test.mjs"
      - ".github/workflows/professor-ui-audit-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  professor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Verify verified Professor Code NDJSON stream contract
        run: node --test tests/chat-stream.test.mjs
      - name: Execute generated Professor file upload runtime
        run: node --test tests/professor-file-upload-runtime.test.mjs
      - name: Audit every Professor control
        run: node --test tests/ui-control-contract-exhaustive.test.mjs
      - name: Audit Professor ergonomics and responsive UI
        run: node --test tests/ui-performance-ergonomics.test.mjs
      - name: Audit capability health semantics
        run: node --test tests/capability-protected-health.test.mjs tests/gen2/platform-read-capabilities.test.mjs
      - name: Verify self-state chat grounding
        run: node --test tests/response-grounding.test.mjs
      - name: Verify autonomy evidence and reset isolation
        run: >-
          node --test tests/autonomy-activity-detail.test.mjs
          tests/autonomy-claimed-bridge.test.mjs tests/autonomy-runtime-epoch.test.mjs
          tests/dev-job-cancelled-not-revived.test.mjs tests/full-candidate-ci-lookup.test.mjs
          tests/autonomy-runtime.test.mjs tests/autonomy-verification-wait.test.mjs
          tests/autonomy-completion-gates.test.mjs tests/autonomy-completion-mentor-learning.test.mjs
      - name: Verify audited controls and roadmap compatibility
        run: node --test tests/ui-audit-controls.test.mjs tests/chat-roadmap-audit.test.mjs tests/roadmap-consolidation.test.mjs tests/roadmap-truth.test.mjs
      - name: Exercise canonical pages in Chromium (local integrations remain BLOCKED)
        env:
          MEL_TEST_BROWSER_PATH: /usr/bin/google-chrome
          MEL_UI_AUDIT_OUTPUT: ${{ runner.temp }}/mel-interface-browser-proof
        run: node scripts/verify-interface-browser.mjs
      - name: Retain browser matrix, inventory, requests and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mel-interface-browser-proof
          path: ${{ runner.temp }}/mel-interface-browser-proof/
          if-no-files-found: warn
          retention-days: 7
      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B candidate/professor-ui-audit-ci "$(git rev-parse HEAD)"
          npm test
