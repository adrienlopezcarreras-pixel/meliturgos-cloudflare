name: Professor Qwen3 Kaggle GPU (gated)
on:
  workflow_dispatch:
    inputs:
      dataset_slug:
        description: "Reviewed private Kaggle dataset owner/name, with dataset.jsonl and sources.json"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: professor-qwen-kaggle-gpu
  cancel-in-progress: false
jobs:
  launch-qwen-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      DATASET_SLUG: ${{ inputs.dataset_slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate gated input and Kaggle credential
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DATASET_SLUG" =~ ^[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+$ ]] || { echo "INVALID_KAGGLE_DATASET_SLUG"; exit 1; }
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_CREDENTIALS_MISSING"; exit 1; }
          python -m py_compile scripts/train-qwen3-lora.py kaggle/qwen3-gated-gpu-entry.py
          python -m unittest discover -s tests -p test_qwen3_training.py -v
          python -m unittest discover -s tests -p test_qwen_gpu_evidence.py -v
      - name: Install official Kaggle CLI
        run: python -m pip install -q kaggle
      - name: Verify Kaggle corpus before requesting GPU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qwen-preflight
          kaggle datasets download -d "$DATASET_SLUG" -p artifacts/qwen-preflight -q
          python - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('artifacts/qwen-preflight')
          zips=list(root.glob('*.zip'))
          if len(zips)!=1:
              raise SystemExit('QWEN_DATASET_DOWNLOAD_NOT_UNIQUE')
          with zipfile.ZipFile(zips[0]) as archive:
              entries=archive.infolist()
              names=[e.filename for e in entries]
              if len(names)!=2 or sorted(names)!=['dataset.jsonl','sources.json']:
                  raise SystemExit('QWEN_DATASET_EXACT_FILES_REQUIRED')
              if any(e.is_dir() or e.file_size > 20_000_000 or e.compress_size > 20_000_000 for e in entries):
                  raise SystemExit('QWEN_DATASET_FILE_SIZE_INVALID')
              for entry in entries:
                  # Reject zip bombs / malformed archives with streamed bounded reads.
                  with archive.open(entry) as src, (root/entry.filename).open('wb') as dst:
                      total=0
                      while True:
                          chunk=src.read(65536)
                          if not chunk: break
                          total+=len(chunk)
                          if total>20_000_000: raise SystemExit('QWEN_DATASET_FILE_SIZE_INVALID')
                          dst.write(chunk)
          PY
          python scripts/train-qwen3-lora.py --dataset artifacts/qwen-preflight/dataset.jsonl --manifest artifacts/qwen-preflight/sources.json --output artifacts/qwen-preflight/candidate --dry-run > /dev/null
          echo "QWEN_REVIEWED_DATASET_PREFLIGHT_OK"
      - name: Authenticate Kaggle and submit GPU notebook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/qwen-kernel
          # Kaggle pushes the declared code_file; embed trainer bytes to avoid
          # relying on an undeclared sibling file being uploaded or mounted.
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          trainer=Path('scripts/train-qwen3-lora.py').read_bytes()
          entry=Path('kaggle/qwen3-gated-gpu-entry.py').read_text(encoding='utf-8')
          preamble=("from pathlib import Path as _MELPath\n"
                    "import base64 as _mel_b64\n"
                    "_MELPath('/kaggle/working/train-qwen3-lora.py').write_bytes("
                    "_mel_b64.b64decode("+repr(base64.b64encode(trainer).decode('ascii'))+"))\n")
          # The generated file must be syntactically valid, not just the sources.
          # Pin the immutable Git SHA inside the submitted notebook itself.
          sha=os.environ.get('GITHUB_SHA','')
          if len(sha)!=40 or any(ch not in '0123456789abcdef' for ch in sha.lower()):
              raise SystemExit('QWEN_SOURCE_SHA_INVALID')
          preamble="import os as _mel_os\n_mel_os.environ['MEL_QWEN_SOURCE_SHA']="+repr(sha)+"\n"+preamble
          generated=preamble+entry
          compile(generated,'main.py','exec')
          Path('artifacts/qwen-kernel/main.py').write_text(generated,encoding='utf-8')
          print('QWEN_SELF_CONTAINED_KERNEL_CREATED')
          PY
          python - <<'PY'
          import json,os,pathlib
          from kagglesdk.kaggle_client import KaggleClient
          from kagglesdk.kaggle_creds import KaggleCredentials
          token=os.environ['KAGGLE_API_TOKEN']
          client=KaggleClient(user_agent="mel-qwen3-gpu/1.0")
          creds=KaggleCredentials(client=client,access_token=token)
          username=str(creds.introspect()).strip()
          if not username or '/' in username: raise SystemExit('KAGGLE_USERNAME_INVALID')
          meta={'id':username+'/mel-qwen3-gated-gpu','title':'MEL Qwen3 GPU gated candidate','code_file':'main.py','language':'python','kernel_type':'script','is_private':True,'enable_gpu':True,'enable_internet':True,'machine_shape':'NvidiaTeslaT4','dataset_sources':[os.environ['DATASET_SLUG']],'competition_sources':[],'kernel_sources':[],'model_sources':[]}
          pathlib.Path('artifacts/qwen-kernel/kernel-metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
          print('KAGGLE_METADATA_VALIDATED')
          PY
          # Inject dataset slug without logging its contents or any corpus data.
          sed -i "s|os.environ.get('MEL_QWEN_DATASET_SLUG','')|'${DATASET_SLUG}'|" artifacts/qwen-kernel/main.py
          kaggle kernels push -p artifacts/qwen-kernel --accelerator NvidiaTeslaT4
      - name: Record dispatch (not training success)
        if: success()
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json,os,pathlib
          data={'status':'KAGGLE_GPU_DISPATCHED_UNVERIFIED','track':'qwen3','github_run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'dataset_slug':os.environ['DATASET_SLUG'],'gpu_training_proven':False,'checkpoint_validated':False,'adapter_active':False}
          pathlib.Path('artifacts/qwen-dispatch.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: qwen-gpu-dispatch-${{ github.run_id }}
          path: artifacts/qwen-dispatch.json
