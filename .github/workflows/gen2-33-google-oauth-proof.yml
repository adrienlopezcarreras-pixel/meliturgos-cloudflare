name: gen2-33-google-oauth-proof

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - src/connectors/google-oauth-runtime.js
      - src/capabilities/google-workspace-capabilities.js
      - src/api/google-oauth-api.js
      - tests/gen2/google-oauth-runtime.test.mjs
      - tests/gen2/google-workspace-agentic.test.mjs
      - tests/gen2/oauth-google-runtime.test.mjs
      - .github/workflows/gen2-33-google-oauth-proof.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Run Google OAuth and workspace contract tests
        run: |
          node --test \
            tests/gen2/google-oauth-runtime.test.mjs \
            tests/gen2/google-workspace-agentic.test.mjs \
            tests/gen2/oauth-google-runtime.test.mjs

  production-proof:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci

      - name: Read production secret names only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > worker-secrets.raw.json

      - name: Read OAuth vault metadata only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='mel_oauth_tokens'" \
            > oauth-table.raw.json
          if grep -q 'mel_oauth_tokens' oauth-table.raw.json; then
            npx wrangler d1 execute DB --remote --json \
              --command "SELECT connector_id,COUNT(*) AS token_rows,MAX(updated_at) AS updated_at FROM mel_oauth_tokens WHERE connector_id IN ('gmail','google-calendar','google-tasks','google-drive') GROUP BY connector_id ORDER BY connector_id" \
              > oauth-token-metadata.raw.json
          else
            printf '[]\n' > oauth-token-metadata.raw.json
          fi

      - name: Build sanitized GEN2-33 proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def load_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return []

          def result_rows(payload):
              rows = []
              if isinstance(payload, dict):
                  payload = [payload]
              for part in payload if isinstance(payload, list) else []:
                  if isinstance(part, dict) and isinstance(part.get('results'), list):
                      rows.extend(row for row in part['results'] if isinstance(row, dict))
                  elif isinstance(part, dict):
                      rows.append(part)
              return rows

          raw_secrets = load_json('worker-secrets.raw.json')
          secret_names = set()
          if isinstance(raw_secrets, dict):
              candidates = raw_secrets.get('secrets') or raw_secrets.get('result') or []
          else:
              candidates = raw_secrets
          for item in candidates if isinstance(candidates, list) else []:
              if isinstance(item, str):
                  secret_names.add(item)
              elif isinstance(item, dict):
                  name = item.get('name') or item.get('key')
                  if name:
                      secret_names.add(str(name))

          table_rows = result_rows(load_json('oauth-table.raw.json'))
          token_rows = result_rows(load_json('oauth-token-metadata.raw.json'))
          tokens = {
              str(row.get('connector_id')): {
                  'present': int(row.get('token_rows') or 0) > 0,
                  'updated_at': int(row.get('updated_at') or 0) or None,
              }
              for row in token_rows
              if row.get('connector_id')
          }

          required_secret_names = [
              'GOOGLE_OAUTH_CLIENT_ID',
              'GOOGLE_OAUTH_CLIENT_SECRET',
              'MEL_OAUTH_ENCRYPTION_KEY_ID',
              'MEL_OAUTH_ENCRYPTION_KEY_B64',
              'MEL_BACKUP_ENCRYPTION_KEY_ID',
              'MEL_BACKUP_ENCRYPTION_KEY_B64',
          ]
          secret_presence = {name: name in secret_names for name in required_secret_names}
          connectors = {
              name: tokens.get(name, {'present': False, 'updated_at': None})
              for name in ('gmail', 'google-calendar', 'google-tasks', 'google-drive')
          }

          oauth_app_ready = secret_presence['GOOGLE_OAUTH_CLIENT_ID'] and secret_presence['GOOGLE_OAUTH_CLIENT_SECRET']
          dedicated_vault_crypto_ready = secret_presence['MEL_OAUTH_ENCRYPTION_KEY_ID'] and secret_presence['MEL_OAUTH_ENCRYPTION_KEY_B64']
          backup_vault_crypto_ready = secret_presence['MEL_BACKUP_ENCRYPTION_KEY_ID'] and secret_presence['MEL_BACKUP_ENCRYPTION_KEY_B64']
          vault_crypto_ready = dedicated_vault_crypto_ready or backup_vault_crypto_ready
          vault_crypto_source = 'dedicated_oauth_key' if dedicated_vault_crypto_ready else ('backup_derived' if backup_vault_crypto_ready else 'none')
          vault_table_present = any(str(row.get('name') or '') == 'mel_oauth_tokens' for row in table_rows)
          connected_count = sum(1 for row in connectors.values() if row['present'])
          shared_google_grant_present = connected_count >= 1

          if not oauth_app_ready:
              status = 'BLOCKED_HUMAN_OAUTH_APP_CREDENTIALS_MISSING'
          elif not vault_crypto_ready:
              status = 'BLOCKED_CONFIGURATION_OAUTH_VAULT_KEY_MISSING'
          elif not vault_table_present:
              status = 'BLOCKED_CONFIGURATION_OAUTH_VAULT_TABLE_MISSING'
          elif not shared_google_grant_present:
              status = 'BLOCKED_HUMAN_GOOGLE_CONSENT_INCOMPLETE'
          else:
              status = 'READY_FOR_LIVE_GOOGLE_API_PROBES'

          proof = {
              'schema': 'mel.gen2-33-google-oauth-proof/v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ.get('GITHUB_SHA'),
              'status': status,
              'oauth_app_ready': oauth_app_ready,
              'vault_crypto_ready': vault_crypto_ready,
              'vault_crypto_source': vault_crypto_source,
              'dedicated_vault_crypto_ready': dedicated_vault_crypto_ready,
              'backup_vault_crypto_ready': backup_vault_crypto_ready,
              'vault_table_present': vault_table_present,
              'secret_presence': secret_presence,
              'connectors': connectors,
              'connected_count': connected_count,
              'shared_google_grant_present': shared_google_grant_present,
              'rules': {
                  'secret_values_exposed': False,
                  'token_values_exposed': False,
                  'mutation_performed': False,
                  'consent_started': False,
              },
          }
          Path('gen2-33-google-oauth-proof.json').write_text(
              json.dumps(proof, indent=2, ensure_ascii=False),
              encoding='utf-8',
          )
          print(json.dumps(proof, indent=2, ensure_ascii=False))

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as h:
                  h.write('### GEN2-33 Google OAuth proof\n\n')
                  h.write(f'- Status: **{status}**\n')
                  h.write(f'- OAuth app credentials present: {oauth_app_ready}\n')
                  h.write(f'- OAuth vault crypto present: {vault_crypto_ready} ({vault_crypto_source})\n')
                  h.write(f'- OAuth token table present: {vault_table_present}\n')
                  h.write(f'- Persisted Google connector rows: {connected_count}/4 (a single shared grant is valid)\n')
          PY

      - name: Upload sanitized proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen2-33-google-oauth-proof-${{ github.sha }}
          path: gen2-33-google-oauth-proof.json
          if-no-files-found: error
          retention-days: 14
