name: gen2-55-data-integrity-ci

on:
  pull_request:
    paths:
      - 'src/diagnostics/data-integrity.js'
      - 'src/diagnostics/final-maturity-audit.js'
      - 'src/capabilities/default-bus.js'
      - 'src/router.js'
      - '.github/workflows/deploy-cloudflare-release.yml'
      - 'src/persistence/migrations.js'
      - 'src/persistence/gen2-schema.js'
      - 'src/roadmap/master-roadmap.js'
      - 'tests/data-integrity.test.mjs'
      - 'tests/final-maturity-audit.test.mjs'
      - 'tests/release-production-smoke-routes.test.mjs'
      - 'tests/gen2/gen2-55-production-release-smoke.test.mjs'
      - '.github/workflows/gen2-55-data-integrity-ci.yml'
  push:
    branches:
      - 'roadmap/gen2-55-data-integrity-20260925'
    paths:
      - 'src/diagnostics/data-integrity.js'
      - 'src/diagnostics/final-maturity-audit.js'
      - 'src/capabilities/default-bus.js'
      - 'src/router.js'
      - '.github/workflows/deploy-cloudflare-release.yml'
      - 'src/persistence/migrations.js'
      - 'src/persistence/gen2-schema.js'
      - 'src/roadmap/master-roadmap.js'
      - 'tests/data-integrity.test.mjs'
      - 'tests/final-maturity-audit.test.mjs'
      - 'tests/release-production-smoke-routes.test.mjs'
      - 'tests/gen2/gen2-55-production-release-smoke.test.mjs'
      - '.github/workflows/gen2-55-data-integrity-ci.yml'

permissions:
  contents: read

jobs:
  integrity-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
      - name: Integrity syntax
        run: >
          node --check src/diagnostics/data-integrity.js &&
          node --check src/diagnostics/final-maturity-audit.js &&
          node --check src/capabilities/default-bus.js &&
          node --check src/router.js
      - name: Integrity targeted tests
        run: >
          node --test
          tests/data-integrity.test.mjs
          tests/final-maturity-audit.test.mjs
          tests/gen2/contracts.test.mjs
          tests/release-production-smoke-routes.test.mjs
          tests/gen2/gen2-55-production-release-smoke.test.mjs

  integrity-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: integrity-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Repository syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/gen2-55-data-integrity-ci
      - name: Full test suite
        run: npm test
