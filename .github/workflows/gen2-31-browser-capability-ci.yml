name: gen2-31-browser-capability-ci

on:
  push:
    branches:
      - 'work/gen2-31-browser-companion'
    paths:
      - 'src/devices/browser-capability.js'
      - 'src/devices/browser-companion-adapter.js'
      - 'src/capabilities/browser-runtime-capabilities.js'
      - 'src/capabilities/default-bus.js'
      - 'tests/gen2/browser-capability.test.mjs'
      - 'tests/browser-runtime-capability.test.mjs'
      - '.github/workflows/gen2-31-browser-capability-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/devices/browser-capability.js'
      - 'src/devices/browser-companion-adapter.js'
      - 'src/capabilities/browser-runtime-capabilities.js'
      - 'src/capabilities/default-bus.js'
      - 'tests/gen2/browser-capability.test.mjs'
      - 'tests/browser-runtime-capability.test.mjs'
      - '.github/workflows/gen2-31-browser-capability-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Browser runtime syntax
        run: |
          node --check src/devices/browser-capability.js
          node --check src/devices/browser-companion-adapter.js
          node --check src/capabilities/browser-runtime-capabilities.js
          node --check src/capabilities/default-bus.js
      - name: Browser runtime tests
        run: node --test tests/gen2/browser-capability.test.mjs tests/browser-runtime-capability.test.mjs
      - name: Full syntax gate
        run: npm run check
      - name: Full regression suite
        shell: bash
        run: |
          # One legacy self-dev invariant hardcodes candidate/mel-clean-autonomy as
          # the outer local branch. Rename only the ephemeral runner branch so the
          # invariant tests branch preservation rather than GitHub ref naming.
          if git symbolic-ref -q HEAD >/dev/null; then
            git branch -m candidate/mel-clean-autonomy
          else
            git switch -c candidate/mel-clean-autonomy
          fi
          set +e
          npm test 2>&1 | tee gen2-31-full-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> gen2-31-full-test.log
          exit $code
      - name: Preserve regression report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gen2-31-full-test-report
          path: gen2-31-full-test.log
          retention-days: 1
