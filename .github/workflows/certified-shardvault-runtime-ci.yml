name: certified ShardVault runtime CI

on:
  push:
    branches:
      - 'hotfix/shardvault-certified-runtime-20260921'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax
        run: npm run check
      - name: ShardVault and launch readiness regression suite
        run: >
          node --test
          tests/autonomy-launch-readiness.test.mjs
          tests/release-launch-bootstrap.test.mjs
          tests/reliability-restore.test.mjs
          tests/restore-service.test.mjs
          tests/shardvault-activation-flow.test.mjs
          tests/shardvault-autonomous-policy.test.mjs
          tests/shardvault-cloudflare-fetch.test.mjs
          tests/shardvault-continuity.test.mjs
          tests/shardvault-documented-provider.test.mjs
          tests/shardvault-live-adapters.test.mjs
          tests/shardvault-progressive-discovery.test.mjs
          tests/shardvault-reconstruction-stress.test.mjs
          tests/shardvault-resilient-bootstrap.test.mjs
          tests/shardvault-reviewed-evidence.test.mjs
