name: Recover existing Kaggle LoRA checkpoint (no GPU)

on:
  # One-branch read-only recovery run; no GPU submission, no deployment.
  push:
    branches:
      - fix/lora-preserve-checkpoint-before-release-20261012
    paths:
      - ".github/workflows/recover-existing-kaggle-lora.yml"
  pull_request:
    paths:
      - ".github/workflows/recover-existing-kaggle-lora.yml"
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Optional immutable Kaggle kernel version (digits only); blank uses latest'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mel-lora-checkpoint-recovery-c000
  cancel-in-progress: false

jobs:
  recover-existing:
    # PR-origin guard: only the owner's internal recovery branch can access preview secrets.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/lora-preserve-checkpoint-before-release-20261012' && github.actor == 'adrienlopezcarreras-pixel') }}
    runs-on: ubuntu-24.04
    environment: preview
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Download existing completed Kaggle kernel output (read-only)
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KERNEL_VERSION: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "KAGGLE_API_TOKEN_REQUIRED"; exit 1; }
          python -m pip install -q kaggle
          mkdir -p artifacts/kaggle-recovery
          REF=adrienlopezcarreras/mel-lora-uncensored-notebook-t4
          if [[ -n "${KAGGLE_KERNEL_VERSION:-}" ]]; then
            [[ "$KAGGLE_KERNEL_VERSION" =~ ^[0-9]{1,8}$ ]] || { echo 'RECOVERY_KERNEL_VERSION_INVALID'; exit 1; }
            REF="${REF}/${KAGGLE_KERNEL_VERSION}"
          fi
          kaggle kernels output "$REF" \
            -p artifacts/kaggle-recovery --force
          python - <<'PY'
          from pathlib import Path
          files=list(Path('artifacts/kaggle-recovery').rglob('mel-lora-bundle.tar.gz'))
          if len(files)!=1 or not files[0].is_file():
              raise SystemExit('RECOVERY_SINGLE_EXISTING_BUNDLE_REQUIRED')
          path=Path('artifacts/mel-lora-bundle.tar.gz')
          path.write_bytes(files[0].read_bytes())
          PY
      - name: Verify exact existing training output before retaining
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-existing-kaggle-lora-bundle.py artifacts/mel-lora-bundle.tar.gz \
            | tee artifacts/existing-lora-recovery-proof.json
      - name: Retain verified checkpoint (no activation)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mel-lora-c000-existing-verified-checkpoint
          path: |
            artifacts/mel-lora-bundle.tar.gz
            artifacts/existing-lora-recovery-proof.json
          if-no-files-found: error
          retention-days: 30
