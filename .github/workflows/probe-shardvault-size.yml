name: probe-shardvault-size

on:
  push:
    branches:
      - probe/shardvault-providers-20260919
    paths:
      - .github/workflows/probe-shardvault-size.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare real-size ShardVault payload
        shell: bash
        run: |
          set -euo pipefail
          head -c 315000 /dev/urandom > probe.bin
          base64 -w0 probe.bin > probe.b64
          echo "binary=$(wc -c < probe.bin) text=$(wc -c < probe.b64)"

      - name: Probe x0.at at real size
        shell: bash
        run: |
          set +e
          url="$(curl -fsS --max-time 40 -F "file=@probe.b64;filename=mel-shard.txt" https://x0.at/ 2>err | tr -d '\r\n')"
          if printf '%s' "$url" | grep -q '^https://'; then
            curl -fsSL --max-time 40 "$url" -o encoded
            base64 -d encoded > out 2>/dev/null
            cmp -s probe.bin out && echo "SIZE_RESULT x0at PASS" || echo "SIZE_RESULT x0at FAIL_READ"
          else echo "SIZE_RESULT x0at FAIL_UPLOAD $(tr '\n' ' ' < err)"; fi

      - name: Probe paste.gg at real size
        shell: bash
        run: |
          set +e
          content="$(cat probe.b64)"
          body="$(jq -n --arg c "$content" '{visibility:"unlisted",files:[{name:"mel-shard.txt",content:{format:"text",value:$c}}]}' | curl -fsS --max-time 40 -H 'Content-Type: application/json' --data-binary @- https://api.paste.gg/v1/pastes 2>err)"
          id="$(printf '%s' "$body" | jq -r '.result.id // empty' 2>/dev/null)"
          if [ -n "$id" ]; then
            get="$(curl -fsS --max-time 40 "https://api.paste.gg/v1/pastes/$id?full=true" 2>err2)"
            printf '%s' "$get" | jq -r '.result.files[0].content.value // empty' > encoded
            base64 -d encoded > out 2>/dev/null
            cmp -s probe.bin out && echo "SIZE_RESULT pastegg PASS" || echo "SIZE_RESULT pastegg FAIL_READ"
          else echo "SIZE_RESULT pastegg FAIL_UPLOAD body=$(printf '%s' "$body" | head -c 300) err=$(tr '\n' ' ' < err)"; fi

      - name: Probe MSK Paste at real size
        shell: bash
        run: |
          set +e
          content="$(cat probe.b64)"
          body="$(jq -n --arg c "$content" '{content:$c,language:"plaintext",expiresIn:"1y"}' | curl -fsS --max-time 40 -H 'Content-Type: application/json' --data-binary @- https://paste.msk-scripts.de/api/pastes 2>err)"
          id="$(printf '%s' "$body" | jq -r '.pasteId // empty' 2>/dev/null)"
          if [ -n "$id" ]; then
            get="$(curl -fsS --max-time 40 "https://paste.msk-scripts.de/api/pastes/$id" 2>err2)"
            printf '%s' "$get" | jq -r '.content // empty' > encoded
            base64 -d encoded > out 2>/dev/null
            cmp -s probe.bin out && echo "SIZE_RESULT mskpaste PASS" || echo "SIZE_RESULT mskpaste FAIL_READ"
          else echo "SIZE_RESULT mskpaste FAIL_UPLOAD body=$(printf '%s' "$body" | head -c 300) err=$(tr '\n' ' ' < err)"; fi

      - name: Probe dpaste.com at real size
        shell: bash
        run: |
          set +e
          content="$(cat probe.b64)"
          url="$(curl -fsS --max-time 40 -A 'MEL-ShardVault/1.0' -X POST --data-urlencode "content=$content" -d "expiry_days=365" https://dpaste.com/api/v2/ 2>err | tr -d '\r\n')"
          raw="${url%/}.txt"
          if printf '%s' "$url" | grep -q '^https://'; then
            curl -fsSL --max-time 40 -A 'MEL-ShardVault/1.0' "$raw" -o encoded
            base64 -d encoded > out 2>/dev/null
            cmp -s probe.bin out && echo "SIZE_RESULT dpastecom PASS" || echo "SIZE_RESULT dpastecom FAIL_READ"
          else echo "SIZE_RESULT dpastecom FAIL_UPLOAD $(tr '\n' ' ' < err)"; fi

      - name: Probe Pastebin.ai at real size
        shell: bash
        run: |
          set +e
          content="$(cat probe.b64)"
          body="$(jq -n --arg c "$content" '{content:$c,title:"MEL ShardVault probe",language:"plaintext",visibility:"unlisted",expiration:"never"}' | curl -fsS --max-time 40 -H 'Content-Type: application/json' --data-binary @- https://pastebin.ai/api/v1/pastes 2>err)"
          id="$(printf '%s' "$body" | jq -r '.id // empty' 2>/dev/null)"
          raw="$(printf '%s' "$body" | jq -r '.raw_url // empty' 2>/dev/null)"
          if [ -n "$id" ]; then
            if [ -n "$raw" ]; then curl -fsSL --max-time 40 "$raw" -o encoded; else
              get="$(curl -fsS --max-time 40 "https://pastebin.ai/api/v1/pastes/$id" 2>err2)"
              printf '%s' "$get" | jq -r '.content // empty' > encoded
            fi
            base64 -d encoded > out 2>/dev/null
            cmp -s probe.bin out && echo "SIZE_RESULT pastebinai PASS" || echo "SIZE_RESULT pastebinai FAIL_READ"
          else echo "SIZE_RESULT pastebinai FAIL_UPLOAD body=$(printf '%s' "$body" | head -c 300) err=$(tr '\n' ' ' < err)"; fi
