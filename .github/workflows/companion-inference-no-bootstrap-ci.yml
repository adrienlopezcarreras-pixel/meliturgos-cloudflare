name: Companion Inference No Bootstrap CI
on:
  pull_request:
    paths:
      - 'assets/MEL-Computer-Companion.ps1'
      - 'dist/MEL-Computer-Companion.ps1'
      - 'tests/gen2/companion-inference-no-bootstrap.test.mjs'
      - 'tests/windows/companion-inference-no-bootstrap-smoke.ps1'
      - '.github/workflows/companion-inference-no-bootstrap-ci.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PowerShell AST without executing agent
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'assets/MEL-Computer-Companion.ps1'),[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell AST parse failed: $($errors | Out-String)" }
      - name: Verify no-bootstrap model selection at runtime using mocked Ollama
        shell: powershell
        run: .\tests\windows\companion-inference-no-bootstrap-smoke.ps1
      - run: node --test tests/gen2/companion-inference-no-bootstrap.test.mjs tests/gen2/companion-ai-prevalidation-runtime.test.mjs tests/gen2/companion-prebootstrap-deadline.test.mjs
