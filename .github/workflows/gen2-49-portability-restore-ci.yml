name: gen2-49-portability-restore-ci

on:
  push:
    branches:
      - 'roadmap/gen2-49-*'
      - 'candidate/gen2-49-*'
  pull_request:
    branches:
      - main
    paths:
      - 'src/portability/**'
      - 'src/memory/portable-export.js'
      - 'src/evolution/skill-registry.js'
      - 'src/planning/project-service.js'
      - 'src/plugins/runtime.js'
      - 'tests/gen2/provider-neutral-portability.test.mjs'
      - 'tests/gen2/provider-neutral-system-bundle.test.mjs'
      - 'tests/gen2/runtime-portability-exporters.test.mjs'
      - 'tests/gen2/provider-neutral-restore-drill.test.mjs'
      - '.github/workflows/gen2-49-portability-restore-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Targeted GEN2-49 tests
        run: node --test tests/gen2/provider-neutral-portability.test.mjs tests/gen2/provider-neutral-system-bundle.test.mjs tests/gen2/runtime-portability-exporters.test.mjs tests/gen2/provider-neutral-restore-drill.test.mjs
      - name: Syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/gen2-49-ci
      - name: Full test suite
        run: npm test
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
