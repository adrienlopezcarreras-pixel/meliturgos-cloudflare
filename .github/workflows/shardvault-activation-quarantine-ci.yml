name: shardvault-activation-quarantine-ci

on:
  pull_request:
    paths:
      - 'src/continuity/shardvault-runtime.js'
      - 'tests/release-shardvault-prep.test.mjs'
      - 'tests/shardvault-activation-flow.test.mjs'
      - 'tests/shardvault-progressive-discovery.test.mjs'
      - 'tests/shardvault-continuity.test.mjs'
      - '.github/workflows/shardvault-activation-quarantine-ci.yml'
  push:
    branches:
      - 'fix/shardvault-quarantine-dead-activation-20260925'

permissions:
  contents: read

jobs:
  shardvault-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/runtime-security-gate.mjs
      - run: node --check src/continuity/shardvault-runtime.js
      - name: ShardVault targeted tests
        run: >
          node --test
          tests/release-shardvault-prep.test.mjs
          tests/shardvault-activation-flow.test.mjs
          tests/shardvault-progressive-discovery.test.mjs
          tests/shardvault-continuity.test.mjs

  shardvault-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: shardvault-targeted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git switch -c candidate/shardvault-quarantine-ci
      - run: npm test
