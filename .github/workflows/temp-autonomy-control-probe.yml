name: temp-autonomy-control-probe

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - '.github/workflows/temp-autonomy-control-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read public autonomy control
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 30             "https://meliturgos.adrien-lopezcarreras.workers.dev/api/gen2/autonomy/control"             -o control.json
          node - <<'NODE'
          const d=require('./control.json');
          console.log(JSON.stringify({
            ok:d?.ok===true,
            paused:d?.paused===true,
            max_autonomy:d?.max_autonomy===true,
            owner_override:d?.owner_override===true,
            status:d?.status||null,
            updated_at:d?.updated_at||null
          },null,2));
          NODE
