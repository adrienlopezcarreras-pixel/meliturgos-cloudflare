name: Qwen3 corpus publish (no GPU)
# Builds the reviewed Qwen3 training corpus from an owner-approved, licensed
# source pinned to an immutable revision, and publishes it as a PRIVATE Kaggle
# dataset (dataset.jsonl + sources.json) for professor-qwen-kaggle-gpu.yml.
# Owner decision 30/10: Devilishcode/ultrachat-uncensored (MIT) only;
# Guilherme34/uncensor has no declared license and is excluded.
# No GPU, no training, no model activation.
on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Bounded number of conversations (smoke: 3000)"
        required: false
        default: "3000"
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      SOURCE_ID: Devilishcode/ultrachat-uncensored
      SOURCE_REVISION: 65d0494745005d37e1cf6f600631838b146ed4ff
      SOURCE_FILE: ultrachat_uncensored.jsonl
      SOURCE_LICENSE: MIT
      ROWS: ${{ inputs.rows || '3000' }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Convert a bounded prefix of the pinned source to Qwen messages
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ROWS" =~ ^[0-9]+$ ]] && (( ROWS >= 50 && ROWS <= 20000 ))
          mkdir -p .tmp-qwen artifacts
          # The file is 2.9 GB: stream it and stop after the first ROWS valid rows.
          curl -sSL --fail --max-time 900 \
            "https://huggingface.co/datasets/${SOURCE_ID}/resolve/${SOURCE_REVISION}/${SOURCE_FILE}" \
            | python3 -I scripts/convert-ultrachat-uncensored.py --rows "$ROWS" --output .tmp-qwen/source.jsonl \
            || [[ -s .tmp-qwen/source.jsonl ]]
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          data=Path('.tmp-qwen/source.jsonl').read_bytes()
          Path('.tmp-qwen/license-review.json').write_text(json.dumps({
            "license_review_passed":True,"source_id":os.environ["SOURCE_ID"],
            "revision":os.environ["SOURCE_REVISION"],"license":os.environ["SOURCE_LICENSE"],
            "input_sha256":"sha256:"+hashlib.sha256(data).hexdigest(),
            "reviewed_by":"owner-decision-2026-10-30"},indent=2)+"\n")
          PY
          python3 scripts/prepare-qwen-kaggle-corpus.py --input .tmp-qwen/source.jsonl \
            --output artifacts/qwen-corpus --license-review .tmp-qwen/license-review.json | tee artifacts/prepare.json
      - name: Publish as a private Kaggle dataset
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo "::error title=KAGGLE_API_TOKEN_MISSING::"; exit 1; }
          python -m pip install -q kaggle
          KAGGLE_USER=adrienlopezcarreras
          SHA="$(python3 -c "import json;print(json.load(open('artifacts/prepare.json'))['dataset_sha256'][7:19])")"
          SLUG="mel-qwen3-corpus-${SHA}"
          python3 - "$KAGGLE_USER/$SLUG" <<'PY'
          import json,sys
          from pathlib import Path
          Path('artifacts/qwen-corpus/dataset-metadata.json').write_text(json.dumps(
            {"title":"MEL Qwen3 corpus "+sys.argv[1].split('-')[-1],"id":sys.argv[1],"licenses":[{"name":"other"}]},indent=2))
          PY
          kaggle datasets create -p artifacts/qwen-corpus -q 2>&1 | tee artifacts/publish.log
          grep -qiE 'successfully|already exists|created' artifacts/publish.log
          echo "QWEN_CORPUS_DATASET=$KAGGLE_USER/$SLUG" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen-corpus-publish-${{ github.run_id }}
          path: |
            artifacts/prepare.json
            artifacts/qwen-corpus/sources.json
            artifacts/publish.log
          if-no-files-found: warn
