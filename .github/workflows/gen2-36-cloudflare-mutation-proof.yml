name: gen2-36-cloudflare-mutation-proof

on:
  push:
    branches:
      - candidate/gen2-36-cloudflare-mutation-proof
    paths:
      - '.github/workflows/gen2-36-cloudflare-mutation-proof.yml'

permissions:
  contents: read

jobs:
  cloudflare-bounded-mutation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEL_CLOUDFLARE_SCRIPT: meliturgos
    steps:
      - name: Prove bounded neutral Cloudflare deployment mutation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${MEL_CLOUDFLARE_SCRIPT}/deployments"

          HTTP_CODE="$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            --output /tmp/gen2-36-current-deployments.json \
            --write-out '%{http_code}' \
            "${BASE}?per_page=10")"
          echo "Cloudflare deployment list HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            node -e 'const fs=require("fs"); try { const d=JSON.parse(fs.readFileSync("/tmp/gen2-36-current-deployments.json","utf8")); console.error(JSON.stringify({success:d?.success,errors:d?.errors||[]},null,2)); } catch {}'
            exit 10
          fi

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/gen2-36-current-deployments.json','utf8'));
          if (payload?.success !== true) throw new Error('CLOUDFLARE_DEPLOYMENT_LIST_FAILED');
          const rows = Array.isArray(payload?.result)
            ? payload.result
            : Array.isArray(payload?.result?.deployments)
              ? payload.result.deployments
              : [];
          const latest = rows[0];
          if (!latest?.id || !Array.isArray(latest?.versions) || latest.versions.length < 1 || latest.versions.length > 2) {
            throw new Error('CLOUDFLARE_CURRENT_DEPLOYMENT_INVALID');
          }
          const versions = latest.versions.map(row => ({
            version_id: String(row?.version_id || ''),
            percentage: Number(row?.percentage || 0),
          }));
          if (versions.some(row => !/^[0-9a-f-]{36}$/i.test(row.version_id))) throw new Error('CLOUDFLARE_VERSION_ID_INVALID');
          const total = versions.reduce((sum,row)=>sum+row.percentage,0);
          if (Math.abs(total - 100) > 0.001) throw new Error('CLOUDFLARE_PERCENTAGE_TOTAL_INVALID');
          fs.writeFileSync('/tmp/gen2-36-request.json', JSON.stringify({
            strategy: 'percentage',
            versions,
            annotations: {
              'workers/message': 'GEN2-36 bounded neutral mutation proof',
              'workers/triggered_by': 'gen2-36-proof',
            },
          }));
          fs.writeFileSync('/tmp/gen2-36-before.json', JSON.stringify({
            id: String(latest.id),
            versions,
          }));
          NODE

          MUTATE_CODE="$(curl --silent --show-error --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/gen2-36-request.json \
            --output /tmp/gen2-36-created-deployment.json \
            --write-out '%{http_code}' \
            "$BASE")"
          echo "Cloudflare deployment create HTTP ${MUTATE_CODE}"
          if [ "$MUTATE_CODE" != "200" ] && [ "$MUTATE_CODE" != "201" ]; then
            node -e 'const fs=require("fs"); try { const d=JSON.parse(fs.readFileSync("/tmp/gen2-36-created-deployment.json","utf8")); console.error(JSON.stringify({success:d?.success,errors:d?.errors||[]},null,2)); } catch {}'
            exit 11
          fi

          BASE="$BASE" node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/gen2-36-before.json','utf8'));
          const created = JSON.parse(fs.readFileSync('/tmp/gen2-36-created-deployment.json','utf8'));
          if (created?.success !== true || !created?.result?.id) throw new Error('CLOUDFLARE_DEPLOYMENT_CREATE_FAILED');
          const versions = (created?.result?.versions || []).map(row => ({
            version_id: String(row?.version_id || ''),
            percentage: Number(row?.percentage || 0),
          }));
          if (JSON.stringify(versions) !== JSON.stringify(before.versions)) {
            throw new Error('CLOUDFLARE_NEUTRALITY_PROOF_FAILED');
          }
          fs.writeFileSync('/tmp/gen2-36-created-id.txt', String(created.result.id));
          console.log(JSON.stringify({
            proof: 'GEN2_36_CLOUDFLARE_BOUNDED_MUTATION_VERIFIED',
            previous_deployment_id: before.id,
            created_deployment_id: String(created.result.id),
            versions,
            traffic_changed: false,
            force_used: false,
          }, null, 2));
          NODE

          CREATED_ID="$(cat /tmp/gen2-36-created-id.txt)"
          VERIFY_CODE="$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Accept: application/json" \
            --output /tmp/gen2-36-verified-deployment.json \
            --write-out '%{http_code}' \
            "${BASE}/${CREATED_ID}")"
          echo "Cloudflare deployment verify HTTP ${VERIFY_CODE}"
          if [ "$VERIFY_CODE" != "200" ]; then
            node -e 'const fs=require("fs"); try { const d=JSON.parse(fs.readFileSync("/tmp/gen2-36-verified-deployment.json","utf8")); console.error(JSON.stringify({success:d?.success,errors:d?.errors||[]},null,2)); } catch {}'
            exit 12
          fi

          CREATED_ID="$CREATED_ID" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/gen2-36-verified-deployment.json','utf8'));
          if (payload?.success !== true || String(payload?.result?.id || '') !== String(process.env.CREATED_ID || '')) {
            throw new Error('CLOUDFLARE_DEPLOYMENT_VERIFY_FAILED');
          }
          console.log('Cloudflare bounded neutral deployment mutation verified end-to-end.');
          NODE
