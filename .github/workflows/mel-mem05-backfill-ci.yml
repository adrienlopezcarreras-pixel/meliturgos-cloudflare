name: mel-mem05-backfill-ci

on:
  push:
    branches:
      - 'roadmap/mel-mem05-backfill-20260921'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Collector integrity
        run: node --test tests/chatgpt-collector-integrity.test.mjs
      - name: Archive importer regression
        run: node --test tests/chatgpt-archive-importer.test.mjs
