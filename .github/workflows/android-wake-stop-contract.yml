name: Android OK MEL stop contract
on:
  pull_request:
    paths:
      - 'tests/android-wake-stop-lifecycle.test.mjs'
      - 'android-companion/app/src/main/java/fr/veriteinterdite/mel/MainActivity.kt'
      - 'android-companion/app/src/main/java/fr/veriteinterdite/mel/WakePhraseTrainer.kt'
      - '.github/workflows/android-wake-stop-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/android-wake-stop-lifecycle.test.mjs
