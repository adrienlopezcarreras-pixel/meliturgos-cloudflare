name: mel-conn-03-mail-provider-proof

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - src/api/connection-settings-api.js
      - src/connectors/mail-oauth-runtime.js
      - src/connectors/generic-imap-smtp.js
      - src/connectors/yahoo-mail.js
      - tests/gen2/mail-provider-oauth-runtime.test.mjs
      - tests/gen2/connection-settings-api.test.mjs
      - .github/workflows/mel-conn-03-mail-provider-proof.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Run Yahoo and Roundcube connection contract tests
        run: |
          node --test \
            tests/gen2/mail-provider-oauth-runtime.test.mjs \
            tests/gen2/connection-settings-api.test.mjs

  production-proof:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install exact lockfile
        run: npm ci

      - name: Read production secret names only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > worker-secrets.raw.json

      - name: Read sanitized Yahoo and Roundcube vault metadata
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='mel_oauth_tokens'" \
            > oauth-table.raw.json
          if grep -q 'mel_oauth_tokens' oauth-table.raw.json; then
            npx wrangler d1 execute DB --remote --json \
              --command "SELECT connector_id,COUNT(*) AS token_rows,MAX(updated_at) AS updated_at FROM mel_oauth_tokens WHERE connector_id IN ('oauth-app-yahoo','yahoo-mail','generic-imap-smtp') GROUP BY connector_id ORDER BY connector_id" \
              > mail-provider-token-metadata.raw.json
          else
            printf '[]\n' > mail-provider-token-metadata.raw.json
          fi

      - name: Build sanitized MEL-CONN-03 proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def load_json(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return []

          def result_rows(payload):
              rows = []
              if isinstance(payload, dict):
                  payload = [payload]
              for part in payload if isinstance(payload, list) else []:
                  if isinstance(part, dict) and isinstance(part.get('results'), list):
                      rows.extend(row for row in part['results'] if isinstance(row, dict))
                  elif isinstance(part, dict):
                      rows.append(part)
              return rows

          raw_secrets = load_json('worker-secrets.raw.json')
          candidates = raw_secrets.get('secrets') or raw_secrets.get('result') or [] if isinstance(raw_secrets, dict) else raw_secrets
          secret_names = set()
          for item in candidates if isinstance(candidates, list) else []:
              if isinstance(item, str):
                  secret_names.add(item)
              elif isinstance(item, dict):
                  name = item.get('name') or item.get('key')
                  if name:
                      secret_names.add(str(name))

          table_rows = result_rows(load_json('oauth-table.raw.json'))
          token_rows = result_rows(load_json('mail-provider-token-metadata.raw.json'))
          rows = {
              str(row.get('connector_id')): {
                  'present': int(row.get('token_rows') or 0) > 0,
                  'updated_at': int(row.get('updated_at') or 0) or None,
              }
              for row in token_rows
              if row.get('connector_id')
          }

          secret_presence = {
              name: name in secret_names
              for name in (
                  'YAHOO_OAUTH_CLIENT_ID',
                  'YAHOO_OAUTH_CLIENT_SECRET',
                  'MEL_OAUTH_ENCRYPTION_KEY_ID',
                  'MEL_OAUTH_ENCRYPTION_KEY_B64',
              )
          }

          vault_table_present = any(str(row.get('name') or '') == 'mel_oauth_tokens' for row in table_rows)
          vault_crypto_ready = (
              secret_presence['MEL_OAUTH_ENCRYPTION_KEY_ID']
              and secret_presence['MEL_OAUTH_ENCRYPTION_KEY_B64']
          )
          yahoo_app_env_ready = (
              secret_presence['YAHOO_OAUTH_CLIENT_ID']
              and secret_presence['YAHOO_OAUTH_CLIENT_SECRET']
          )
          yahoo_app_vault_present = rows.get('oauth-app-yahoo', {}).get('present', False)
          yahoo_app_ready = yahoo_app_env_ready or yahoo_app_vault_present
          yahoo_token_present = rows.get('yahoo-mail', {}).get('present', False)
          roundcube_config_present = rows.get('generic-imap-smtp', {}).get('present', False)

          if not vault_crypto_ready:
              yahoo_status = 'BLOCKED_CONFIGURATION_OAUTH_VAULT_KEY_MISSING'
              roundcube_status = 'BLOCKED_CONFIGURATION_OAUTH_VAULT_KEY_MISSING'
          elif not vault_table_present:
              yahoo_status = 'BLOCKED_CONFIGURATION_OAUTH_VAULT_TABLE_MISSING'
              roundcube_status = 'BLOCKED_CONFIGURATION_OAUTH_VAULT_TABLE_MISSING'
          else:
              if not yahoo_app_ready:
                  yahoo_status = 'BLOCKED_HUMAN_YAHOO_APP_CREDENTIALS_MISSING'
              elif not yahoo_token_present:
                  yahoo_status = 'BLOCKED_HUMAN_YAHOO_CONSENT_INCOMPLETE'
              else:
                  yahoo_status = 'READY_FOR_LIVE_YAHOO_API_PROBE'

              if not roundcube_config_present:
                  roundcube_status = 'BLOCKED_HUMAN_ROUNDCUBE_CONFIGURATION_MISSING'
              else:
                  roundcube_status = 'READY_FOR_LIVE_ROUNDCUBE_IMAP_SMTP_PROBE'

          ready = (
              yahoo_status == 'READY_FOR_LIVE_YAHOO_API_PROBE'
              and roundcube_status == 'READY_FOR_LIVE_ROUNDCUBE_IMAP_SMTP_PROBE'
          )
          overall_status = 'READY_FOR_LIVE_PROVIDER_PROBES' if ready else 'BLOCKED_HUMAN_OR_CONFIGURATION'

          proof = {
              'schema': 'mel.mel-conn-03-mail-provider-proof/v1',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'source_sha': os.environ.get('GITHUB_SHA'),
              'status': overall_status,
              'vault_crypto_ready': vault_crypto_ready,
              'vault_table_present': vault_table_present,
              'yahoo': {
                  'status': yahoo_status,
                  'app_env_ready': yahoo_app_env_ready,
                  'app_vault_present': yahoo_app_vault_present,
                  'app_ready': yahoo_app_ready,
                  'oauth_token_present': yahoo_token_present,
              },
              'roundcube': {
                  'status': roundcube_status,
                  'config_present': roundcube_config_present,
              },
              'metadata': {
                  'oauth_app_yahoo': rows.get('oauth-app-yahoo', {'present': False, 'updated_at': None}),
                  'yahoo_mail': rows.get('yahoo-mail', {'present': False, 'updated_at': None}),
                  'generic_imap_smtp': rows.get('generic-imap-smtp', {'present': False, 'updated_at': None}),
              },
              'rules': {
                  'secret_values_exposed': False,
                  'token_values_exposed': False,
                  'password_values_exposed': False,
                  'mutation_performed': False,
                  'consent_started': False,
                  'live_network_probe_performed': False,
              },
          }

          Path('mel-conn-03-mail-provider-proof.json').write_text(
              json.dumps(proof, indent=2, ensure_ascii=False),
              encoding='utf-8',
          )
          print(json.dumps(proof, indent=2, ensure_ascii=False))

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as h:
                  h.write('### MEL-CONN-03 Yahoo / Roundcube proof\n\n')
                  h.write(f'- Overall: **{overall_status}**\n')
                  h.write(f'- Yahoo: **{yahoo_status}**\n')
                  h.write(f'- Roundcube: **{roundcube_status}**\n')
                  h.write(f'- OAuth vault crypto ready: {vault_crypto_ready}\n')
                  h.write(f'- OAuth vault table present: {vault_table_present}\n')
          PY

      - name: Upload sanitized proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mel-conn-03-mail-provider-proof-${{ github.sha }}
          path: mel-conn-03-mail-provider-proof.json
          if-no-files-found: error
          retention-days: 14
