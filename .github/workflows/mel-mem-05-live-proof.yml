name: MEL-MEM-05 attachment live proof

on:
  push:
    branches:
      - candidate/mel-clean-autonomy
    paths:
      - "scripts/prove-mel-mem-05-live.mjs"
      - "tests/mel-mem-05-live-proof.test.mjs"
      - ".github/workflows/mel-mem-05-live-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Validate MEM-MEM-05 proof contract
        run: node --test tests/mel-mem-05-live-proof.test.mjs

  production-live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Prove MEL-MEM-05 against remote D1
        shell: bash
        run: |
          set -o pipefail
          node scripts/prove-mel-mem-05-live.mjs --database meliturgos-memory | tee mel-mem-05-live-proof.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish proof summary
        if: always()
        shell: bash
        run: |
          if [ -s mel-mem-05-live-proof.json ]; then
            cat mel-mem-05-live-proof.json
            {
              echo '### MEL-MEM-05 production attachment proof'
              echo
              echo '```json'
              cat mel-mem-05-live-proof.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mel-mem-05-live-proof-${{ github.sha }}
          path: mel-mem-05-live-proof.json
          if-no-files-found: warn
          retention-days: 30
