name: fides-production-inference-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture only scrubbed FIDES error category during one live request
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          timeout 75s npx wrangler tail meliturgos --format json > /tmp/fides-tail-raw.jsonl 2>/tmp/fides-tail-errors.txt &
          TAIL_PID=$!
          trap 'kill "${TAIL_PID}" 2>/dev/null || true; rm -f /tmp/fides-tail-raw.jsonl /tmp/fides-tail-errors.txt /tmp/fides-live-probe.json' EXIT
          sleep 8
          http="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            --request POST -H 'content-type: application/json' \
            -H 'origin: https://verite-interdite.fr' \
            --data '{"message":"Qui est saint Jean l Evang\u00e9liste ?"}' \
            --output /tmp/fides-live-probe.json -w '%{http_code}' \
            'https://meliturgos.adrien-lopezcarreras.workers.dev/api/public/fides/chat')"
          export FIDES_LIVE_HTTP="$http"
          sleep 12
          kill "${TAIL_PID}" 2>/dev/null || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let d={};
          try{d=JSON.parse(fs.readFileSync('/tmp/fides-live-probe.json','utf8'))}catch{}
          const lines=fs.existsSync('/tmp/fides-tail-raw.jsonl')
            ?fs.readFileSync('/tmp/fides-tail-raw.jsonl','utf8').split('\n'):[];
          const text=lines.join('\n');
          const has=s=>text.includes(s);
          const response=typeof d.answer==='string'?d.answer:'';
          console.log(JSON.stringify({
            http:Number(process.env.FIDES_LIVE_HTTP||0),
            error_code:String(d.error||'').slice(0,70),
            fides_lines:lines.filter(l=>l.includes('FIDES public')).length,
            saw_fallback:has('trying bounded free-model fallback'),
            saw_object_object:has('[object Object]'),
            saw_neuron:has('neuron')||has('Neurons')||has('10,000'),
            saw_account_limited:has('Account limited'),
            saw_paid_plan:has('Workers Paid'),
            saw_no_such_model:has('No such model'),
            saw_3036:has('3036'),
            saw_3040:has('3040'),
            saw_5035:has('5035'),
            saw_5007:has('5007'),
            saw_429:has('429'),
            saw_403:has('403')
          }));
          NODE
