name: fides-production-inference-diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fides-production-inference-diagnostic.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture only scrubbed FIDES error category during one live request
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          timeout 75s npx wrangler tail meliturgos --format json > /tmp/fides-tail-raw.jsonl 2>/tmp/fides-tail-errors.txt &
          TAIL_PID=$!
          trap 'kill "${TAIL_PID}" 2>/dev/null || true; rm -f /tmp/fides-tail-raw.jsonl /tmp/fides-tail-errors.txt /tmp/fides-live-probe.json' EXIT
          sleep 8
          http="$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            --request POST -H 'content-type: application/json' \
            -H 'origin: https://verite-interdite.fr' \
            --data '{"message":"Qui est saint Jean l Evang\u00e9liste ?"}' \
            --output /tmp/fides-live-probe.json -w '%{http_code}' \
            'https://meliturgos.adrien-lopezcarreras.workers.dev/api/public/fides/chat')"
          export FIDES_LIVE_HTTP="$http"
          sleep 12
          kill "${TAIL_PID}" 2>/dev/null || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let d={};
          try{d=JSON.parse(fs.readFileSync('/tmp/fides-live-probe.json','utf8'))}catch{}
          const lines=fs.existsSync('/tmp/fides-tail-raw.jsonl')
            ?fs.readFileSync('/tmp/fides-tail-raw.jsonl','utf8').split('\n'):[];
          const unescapeTail=line=>{
            let value=String(line||'');
            for(let i=0;i<6;i++){
              const next=value.replace(/\\u0022/g,'"').replace(/\\"/g,'"');
              if(next===value) break;
              value=next;
            }
            return value;
          };
          const text=lines.map(unescapeTail).join('\n');
          const fides=text.split('\n').filter(l=>l.includes('[FIDES public]')||l.includes('FIDES public'));
          const scope=fides.length?fides.join('\n'):text;
          const kinds=['EMPTY_MODEL_RESPONSE','TIMEOUT','QUOTA_OR_BUDGET','AUTHORIZATION','UNCLASSIFIED'];
          const pick=(re,source)=>[...new Set([...source.matchAll(re)].map(m=>m[1]))];
          const response=typeof d.answer==='string'?d.answer:'';
          console.log(JSON.stringify({
            http:Number(process.env.FIDES_LIVE_HTTP||0),ok:d.ok===true,
            answer_chars:response.length,error_code:String(d.error||'').slice(0,70),
            tail_lines:lines.filter(Boolean).length,
            fides_lines:fides.length,
            saw_fides_marker:text.includes('[FIDES public]')||text.includes('FIDES public'),
            saw_invocation_failed:text.includes('WORKERS_AI_INVOCATION_FAILED'),
            saw_empty_model:text.includes('EMPTY_MODEL_RESPONSE')||text.includes('EMPTY_WORKERS_AI_RESPONSE'),
            saw_fallback:text.includes('trying bounded free-model fallback'),
            message_kinds:pick(new RegExp('messageKind"?\\s*:\\s*"('+kinds.join('|')+')','g'),scope),
            provider_codes:pick(/"code"\s*:\s*"([A-Za-z0-9_-]{1,48})"/g,scope).slice(0,8),
            provider_names:pick(/"name"\s*:\s*"([A-Za-z0-9_-]{1,40})"/g,scope).slice(0,8),
            provider_statuses:pick(/"status"\s*:\s*(\d{1,3})/g,scope).map(Number).slice(0,8),
            internal_codes:pick(/\b(3036|3040|5007|5035|5016|3006|3007|3042)\b/g,scope),
            tail_received:lines.filter(Boolean).length>0,
            tail_subscription_failed:fs.existsSync('/tmp/fides-tail-errors.txt')
              && /error|failed|unauthorized/i.test(fs.readFileSync('/tmp/fides-tail-errors.txt','utf8'))
          }));
          NODE
