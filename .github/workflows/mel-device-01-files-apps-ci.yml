name: mel-device-01-files-apps-ci

on:
  push:
    branches:
      - 'roadmap/mel-device-01-*'
      - 'candidate/mel-device-01-*'
  pull_request:
    branches:
      - main
    paths:
      - 'src/devices/computer-use.js'
      - 'src/devices/computer-companion-api.js'
      - 'src/capabilities/computer-runtime-capabilities.js'
      - 'assets/MEL-Computer-Setup.ps1'
      - 'dist/MEL-Computer-Setup.ps1'
      - 'assets/MEL-Computer-Companion.ps1'
      - 'dist/MEL-Computer-Companion.ps1'
      - 'tests/gen2/mel-device-01-files-apps.test.mjs'
      - 'tests/gen2/computer-use.test.mjs'
      - 'tests/computer-companion-api.test.mjs'
      - '.github/workflows/mel-device-01-files-apps-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Targeted MEL-DEVICE-01 tests
        run: node --test tests/gen2/mel-device-01-files-apps.test.mjs tests/gen2/computer-use.test.mjs tests/computer-companion-api.test.mjs
      - name: Syntax
        run: npm run check
      - name: Normalize branch for candidate-only integration tests
        run: git switch -c candidate/mel-device-01-ci
      - name: Full test suite
        run: npm test
      - name: Runtime dependency security gate
        run: node scripts/runtime-security-gate.mjs
