name: cloud-capability-readonly-proof-contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloud-capability-readonly-proof-contract.yml'
      - 'scripts/prove-production-capability-inventory-readonly.mjs'
      - 'scripts/prove-production-safe-capabilities-readonly.mjs'
      - 'tests/capability-production-readonly-inventory.test.mjs'
      - 'tests/capability-production-safe-execution.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-proof-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify exact production SHA and read-only capability allowlist contracts
        run: node --test tests/capability-production-readonly-inventory.test.mjs tests/capability-production-safe-execution.test.mjs
