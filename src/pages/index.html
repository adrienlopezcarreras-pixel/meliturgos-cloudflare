<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0c0e"><link rel="manifest" href="/manifest.webmanifest"><title>MELITURGOS</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c0c0e;color:#f4f5f7}main{max-width:680px;margin:auto;padding:18px 14px 42px}header{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:18px}h1{font-size:clamp(30px,8vw,44px);margin:0}p{color:#a8adb7}.status{font-size:12px;color:#a8adb7;text-align:right}.panel{background:#15171c;border:1px solid #2d333d;border-radius:18px;padding:14px;margin:12px 0}.chat{min-height:38vh;max-height:52vh;overflow:auto}.msg{white-space:pre-wrap;padding:11px 13px;border-radius:14px;margin:8px 0;line-height:1.5}.bot{background:#222933}.user{background:#1d3852;margin-left:8%}.meta{font-size:12px;color:#a8adb7}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.actions a,.actions button,button{min-height:46px;border:1px solid #566579;border-radius:12px;background:#223247;color:#fff;padding:11px;text-decoration:none;font:inherit;cursor:pointer}.composer{display:grid;grid-template-columns:1fr auto;gap:8px;position:sticky;bottom:8px}textarea,input,select{width:100%;background:#0f1115;color:#fff;border:1px solid #414a57;border-radius:12px;padding:11px;font:inherit}textarea{min-height:78px;resize:vertical}.voice{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:440px){main{padding:12px 10px}.composer{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.voice{grid-template-columns:1fr}}</style></head><body><main><header><div><h1>MELITURGOS</h1><p>Votre espace de conversation et de mémoire.</p></div><div id="status" class="status">Connexion…</div></header><section class="panel chat" id="chat" aria-live="polite"><div class="msg bot">Je suis prêt. Écrivez votre première question.</div></section><form class="panel composer" id="form"><textarea id="question" placeholder="Écrire un message…" aria-label="Message"></textarea><button type="submit">Envoyer</button></form><section class="panel voice"><button id="mic-start" type="button">🎙 Micro</button><button id="mic-stop" type="button" disabled>Arrêter</button><div id="voice-status" class="meta" style="grid-column:1/-1">Le micro reste inactif jusqu'à votre action.</div></section><section class="panel actions"><button id="memory" type="button">🧠 Mémoire</button><button id="diagnostic" type="button">◌ Diagnostic</button><button id="backup" type="button">↧ Sauvegarde</button></section><div id="info" class="meta" role="status"></div><script>(function(){var q=function(s){return document.querySelector(s)},chat=q('#chat'),input=q('#question'),info=q('#info'),rec,stream,parts=[];function add(t,c){var d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function api(path,o){var r=await fetch(path,o),j=await r.json();if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}var sending=false;q('#form').onsubmit=async function(e){e.preventDefault();if(sending)return;var t=input.value.trim();if(!t)return;sending=true;q('#form').querySelector('button[type=submit]').disabled=true;var provenance=input.dataset.provenance||'chat';input.value='';input.dataset.provenance='chat';add(t,'user');try{var j=await api('/api/chat',{method:'POST',headers:({'content-type':'application/json'}),body:JSON.stringify({text:t,provenance:input.dataset.provenance||"chat"})});add(j.text,'bot');if('speechSynthesis'in window){var u=new SpeechSynthesisUtterance(j.text);u.lang='fr-FR';u.voice=Array.from(speechSynthesis.getVoices()).find(function(v){return /fr/i.test(v.lang)&&/female|amelie|audrey|marie/i.test(v.name)})||null;speechSynthesis.speak(u)}}catch(e){add('Erreur : '+e.message,'bot')}finally{sending=false;q('#form').querySelector('button[type=submit]').disabled=false}};input.addEventListener('keydown',function(e){if(e.isComposing)return;if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();q('#form').requestSubmit()}});q('#memory').onclick=async function(){try{var j=await api('/api/status');info.textContent=j.memories+' souvenirs · '+j.interactions+' échanges'}catch(e){info.textContent='Mémoire indisponible'}};q('#diagnostic').onclick=async function(){info.textContent='Diagnostic…';try{var j=await api('/api/diagnostic');info.textContent='D1 '+j.checks.d1+' · AI '+(j.checks.ai_binding||j.checks.workers_ai&&j.checks.workers_ai.status)+' · '+j.latency_ms+' ms'}catch(e){info.textContent='Diagnostic indisponible'}};q('#backup').onclick=function(){location.href='/api/export'};q('#mic-start').onclick=async function(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){q('#voice-status').textContent='Micro indisponible · utilisez le texte';return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});parts=[];rec=new MediaRecorder(stream);rec.ondataavailable=function(e){if(e.data.size)parts.push(e.data)};rec.onstop=async function(){stream.getTracks().forEach(function(t){t.stop()});q('#voice-status').textContent='Transcription…';var fd=new FormData();fd.append('audio',new Blob(parts,{'type':'audio/webm'}),'micro.webm');try{var r=await fetch('/api/voice/transcribe',{'method':'POST','body':fd}),j=await r.json();if(!r.ok)throw Error(j.error||'indisponible');input.value=j.text;input.dataset.provenance='voice';q('#voice-status').textContent='Texte transcrit · envoyé à MEL';q('#form').requestSubmit()}catch(e){q('#voice-status').textContent='Transcription indisponible · repli texte'}};rec.start();q('#mic-start').disabled=true;q('#mic-stop').disabled=false;q('#voice-status').textContent='Écoute…'}catch(e){q('#voice-status').textContent='Micro refusé · repli texte'}};q('#mic-stop').onclick=function(){if(rec&&rec.state!=='inactive'){rec.stop();q('#mic-start').disabled=false;q('#mic-stop').disabled=true}};q('#memory').click()})()</script></main></body></html>
