  <header><div><h1>MELITURGOS</h1><p class="tag">Cloud · mémoire persistante · mobile</p></div><div id="status" class="status">connexion…</div></header>
  <div class="toolbar" id="top-tools">

    <button class="small" id="diagnostic" type="button">Diagnostic</button>
    <button class="small" id="backup" type="button">Sauvegarde</button>
  </div>
  <div id="diag" class="meta"></div>
  <div class="avatar-wrap" aria-label="Avatar MEL">
    <div class="mel-avatar" id="mel-avatar" role="button" tabindex="0" aria-label="Activer le microphone" title="Cliquez ou tapez pour parler">
      <img src="/meliturgos-avatar-fille.png" alt="" onerror="this.hidden=true;this.parentNode.innerHTML='<svg viewBox=\'0 0 200 200\' aria-label=\'Avatar MELITURGOS\' preserveAspectRatio=\'xMidYMid slice\'><circle cx=100 cy=85 r=55 fill=\'#f0c7a8\'/><path d=\'M45 72 q55-90 110 0\' fill=\'#172332\'/><circle cx=78 cy=82 r=7/><circle cx=122 cy=82 r=7/><path d=\'M70 112 q30 22 60 0\' fill=\'none\' stroke=\'#172332\' stroke-width=\'6\'/></svg>'">
    </div>

      <button type="submit">Envoyer</button>
    </div>
    <label class="drop-zone" id="drop-zone">
      <span>Déposez ici tout fichier (image, audio, vidéo, document, PDF, archive…)</span>
      <input type="file" id="fileInput" accept="*/*" aria-label="Joindre un fichier">
    </label>
    <video id="local-preview" controls playsinline hidden></video>
  </form>
  <section class="panel" id="chat"></section>
  <div id="audit" class="meta" role="status"></div>
  <div class="mode-link-wrap"><a href="/professor">Passer en mode complet</a></div>
  <script>
    var qs=function(s){return document.querySelector(s)},chat=qs('#chat'),q=qs('#q'),zone=qs('#drop-zone'),fileInput=qs('#fileInput'),diag=qs('#diag');
    async function api(path,options){options=options||{};var h=new Headers(options.headers||{});if(options.body&&!h.has('content-type'))h.set('content-type','application/json');options.headers=h;var r;try{r=await fetch(path,options)}catch(e){throw new Error('Connexion impossible au service MELITURGOS.')}var raw=await r.text(),data;try{data=raw?JSON.parse(raw):{}}catch(e){var p=raw.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,160);throw new Error('Le serveur a répondu en '+r.status+' avec un format non JSON'+(p?' : '+p:''))}if(!r.ok)throw new Error(data.error||('Erreur HTTP '+r.status));return data}
    function add(text,cls,meta,iid){var d=document.createElement('div');d.className='msg '+cls;d.textContent=text;if(meta){var m=document.createElement('div');m.className='meta';m.textContent=meta;d.appendChild(m)}chat.appendChild(d);if(iid){var f=document.createElement('div'),y=document.createElement('button'),n=document.createElement('button');f.className='feedback';y.className=n.className='small';y.textContent='👍 utile';n.textContent='👎 corriger';y.onclick=async function(){try{await api('/api/feedback',{method:'POST',body:JSON.stringify({interaction_id:iid,good:true})});f.innerHTML='<span class="badge">retour enregistré</span>'}catch(e){f.textContent='Erreur : '+e.message}};n.onclick=async function(){var c=prompt('Quelle correction doit-il retenir ?','');if(c===null)return;try{await api('/api/feedback',{method:'POST',body:JSON.stringify({interaction_id:iid,good:false,correction:c})});f.innerHTML='<span class="badge">correction prioritaire mémorisée</span>'}catch(e){f.textContent='Erreur : '+e.message}};f.append(y,n);chat.appendChild(f)}chat.scrollTop=chat.scrollHeight}
    async function refresh(){try{var s=await api('/api/status');qs('#status').textContent=s.memories+' souvenirs · en ligne'}catch(e){qs('#status').textContent='erreur : '+e.message}}
    qs('#form').onsubmit=async function(e){e.preventDefault();var text=q.value.trim();if(!text)return;q.value='';add(text,'user');var w=document.createElement('div');w.className='msg bot';w.textContent='MELITURGOS réfléchit…';chat.appendChild(w);try{var j=await api('/api/chat',{method:'POST',body:JSON.stringify({text:text,model:qs('#model').value})});w.remove();add(j.text,'bot',(j.model||'')+' · '+(j.memory_hits||0)+' souvenirs retrouvés',j.interaction_id);refresh()}catch(err){w.classList.add('error');w.textContent='Erreur : '+err.message}};
    q.addEventListener('keydown',function(e){if(e.isComposing)return;if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();qs('#form').requestSubmit()}});
    qs('#backup').onclick=function(){location.href='/api/export'};
    qs('#diagnostic').onclick=async function(){diag.textContent='Diagnostic en cours…';try{var j=await api('/api/diagnostic');diag.textContent='v'+(j.version||'')+' · D1 '+(j.checks.d1||'')+' · AI '+(j.checks.ai_binding||'')+' · auth '+(j.checks.authentication||'')+' · '+(j.latency_ms||0)+' ms'}catch(e){diag.textContent='Erreur : '+e.message}};
    ['dragenter','dragover','dragleave','drop'].forEach(function(ev){zone.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();})});
    zone.addEventListener('dragenter',function(){zone.classList.add('dragging')});
    zone.addEventListener('dragleave',function(){zone.classList.remove('dragging')});
    zone.addEventListener('drop',function(e){zone.classList.remove('dragging');var files=e.dataTransfer.files;if(!files.length)return;showPreview(files[0]);uploadFile(files[0])});
    fileInput.onchange=function(){if(fileInput.files.length){showPreview(fileInput.files[0]);uploadFile(fileInput.files[0])}};
    var preview=qs('#local-preview'),previewUrl=null;
    function showPreview(file){if(!file||!(file.type.indexOf('video')===0||file.type.indexOf('audio')===0||file.type.indexOf('image')===0))return;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);preview.src=previewUrl;preview.hidden=false}
    async function uploadFile(file){diag.textContent='Analyse de '+file.name+'…';try{var fd=new FormData();fd.append('file',file);var r=await fetch('/api/files/analyze',{method:'POST',body:fd});var j=await r.json();if(!r.ok)throw new Error(j.error||'Analyse indisponible');add('📎 '+file.name,'user',j.summary||'',null);if(j.text){q.value=(q.value?q.value+'\n':'')+j.text;qs('#form').requestSubmit()}}catch(e){diag.textContent='Erreur fichier : '+e.message}}
    var rec,stream,parts=[],avatar=qs('#mel-avatar'),vstatus=qs('#voice-status');
    function toggleMic(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){vstatus.textContent='Micro indisponible · utilisez le texte';return}if(rec&&rec.state!=='inactive'){rec.stop();avatar.classList.remove('speaking');return}stream&&stream.getTracks().forEach(function(t){t.stop()});parts=[];navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){stream=s;rec=new MediaRecorder(s);rec.ondataavailable=function(e){if(e.data.size)parts.push(e.data)};rec.onstop=async function(){stream.getTracks().forEach(function(t){t.stop()});vstatus.textContent='Transcription…';var fd=new FormData();fd.append('audio',new Blob(parts,{type:rec.mimeType||'audio/webm'}),'voice.webm');try{var r=await fetch('/api/voice/transcribe',{method:'POST',body:fd}),j=await r.json();if(!r.ok)throw new Error(j.error||'indisponible');q.value=j.text||'';vstatus.textContent='Transcrit · envoi…';qs('#form').requestSubmit()}catch(e){vstatus.textContent='Transcription indisponible · repli texte'}finally{avatar.classList.remove('speaking')}};rec.start();avatar.classList.add('speaking');vstatus.textContent='Écoute… tapez le visage pour arrêter'}).catch(function(e){vstatus.textContent='Micro refusé · repli texte'})}
    avatar.onclick=toggleMic;
    avatar.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleMic()}};
    add('Je suis MELITURGOS. Ma mémoire est prête.','bot','mémoire D1');refresh();
  </script>
</main></body></html>
